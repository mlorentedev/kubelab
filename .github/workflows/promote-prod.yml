---
name: Promote Prod
# Continuous delivery to prod (ADR-046 — gated promotion). Run
# `toolkit deployment promote --env prod` for a platform app at an existing
# immutable semver tag, and open a PR with the regenerated overlay. Merging it
# (human review + required checks) lets Argo CD (prod, selfHeal:true) sync and
# deploy that version, then defend it.
#
# Mirror of staging-deploy.yml, minus the build step: prod only ships tags that
# already exist (built + released for staging). The promote command refuses a
# non-existent registry tag, so a typo fails fast instead of ImagePullBackOff.
#
# Same PAT rationale as staging: the PR is opened with RELEASE_PLEASE_TOKEN, not
# the default GITHUB_TOKEN. A GITHUB_TOKEN-opened PR does not trigger
# `on: pull_request` workflows, so its required checks would never run and it
# could never be merged.
#
# TWO WAYS IN, ONE GATE (#1585). Until 2026-09-03 the only trigger was a human
# remembering to dispatch this workflow — and prod ran kubelab-web:1.1.1 from
# 15 June through eleven consecutive releases because that remembering failed
# every time, with every release pipeline green throughout (web#190).
# `web-release-published` fires from mlorentedev/web when a release publishes
# (web#295), so the promotion PR now opens itself. That automates the
# REMEMBERING and not the GATE: a human still reviews and merges the PR, Argo CD
# still syncs afterwards, ADR-046 is unchanged and auto-merge stays forbidden.
# `workflow_dispatch` remains the path for a re-promote, a rollback, or `api`.
#
# THE REGISTRY DECIDES (IDP-042, #1815). Which apps exist and which event type
# means which app are read from infra/config/products.yaml, not spelled here.
# `repository_dispatch` therefore declares no `types`: every dispatch starts a
# run, one whose event type the registry routes to the staging lane is skipped
# as "not this lane", and one it does not know fails in red.
on:
  workflow_dispatch:
    inputs:
      app:
        description: A product registered in infra/config/products.yaml (web, api, ...)
        type: string
        required: true
      version:
        description: 'Immutable semver image tag (e.g. 1.1.1) — must already exist in the registry'
        type: string
        required: true
  repository_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialize promotions of the same app; never cancel an in-flight one (it may be
# mid-push). Different apps can promote concurrently.
#
# The `|| 'web'` is load-bearing, not defensive noise: on a repository_dispatch
# the `inputs` context is empty, so the bare form degrades to `promote-prod-`
# and an automated promote would sit in a different group from a human promoting
# web at the same moment — two runs racing a force-push to one branch name.
# It is the one product name left in this file: the group is evaluated before
# any step can ask the registry, and a test fails the day a second product has
# a prod dispatch event (Q4).
concurrency:
  group: promote-prod-${{ inputs.app || 'web' }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote Prod
    runs-on: ${{ fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'
      - name: Install toolkit
        run: |
          python -m pip install "poetry>=1.8,<2.0"
          poetry install --only main
      # One place decides what this run promotes, whichever trigger started it.
      # Every value below reaches the step through `env:`, never `${{ }}` inside
      # the script: client_payload is arbitrary JSON from the sender, and `${{ }}`
      # in a `run:` is textual substitution before bash ever sees it.
      - name: Resolve the app and version this run promotes
        id: target
        env:
          EVENT: ${{ github.event_name }}
          # On a repository_dispatch, `action` is the event_type the sender POSTed.
          EVENT_TYPE: ${{ github.event.action }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_VERSION: ${{ inputs.version }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          TOOLKIT: poetry run toolkit
        run: |
          set -euo pipefail
          case "$EVENT" in
            repository_dispatch)
              # The app comes from the EVENT TYPE, through the registry, not the
              # payload: `web-release-published` means web because
              # products.yaml says so. The sender does not get to choose which
              # application is promoted to production, and the payload surface
              # stays at exactly one field.
              if ! route="$($TOOLKIT product app-for-event "$EVENT_TYPE" --json)"; then
                # The CLI's own refusal is JSON; anything else (an import
                # error, a missing poetry) is shown as it came.
                reason="$(jq -er '"\(.error). \(.why) FIX: \(.fix)"' <<<"$route" 2>/dev/null)" \
                  || reason="toolkit product app-for-event failed: ${route}"
                echo "::error::${reason}"
                exit 1
              fi
              # An answer that is not one JSON object must fail here. Read
              # leniently, its lane would be empty, which is not `prod`, and a
              # release would end green as "not this lane".
              if ! lane="$(jq -er .lane <<<"$route" 2>/dev/null)"; then
                echo "::error::toolkit product app-for-event answered no lane: ${route}"
                exit 1
              fi
              if [ "$lane" != prod ]; then
                echo "Event type '${EVENT_TYPE}' belongs to the staging lane: not this lane, nothing to promote"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              app="$(jq -r .app <<<"$route")"
              version="$PAYLOAD_VERSION"
              ;;
            *)
              app="$INPUT_APP"
              version="$INPUT_VERSION"
              ;;
          esac
          if ! products="$($TOOLKIT product list)"; then
            echo "::error::toolkit product list failed: ${products}"
            exit 1
          fi
          if ! grep -qxF -- "$app" <<<"$products"; then
            echo "::error::Unknown app '${app}' — expected a product in infra/config/products.yaml: ${products//$'\n'/ }"
            exit 1
          fi
          # An immutable semver tag and nothing else. This value becomes a
          # command-line argument, a registry lookup and a git branch name.
          #
          # `[[ =~ ]]` rather than a pipe into `grep`: grep is line-oriented, so
          # `printf '%s' "$version" | grep -qE '^[0-9.]+$'` matches the FIRST
          # line and returns 0 — and JSON strings carry newlines. Bash anchors
          # `^`/`$` against the whole string.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to promote '${version}' to prod — expected an immutable" \
              "semver tag such as 1.12.0: no leading v, no mutable alias, no sha-* staging tag"
            exit 1
          fi
          echo "app=${app}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Promoting ${app} to ${version} (trigger: ${EVENT})"
      # Prod renders the contract of the release it ships, from its own snapshot
      # (IDP-042). The receiver renders staging only, so without this step any
      # contract change to a prod-owned key (port, health_path, auth, the prod
      # hostname) left prod's drift check red with nothing to correct it. The
      # release's commit is proven by digest inside the toolkit, never taken
      # from the payload; an in-tree app has hand-authored values and no contract.
      - name: Render prod from the release's contract
        id: contract
        if: steps.target.outputs.skip != 'true'
        env:
          APP: ${{ steps.target.outputs.app }}
          VERSION: ${{ steps.target.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          TOOLKIT: poetry run toolkit
        run: |
          set -euo pipefail
          if ! entry="$($TOOLKIT product show "$APP" --json)"; then
            echo "::error::toolkit product show failed: ${entry}"
            exit 1
          fi
          if ! forge="$(jq -er .forge <<<"$entry" 2>/dev/null)"; then
            echo "::error::toolkit product show answered no forge: ${entry}"
            exit 1
          fi
          if [ "$forge" = in-tree ]; then
            echo "${APP} is in-tree: its prod values are hand-authored, no contract to render"
            exit 0
          fi
          snapshot="infra/config/products/contracts/prod/${APP}.yaml"
          if ! answer="$($TOOLKIT product release-contract --app "$APP" --version "$VERSION" --out "$snapshot" --json)"; then
            reason="$(jq -er '"\(.error). \(.why) FIX: \(.fix)"' <<<"$answer" 2>/dev/null)" \
              || reason="toolkit product release-contract failed: ${answer}"
            echo "::error::${reason}"
            exit 1
          fi
          $TOOLKIT product render --contract "$snapshot" --app "$APP" --env prod --write
      - name: Promote app to prod
        id: promote
        if: steps.target.outputs.skip != 'true'
        env:
          APP: ${{ steps.target.outputs.app }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          poetry run toolkit deployment promote --env prod --app "$APP" --version "$VERSION"
      - name: Open prod promotion PR
        id: open-pr
        if: steps.target.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          APP: ${{ steps.target.outputs.app }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          git config user.name "kubelab-bot"
          git config user.email "bot@kubelab.live"
          git add infra/config/values/prod.yaml infra/k8s/overlays/prod/ infra/config/products/contracts/prod/
          if git diff --staged --quiet; then
            echo "No prod overlay changes — ${APP} already at ${VERSION}"; exit 0
          fi
          BRANCH="promote/prod-${APP}-${VERSION}"
          git checkout -b "$BRANCH"
          git commit -m "promote: prod ${APP} to ${VERSION}"
          git push -u origin "$BRANCH" --force-with-lease
          gh pr create --base master --head "$BRANCH" \
            --title "promote: prod ${APP} to ${VERSION}" \
            --body "Gated prod promotion of \`${APP}\` to \`${VERSION}\` (ADR-046). Argo CD (prod) deploys on merge."
