name: pr-agent

# The reusable reviewer from mlorentedev/ci-workflows (CI-007). Repository-specific
# review instructions live in .pr_agent.toml; this file only calls the shared job.
#
# The name `pr-agent` is a TWO-FILE AGREEMENT: `review-attestation.yml` declares
# `workflow_run: workflows: [pr-agent]` so the gate re-reads the verdict after
# this runs, and reads the `reviewed-pr` artifact the shared job uploads on a
# comment run. Rename either side and re-evaluation stops firing SILENTLY.
# Asserted by `tests/test_pr_agent_workflow.py`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  # The event name is part of the key: a PR comment is an issue_comment whose
  # issue.number is the PR number, and without it a comment cancels the review.
  # Only a comment the shared job runs (a slash command from an association it
  # trusts) shares the /review group, so a newer /review supersedes an older one;
  # any other comment gets its own group and cancels nothing (dotfiles #2855).
  # The association list must equal the shared job's.
  # A bot's push gets its own group too: the shared job ignores bot commits, so a
  # bot run that cancelled a human run would leave the PR with no review.
  group: >-
    ${{ format('{0}-{1}-{2}{3}{4}', github.workflow,
      github.event.pull_request.number || github.event.issue.number, github.event_name,
      (github.event_name == 'issue_comment'
        && !(startsWith(github.event.comment.body, '/')
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
      && format('-{0}', github.event.comment.id) || '',
      (github.event_name == 'pull_request' && endsWith(github.actor, '[bot]'))
      && format('-{0}', github.run_id) || '') }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: mlorentedev/ci-workflows/.github/workflows/pr-agent.yml@2355330358344bb08c0b7a305be4ed6488f23d0c # v0.6.0
    # dotf_version takes the tag's default, the dotf release it was tested with.
    with:
      # This repository's own pool (ADR-070): its weights and its Anthropic members
      # decide the draw, not the copy embedded in dotf.
      pool: harness/reviewer-pool.json
      # The NaN chain the preflight probes, in order: mimo first, because its
      # failure (a 429 or a hang) is one the chain can move on from (#1205), then
      # deepseek and glm5.3 (TOOL-082). Declared here rather than read from the
      # pool's weights, which would put deepseek first.
      declared_model: openai/mimo-v2.6-flash
      declared_fallback_models: '["openai/deepseek-v4-flash", "openai/glm5.3-flash"]'
      # Release PRs restate commits each reviewed when it landed; deploy/ and
      # promote/ carry generated version bumps (DELIVERY-004). A borrowed branch
      # name only forfeits a review: the gate never matches on a name.
      skip_branch_prefixes: release-please-- deploy/ promote/
      # A PR whose whole diff is inside .pr_agent.toml's [ignore] glob is declared
      # unreviewed with the registry's escape label and section (CI-GATE-017).
      declare_unreviewed: true
    secrets:
      NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
      PR_AGENT_ANTHROPIC_API_KEY: ${{ secrets.PR_AGENT_ANTHROPIC_API_KEY }}
