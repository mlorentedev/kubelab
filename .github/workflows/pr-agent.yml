---
# TOOL-021 Part 2 (#1140, spec #1160). The reviewer whose capacity is ours.
#
# The name `pr-agent` is a TWO-FILE AGREEMENT: `review-attestation.yml` declares
# `workflow_run: workflows: [pr-agent]` so the gate re-reads the verdict after
# this runs. Rename either side and re-evaluation stops firing SILENTLY — the
# reviewer would review, the gate would never look again, and every PR it
# reviewed would read unreviewed. Asserted by `tests/test_pr_agent_workflow.py`
# rather than left as a convention.
name: pr-agent

on:
  pull_request:
    # `synchronize` is here so a push is reviewed, and it is deliberately NOT in
    # `pr_actions` below — upstream routes it down a separate path
    # (`handle_push_trigger`), so listing it there is a setting that looks right
    # and asserts nothing.
    types: [opened, synchronize, reopened, ready_for_review]
  # Slash commands (/review, /improve) on an existing PR.
  issue_comment:
    types: [created]

concurrency:
  # The event name is part of the key and it is LOAD-BEARING. A PR comment is an
  # `issue_comment` whose `issue.number` IS the PR number, so without it a
  # comment-triggered run shares this group with the in-flight `pull_request` run
  # and `cancel-in-progress` kills the review. PR-Agent is a Docker action that
  # spends its first ~20s building, and a reviewer's auto-summary comment lands
  # reliably inside that window. Measured upstream on two PRs: both cancelled
  # mid-build, both workflows green, zero reviews produced.
  #
  # The skip conditions that can change between two runs of one PR are part of
  # the key for the same reason (#1944). A run joins this group BEFORE the job's
  # `if:` is read, so a run carrying a draft payload, which the job skips, used
  # to cancel the `ready_for_review` run beside it. On #1942 the two runs were
  # created 90 s apart and in the opposite order to their events: `cancelled`,
  # `skipped`, no review. The actor is the other such condition: a human's push
  # to a Dependabot PR is reviewed, and the bot's rebase after it is skipped.
  # Fork and branch prefix are fixed for a PR's life. Comments are the third
  # (#1950): every comment starts a run, and only a member's slash command is
  # reviewed, so the `## Review triage` comment every PR receives, or any
  # stranger's comment on a public PR, used to cancel a `/review` in flight. The
  # comment conditions here are the job's own, verbatim. A run the job skips now
  # lands in a group of its own and can neither cancel nor displace a run that
  # reviews. `tests/test_pr_agent_workflow.py` evaluates both expressions to
  # hold them in agreement.
  group: >-
    ${{ format('{0}-{1}-{2}{3}',
    github.workflow,
    github.event.pull_request.number || github.event.issue.number,
    github.event_name,
    (github.event.pull_request.draft
      || github.actor == 'dependabot[bot]'
      || (github.event_name == 'issue_comment'
          && !(startsWith(github.event.comment.body, '/')
               && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                           github.event.comment.author_association))))
    && '-skipped' || '') }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # the review comments are the product
  issues: write          # slash-command replies land as issue comments

jobs:
  review:
    # Three conditions, each for its own reason:
    #
    # - `issue_comment` fires on issues too, and an issue has no diff to review.
    # - A draft PR is by definition not asking to be read yet.
    # - Release PRs are skipped. Upstream's config-level
    #   `ignore_pr_source_branches` was measured INERT on the Action path — loaded
    #   and never consulted, so release PRs were reviewed anyway (dotfiles #1073,
    #   recommendation: delete it). This is the replacement, at the only layer
    #   that actually runs. Without it PR-Agent's ticket-compliance pass reads the
    #   CHANGELOG's issue references, looks for their code in the diff, and
    #   reports "none of the above requirements are fulfilled" on EVERY release,
    #   structurally — noise guaranteed to recur, and noise from a reviewer is how
    #   a reviewer stops being read.
    #
    #   Branch-name matching was rejected for the attestation GATE because gaming
    #   the name would bypass review. Here it fails the other way: a branch named
    #   to match forfeits its review, and the gate then reports the PR unreviewed
    #   and goes red. Gaming it costs the gamer.
    #
    #   `head_ref` is empty on `issue_comment`, so a human typing `/review` on a
    #   release PR still gets one. A human asking is not structural noise.
    #
    # - The slash-command path is restricted to OWNER/MEMBER/COLLABORATOR. Any
    #   GitHub account can comment on a PR in a public repository,
    #   `issue_comment` runs in base-repo context with `NAN_API_KEY`, and the
    #   unrestricted form would let a stranger spend our inference budget and
    #   exercise `pull-requests: write` on demand.
    #
    #   An earlier version of this comment explained the upstream's unrestricted
    #   form away as "their repo is private". Measured 2026-08-19: it is PUBLIC.
    #   So that was a live exposure there rather than a difference in context,
    #   and reporting it produced a fix on their side. The lesson belongs to this
    #   port, not to them — the reason a condition is safe is itself a claim, and
    #   it has to be checked like any other. The association set is
    #   deliberately the same one `_MEMBER_ASSOCIATIONS` uses in
    #   `toolkit/features/review_attestation.py` — one definition of "belongs to
    #   this repository", used by both the gate and the reviewer.
    #
    #   Related, and NO LONGER hypothetical: a PR that gets no secrets on
    #   `pull_request` cannot be reviewed here, because the model call needs
    #   `NAN_API_KEY`. That was written about forks; DEPENDABOT is the same shape
    #   and it arrived first. Measured 2026-08-24 on #1358-#1362, all five red:
    #
    #     Secret source: Dependabot        <- the run log says it outright
    #       OPENAI__KEY:                   <- empty; the Actions store is not read
    #
    #   versus `OPENAI__KEY: ***` on #1357, a human PR the same night. The
    #   Dependabot secret store is a SEPARATE store and this repository never
    #   filled it, so every `secrets.*` resolves to the empty string. The token is
    #   not the obstacle — the same log reports `PullRequests: write`, so the
    #   `permissions:` block above does elevate it for Dependabot events.
    #
    #   So the job is skipped rather than left to fail: a reviewer that CANNOT run
    #   is not a reviewer that found nothing, and failing here would only teach
    #   people that red is normal on dependency bumps. The disclosure moves to
    #   `dependabot-declare-unreviewed.yml`, which labels the PR and writes the
    #   rationale into its body — because proceeding unreviewed is allowed and
    #   proceeding SILENTLY is not (harness/review-attestation.json, `escape`).
    #
    #   `github.actor` rather than `github.event.pull_request.user.login`: the
    #   actor is who triggered the run, which is what decides the secret store,
    #   and it is therefore the same value the failure depends on.
    #
    #   The `issue_comment` path is deliberately NOT excluded. A human typing
    #   `/review` on a bump gets one, and that run carries the real secrets
    #   because it is triggered by the human, not by the bot.
    #
    # - Generated deploy/promote PRs are skipped, for the same reason as release
    #   PRs and by the same mechanism (DELIVERY-004, #1619). Each is two lines —
    #   an app version in `values/<env>.yaml` and the same value in the
    #   regenerated overlay — written by `toolkit deployment promote` and already
    #   guaranteed byte-for-byte against the generator by the config-drift gate,
    #   so there is no seam a reviewer could act on. Measured on four of them:
    #   three reported "No major issues detected" and the fourth (#1590) reported
    #   an indentation defect that does not exist — `version` sits at the same
    #   6-space indent as every sibling and the file parses. That is the expected
    #   yield from two lines shown without the surrounding file, and a false
    #   positive on a PR nobody reads closely is worse than silence: it trains
    #   the reader to skip this reviewer, which is the asset worth protecting.
    #
    #   Why this one skips a job that the whole point is to run: 23 of the last
    #   60 PRs here are these, and each takes the ONE pending slot of the
    #   `pr-agent-nan-inference` group below — GitHub keeps a single pending run
    #   per group and evicts it when the next arrives (#1203). So a generated
    #   bump does not merely waste a review, it displaces a human PR's. Measured
    #   the same day on #1617: `cancelled`, `steps: 0`, the job never ran.
    if: >
      (github.event_name == 'pull_request'
        && github.event.pull_request.draft == false
        && github.actor != 'dependabot[bot]'
        && github.event.pull_request.head.repo.fork == false
        && !startsWith(github.head_ref, 'release-please--')
        && !startsWith(github.head_ref, 'deploy/')
        && !startsWith(github.head_ref, 'promote/'))
      || (github.event_name == 'issue_comment'
            && github.event.issue.pull_request
            && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                        github.event.comment.author_association)
            && startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    # A run that hangs holds an inference slot for the full 6h default. Ported
    # from the upstream this reviewer came from, where the bound is what turns a
    # stuck run into a failed one somebody can see.
    #
    # Re-derived for the review pool (TOOL-082, #1843). A run makes at most two
    # PR-Agent attempts, one per provider: 8 minutes on Anthropic and 19 on NaN,
    # 27 together. Before them come the preflight (3 models x 90 s), the draw
    # (two 30 s Anthropic probes) and about 2 minutes of setup. After them come
    # the publication probe and the final guard, each up to three API calls with
    # retry sleeps. The sum is about 37 minutes. The bound exceeds it so that a
    # probe running to its last second still leaves the guard time to name the
    # failure (#1909). A day without trouble runs one attempt and holds the
    # one-at-a-time lane no longer than before.
    # tests/test_pr_agent_workflow.py holds the sum.
    timeout-minutes: 40
    # A SECOND concurrency group, deliberately, and not a replacement for the
    # workflow-level one above. That one keys on the PR and cancels — it stops a
    # PR racing itself. This one is global, and it protects the NaN cluster's 5
    # simultaneous requests, shared with other consumers, whose exhaustion is
    # the diagnosed cause of PR-Agent reporting success while publishing
    # nothing (upstream #1107).
    #
    # Without `queue: max` it did NOT queue (#1203, TOOL-108 #2179): GitHub
    # keeps one running and ONE pending run per group, and a newer pending run
    # cancels the older one whatever `cancel-in-progress` says, before it gets
    # a runner. Measured 2026-10-10: the #2177 `/improve` run 38042716679
    # queued at 09:48:55Z and was cancelled at 09:54:39Z, one second after
    # #2178's review entered the group. `queue: max` makes the group a real
    # FIFO, so every review waits its turn instead of being discarded. Ported
    # from mlorentedev/dotfiles#1940, where the same design has run since 2026-10-01.
    #
    # GitHub refuses `queue: max` beside `cancel-in-progress: true`, which is
    # why it lives here and not on the workflow-level group: that one still
    # cancels a PR's older run on a new push, wherever that run is waiting,
    # so the queue never holds two reviews of one PR and event. A run that waits here can outlive its PR's state, so
    # `Skip a review whose PR is no longer open` below drops it at the head of
    # the queue instead of spending the lane on it.
    #
    # Second known limit, unchanged: concurrency groups are per repository, so
    # this serialises kubelab's own runs and not the other repository's against
    # the same cluster. Two serialised lanes, not one.
    concurrency:
      group: pr-agent-nan-inference
      cancel-in-progress: false
      queue: max
    steps:
      # The PR number, handed to `review-attestation.yml` (#1184).
      #
      # `workflow_run` does not propagate the triggering event's context. A run
      # started by `issue_comment` -- a `/review` -- is associated with the
      # DEFAULT BRANCH, because a comment has no head ref. The gate therefore
      # receives `pull_requests[]` empty and `head_sha` pointing at master, its
      # fallback asks which PRs carry master's SHA, gets none, and skips. That
      # skip is CORRECT: a run with nothing to judge must not attest. The
      # reference is not lost in the handoff -- it never enters it, so no
      # additional resolution layer on the reading side could recover it.
      #
      # It is not missing from THIS run, though: the `Fail if no review was
      # published` step below already resolves it from the same expression.
      # Uploading it hands the gate the value from the run being judged, rather
      # than letting it infer one from a SHA that is already wrong.
      #
      # FIRST on purpose. This job is cancellable by the workflow-level
      # concurrency group, and `workflow_run: [completed]` fires for cancelled
      # runs too. Written before PR-Agent starts, the artifact exists however
      # this run ends.
      #
      # Needs no new permission: artifact upload goes through the Actions
      # runtime, not the GITHUB_TOKEN scopes. Only the READER needs
      # `actions: read`, and it is not added here -- this half is inert until
      # the gate learns to read it, which is why it ships on its own.
      - name: Record the PR number for the attestation gate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          # Asserted, not sanitised: every path into PR_NUMBER yields an integer
          # today. A non-numeric value means an assumption broke, and writing it
          # would hand the gate a reference to something that is not a PR.
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::resolved PR reference is not a number: $PR_NUMBER"
              exit 1 ;;
          esac
          printf '%s' "$PR_NUMBER" > pr-number.txt

      - name: Upload the PR number
        # SHA-pinned like the reviewer action below, and for the same reason:
        # every action in this job runs alongside `NAN_API_KEY` on a public
        # repository, so a mutable tag decides what executes with that
        # credential. Resolved 2026-08-20 from
        # `repos/actions/upload-artifact/tags`. Bump it by re-resolving the tag
        # you intend, never by editing the comment.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          # THE NAME IS A TWO-FILE AGREEMENT, exactly like this workflow's `name:`
          # above: the gate will download by this literal string. Asserted in
          # `tests/test_pr_agent_workflow.py` rather than left as a convention,
          # because drift here degrades into silence -- the reviewer reviews, the
          # gate finds no artifact, and the PR reads unreviewed.
          name: pr-number
          path: pr-number.txt
          # The gate reads this within minutes of the run completing. Anything
          # longer is storage held for nobody.
          retention-days: 1

      # A run's event is a snapshot from when it was queued, and with
      # `queue: max` above a run can wait long enough for its PR to merge,
      # close or turn back into a draft. Nothing else notices, so the review
      # would hold the one-at-a-time lane for a PR nobody will read (measured
      # in dotfiles 2026-10-07: 18 minutes, eight open PRs waiting behind it;
      # ported from mlorentedev/dotfiles#2079). A draft is reviewed again on
      # `ready_for_review`. Only a definite answer skips: a failed read leaves
      # `gone` unset and the review runs, as before. Only `pull_request` runs
      # skip, because a human typing /review on a merged PR means it.
      #
      # Skipping `reviewable` is what skips everything after it: every later
      # step tests its `any` output, which an unrun step leaves empty, so no
      # review is attempted, no failure is reported and nothing is declared
      # unreviewed.
      - name: Skip a review whose PR is no longer open
        id: open
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          state=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq 'if .merged then "merged" elif .state == "closed" then "closed" elif .draft then "draft" else "open" end' \
            2>/dev/null) || state=""
          case "$state" in
            merged|closed|draft)
              echo "::notice::PR #${PR_NUMBER} became ${state} while this review waited in the queue; not reviewing it."
              echo "gone=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # CI-GATE-017 (#1527). PR-Agent's OWN diff-fetch (`get_pr_diff`) computes
      # a real diff for token accounting, but a separate pass inside
      # `_prepare_prediction` re-derives the reviewable set after applying
      # `.pr_agent.toml`'s `[ignore] glob` and can find it EMPTY -- no
      # exception, no comment, nothing published. Measured identically on
      # #1514 and #1523, both single-file PRs entirely inside
      # `infra/config/secrets/**`:
      #
      #   "Filtered out [ignore] files for pull request:"
      #   "extra": {"files": ["infra/config/secrets/prod.enc.yaml"], "filtered_files": []}
      #   "Empty diff for PR: ..."
      #
      # `Fail if no review was published` below then correctly reports "no
      # review landed", but its own two documented causes (saturation,
      # empty-body-on-a-200) are both the wrong diagnosis for this run --
      # there was nothing left to review after the ignore filter, which is
      # a structural property of the diff and not a reviewer failure. This
      # step detects that case ahead of time so the job can skip PR-Agent
      # and the guard, and declare unreviewed instead of failing red for a
      # reason neither of the guard's own error messages name.
      # `/improve` must pass this check too: PR-Agent is gated on its output,
      # and with `/review` alone here a `/improve` comment skipped every step
      # and reported success (#2187). The attestation steps below stay on
      # `/review`, since a `/improve` run publishes suggestions, never a review.
      - name: Determine whether the diff has anything to review
        id: reviewable
        if: >
          steps.open.outputs.gone != 'true'
            && (github.event_name == 'pull_request'
                || (github.event_name == 'issue_comment'
                    && (contains(github.event.comment.body, '/review')
                        || contains(github.event.comment.body, '/improve'))))
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          # The repository's OWN default branch, same reasoning as
          # `Fail if no review was published` below and never the PR head or
          # `base.ref`: reading the ignore list from the PR itself would let
          # an author add `"**"` to `.pr_agent.toml` in their own branch, make
          # every file "excluded", and auto-skip straight to the escape below
          # with a green gate and no review ever attempted.
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/.pr_agent.toml?ref=${BASE_REF}" \
            --jq '.content' | base64 -d > pr_agent_config.toml
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[].filename' > changed_files.txt

          # fnmatch, not a TOML-aware glob library: `.pr_agent.toml`'s own
          # `**` entries (e.g. `infra/config/secrets/**`) only need "matches
          # anything", which is what an unanchored regex from `fnmatch`
          # already gives every `*` -- consistent with the same
          # regex-over-raw-text approach `_fallback_model_names()` in
          # tests/test_pr_agent_workflow.py already uses for this file,
          # rather than a second parsing method disagreeing with the first.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import fnmatch
          import re

          config = open("pr_agent_config.toml", encoding="utf-8").read()
          files = [f for f in open("changed_files.txt", encoding="utf-8").read().splitlines() if f]

          m = re.search(r"^\[ignore\].*?glob\s*=\s*\[(.*?)\]", config, re.S | re.M)
          globs = re.findall(r'"([^"]+)"', m.group(1)) if m else []

          reviewable = [f for f in files if not any(fnmatch.fnmatchcase(f, g) for g in globs)]
          print(f"any={'true' if reviewable else 'false'}")
          PY

      # A PR that started secrets-only (declared unreviewed by the step
      # below) and later gains a reviewable file on the SAME branch would
      # otherwise carry both a real review marker AND a stale
      # `merged-unreviewed` label + rationale forever -- nothing else clears
      # either. Only the label is cleared here; the body section is left for
      # a human, editing PR body text by script being a sharper edge than
      # this fix needs.
      - name: Clear a stale unreviewed-merge declaration, if this PR just became reviewable
        if: >
          always() && steps.reviewable.outputs.any == 'true'
            && (github.event_name == 'pull_request'
                || (github.event_name == 'issue_comment'
                    && contains(github.event.comment.body, '/review')))
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          label=$(gh api "repos/${GITHUB_REPOSITORY}/contents/harness/review-attestation.json?ref=${BASE_REF}" \
            --jq '.content' | base64 -d | jq -r '.escape.label')
          have=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name')
          if printf '%s\n' "$have" | grep -qxF "$label"; then
            echo "::warning::removing stale '${label}' label -- this PR is reviewable now."
            echo "::warning::the rationale section in the PR body is left for a human to clean up."
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/${label}" --silent
          fi

      # Captured BEFORE PR-Agent runs so the guard below can bind its verdict to
      # THIS run: with `persistent_comment` PR-Agent edits its earlier Guide, which
      # moves `updated_at`; a Guide left by a previous run and never touched by
      # this one stays older than this stamp and no longer satisfies the guard.
      - name: Stamp run start
        id: start
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # PR-Agent swallows an authentication failure and exits green, so without
      # this step a missing secret surfaces only as "published no review". The
      # presence test travels as a boolean env var (secrets is not a step-if
      # context); the value never does.
      - name: Fail if the reviewer has no credential
        id: credential
        if: steps.reviewable.outputs.any == 'true'
        env:
          HAS_NAN_API_KEY: ${{ secrets.NAN_API_KEY != '' }}
        run: |
          if [ "${HAS_NAN_API_KEY}" != "true" ]; then
            echo "::error::NAN_API_KEY is not set in this repository's Actions secrets, so PR-Agent cannot review."
            echo "::error::Remedy: add ci:${GITHUB_REPOSITORY} to NAN_API_KEY's consumers in" \
              "dotfiles/secrets/registry.yaml, then run: dotf secrets sync ci --repo ${GITHUB_REPOSITORY}"
            exit 1
          fi
      # The job has no full checkout: only the scripts that decide which model
      # reviews (the preflight and the draw) and whether it published (the guard,
      # which also gates the second attempt), plus the pool whose weights the
      # draw reads. They come from the PR's merge ref, the same trust as this
      # workflow file, and forks never reach this job. Everything that decides
      # what counts as a review is still read from the default branch.
      - name: Check out the reviewer's scripts
        if: steps.reviewable.outputs.any == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          sparse-checkout: |
            harness/reviewer-pool.json
            scripts/pr-agent-model-preflight.sh
            scripts/pr-agent-route.sh
            scripts/pr-agent-publish-guard.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Ask NaN which model of the declared chain answers, BEFORE the review
      # (#1843, #1964). NaN retired mimo-v2.5: it first hung, so PR-Agent
      # published nothing and the job went green, then it answered 401.
      # PR-Agent's own fallback catches a refusal but not a hang, and neither
      # case names the dead model. The script probes each model once, passes on
      # the ones that answer in declared order, and names every one that did not.
      #
      # The chain is declared HERE as well as in `.pr_agent.toml`, because
      # PR-Agent reads the toml from the default branch, so a PR changing the
      # model would still probe the old one. A test holds the two equal.
      #
      # When none answers, NaN is out of the review pool for this run and the
      # pool's Anthropic member reviews. So the failure does not end the job
      # here; the final guard reports what happened, naming this step.
      - name: Probe the declared NaN chain
        id: models
        if: steps.reviewable.outputs.any == 'true'
        continue-on-error: true
        env:
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
          DECLARED_MODEL: openai/mimo-v2.6-flash
          DECLARED_FALLBACK_MODELS: '["openai/deepseek-v4-flash", "openai/glm5.3-flash"]'
        # The exit code travels to the draw: 1 (no NaN model answered) is an
        # outage the pool absorbs, 2 (a broken setup) must stop it.
        # continue-on-error leaves only `outcome`, which is `failure` for both.
        run: |
          rc=0
          ./scripts/pr-agent-model-preflight.sh --model "${DECLARED_MODEL}" \
            --fallbacks "${DECLARED_FALLBACK_MODELS}" --output "$GITHUB_OUTPUT" || rc=$?
          echo "exit=${rc}" >> "$GITHUB_OUTPUT"
          exit "$rc"
      # The review pool (ADR-070). Every member that answered its probe (the NaN
      # models above, and Haiku, probed here) is drawn by the `weight`
      # harness/reviewer-pool.json gives it, so each member's share is a declared
      # number and a dead or saturated member is simply not in the draw. A PR at
      # or past `pr_agent_risk` (its changed lines, or the label) reviews first on
      # Sonnet instead, when Sonnet answers. One attempt talks to one provider;
      # the other provider is the second attempt, which runs only on a measured
      # absence of a published review. `vars.PR_AGENT_PROVIDER` overrides the
      # draw (draw, nan, anthropic, nan-only); `nan-only` stops all spending on
      # the Anthropic key without a PR. docs/runbooks/pr-agent-reviewer.md.
      #
      # The size and labels are read here rather than from the event, because an
      # `issue_comment` event carries neither. A failed read leaves them empty:
      # the draw says so, and the label alone can still route.
      - name: Draw the reviewer from the pool
        id: route
        if: >
          !cancelled() && steps.credential.outcome == 'success'
            && steps.reviewable.outputs.any == 'true'
        env:
          NAN_OUTCOME: ${{ steps.models.outcome }}
          NAN_MODEL: ${{ steps.models.outputs.model }}
          NAN_FALLBACKS: ${{ steps.models.outputs.fallbacks }}
          NAN_PREFLIGHT_EXIT: ${{ steps.models.outputs.exit }}
          # For the probe only; it travels to curl on stdin, never on argv.
          PR_AGENT_ANTHROPIC_API_KEY: ${{ secrets.PR_AGENT_ANTHROPIC_API_KEY }}
          PR_AGENT_PROVIDER: ${{ vars.PR_AGENT_PROVIDER }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"); then
            PR_CHANGED_LINES=$(jq -r '.additions + .deletions' <<<"$pr")
            PR_LABELS=$(jq -c '[.labels[].name]' <<<"$pr")
          else
            PR_CHANGED_LINES="" PR_LABELS="[]"
          fi
          export PR_CHANGED_LINES PR_LABELS
          ./scripts/pr-agent-route.sh --output "$GITHUB_OUTPUT"
      # The Anthropic attempt. It appears twice, first and second, because steps
      # cannot be reordered at run time; a test holds the two identical. What
      # shapes its cost is stated here and pinned by tests, because the key pays
      # per token (dotfiles ADR-046 has the measurements):
      #
      # - The MODEL is the one the draw chose, with no fallback chain: Haiku when
      #   drawn, Sonnet on the risk route. The Console cannot restrict a key to a
      #   model, so ALLOWED_ANTHROPIC in scripts/pr-agent-route.sh is the
      #   allowlist, and it fails the draw on any other model.
      # - The PROMPT is capped at 200,000 tokens, as on the NaN attempt, so every
      #   member reviews the same diff.
      # - The OUTPUT is capped at 40,000 tokens. LiteLLM sends 4,096 for a Claude
      #   model it does not know, and thinking counts toward the cap, so a review
      #   could be cut and published as nothing (mlorentedev/dotfiles#2458).
      # - EFFORT is the member's `reasoning_effort` in the pool, with adaptive
      #   thinking. PR-Agent sends it only for a model it recognises as adaptive,
      #   hence the override list naming every allowed model.
      # - TEMPERATURE is never sent: Haiku 5.5 answers 400 to any non-default value.
      # - The call is not streamed (no OpenAI-compatible base URL), so
      #   `ai_timeout` bounds the whole answer; the step's 8 minutes bound the rest.
      - name: PR-Agent on Anthropic, drawn first
        id: pr_agent_anthropic_first
        if: >
          !cancelled() && steps.reviewable.outputs.any == 'true'
            && steps.route.outputs.first == 'anthropic'
        timeout-minutes: 8
        continue-on-error: true
        uses: The-PR-Agent/pr-agent@efdde4afe14aa401a3889012c7f3e9ef3081a430  # v0.49.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The only inference credential this step holds; NaN's is not here.
          ANTHROPIC__KEY: ${{ secrets.PR_AGENT_ANTHROPIC_API_KEY }}
          # .pr_agent.toml declares custom_llm_provider = "openai" for NaN, and that
          # applies to every model: without this override a Claude model is sent
          # through the OpenAI transport and refused (`openai does not support
          # parameters: ['thinking']`, measured on #2302).
          LITELLM__CUSTOM_LLM_PROVIDER: anthropic
          CONFIG__MODEL: ${{ steps.route.outputs.anthropic_model }}
          CONFIG__MODEL_WEAK: ${{ steps.route.outputs.anthropic_model }}
          CONFIG__FALLBACK_MODELS: "[]"
          CONFIG__MAX_MODEL_TOKENS: "200000"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "200000"
          CONFIG__NO_TEMPERATURE_MODELS: >-
            ["anthropic/claude-haiku-5-5", "claude-haiku-5-5",
            "anthropic/claude-sonnet-5-5", "claude-sonnet-5-5"]
          CONFIG__ENABLE_CLAUDE_ADAPTIVE_THINKING: "true"
          CONFIG__CLAUDE_ADAPTIVE_THINKING_MODELS_OVERRIDE: '["anthropic/claude-haiku-5-5", "anthropic/claude-sonnet-5-5"]'
          CONFIG__REASONING_EFFORT: ${{ steps.route.outputs.anthropic_effort }}
          CONFIG__AI_TIMEOUT: "360"
          CONFIG__RETRY_SAME_MODEL_ON_TIMEOUT: "false"
          CONFIG__NUM_RETRIES: "0"
          DEFAULT_ANTHROPIC_CHAT_MAX_TOKENS: "40000"
          # Below: identical to the NaN attempt's review settings (a test checks it).
          PR_REVIEWER__NUM_MAX_FINDINGS: "5"
          CONFIG__PUBLISH_OUTPUT_PROGRESS: false
          CONFIG__OUTPUT_RUN_DETAILS: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review"]'
          github_action_config.push_trigger_ignore_bot_commits: "true"
          github_action_config.push_trigger_ignore_merge_commits: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "false"
          github_action_config.fail_on_tool_errors: "true"
      # The NaN attempt runs when NaN was drawn first, or when the Anthropic
      # attempt published nothing. The probe measures rather than guesses: it asks
      # the final guard's question, and only a definite "no" runs the next
      # attempt. `persistent_comment` makes a late second attempt EDIT the first
      # Guide rather than add another. `!cancelled()`, not `always()`: a run
      # superseded by a newer push must not spend a second attempt.
      - name: Measure whether the Anthropic attempt published
        id: published_after_anthropic
        if: >
          !cancelled() && steps.reviewable.outputs.any == 'true'
            && steps.route.outputs.first == 'anthropic'
            && steps.route.outputs.second == 'nan'
            && (github.event_name == 'pull_request'
              || (github.event_name == 'issue_comment'
                  && contains(github.event.comment.body, '/review')))
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          STARTED: ${{ steps.start.outputs.started }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: ./scripts/pr-agent-publish-guard.sh --probe --output "$GITHUB_OUTPUT"
      - name: PR-Agent
        id: pr_agent
        if: >
          !cancelled() && steps.reviewable.outputs.any == 'true'
            && (steps.route.outputs.first == 'nan'
              || steps.published_after_anthropic.outputs.published == 'false')
        # Its own limit, under the job's. The healthy chain is one ai_timeout per
        # model (3 x 360 s plus a minute of setup); a non-timeout APIError is
        # replayed once on the same model with no setting to stop it. Cutting the
        # step here, not the job, leaves the probe and the final guard time to
        # act. A failure does not end the job: the probe below measures whether
        # anything was published, and the guard reports the last attempt.
        # tests/test_pr_agent_workflow.py holds both bounds.
        timeout-minutes: 19
        continue-on-error: true
        # Pinned by COMMIT SHA, not by tag, and this deliberately exceeds the
        # upstream it ports from. A tag is mutable: whoever can move `v0.42.0`
        # can change what runs in a job that holds `NAN_API_KEY` on a public
        # repository. The SHA cannot be moved.
        #
        # Resolved 2026-08-19 from `repos/The-PR-Agent/pr-agent/git/ref/tags/v0.42.0`.
        # Bump it deliberately, by re-resolving the tag you intend — never by
        # editing the comment.
        uses: The-PR-Agent/pr-agent@efdde4afe14aa401a3889012c7f3e9ef3081a430  # v0.49.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NaN is OpenAI-compatible, so LiteLLM reaches it through the OpenAI
          # transport with the base URL swapped. The `openai/` prefix on the model
          # id in `.pr_agent.toml` is for the same reason; nothing talks to OpenAI.
          OPENAI__KEY: ${{ secrets.NAN_API_KEY }}
          OPENAI__API_BASE: https://api.nan.builders/v1
          # PR-Agent loads .pr_agent.toml from the default branch, so the PR that changes
          # the model there reviews with the old one until merge; on a `pull_request`
          # run the workflow file is read from the PR head, so the model travels here
          # too. Keep the two in step. A slash command (`issue_comment`) runs the
          # default branch's copy of this file instead (lesson-553). The draw puts
          # the NaN member it picked first, and the preflight has already dropped
          # every model that did not answer.
          CONFIG__MODEL: ${{ steps.route.outputs.nan_model }}
          CONFIG__RETRY_SAME_MODEL_ON_TIMEOUT: "false"
          CONFIG__NUM_RETRIES: "0"
          CONFIG__AI_TIMEOUT: "360"
          LITELLM__CUSTOM_LLM_PROVIDER: openai
          LITELLM__FORCE_STREAMING_CUSTOM_LLM_PROVIDER: openai
          LITELLM__FORCE_STREAMING_API_BASE_SUBSTRINGS: '["api.nan.builders"]'
          PR_REVIEWER__NUM_MAX_FINDINGS: "5"
          CONFIG__FALLBACK_MODELS: ${{ steps.route.outputs.nan_fallbacks }}
          # glm5.3-flash reasons until NaN closes the stream unless its effort is
          # lowered: at its default and at `medium` it spent the whole output on
          # thinking and returned no review; at `low` it reviewed 37K- and
          # 97K-token diffs in under 5 minutes (measured in dotfiles 2026-10-08).
          # LiteLLM does not know the model, so PR-Agent sends an effort only to
          # the ids listed. deepseek accepts `low` and does not act on it;
          # mimo receives none.
          CONFIG__REASONING_EFFORT: low
          CONFIG__ADDITIONAL_REASONING_EFFORT_MODELS: '["glm5.3-flash"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "200000"
          CONFIG__PUBLISH_OUTPUT_PROGRESS: false
          # The review names the model that wrote it, so a reader of the comment
          # knows which pool member reviewed without opening the run.
          CONFIG__OUTPUT_RUN_DETAILS: "true"
          # Stated rather than defaulted, so the event lists are visible instead
          # of implied. `synchronize` is NOT here on purpose — see the trigger
          # comment above.
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          # The push path, which is what actually reviews a new commit.
          github_action_config.handle_push_trigger: "true"
          # `/review` ONLY, and the omission is the point: upstream's default is
          # ['/describe', '/review'], so enabling the push trigger without saying
          # this would silently reinstate `describe` on every push and undo the
          # decision below.
          github_action_config.push_commands: '["/review"]'
          github_action_config.push_trigger_ignore_bot_commits: "true"
          github_action_config.push_trigger_ignore_merge_commits: "true"
          # `describe` REWRITES the PR body. The bodies in this repo carry
          # hand-written measurement tables, merge orders and before/after
          # evidence — the part worth reading — and a model rewriting them
          # destroys exactly that. It also removes one inference call per PR.
          # Off as a decision, not by accident.
          github_action_config.auto_describe: "false"
          github_action_config.auto_review: "true"
          # OFF, on local evidence rather than on the upstream's say-so. #1179
          # produced "Failed to generate code suggestions for PR", and on #1180
          # PR-Agent published `## PR Code Suggestions` and NO review at all
          # while reporting success — the improve call consumed the inference
          # slot the review needed. The review is the output this repository's
          # attestation gate depends on; suggestions are optional and are
          # available on demand with an explicit `/improve` (dead from #1528
          # until #2187 restored it; the `reviewable` step admits it).
          github_action_config.auto_improve: "false"
          github_action_config.fail_on_tool_errors: "true"

      - name: Measure whether the NaN attempt published
        id: published_after_nan
        if: >
          !cancelled() && steps.reviewable.outputs.any == 'true'
            && steps.route.outputs.first == 'nan'
            && steps.route.outputs.second == 'anthropic'
            && (github.event_name == 'pull_request'
              || (github.event_name == 'issue_comment'
                  && contains(github.event.comment.body, '/review')))
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          STARTED: ${{ steps.start.outputs.started }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: ./scripts/pr-agent-publish-guard.sh --probe --output "$GITHUB_OUTPUT"
      # The Anthropic attempt again, second this time; see its first copy above.
      - name: PR-Agent on Anthropic, after NaN published nothing
        id: pr_agent_anthropic_second
        if: >
          !cancelled() && steps.reviewable.outputs.any == 'true'
            && steps.route.outputs.second == 'anthropic'
            && steps.published_after_nan.outputs.published == 'false'
        timeout-minutes: 8
        continue-on-error: true
        uses: The-PR-Agent/pr-agent@efdde4afe14aa401a3889012c7f3e9ef3081a430  # v0.49.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The only inference credential this step holds; NaN's is not here.
          ANTHROPIC__KEY: ${{ secrets.PR_AGENT_ANTHROPIC_API_KEY }}
          # .pr_agent.toml declares custom_llm_provider = "openai" for NaN, and that
          # applies to every model: without this override a Claude model is sent
          # through the OpenAI transport and refused (`openai does not support
          # parameters: ['thinking']`, measured on #2302).
          LITELLM__CUSTOM_LLM_PROVIDER: anthropic
          CONFIG__MODEL: ${{ steps.route.outputs.anthropic_model }}
          CONFIG__MODEL_WEAK: ${{ steps.route.outputs.anthropic_model }}
          CONFIG__FALLBACK_MODELS: "[]"
          CONFIG__MAX_MODEL_TOKENS: "200000"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "200000"
          CONFIG__NO_TEMPERATURE_MODELS: >-
            ["anthropic/claude-haiku-5-5", "claude-haiku-5-5",
            "anthropic/claude-sonnet-5-5", "claude-sonnet-5-5"]
          CONFIG__ENABLE_CLAUDE_ADAPTIVE_THINKING: "true"
          CONFIG__CLAUDE_ADAPTIVE_THINKING_MODELS_OVERRIDE: '["anthropic/claude-haiku-5-5", "anthropic/claude-sonnet-5-5"]'
          CONFIG__REASONING_EFFORT: ${{ steps.route.outputs.anthropic_effort }}
          CONFIG__AI_TIMEOUT: "360"
          CONFIG__RETRY_SAME_MODEL_ON_TIMEOUT: "false"
          CONFIG__NUM_RETRIES: "0"
          DEFAULT_ANTHROPIC_CHAT_MAX_TOKENS: "40000"
          # Below: identical to the NaN attempt's review settings (a test checks it).
          PR_REVIEWER__NUM_MAX_FINDINGS: "5"
          CONFIG__PUBLISH_OUTPUT_PROGRESS: false
          CONFIG__OUTPUT_RUN_DETAILS: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review"]'
          github_action_config.push_trigger_ignore_bot_commits: "true"
          github_action_config.push_trigger_ignore_merge_commits: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "false"
          github_action_config.fail_on_tool_errors: "true"

      # PR-Agent reports SUCCESS when it starts and finishes, not when it
      # publishes. Observed on #1180: job green, `## PR Code Suggestions`
      # posted, zero comments carrying the review marker, and the attestation
      # gate correctly red — leaving a green reviewer job sitting beside a red
      # gate with nothing explaining the contradiction.
      #
      # The gate already protects the MERGE, so this step is not a second lock.
      # It converts a silent nothing into a red job that names its own cause,
      # which is the difference between "the gate is broken" and "the reviewer
      # produced nothing, here is why".
      #
      # The marker is read from the SAME registry the gate classifies with, so
      # the reviewer and its judge cannot disagree about what a review looks
      # like. A hardcoded string here would be a second source of truth. The
      # logic lives in scripts/pr-agent-publish-guard.sh, which the probes above
      # share, so "published" has one definition; its header records the
      # bindings (author, start stamp, marker from the default branch).
      - name: Fail if no review was published
        if: >
          always() && steps.reviewable.outputs.any == 'true'
            && steps.credential.outcome != 'failure'
            && (github.event_name == 'pull_request'
            || (github.event_name == 'issue_comment'
                && contains(github.event.comment.body, '/review')))
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          # The repository's OWN default branch, never
          # `github.event.pull_request.base.ref`. The base is attacker-influenced
          # — a PR author picks the target branch — and this reads a file from
          # that ref to decide what counts as a review. review-attestation.yml
          # already rejected that exact input for the same reason.
          BASE_REF: ${{ github.event.repository.default_branch }}
          STARTED: ${{ steps.start.outputs.started }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          # Every attempt in execution order, as `<outcome> <model>`; the guard
          # judges the last one that ran.
          ATTEMPTS: |
            ${{ steps.pr_agent_anthropic_first.outcome }} ${{ steps.route.outputs.anthropic_model }}
            ${{ steps.pr_agent.outcome }} ${{ steps.route.outputs.nan_model }}
            ${{ steps.pr_agent_anthropic_second.outcome }} ${{ steps.route.outputs.anthropic_model }}
          ROUTE_NOTE: ${{ steps.route.outputs.note }}
          # A failed draw writes no outputs, so every attempt reads skipped; this
          # tells that apart from a pool where no member answered.
          ROUTE_OUTCOME: ${{ steps.route.outcome }}
        run: ./scripts/pr-agent-publish-guard.sh

      # CI-GATE-017 (#1527). The other branch of the `reviewable` step above:
      # every changed file matched `.pr_agent.toml`'s own `[ignore]` glob, so
      # PR-Agent has nothing to review and never ran. That is a structural
      # property of the diff, not a reviewer failure, so this declares it
      # plainly instead of letting the job fail for a reason the guard above
      # does not name. Same registry-driven escape as
      # `dependabot-declare-unreviewed.yml` (CI-GATE-015, #1364) -- proceeding
      # unreviewed is allowed, proceeding SILENTLY is not -- but the rationale
      # text differs on purpose: dependabot's says "comment /review", which
      # would carry the credential dependabot's run lacks. Here a `/review`
      # retry hits the SAME ignore filter and produces the SAME empty diff,
      # so pointing at it would be pointing at a dead end.
      - name: Declare unreviewed — diff is entirely excluded from review by .pr_agent.toml
        if: >
          always() && steps.reviewable.outputs.any == 'false'
            && (github.event_name == 'pull_request'
                || (github.event_name == 'issue_comment'
                    && contains(github.event.comment.body, '/review')))
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          registry=$(gh api "repos/${GITHUB_REPOSITORY}/contents/harness/review-attestation.json?ref=${BASE_REF}" \
            --jq '.content' | base64 -d)
          label=$(printf '%s' "$registry" | jq -r '.escape.label')
          section=$(printf '%s' "$registry" | jq -r '.escape.section')
          if [ -z "$label" ] || [ "$label" = "null" ] || [ -z "$section" ] || [ "$section" = "null" ]; then
            echo "::error::harness/review-attestation.json declares no escape.label/escape.section"
            exit 1
          fi

          # Read into a FILE and never interpolated into this script, same
          # reasoning as dependabot-declare-unreviewed.yml: the body is
          # attacker-influenced in principle, and the difference does not
          # matter at the point where a shell would expand it.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' > body.md

          # Idempotent on `synchronize`: a re-pushed all-secrets PR re-runs
          # this, and appending a second copy would make the gate read the
          # rationale from the first one and a human from the last.
          if grep -qxF "$section" body.md; then
            echo "already declared"
          else
            {
              printf '\n\n%s\n\n' "$section"
              printf 'PR-Agent (github-actions) published no review, and this section exists so\n'
              printf 'that fact is declared rather than implied. Proceeding unreviewed is allowed\n'
              printf 'here; proceeding SILENTLY is not.\n\n'
              printf 'Every changed file in this PR matches `.pr_agent.toml`'"'"'s own `[ignore]`\n'
              printf 'glob (read from `%s`), so the diff PR-Agent has left to review, after its\n' "$BASE_REF"
              printf 'own filter, is empty -- logged upstream as `Empty diff for PR` (CI-GATE-017,\n'
              printf '#1527). That is a structural property of the diff, not a quota or\n'
              printf 'saturation failure, and a `/review` retry on the same commit hits the\n'
              printf 'identical empty diff -- asking for one here would not produce a review.\n\n'
              printf 'Verify a change like this the way #1514/#1517/#1523 did: decrypt both\n'
              printf 'sides and diff the key NAMES, never the values (lesson-376).\n'
            } >> body.md
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -F body=@body.md --silent
            echo "rationale written"
          fi

          # Additive POST, not a replacing PUT -- see dependabot-declare-
          # unreviewed.yml's identical comment: a PUT would drop whatever
          # ecosystem/triage labels are already on the PR.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
            -f "labels[]=${label}" --silent

          # A zero exit is not evidence the label landed. Read it back, same
          # as the dependabot version -- a half-written declaration leaves
          # this job green, the gate red, and the PR reading "not reviewed,
          # and not declared as such" for as long as it lives.
          have=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name')
          if printf '%s\n' "$have" | grep -qxF "$label"; then
            echo "declared: '$label' is on PR #${PR_NUMBER}"
          else
            echo "labels on the PR after the write: $(printf '%s' "$have" | tr '\n' ' ')"
            echo "::error::escape label '$label' absent after the write; the gate reads this PR as undeclared"
            exit 1
          fi
