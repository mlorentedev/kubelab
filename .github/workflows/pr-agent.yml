---
# TOOL-021 Part 2 (#1140, spec #1160). The reviewer whose capacity is ours.
#
# The name `pr-agent` is a TWO-FILE AGREEMENT: `review-attestation.yml` declares
# `workflow_run: workflows: [pr-agent]` so the gate re-reads the verdict after
# this runs. Rename either side and re-evaluation stops firing SILENTLY — the
# reviewer would review, the gate would never look again, and every PR it
# reviewed would read unreviewed. Asserted by `tests/test_pr_agent_workflow.py`
# rather than left as a convention.
name: pr-agent

on:
  pull_request:
    # `synchronize` is here so a push is reviewed, and it is deliberately NOT in
    # `pr_actions` below — upstream routes it down a separate path
    # (`handle_push_trigger`), so listing it there is a setting that looks right
    # and asserts nothing.
    types: [opened, synchronize, reopened, ready_for_review]
  # Slash commands (/review, /improve) on an existing PR.
  issue_comment:
    types: [created]

concurrency:
  # The event name is part of the key and it is LOAD-BEARING. A PR comment is an
  # `issue_comment` whose `issue.number` IS the PR number, so without it a
  # comment-triggered run shares this group with the in-flight `pull_request` run
  # and `cancel-in-progress` kills the review. PR-Agent is a Docker action that
  # spends its first ~20s building, and a reviewer's auto-summary comment lands
  # reliably inside that window. Measured upstream on two PRs: both cancelled
  # mid-build, both workflows green, zero reviews produced.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # the review comments are the product
  issues: write          # slash-command replies land as issue comments

jobs:
  review:
    # Three conditions, each for its own reason:
    #
    # - `issue_comment` fires on issues too, and an issue has no diff to review.
    # - A draft PR is by definition not asking to be read yet.
    # - Release PRs are skipped. Upstream's config-level
    #   `ignore_pr_source_branches` was measured INERT on the Action path — loaded
    #   and never consulted, so release PRs were reviewed anyway (dotfiles #1073,
    #   recommendation: delete it). This is the replacement, at the only layer
    #   that actually runs. Without it PR-Agent's ticket-compliance pass reads the
    #   CHANGELOG's issue references, looks for their code in the diff, and
    #   reports "none of the above requirements are fulfilled" on EVERY release,
    #   structurally — noise guaranteed to recur, and noise from a reviewer is how
    #   a reviewer stops being read.
    #
    #   Branch-name matching was rejected for the attestation GATE because gaming
    #   the name would bypass review. Here it fails the other way: a branch named
    #   to match forfeits its review, and the gate then reports the PR unreviewed
    #   and goes red. Gaming it costs the gamer.
    #
    #   `head_ref` is empty on `issue_comment`, so a human typing `/review` on a
    #   release PR still gets one. A human asking is not structural noise.
    #
    # - The slash-command path is restricted to OWNER/MEMBER/COLLABORATOR. Any
    #   GitHub account can comment on a PR in a public repository,
    #   `issue_comment` runs in base-repo context with `NAN_API_KEY`, and the
    #   unrestricted form would let a stranger spend our inference budget and
    #   exercise `pull-requests: write` on demand.
    #
    #   An earlier version of this comment explained the upstream's unrestricted
    #   form away as "their repo is private". Measured 2026-08-19: it is PUBLIC.
    #   So that was a live exposure there rather than a difference in context,
    #   and reporting it produced a fix on their side. The lesson belongs to this
    #   port, not to them — the reason a condition is safe is itself a claim, and
    #   it has to be checked like any other. The association set is
    #   deliberately the same one `_MEMBER_ASSOCIATIONS` uses in
    #   `toolkit/features/review_attestation.py` — one definition of "belongs to
    #   this repository", used by both the gate and the reviewer.
    #
    #   Related, acknowledged rather than engineered for: a PR from a FORK gets no
    #   secrets on `pull_request`, so this job fails there and the attestation gate
    #   then reports the PR unreviewed. Correct behaviour, and currently
    #   hypothetical — the last 20 merged PRs have a single author.
    if: >
      (github.event_name == 'pull_request'
        && github.event.pull_request.draft == false
        && !startsWith(github.head_ref, 'release-please--'))
      || (github.event_name == 'issue_comment'
            && github.event.issue.pull_request
            && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                        github.event.comment.author_association))
    runs-on: ubuntu-latest
    # A run that hangs holds an inference slot for the full 6h default. Ported
    # from the upstream this reviewer came from, where the bound is what turns a
    # stuck run into a failed one somebody can see.
    timeout-minutes: 15
    # A SECOND concurrency group, deliberately, and not a replacement for the
    # workflow-level one above. That one keys on the PR and cancels — it stops a
    # PR racing itself. This one is global and QUEUES (`cancel-in-progress:
    # false`): the NaN cluster allows 5 simultaneous requests, shared with other
    # consumers, and exhausting them is the diagnosed cause of PR-Agent
    # reporting success while publishing nothing (upstream #1107).
    #
    # Known limit, stated rather than solved: concurrency groups are per
    # repository, so this serialises kubelab's own runs and not the other
    # repository's against the same cluster. Two serialised lanes, not one.
    concurrency:
      group: pr-agent-nan-inference
      cancel-in-progress: false
    steps:
      - name: PR-Agent
        # Pinned by COMMIT SHA, not by tag, and this deliberately exceeds the
        # upstream it ports from. A tag is mutable: whoever can move `v0.42.0`
        # can change what runs in a job that holds `NAN_API_KEY` on a public
        # repository. The SHA cannot be moved.
        #
        # Resolved 2026-08-19 from `repos/The-PR-Agent/pr-agent/git/ref/tags/v0.42.0`.
        # Bump it deliberately, by re-resolving the tag you intend — never by
        # editing the comment.
        uses: The-PR-Agent/pr-agent@f6af7d77554ff8d26adffded077e6461329e92fa  # v0.42.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NaN is OpenAI-compatible, so LiteLLM reaches it through the OpenAI
          # transport with the base URL swapped. The `openai/` prefix on the model
          # id in `.pr_agent.toml` is for the same reason; nothing talks to OpenAI.
          OPENAI__KEY: ${{ secrets.NAN_API_KEY }}
          OPENAI__API_BASE: https://api.nan.builders/v1
          CONFIG__PUBLISH_OUTPUT_PROGRESS: false
          # Stated rather than defaulted, so the event lists are visible instead
          # of implied. `synchronize` is NOT here on purpose — see the trigger
          # comment above.
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          # The push path, which is what actually reviews a new commit.
          github_action_config.handle_push_trigger: "true"
          # `/review` ONLY, and the omission is the point: upstream's default is
          # ['/describe', '/review'], so enabling the push trigger without saying
          # this would silently reinstate `describe` on every push and undo the
          # decision below.
          github_action_config.push_commands: '["/review"]'
          github_action_config.push_trigger_ignore_bot_commits: "true"
          github_action_config.push_trigger_ignore_merge_commits: "true"
          # `describe` REWRITES the PR body. The bodies in this repo carry
          # hand-written measurement tables, merge orders and before/after
          # evidence — the part worth reading — and a model rewriting them
          # destroys exactly that. It also removes one inference call per PR.
          # Off as a decision, not by accident.
          github_action_config.auto_describe: "false"
          github_action_config.auto_review: "true"
          # OFF, on local evidence rather than on the upstream's say-so. #1179
          # produced "Failed to generate code suggestions for PR", and on #1180
          # PR-Agent published `## PR Code Suggestions` and NO review at all
          # while reporting success — the improve call consumed the inference
          # slot the review needed. The review is the output this repository's
          # attestation gate depends on; suggestions are optional and remain
          # available on demand with an explicit `/improve`.
          github_action_config.auto_improve: "false"

      # PR-Agent reports SUCCESS when it starts and finishes, not when it
      # publishes. Observed on #1180: job green, `## PR Code Suggestions`
      # posted, zero comments carrying the review marker, and the attestation
      # gate correctly red — leaving a green reviewer job sitting beside a red
      # gate with nothing explaining the contradiction.
      #
      # The gate already protects the MERGE, so this step is not a second lock.
      # It converts a silent nothing into a red job that names its own cause,
      # which is the difference between "the gate is broken" and "the reviewer
      # produced nothing, here is why".
      #
      # The marker is read from the SAME registry the gate classifies with, so
      # the reviewer and its judge cannot disagree about what a review looks
      # like. A hardcoded string here would be a second source of truth.
      - name: Fail if no review was published
        if: >
          always() && (github.event_name == 'pull_request'
            || (github.event_name == 'issue_comment'
                && contains(github.event.comment.body, '/review')))
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          # The repository's OWN default branch, never
          # `github.event.pull_request.base.ref`. The base is attacker-influenced
          # — a PR author picks the target branch — and this reads a file from
          # that ref to decide what counts as a review. The upstream this ports
          # from uses `base.ref`; review-attestation.yml already rejected that
          # exact input for the same reason, so the port takes the hardened form
          # rather than reintroducing a decision this repository already made.
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          marker=$(gh api "repos/${GITHUB_REPOSITORY}/contents/harness/review-attestation.json?ref=${BASE_REF}" \
            --jq '.content' | base64 -d \
            | jq -r '.reviewers[] | select(.login == "github-actions") | .review_markers[0]')
          if [ -z "$marker" ] || [ "$marker" = "null" ]; then
            echo "::error::no review marker declared for github-actions in harness/review-attestation.json"
            exit 1
          fi
          found=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate --jq "[.[] | select(.body | contains(\"${marker}\"))] | length")
          if [ "$found" -gt 0 ]; then
            echo "review published (marker: ${marker})"
            exit 0
          fi
          echo "::error::PR-Agent reported success but published no review (no comment carries \"${marker}\")."
          echo "::error::Most likely cause: inference concurrency exhaustion — the NaN cluster allows 5"
          echo "::error::simultaneous requests and is shared with other consumers."
          exit 1
