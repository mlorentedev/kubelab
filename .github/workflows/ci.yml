---
name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel a superseded run when a new commit is pushed to the same PR — frees
# runners instead of letting stale builds occupy the fleet (ADR-030 amendment).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:

  validate:
    name: Validate
    # Fork PRs run on GitHub-hosted (self-hosted has Docker socket access)
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate branch name
        if: github.event_name == 'push' && github.ref_name != 'master'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$BRANCH_NAME" =~ ^(feature|fix|hotfix|chore)/.+ ]]; then
            echo "::error::Branch name must match feature/*, fix/*, hotfix/*, or chore/*"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate YAML syntax
        # Uses the repo .yamllint (single SSOT) — no inline config to drift.
        run: |
          pip install --quiet yamllint
          yamllint .github/workflows/

      - name: Validate Makefile
        run: make -n help >/dev/null

  # The toolkit drives every deploy, renders every manifest and applies every
  # secret, and until CI-001 its 420 tests ran only when a human remembered to.
  # Several safeguards exist SPECIFICALLY to be runnable with the on-demand
  # homelab powered off — tests/test_spoke_rbac_covers_manifests.py says so in
  # its own docstring — and that promise was not being kept anywhere.
  #
  # Deliberately unconditional: no paths filter. A toolkit test can break from a
  # change to infra/config/values (the tests read common.yaml as SSOT) or to
  # infra/k8s (the RBAC and render tests walk the manifests), so filtering on
  # `toolkit/**` would skip exactly the cross-cutting breakage worth catching.
  # The job is well under a minute; a filter would buy nothing and cost coverage.
  tests:
    name: Tests
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    env:
      # Rich detects GitHub Actions and turns colour ON, which splits option
      # names with escape codes: `--check` renders as
      # `\x1b[1;36m-\x1b[0m\x1b[1;36m-check\x1b[0m`, so the CLI help tests in
      # tests/test_sync.py cannot find their own substring. Measured, not
      # guessed: `GITHUB_ACTIONS=true` reproduces it on a workstation and
      # `TERM=dumb` fixes it, while NO_COLOR and FORCE_COLOR=0 do not.
      #
      # This makes CI deterministic; it does not make the assertions robust.
      # Those tests match rendered human-facing output and would break again in
      # any colour-enabled terminal — worth normalising at the assertion, which
      # is a change to test_sync.py and therefore a different PR.
      TERM: dumb
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        # `make setup` also provisions SOPS, certs and Ansible — none of which a
        # unit test touches, and all of which need credentials CI does not have.
        run: poetry install --no-interaction --no-ansi

      # Same three gates the Definition of Done requires locally, in the same
      # order, through the same Makefile targets — so a green CI run and a green
      # workstation run mean the same thing. Cluster-dependent suites carry the
      # `infra`/`e2e` markers and are deselected by the pytest config, so nothing
      # here needs VPN or a kubeconfig.
      - name: Tests
        run: make test

      - name: Lint
        run: make lint

      - name: Types
        run: make type

      # Nothing validated Ansible in this repo before this: `make lint` is ruff
      # over toolkit/, and pre-commit's yamllint only proves a file is YAML. A
      # playbook can be valid YAML and still be rejected by Ansible — an unknown
      # module, a missing role, a malformed `hosts:` — and until now the first
      # thing to notice was a deploy against real infrastructure.
      #
      # ansible-core, not the full `ansible` package: requirements.yml names the
      # collections this repo actually uses, and pulling the batteries-included
      # distribution to get three of them costs an order of magnitude more.
      - name: Install Ansible
        run: pip install --quiet ansible-core

      # syntax-check LOADS the roles a playbook includes, so a role using
      # community.docker fails to parse when the collection is absent — measured
      # against ANSIBLE_COLLECTIONS_PATH=/nonexistent, not assumed. Cached on
      # requirements.yml so the ~30s install happens only when it changes;
      # same shape as review-attestation.yml's Poetry cache.
      - name: Cache Ansible collections
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ runner.os }}-${{ hashFiles('infra/ansible/requirements.yml') }}

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r infra/ansible/requirements.yml

      - name: Ansible
        run: make lint-ansible

      # Report, do not gate. `kubectl kustomize` renders the overlays for the
      # OBS-007 tier assertions; if the runner image ever drops kubectl those
      # tests skip with CANNOT CHECK rather than passing vacuously, and this step
      # is how that becomes visible instead of silent.
      - name: Record whether kubectl was available
        if: always()
        run: |
          if command -v kubectl >/dev/null; then
            kubectl version --client -o yaml | head -3 >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::kubectl absent — rendered-manifest tests skipped"
            echo "kubectl absent: rendered-manifest tests were CANNOT CHECK, not verified." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  detect-changes:
    name: Detect Changes
    needs: validate
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    outputs:
      api: ${{ steps.filter.outputs.api }}
      errors: ${{ steps.filter.outputs.errors }}
      any_changed: ${{ steps.check.outputs.any_changed }}
      changed_apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          base: >-
            ${{ github.event.before != '0000000000000000000000000000000000000000'
            && github.event.before || github.sha }}
          filters: |
            api:
              - 'apps/api/**'
            errors:
              - 'edge/errors/**'

      - name: Check if any app changed
        id: check
        env:
          API: ${{ steps.filter.outputs.api }}
          ERRORS: ${{ steps.filter.outputs.errors }}
        run: |
          if [[ "$API" == "true" || "$ERRORS" == "true" ]]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: List changed apps
        id: list
        env:
          API: ${{ steps.filter.outputs.api }}
          ERRORS: ${{ steps.filter.outputs.errors }}
        run: |
          apps=()
          [[ "$API" == "true" ]] && apps+=("api")
          [[ "$ERRORS" == "true" ]] && apps+=("errors")
          apps_json=$(printf '%s\n' "${apps[@]}" | jq -R . | jq -c -s .)
          echo "apps=${apps_json}" >> "$GITHUB_OUTPUT"

  api-pipeline:
    name: API
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    uses: ./.github/workflows/ci-pipeline.yml
    with:
      app: api
      runner: >-
        ${{ github.event.pull_request.head.repo.fork
            && '"ubuntu-latest"'
            || vars.RUNNER_DOCKER || '"ubuntu-latest"' }}
    secrets: inherit

  errors-pipeline:
    name: Errors
    needs: detect-changes
    if: needs.detect-changes.outputs.errors == 'true'
    uses: ./.github/workflows/ci-pipeline.yml
    with:
      app: errors
      runner: >-
        ${{ github.event.pull_request.head.repo.fork
            && '"ubuntu-latest"'
            || vars.RUNNER_DOCKER || '"ubuntu-latest"' }}
    secrets: inherit
