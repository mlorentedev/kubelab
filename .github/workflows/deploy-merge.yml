---
name: deploy-merge

# DELIVERY-004 AC6 (#1619): the merge step for mechanical staging deploys, the
# "diff nobody wrote" exception. Behind a switch that ships OFF:
# `mechanical.merge` in harness/review-attestation.json. While it is off, every
# run only reports what it would do. That report is the evidence the flip (its
# own PR) links on #1619.
#
# `toolkit tools deploy-merge` judges every open non-draft PR to master from
# master's code: the verdict recomputed at one head sha, every context branch
# protection requires passing on that sha, `clean`, and the head unchanged at
# the end. It never reads the event payload or a branch name. This file only
# acts on its decisions:
#
#   merge   squash-merge, pinned to the judged sha (--match-head-commit). A
#           refusal because the head moved means the receiver force-pushed a
#           newer tag mid-run. That is reported as superseded, and the next
#           run judges the new head.
#   close   the PR has no changed files, so there is nothing to merge (#2649
#           merged empty). Reopening it undoes this.
#
# Identity: the merge runs with RELEASE_PLEASE_TOKEN, so the push workflows
# fire after it; a merge made with GITHUB_TOKEN starts none. Everything else
# reads with GITHUB_TOKEN. Auto-merge stays off (tests/test_no_auto_merge.py),
# and tests/test_deploy_shape_widening.py pins the one merge line below.

on:
  workflow_run:
    workflows: [CI, review-attestation, deploy-shape]
    types: [completed]
  schedule:
    # Off the top of the hour: GitHub delays or drops scheduled runs at minute zero.
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: deploy-merge
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write   # close and comment
  checks: read
  statuses: read

jobs:
  merge:
    name: Merge mechanical deploys
    # A dispatch on another branch would judge with that branch's code. This
    # only stops an accidental one: a branch can edit this line too.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # No `ref:`. For schedule and workflow_run, github.sha is the default
      # branch's tip, never a PR's head, so the judge and its declarations are
      # master's, as in the repository's other scheduled workflows. A dispatch
      # is limited to the default branch by the job's `if:`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: python -m pip install "poetry>=1.8,<2.0"

      - name: Cache Poetry's package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py3.12-

      - name: Install project deps
        run: poetry install --only main

      - name: Judge the open pull requests
        id: judge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          poetry run toolkit tools deploy-merge --out "$RUNNER_TEMP/decisions.json"
          echo "enabled=$(jq -r .enabled "$RUNNER_TEMP/decisions.json")" >> "$GITHUB_OUTPUT"

      - name: Report what an enabled switch would do
        if: steps.judge.outputs.enabled != 'true'
        run: |
          jq -r '.decisions[] | select(.action != "skip") | "would \(.action) #\(.pr) at \(.head_sha): \(.reason)"' \
            "$RUNNER_TEMP/decisions.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Close pull requests with nothing to merge
        if: steps.judge.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq -r '.decisions[] | select(.action == "close") | "\(.pr) \(.head_sha)"' "$RUNNER_TEMP/decisions.json" |
          while read -r n sha; do
            if [ "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${n}" --jq .head.sha)" != "$sha" ]; then
              echo "::notice::#${n} moved since it was judged empty; the next run judges it again"
              continue
            fi
            # Close first: a close that fails leaves no comment, so a persistent API
            # failure cannot post one per run. A closed PR is not judged again.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${n}" -f state=closed >/dev/null
            body="Closed: this pull request has no changed files at ${sha}, so there is nothing to merge."
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${n}/comments" -f body="${body} Reopen it to undo." >/dev/null
            echo "closed #${n} (empty at ${sha})" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Merge mechanical deploys at the judged sha
        if: steps.judge.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -uo pipefail
          failed=0
          while read -r n sha; do
            if gh pr merge "$n" --squash --match-head-commit "$sha"; then
              echo "merged #${n} at ${sha}" | tee -a "$GITHUB_STEP_SUMMARY"
            elif [ "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${n}" --jq .head.sha)" != "$sha" ]; then
              echo "::notice::#${n} superseded: its head moved past ${sha}; the next run judges the new head"
            else
              echo "::error::#${n} was judged mergeable at ${sha} and the merge was refused"
              failed=1
            fi
          done < <(jq -r '.decisions[] | select(.action == "merge") | "\(.pr) \(.head_sha)"' "$RUNNER_TEMP/decisions.json")
          exit "$failed"
