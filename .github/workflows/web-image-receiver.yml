---
name: Web Image Receiver

# Cross-repo receiver (ADR-053 §2). mlorentedev/web CI publishes an immutable
# `sha-<short>` image and fires a `repository_dispatch` (web-image-published).
# Here we promote that tag to staging via `toolkit deployment promote` and open a
# staging-deploy PR (ADR-046 D3 — PR-per-update); merging it (human + required
# checks) lets Argo CD sync staging to master HEAD. Same mechanism as
# staging-deploy.yml, but triggered by the dispatch instead of an apps/web push.
#
# Opened with RELEASE_PLEASE_TOKEN (a PAT), NOT GITHUB_TOKEN: a PR opened by
# GITHUB_TOKEN does not trigger `on: pull_request`, so its required checks would
# never run and it could never be merged.
#
# One long-lived offer, not a queue: only the latest web sha matters for
# continuous staging, so the promotion lands on a single stable branch
# (`deploy/staging-web`) whose pull request is force-updated in place. This
# replaced a coalesce-by-closing loop, which produced 67 superseded closes in 104
# PRs against one genuine decline (DELIVERY-005, #1645).
#
# Prod promotion is unchanged — the existing gated promote-prod.yml.

on:
  repository_dispatch:
    types: [web-image-published]

permissions:
  contents: write
  pull-requests: write

# Serialize dispatches so rapid web pushes process one at a time (latest wins by
# force-updating the stable branch). cancel-in-progress: false — never kill a
# promote mid-push, which could leave a branch without its PR.
#
# That state arrived anyway, six times, through the path this guard does not
# cover: the PR call failing after the push succeeded (DELIVERY-006, #1651).
# #1660 made the create survive it, and a stable branch retires the class — the
# branch is now MEANT to persist, so an interrupted run leaves a ref that the
# next dispatch reuses instead of debris nothing collects.
#
# Serialisation is also what makes the bare `--force` below safe: it is the only
# writer of `deploy/staging-web`, and it never races itself.
concurrency:
  group: web-image-receiver
  cancel-in-progress: false

jobs:
  promote-web:
    name: Promote web ${{ github.event.client_payload.tag }} → staging
    runs-on: ${{ fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install toolkit
        run: |
          python -m pip install "poetry>=1.8,<2.0"
          poetry install --only main

      - name: Promote web to staging
        env:
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          # Defensive: the dispatch is authenticated (KUBELAB_DISPATCH_TOKEN), but
          # staging only ever tracks immutable sha-<short> tags (ADR-046).
          case "$TAG" in
            sha-*) ;;
            *) echo "::error::Unexpected tag '$TAG' (expected sha-<short>)"; exit 1 ;;
          esac
          poetry run toolkit deployment promote --env staging --app web --version "$TAG"

      - name: Open or update the staging deploy PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          git config user.name "kubelab-bot"
          git config user.email "bot@kubelab.live"
          git add infra/config/values/staging.yaml infra/k8s/overlays/staging/
          if git diff --staged --quiet; then
            echo "No staging overlay changes to promote (web already at ${TAG})"; exit 0
          fi

          # ONE STABLE BRANCH PER APP, not one per sha (DELIVERY-005, #1645).
          #
          # Keying the branch on the sha minted a new branch, and therefore a new
          # pull request, on every web push. Measured over every
          # `chore(staging): deploy` PR this repository has had: 104 opened, 35
          # merged, 68 closed — and of those closes, 67 were superseded by a
          # newer one rather than declined. The human gate was exercised as a
          # genuine "no, hold staging" ONCE.
          #
          # A stable branch removes the churn without touching the gate. What was
          # a queue of PRs racing each other is now one long-lived offer,
          # force-updated to the newest sha. ADR-037's declinable offer survives
          # intact and improves: declining used to mean closing a PR a newer one
          # would replace anyway; now it means simply not merging, and staging
          # stays put for as long as you want. `allow_auto_merge` stays false.
          BRANCH="deploy/staging-web"
          TITLE="chore(staging): deploy web ${TAG}"
          BODY="Staging promotion of \`web\` to \`${TAG}\` (ADR-046, cross-repo dispatch from mlorentedev/web).

          This pull request is long-lived: every web image dispatch force-updates
          it to the newest \`sha-*\` and rewrites this title. Merging it moves
          staging; leaving it open keeps staging where it is (ADR-037)."

          # The lookup runs BEFORE the push, deliberately.
          #
          # AC2 requires the title to name the sha currently offered — a
          # long-lived PR whose title describes an older commit is worse than the
          # churn it replaces, because someone merges it by its title. Pushing
          # first and then failing to reach the API would produce exactly that:
          # new content on the branch, old sha in the title.
          #
          # Asking first means a failure here exits with the remote untouched, so
          # the offer and its description still agree. Under `bash -e` a failing
          # command substitution ends the step, which is the intent — this is not
          # a case to swallow.
          PR=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY%%/*}:${BRANCH}" \
            --jq '.[0].number // ""')

          git checkout -B "$BRANCH"
          git commit -m "$TITLE"

          # `--force`, NOT `--force-with-lease`, and the distinction is measured
          # rather than assumed.
          #
          # The branch is always exactly one commit ahead of master — the
          # promotion — so every update rewrites it. On this checkout the lease
          # cannot help: `actions/checkout` fetches only the ref it checks out, so
          # there is no remote-tracking value for `deploy/staging-web` and the
          # push is refused outright with `(stale info)`. Fetching first to arm it
          # would make it vacuous instead, since the lease then compares against
          # the value we just fetched (kubelab lesson-430). A seatbelt that is
          # either jammed shut or unbuckled is not worth the pretence of wearing.
          #
          # What actually protects this branch is that nothing else writes it: the
          # workflow serialises on `concurrency: web-image-receiver`, and the ref
          # is machine-owned.
          git push origin "$BRANCH" --force

          # Create or update. No coalescing loop any more — with a single branch
          # there is nothing to supersede, so the `gh pr list` / `gh pr close`
          # calls are gone and with them the last GraphQL call in this step.
          #
          # `state=open` is what makes a closed PR recoverable (AC5): a PR closed
          # to hold staging reads as absent here, so the next dispatch opens a
          # fresh one. Closing means "not now", never "never again".
          if [ -n "$PR" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR}" \
              -f title="$TITLE" -f body="$BODY" --jq '.html_url'
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" \
              -f title="$TITLE" -f head="$BRANCH" -f base="master" \
              -f body="$BODY" --jq '.html_url'
          fi
