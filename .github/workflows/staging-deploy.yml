---
name: Deploy Staging
# Continuous delivery to staging (ADR-046 D3 — PR-per-update) for the in-tree apps, api and
# console (ADR-074), each with its own build, its own job and its own long-lived deploy PR. On
# each push to master that changes app code, build an immutable `sha-<short>` image per
# changed app, run `toolkit deployment promote --env staging`, and open a PR with
# the regenerated overlay. Merging it lets Argo CD sync staging to master HEAD.
# deploy-merge.yml merges it without a human once it is mechanical and every
# context is green (DELIVERY-004); prod keeps its operator merge.
#
# The PR is opened with RELEASE_PLEASE_TOKEN (a PAT), NOT the default
# GITHUB_TOKEN: a PR opened by GITHUB_TOKEN does not trigger `on: pull_request`
# workflows, so its required checks would never run and it could never be merged.
#
# `paths: apps/**` means the promotion PR (which touches only infra/) does not
# re-trigger this workflow — no loop.
#
# `workflow_dispatch` exists to VERIFY this file, not to deploy from it. A run
# that creates jobs is the only proof that the startup failure below is gone, and
# a push under `apps/api/**` cannot be manufactured on demand. Dispatched on
# master the path filter finds nothing changed, so the build is skipped and the
# run is a clean no-op — which is exactly the evidence wanted (#1666, AC1).
on:
  push:
    branches: [master]
    paths:
      - 'apps/**'
  workflow_dispatch:

# `security-events: write` is here because `ci-publish.yml`'s `docker-build-push`
# job asks for it, and A CALLER'S `permissions:` BLOCK IS A CEILING: every scope
# it does not name is `none`, including for the workflows it calls. Without this
# line GitHub refuses the run when it is created:
#
#   Error calling workflow '.../ci-publish.yml'. The nested job
#   'docker-build-push' is requesting 'security-events: write', but is only
#   allowed 'security-events: none'.
#
# That is a `startup_failure`: no jobs, therefore no check runs, therefore no
# annotations and nothing red on any commit or pull request. This file failed
# that way SIXTEEN times out of sixteen between 2026-06-18 and 2026-08-25, and
# `apps/api/**` reached staging exactly never in those ten weeks (#1666).
#
# `release.yml` has always granted it and has always worked; `ci-pipeline.yml`
# declares no ceiling at all, so the repository default applies and it works too.
# This file was the only caller that declared a ceiling and left the scope out.
# `tests/test_reusable_workflow_permission_ceiling.py` now asserts the relation,
# which `actionlint` cannot: it lives between two files.
permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ${{ fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    outputs:
      api: ${{ steps.filter.outputs.api }}
      console: ${{ steps.filter.outputs.console }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        with:
          # ci.yml's expression, for the same reason: on a `push` this is the
          # previous master commit, which is also what the action defaults to, so
          # push behaviour is unchanged. On a `workflow_dispatch` there is no
          # `before`, and the fallback to `github.sha` makes the filter compare a
          # commit against itself — no changes, build skipped, verification run
          # stays a no-op instead of deploying whatever master happens to hold.
          base: >-
            ${{ github.event.before != '0000000000000000000000000000000000000000'
            && github.event.before || github.sha }}
          filters: |
            api:
              - 'apps/api/**'
            console:
              - 'apps/console/**'
      - id: sha
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-api:
    name: Build API
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    uses: ./.github/workflows/ci-publish.yml
    with:
      app: api
      tag: ${{ needs.detect-changes.outputs.sha }}
      sha: ${{ github.sha }}
      context: ./apps/api
      runner: ${{ vars.RUNNER_DOCKER || '"ubuntu-latest"' }}
    secrets: inherit

  build-console:
    name: Build Console
    needs: detect-changes
    if: needs.detect-changes.outputs.console == 'true'
    uses: ./.github/workflows/ci-publish.yml
    with:
      app: console
      tag: ${{ needs.detect-changes.outputs.sha }}
      sha: ${{ github.sha }}
      context: ./apps/console
      runner: ${{ vars.RUNNER_DOCKER || '"ubuntu-latest"' }}
    secrets: inherit

  open-pr:
    name: Open Staging Deploy PR
    needs: [detect-changes, build-api]
    # Run if the app built successfully (a skipped build is not a failure).
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.build-api.result == 'success'
    # One writer of deploy/staging-api at a time. Not cancelled: a queued run
    # replaced by a newer one loses nothing, since only a push that changed
    # apps/api reaches this job and the newer sha contains the older. The group
    # orders jobs by when their build finished, not by push order, so an older
    # build can still arrive last: the promote step refuses it (#3122).
    concurrency:
      group: staging-deploy-api
      cancel-in-progress: false
    runs-on: ${{ fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      # master's tip when the job starts, NOT the pushed sha. The build takes
      # minutes, and anything that merges meanwhile is missing from the pushed
      # sha. A deploy PR written there cannot merge: #3122 was written onto
      # 1b5e724 after #3120 had moved the same line, and it conflicted. Full
      # history, because the promote step asks git which build is newer.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
      - name: Install toolkit
        run: |
          python -m pip install "poetry>=1.8,<2.0"
          poetry install --only main
      # Promotes only forward. Once the checkout is master's tip, master may
      # already pin a build newer than this one, and promoting would write a
      # clean downgrade that deploy-merge then merges as mechanical. A later
      # master commit contains every earlier one, so ancestry decides. A pin
      # git cannot place fails the job rather than guessing (tests/test_staging_deploy_forward_only.py).
      - name: Promote built apps to staging
        id: promote
        env:
          SHA: ${{ needs.detect-changes.outputs.sha }}
          API_BUILT: ${{ needs.build-api.result }}
        run: |
          if [ "$API_BUILT" != "success" ]; then exit 0; fi

          # `--allow-unpinned`: an app with no pin at all is a first promotion, which no
          # earlier build can precede. Only an ABSENT pin is tolerated; a malformed one fails.
          CURRENT=$(poetry run toolkit deployment image-tag --env staging --app api --allow-unpinned)
          if [ -n "$CURRENT" ]; then
            rc=0
            git merge-base --is-ancestor "${CURRENT#sha-}" "$GITHUB_SHA" || rc=$?
            case "$rc" in
              0) ;;
              1) echo "::notice::master already pins api ${CURRENT}, a build newer than ${SHA}; nothing to promote"
                 exit 0 ;;
              *) echo "::error::cannot place the staging pin ${CURRENT} in master's history"
                 exit 1 ;;
            esac
          fi

          poetry run toolkit deployment promote --env staging --app api --version "$SHA"
      # The same step as product-image-receiver.yml's `open-pr`, for the same
      # reasons, and run by the same tests (tests/test_receiver_pr_step.py).
      - name: Open staging deploy PR
        id: open-pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          APP: api
          TAG: ${{ needs.detect-changes.outputs.sha }}
        run: |
          git config user.name "kubelab-bot"
          git config user.email "bot@kubelab.live"
          git add infra/config/values/staging.yaml infra/k8s/overlays/staging/
          if git diff --staged --quiet; then
            echo "No staging changes to promote (${APP} already at ${TAG})"; exit 0
          fi

          # ONE STABLE BRANCH, not one per sha (#1681). Keyed on the sha, every
          # api push minted a PR and the older ones were closed as superseded by
          # hand (five on 2026-11-02 alone). One long-lived offer, force-updated
          # to the newest sha. Merging moves staging; deploy-merge merges it when
          # it is mechanical and green, and a draft holds it (DELIVERY-004).
          BRANCH="deploy/staging-${APP}"
          TITLE="chore(staging): deploy ${APP} ${TAG}"
          BODY="Staging promotion of \`${APP}\` to \`${TAG}\` (ADR-046).

          This pull request is long-lived: every api push force-updates it to the
          newest \`sha-*\` and rewrites this title. Merging it moves staging.
          deploy-merge merges it once it is mechanical and green (DELIVERY-004);
          to hold staging, convert it to a draft (docs/runbooks/gitops-delivery-promotion.md)."

          # Asked BEFORE the push, so an API failure leaves the remote untouched
          # and the title never names a sha the branch no longer carries.
          PR=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY%%/*}:${BRANCH}" \
            --jq '.[0].number // ""')

          git checkout -B "$BRANCH"
          git commit -m "$TITLE"

          # `--force`, not `--force-with-lease`: checkout fetched only master, so
          # a lease has nothing to compare against (lesson-430). The job's
          # concurrency group makes this the branch's only writer.
          git push origin "$BRANCH" --force

          # `state=open` makes a closed PR read as absent, so the next push
          # offers again: closing means "not now", never "never again".
          if [ -n "$PR" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR}" \
              -f title="$TITLE" -f body="$BODY" --jq '.html_url'
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" \
              -f title="$TITLE" -f head="$BRANCH" -f base="master" \
              -f body="$BODY" --jq '.html_url'
          fi

  open-pr-console:
    name: Open Staging Deploy PR (console)
    needs: [detect-changes, build-console]
    # Run if the app built successfully (a skipped build is not a failure).
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.build-console.result == 'success'
    # One writer of deploy/staging-console at a time. Not cancelled: a queued run
    # replaced by a newer one loses nothing, since only a push that changed
    # apps/console reaches this job and the newer sha contains the older. The group
    # orders jobs by when their build finished, not by push order, so an older
    # build can still arrive last: the promote step refuses it (#3122).
    concurrency:
      group: staging-deploy-console
      cancel-in-progress: false
    runs-on: ${{ fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      # master's tip when the job starts, NOT the pushed sha. The build takes
      # minutes, and anything that merges meanwhile is missing from the pushed
      # sha. A deploy PR written there cannot merge: #3122 was written onto
      # 1b5e724 after #3120 had moved the same line, and it conflicted. Full
      # history, because the promote step asks git which build is newer.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
      - name: Install toolkit
        run: |
          python -m pip install "poetry>=1.8,<2.0"
          poetry install --only main
      # Promotes only forward. Once the checkout is master's tip, master may
      # already pin a build newer than this one, and promoting would write a
      # clean downgrade that deploy-merge then merges as mechanical. A later
      # master commit contains every earlier one, so ancestry decides. A pin
      # git cannot place fails the job rather than guessing (tests/test_staging_deploy_forward_only.py).
      - name: Promote built apps to staging
        id: promote
        env:
          SHA: ${{ needs.detect-changes.outputs.sha }}
          CONSOLE_BUILT: ${{ needs.build-console.result }}
        run: |
          if [ "$CONSOLE_BUILT" != "success" ]; then exit 0; fi

          # `--allow-unpinned`: an app with no pin at all is a first promotion, which no
          # earlier build can precede. Only an ABSENT pin is tolerated; a malformed one fails.
          CURRENT=$(poetry run toolkit deployment image-tag --env staging --app console --allow-unpinned)
          if [ -n "$CURRENT" ]; then
            rc=0
            git merge-base --is-ancestor "${CURRENT#sha-}" "$GITHUB_SHA" || rc=$?
            case "$rc" in
              0) ;;
              1) echo "::notice::master already pins console ${CURRENT}, a build newer than ${SHA}; nothing to promote"
                 exit 0 ;;
              *) echo "::error::cannot place the staging pin ${CURRENT} in master's history"
                 exit 1 ;;
            esac
          fi

          poetry run toolkit deployment promote --env staging --app console --version "$SHA"
      # The same step as product-image-receiver.yml's `open-pr`, for the same
      # reasons, and run by the same tests (tests/test_receiver_pr_step.py).
      - name: Open staging deploy PR
        id: open-pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          APP: console
          TAG: ${{ needs.detect-changes.outputs.sha }}
        run: |
          git config user.name "kubelab-bot"
          git config user.email "bot@kubelab.live"
          git add infra/config/values/staging.yaml infra/k8s/overlays/staging/
          if git diff --staged --quiet; then
            echo "No staging changes to promote (${APP} already at ${TAG})"; exit 0
          fi

          # ONE STABLE BRANCH, not one per sha (#1681). Keyed on the sha, every
          # console push minted a PR and the older ones were closed as superseded by
          # hand (five on 2026-11-02 alone). One long-lived offer, force-updated
          # to the newest sha. Merging moves staging; deploy-merge merges it when
          # it is mechanical and green, and a draft holds it (DELIVERY-004).
          BRANCH="deploy/staging-${APP}"
          TITLE="chore(staging): deploy ${APP} ${TAG}"
          BODY="Staging promotion of \`${APP}\` to \`${TAG}\` (ADR-046).

          This pull request is long-lived: every console push force-updates it to the
          newest \`sha-*\` and rewrites this title. Merging it moves staging.
          deploy-merge merges it once it is mechanical and green (DELIVERY-004);
          to hold staging, convert it to a draft (docs/runbooks/gitops-delivery-promotion.md)."

          # Asked BEFORE the push, so an API failure leaves the remote untouched
          # and the title never names a sha the branch no longer carries.
          PR=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY%%/*}:${BRANCH}" \
            --jq '.[0].number // ""')

          git checkout -B "$BRANCH"
          git commit -m "$TITLE"

          # `--force`, not `--force-with-lease`: checkout fetched only master, so
          # a lease has nothing to compare against (lesson-430). The job's
          # concurrency group makes this the branch's only writer.
          git push origin "$BRANCH" --force

          # `state=open` makes a closed PR read as absent, so the next push
          # offers again: closing means "not now", never "never again".
          if [ -n "$PR" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR}" \
              -f title="$TITLE" -f body="$BODY" --jq '.html_url'
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" \
              -f title="$TITLE" -f head="$BRANCH" -f base="master" \
              -f body="$BODY" --jq '.html_url'
          fi
