---
name: Deploy Staging
# Continuous delivery to staging (ADR-046 D3 — PR-per-update). On each push to
# master that changes app code, build an immutable `sha-<short>` image per
# changed app, run `toolkit deployment promote --env staging`, and open a PR with
# the regenerated overlay. Merging it (human + required checks) lets Argo CD sync
# staging to master HEAD. Same mechanism as prod promotion; staging differs only
# in that the PR is opened automatically here.
#
# The PR is opened with RELEASE_PLEASE_TOKEN (a PAT), NOT the default
# GITHUB_TOKEN: a PR opened by GITHUB_TOKEN does not trigger `on: pull_request`
# workflows, so its required checks would never run and it could never be merged.
#
# `paths: apps/**` means the promotion PR (which touches only infra/) does not
# re-trigger this workflow — no loop.
#
# `workflow_dispatch` exists to VERIFY this file, not to deploy from it. A run
# that creates jobs is the only proof that the startup failure below is gone, and
# a push under `apps/api/**` cannot be manufactured on demand. Dispatched on
# master the path filter finds nothing changed, so the build is skipped and the
# run is a clean no-op — which is exactly the evidence wanted (#1666, AC1).
on:
  push:
    branches: [master]
    paths:
      - 'apps/**'
  workflow_dispatch:

# `security-events: write` is here because `ci-publish.yml`'s `docker-build-push`
# job asks for it, and A CALLER'S `permissions:` BLOCK IS A CEILING: every scope
# it does not name is `none`, including for the workflows it calls. Without this
# line GitHub refuses the run when it is created:
#
#   Error calling workflow '.../ci-publish.yml'. The nested job
#   'docker-build-push' is requesting 'security-events: write', but is only
#   allowed 'security-events: none'.
#
# That is a `startup_failure`: no jobs, therefore no check runs, therefore no
# annotations and nothing red on any commit or pull request. This file failed
# that way SIXTEEN times out of sixteen between 2026-06-18 and 2026-08-25, and
# `apps/api/**` reached staging exactly never in those ten weeks (#1666).
#
# `release.yml` has always granted it and has always worked; `ci-pipeline.yml`
# declares no ceiling at all, so the repository default applies and it works too.
# This file was the only caller that declared a ceiling and left the scope out.
# `tests/test_reusable_workflow_permission_ceiling.py` now asserts the relation,
# which `actionlint` cannot: it lives between two files.
permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ${{ fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    outputs:
      api: ${{ steps.filter.outputs.api }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # ci.yml's expression, for the same reason: on a `push` this is the
          # previous master commit, which is also what the action defaults to, so
          # push behaviour is unchanged. On a `workflow_dispatch` there is no
          # `before`, and the fallback to `github.sha` makes the filter compare a
          # commit against itself — no changes, build skipped, verification run
          # stays a no-op instead of deploying whatever master happens to hold.
          base: >-
            ${{ github.event.before != '0000000000000000000000000000000000000000'
            && github.event.before || github.sha }}
          filters: |
            api:
              - 'apps/api/**'
      - id: sha
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-api:
    name: Build API
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    uses: ./.github/workflows/ci-publish.yml
    with:
      app: api
      tag: ${{ needs.detect-changes.outputs.sha }}
      sha: ${{ github.sha }}
      context: ./apps/api
      runner: ${{ vars.RUNNER_DOCKER || '"ubuntu-latest"' }}
    secrets: inherit

  open-pr:
    name: Open Staging Deploy PR
    needs: [detect-changes, build-api]
    # Run if the app built successfully (a skipped build is not a failure).
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.build-api.result == 'success'
    runs-on: ${{ fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolkit
        run: |
          python -m pip install "poetry>=1.8,<2.0"
          poetry install --only main
      - name: Promote built apps to staging
        env:
          SHA: ${{ needs.detect-changes.outputs.sha }}
          API_BUILT: ${{ needs.build-api.result }}
        run: |
          if [ "$API_BUILT" = "success" ]; then
            poetry run toolkit deployment promote --env staging --app api --version "$SHA"
          fi
      - name: Open staging deploy PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          SHA: ${{ needs.detect-changes.outputs.sha }}
        run: |
          git config user.name "kubelab-bot"
          git config user.email "bot@kubelab.live"
          git add infra/config/values/staging.yaml infra/k8s/overlays/staging/
          if git diff --staged --quiet; then
            echo "No staging overlay changes to promote"; exit 0
          fi
          BRANCH="deploy/staging-${SHA}"
          git checkout -b "$BRANCH"
          git commit -m "chore(staging): deploy ${SHA}"
          git push -u origin "$BRANCH" --force-with-lease
          gh pr create --base master --head "$BRANCH" \
            --title "chore(staging): deploy ${SHA}" \
            --body "Automated staging promotion to \`${SHA}\` (ADR-046)."
