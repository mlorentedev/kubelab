---
name: deploy-shape

# DELIVERY-004 (#1619), operator condition (a). Says, on every PR to master,
# whether the diff is a mechanical staging deploy: the class declared under
# `mechanical` in harness/review-attestation.json, judged by
# toolkit/features/deploy_shape.py. Assert-only: nothing here merges.
#
# Published as a check-run named `deploy-shape`, because a required context
# needs a third answer that a commit status cannot give:
#
#   mechanical       success   every condition holds at the head sha
#   not-mechanical   neutral   a normal PR; neutral passes branch protection
#   unknown          failure   could not read or parse: fails closed
#
# This check is what people and branch protection see. It is NOT what grants
# anything: a same-repository PR can add a workflow that posts a check-run of
# this name. review-attestation and the merge job recompute the verdict
# themselves from master's code at the sha they verified.
#
# Fork PRs get a read-only token and cannot publish the check, as with
# review-attestation; accepted (DELIVERY-004 proposal, Risks).

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: deploy-shape-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write   # the check-run is the product

jobs:
  judge:
    name: Judge the diff shape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The default branch, never the PR's head: the predicate and its
      # declaration are files in this tree, and a PR must not judge itself
      # (same reasoning as review-attestation.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: python -m pip install "poetry>=1.8,<2.0"

      - name: Cache Poetry's package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py3.12-

      - name: Install project deps
        run: poetry install --only main

      - name: Judge
        id: judge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          poetry run toolkit tools deploy-shape --pr "$NUMBER" --out "$RUNNER_TEMP/deploy-shape.json"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # The verdict names the sha it judged; the event's sha is only the
      # fallback for a verdict that could not name one (unknown).
      - name: Publish the check-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.judge.outputs.code }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          verdict_file="$RUNNER_TEMP/deploy-shape.json"
          sha="$(jq -r '.head_sha // empty' "$verdict_file" 2>/dev/null || true)"
          reason="$(jq -r '.reason // empty' "$verdict_file" 2>/dev/null || true)"
          case "$CODE" in
            0) conclusion=success; title="mechanical staging deploy" ;;
            1) conclusion=neutral; title="not a mechanical deploy: review applies" ;;
            *) conclusion=failure; title="could not judge the diff shape" ;;
          esac
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="deploy-shape" \
            -f head_sha="${sha:-$EVENT_SHA}" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f "output[title]=$title" \
            -f "output[summary]=${reason:-no verdict was written}" \
            -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo "deploy-shape: ${conclusion} (${reason:-no verdict})"
