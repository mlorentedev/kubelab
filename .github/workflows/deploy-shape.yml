---
name: deploy-shape

# DELIVERY-004 (#1619), operator condition (a). Says, on every PR to master,
# whether the diff is a mechanical staging deploy: the class declared under
# `mechanical` in harness/review-attestation.json, judged by
# toolkit/features/deploy_shape.py. Assert-only: nothing here merges.
#
# Published as a commit status named `deploy-shape`, with the verdict in its
# description:
#
#   mechanical       success   every condition holds at the head sha
#   not-mechanical   success   a normal PR, which takes the normal review path
#   unknown          failure   could not read or parse: fails closed
#
# Never a check-run (DELIVERY-011, #2714). One posted with GITHUB_TOKEN is not
# attached to this workflow's suite but to the first github-actions suite on
# the sha, often review-attestation's or Spec Gate's. Those run again on the
# same sha by design, and branch protection stops seeing the check-runs of a
# superseded suite: the required context then reads "Expected" with every
# check green. A status belongs to no suite, which is why review-attestation
# is one too.
#
# This status is what people and branch protection see. It is NOT what grants
# anything: a same-repository PR can add a workflow that posts a status of
# this name. review-attestation and the merge job recompute the verdict
# themselves from master's code at the sha they verified.
#
# Fork PRs get a read-only token and cannot publish the status, as with
# review-attestation; accepted (DELIVERY-004 proposal, Risks).

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: deploy-shape-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  statuses: write   # the commit status is the product

jobs:
  judge:
    name: Judge the diff shape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The default branch, never the PR's head: the predicate and its
      # declaration are files in this tree, and a PR must not judge itself
      # (same reasoning as review-attestation.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: python -m pip install "poetry>=1.8,<2.0"

      - name: Cache Poetry's package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py3.12-

      - name: Install project deps
        run: poetry install --only main

      - name: Judge
        id: judge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          poetry run toolkit tools deploy-shape --pr "$NUMBER" --out "$RUNNER_TEMP/deploy-shape.json"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # The verdict names the sha it judged; the event's sha is only the
      # fallback for a verdict that could not name one (unknown).
      - name: Publish the status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.judge.outputs.code }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          verdict_file="$RUNNER_TEMP/deploy-shape.json"
          sha="$(jq -r '.head_sha // empty' "$verdict_file" 2>/dev/null || true)"
          reason="$(jq -r '.reason // empty' "$verdict_file" 2>/dev/null || true)"
          case "$CODE" in
            0) state=success; title="mechanical staging deploy" ;;
            1) state=success; title="not a mechanical deploy: review applies" ;;
            *) state=failure; title="could not judge the diff shape" ;;
          esac
          # GitHub refuses a status description over 140 characters; the full
          # reason is in this run's log, which the status links to.
          description="${title}: ${reason:-no verdict was written}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${sha:-$EVENT_SHA}" \
            -f state="$state" \
            -f context="deploy-shape" \
            -f description="${description:0:140}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo "deploy-shape: ${state}, ${title} (${reason:-no verdict})"

      # Fails the JOB only when the predicate could not answer, as
      # review-attestation does: `not-mechanical` is a verdict and lives in the
      # status; `unknown` is the gate malfunctioning, and a green job over it
      # would deliver "could not tell" as silence.
      - name: Fail the run only when the shape could not be judged
        env:
          CODE: ${{ steps.judge.outputs.code }}
        run: |
          if [ "$CODE" = "0" ] || [ "$CODE" = "1" ]; then exit 0; fi
          echo "::error::deploy-shape could not judge this PR (exit ${CODE:-none})"
          exit 2
