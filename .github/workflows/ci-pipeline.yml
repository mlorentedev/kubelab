---
name: CI + Build for App

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      runner:
        required: false
        type: string
        default: '"ubuntu-latest"'
        description: "JSON-encoded runner label (string or array for self-hosted)"
    outputs:
      docker_version:
        description: "Generated Docker version for this app"
        value: ${{ jobs.app-pipeline.outputs.docker_version }}
      sha_short:
        description: "Short SHA"
        value: ${{ jobs.app-pipeline.outputs.sha_short }}
      context:
        description: "Docker build context"
        value: ${{ jobs.app-pipeline.outputs.context }}
      should_build:
        description: "Whether the app should be built"
        value: ${{ jobs.app-pipeline.outputs.should_build }}
      extra_build_args:
        description: "Extra build args for Docker (web app PUBLIC_* vars)"
        value: ${{ jobs.app-pipeline.outputs.extra_build_args }}


jobs:
  app-pipeline:
    name: CI + Build for ${{ inputs.app }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    outputs:
      docker_version: ${{ steps.docker_version.outputs.version }}
      sha_short: ${{ steps.short_sha.outputs.sha }}
      context: ${{ steps.context.outputs.context }}
      should_build: ${{ steps.changes.outputs.should_build }}
      extra_build_args: ${{ steps.web_build_args.outputs.args }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate app and detect changes
        id: changes
        run: |
          APP="${{ inputs.app }}"
          echo "Validating app: $APP"

          # Resolve source directory (edge services vs platform apps)
          case "$APP" in
            errors) SOURCE_DIR="edge/$APP" ;;
            *)      SOURCE_DIR="apps/$APP" ;;
          esac

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Source directory $SOURCE_DIR does not exist, skipping"
            exit 0
          fi

          if [ ! -f "$SOURCE_DIR/Dockerfile" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "::error::Dockerfile not found in $SOURCE_DIR"
            exit 0
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "source_dir=$SOURCE_DIR" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------------
      # VERSIONING — release-please handles stable versions on master.
      # Feature branches build :dev images for testing.
      # ------------------------------------------------------------------------
      - name: Determine Docker Tag
        id: docker_version
        if: steps.changes.outputs.should_build == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" || "$BRANCH" == release-please--* ]]; then
            # Master + release-please: skip here. staging-deploy.yml builds the SHA
            # tag on push to master; release.yml builds the stable semver on release
            # (ADR-046 — no version prediction in this workflow).
            echo "version=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Docker build on master (staging-deploy.yml / release.yml handle it)"
          else
            # Feature branches: immutable per-commit tag for pre-merge preview.
            # release-please stays the sole authority for semver releases (ADR-046).
            FINAL_VERSION="sha-${GITHUB_SHA::7}"
            echo "version=$FINAL_VERSION" >> "$GITHUB_OUTPUT"
            echo "::notice::[DEV] Feature build: $FINAL_VERSION"
          fi

      # API
      - name: Set up Go (for api)
        if: steps.changes.outputs.should_build == 'true' && inputs.app == 'api'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          # Read from go.mod so CI can never build on an older toolchain than the
          # module declares (a literal here fell behind go.mod in #2429).
          go-version-file: './apps/api/src/go.mod'
          cache-dependency-path: './apps/api/src/go.sum'

      - name: Lint API code
        if: steps.changes.outputs.should_build == 'true' && inputs.app == 'api'
        working-directory: ./apps/api/src
        run: go vet ./...

      # The store tests run against a real Postgres with the migrations applied; without
      # one they skip, and in CI a skip fails them (#3117). Same image as the cluster's
      # (infra/k8s/base/services/postgres.yaml, held equal by tests/test_ci_store_postgres_image.py);
      # the password is a fixture, not a secret.
      - name: Start Postgres for the API store tests
        if: steps.changes.outputs.should_build == 'true' && inputs.app == 'api'
        run: |
          docker rm -f api-store-pg >/dev/null 2>&1 || true  # a self-hosted runner keeps containers
          docker run -d --name api-store-pg -p 127.0.0.1:55439:5432 \
            -e POSTGRES_USER=api -e POSTGRES_DB=api -e POSTGRES_PASSWORD=fixture postgres:16-alpine
          # Probe over TCP: the image's entrypoint first runs a socket-only init server,
          # which a socket probe reports ready before the real server and the database exist.
          ready=""
          for _ in $(seq 1 30); do
            if docker exec api-store-pg pg_isready -h 127.0.0.1 -p 5432 -U api -d api -q; then
              ready=1; break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "Postgres for the API store tests was not ready after 30s"
            docker logs api-store-pg
            exit 1
          fi
          for f in apps/api/migrations/*.sql; do
            docker exec -i api-store-pg psql -v ON_ERROR_STOP=1 -q -U api -d api < "$f"
          done

      - name: Test API code
        if: steps.changes.outputs.should_build == 'true' && inputs.app == 'api'
        working-directory: ./apps/api/src
        env:
          FORGE_TEST_POSTGRES_PORT: "55439"
        run: go test -race ./...

      - name: Build API binary
        if: steps.changes.outputs.should_build == 'true' && inputs.app == 'api'
        working-directory: ./apps/api/src
        run: go build -o api-binary ./cmd/server

      # Console (apps/console, ADR-074)
      - name: Set up Go (for the console's fixture contract)
        if: steps.changes.outputs.should_build == 'true' && inputs.app == 'console'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: './apps/api/src/go.mod'
          cache-dependency-path: './apps/api/src/go.sum'

      # The console develops against recorded answers of GET /console/queue, and this test holds
      # them to the handler's types. The `api` job runs it too, but only when apps/api changes: an
      # edit to the fixtures alone would otherwise reach master without it ever running. `-run`
      # matches nothing without failing, so the step also requires the test's own PASS line.
      - name: Console fixtures still match the API's queue contract
        if: steps.changes.outputs.should_build == 'true' && inputs.app == 'console'
        working-directory: ./apps/api/src
        run: |
          set -o pipefail
          go test ./internal/console -run '^TestFixturesMatchTheQueueContract$' -v | tee fixtures-contract.log
          grep -q -- '^--- PASS: TestFixturesMatchTheQueueContract' fixtures-contract.log

      - name: Set up Node (for console)
        if: steps.changes.outputs.should_build == 'true' && inputs.app == 'console'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version-file: './apps/console/.nvmrc'
          cache: npm
          cache-dependency-path: './apps/console/package-lock.json'

      - name: Install console dependencies
        if: steps.changes.outputs.should_build == 'true' && inputs.app == 'console'
        working-directory: ./apps/console
        run: npm ci

      # The type check and the static build run in the image build below (`npm run build`), so a
      # type error fails the image on every pull request; this step is the unit suite.
      - name: Test console code
        if: steps.changes.outputs.should_build == 'true' && inputs.app == 'console'
        working-directory: ./apps/console
        run: npm test

      - name: Audit console dependencies
        if: steps.changes.outputs.should_build == 'true' && inputs.app == 'console'
        working-directory: ./apps/console
        run: npm audit --omit=dev --audit-level=high || echo "::warning::Vulnerabilities found in console dependencies"

      # Security Scanning - Secret Detection
      - name: Run gitleaks secret scanner
        if: steps.changes.outputs.should_build == 'true'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      # Security Scanning - Python (toolkit)
      - name: Set up Python for security scanning
        if: steps.changes.outputs.should_build == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'

      - name: Install Python security tools
        if: steps.changes.outputs.should_build == 'true'
        run: |
          pip install --upgrade pip
          pip install bandit[toml] pip-audit

      - name: Run bandit SAST scanner on toolkit
        if: steps.changes.outputs.should_build == 'true'
        run: |
          echo "Running bandit on toolkit/"
          bandit -r toolkit/ -f json -o bandit-report.json || true
          bandit -r toolkit/ || true

      - name: Run pip-audit on toolkit dependencies
        if: steps.changes.outputs.should_build == 'true'
        run: |
          echo "Checking toolkit dependencies for vulnerabilities"
          pip-audit --desc --require pyproject.toml || echo "::warning::Vulnerabilities found in Python dependencies"

      # Security Scanning - Go (API)
      - name: Install gosec for API
        if: steps.changes.outputs.should_build == 'true' && inputs.app == 'api'
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run gosec SAST scanner on API
        if: steps.changes.outputs.should_build == 'true' && inputs.app == 'api'
        working-directory: ./apps/api/src
        run: |
          echo "Running gosec on API code"
          gosec -fmt json -out gosec-report.json ./... || true
          gosec ./... || true

      - name: Run govulncheck on API
        if: steps.changes.outputs.should_build == 'true' && inputs.app == 'api'
        working-directory: ./apps/api/src
        run: |
          echo "Checking API dependencies for vulnerabilities"
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./... || echo "::warning::Vulnerabilities found in Go dependencies"

      - name: Determine Docker context
        id: context
        run: |
          case "${{ inputs.app }}" in
            api)
              echo "context=./apps/api" >> "$GITHUB_OUTPUT"
              ;;
            errors)
              echo "context=./edge/errors" >> "$GITHUB_OUTPUT"
              ;;
            console)
              echo "context=./apps/console" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported app: ${{ inputs.app }}"
              exit 1
              ;;
          esac

      - name: Extract web build args from config
        id: web_build_args
        if: steps.changes.outputs.should_build == 'true' && inputs.app == 'web'
        run: |
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" ]]; then
            ENV_FILE="infra/config/values/prod.yaml"
          else
            ENV_FILE="infra/config/values/staging.yaml"
          fi
          COMMON="infra/config/values/common.yaml"

          # Helper: read from env yaml first, fall back to common yaml
          get_val() {
            local val
            val=$(yq "$1" "$ENV_FILE" 2>/dev/null)
            if [ "$val" = "null" ] || [ -z "$val" ]; then
              val=$(yq "$1" "$COMMON" 2>/dev/null)
            fi
            echo "$val"
          }

          WEB=".apps.platform.web"
          ARGS=""
          ARGS+="PUBLIC_SITE_TITLE=$(get_val "${WEB}.site_title")"$'\n'
          ARGS+="PUBLIC_SITE_DESCRIPTION=$(get_val "${WEB}.site_description")"$'\n'
          ARGS+="PUBLIC_SITE_DOMAIN=$(get_val "${WEB}.site_domain")"$'\n'
          ARGS+="PUBLIC_SITE_URL=$(get_val "${WEB}.site_url")"$'\n'
          ARGS+="PUBLIC_SITE_MAIL=$(get_val "${WEB}.site_mail")"$'\n'
          ARGS+="PUBLIC_SITE_AUTHOR=$(get_val "${WEB}.site_author")"$'\n'
          ARGS+="PUBLIC_SITE_KEYWORDS=$(get_val "${WEB}.site_keywords")"$'\n'
          ARGS+="PUBLIC_TWITTER_URL=$(get_val "${WEB}.twitter_url")"$'\n'
          ARGS+="PUBLIC_YOUTUBE_URL=$(get_val "${WEB}.youtube_url")"$'\n'
          ARGS+="PUBLIC_GITHUB_URL=$(get_val "${WEB}.github_url")"$'\n'
          ARGS+="PUBLIC_CALENDLY_URL=$(get_val "${WEB}.calendly_url")"$'\n'
          ARGS+="PUBLIC_BUY_ME_A_COFFEE_URL=$(get_val "${WEB}.buy_me_a_coffee_url")"$'\n'
          ARGS+="PUBLIC_GOOGLE_ANALYTICS_ID=$(get_val "${WEB}.google_analytics_id")"$'\n'
          ARGS+="PUBLIC_GOOGLE_TAG_MANAGER_ID=$(get_val "${WEB}.google_tag_manager_id")"$'\n'
          ARGS+="PUBLIC_ENABLE_BLOG=$(get_val "${WEB}.enable_blog")"$'\n'
          ARGS+="PUBLIC_ENABLE_HOMELABS=$(get_val "${WEB}.enable_homelabs")"$'\n'
          ARGS+="PUBLIC_ENABLE_CONTACT=$(get_val "${WEB}.enable_contact")"$'\n'
          ARGS+="PUBLIC_ALLOWED_HOSTS=$(get_val "${WEB}.allowed_hosts")"$'\n'
          ARGS+="BACKEND_URL=$(get_val "${WEB}.backend_url")"

          {
            echo "args<<ENDOFARGS"
            echo "$ARGS"
            echo "ENDOFARGS"
          } >> "$GITHUB_OUTPUT"

      # Stable tags handled by release-please (release.yml)
      - name: Extract short SHA
        id: short_sha
        if: steps.changes.outputs.should_build == 'true'
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  call-publish:
    name: Build and Push Docker Image for ${{ inputs.app }}
    needs: app-pipeline
    # Not for Dependabot, and the reason is the same one that stops the reviewer
    # running on its PRs (CI-GATE-015, #1364): a `pull_request` it raises reads
    # the Dependabot secret store, so `DOCKERHUB_USERNAME`/`DOCKERHUB_TOKEN`
    # resolve to empty strings and `docker/login-action` fails with `Username and
    # password required` before a single layer is built. Measured on #1358, the
    # golang base-image bump.
    #
    # Nothing is lost by skipping: the app's own `CI + Build` job already builds
    # the image on every PR and passed on that same #1358 — this job exists to
    # PUBLISH, and a bump's image is published from master after it merges.
    # Mirroring the secrets into the Dependabot store was the alternative, and it
    # would put a registry push credential within reach of a branch no human
    # wrote.
    if: >
      needs.app-pipeline.outputs.should_build == 'true'
      && needs.app-pipeline.outputs.docker_version != 'skip'
      && github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/ci-publish.yml
    with:
      app: ${{ inputs.app }}
      tag: ${{ needs.app-pipeline.outputs.docker_version }}
      sha: ${{ needs.app-pipeline.outputs.sha_short }}
      context: ${{ needs.app-pipeline.outputs.context }}
      extra_build_args: ${{ needs.app-pipeline.outputs.extra_build_args }}
      runner: ${{ inputs.runner }}
    secrets: inherit

  # GitOps update + tagging handled by release-please (release.yml)
