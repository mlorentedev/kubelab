---
name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      tag:
        required: true
        type: string
        description: "Docker version (e.g., 1.3.0-pre.123, 1.3.0-rc.45, 1.3.0)"
      sha:
        required: true
        type: string
      context:
        required: true
        type: string
      extra_build_args:
        required: false
        type: string
        default: ""
        description: "Additional build args (multiline key=value)"
      runner:
        required: false
        type: string
        default: '"ubuntu-latest"'
        description: "JSON-encoded runner label (string or array for self-hosted)"

    secrets:
      # Named, not inherited: the build reaches the registry credentials and
      # nothing else, and the notification its own webhook (CI-010, kubelab#3344).
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      N8N_WEBHOOK_URL:
        required: false
      N8N_DEPLOY_TOKEN:
        required: false

jobs:
  # The tags to publish, decided before the build. The image is named from the
  # repository owner rather than the DOCKERHUB_USERNAME secret: a `with:` cannot
  # read `secrets`, and a job output holding a secret's value is masked to
  # nothing. The manifests pin docker.io/mlorentedev/kubelab-<app>.
  tags:
    name: Tags for ${{ inputs.app }}:${{ inputs.tag }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions: {}
    env:
      REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX || 'kubelab' }}
    outputs:
      tags: ${{ steps.docker_tags.outputs.tags }}
      image_tag: ${{ steps.docker_tags.outputs.final_tag }}
      registry_url: ${{ steps.docker_tags.outputs.registry }}
      full_image: ${{ steps.docker_tags.outputs.full_image }}
      tag_type: ${{ steps.docker_tags.outputs.tag_type }}
    steps:
      - name: Generate Docker tags
        id: docker_tags
        env:
          DOCKER_VERSION: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
          APP: ${{ inputs.app }}
        run: |
          REGISTRY="docker.io/${OWNER}/${REGISTRY_PREFIX}-${APP}"

          case "$DOCKER_VERSION" in
            sha-*)
              # ADR-046: immutable per-commit build tag for staging. No mutable
              # alias (no :dev, no :latest) — staging tracks this exact tag.
              TAGS="$DOCKER_VERSION"
              TAG_TYPE="sha"
              ;;
            *)
              # Stable semver release (release-please): immutable tag + :latest alias.
              TAGS="${DOCKER_VERSION},latest"
              TAG_TYPE="stable"
              ;;
          esac

          {
            echo "tags=${TAGS}"
            echo "final_tag=${DOCKER_VERSION}"
            echo "registry=${REGISTRY}"
            echo "full_image=${REGISTRY}:${DOCKER_VERSION}"
            echo "tag_type=${TAG_TYPE}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::${REGISTRY} tags once the scans pass: ${TAGS}"

  # CI-010: the shared publish. It pushes each platform by digest with no tag,
  # scans each platform with Trivy (CRITICAL/HIGH, unfixed ignored) and applies
  # the tags only when every scan passes. The layer cache is a gha cache scoped
  # to this image, so apps no longer evict each other's layers.
  docker-build-push:
    name: Build & Push ${{ inputs.app }}:${{ inputs.tag }}
    needs: tags
    permissions:
      contents: read
      security-events: write
    uses: mlorentedev/ci-workflows/.github/workflows/docker-publish.yml@9b34f5b2815a3090d77d7589ef8bcc5087045544 # v0.8.0
    with:
      image: ${{ needs.tags.outputs.registry_url }}
      tags: ${{ needs.tags.outputs.tags }}
      sarif-category: trivy-${{ inputs.app }}
      context: ${{ inputs.context }}
      platforms: linux/amd64,linux/arm64
      build-args: |
        BUILD_ENV=production
        VERSION=${{ inputs.tag }}
        COMMIT_SHA=${{ inputs.sha }}
        TAG_TYPE=${{ needs.tags.outputs.tag_type }}
        ${{ inputs.extra_build_args }}
      labels: |
        org.opencontainers.image.title=${{ vars.REGISTRY_PREFIX || 'kubelab' }}-${{ inputs.app }}
        org.opencontainers.image.description=${{ inputs.app }} service for KubeLab platform
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.version=${{ inputs.tag }}
        org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
        org.opencontainers.image.tag-type=${{ needs.tags.outputs.tag_type }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # ADR-044 / NOTIFY-004: envelope-shaped notification into the n8n routing
  # brain (domain/severity/title/body/source) instead of an ad-hoc payload.
  # page-on-fail, log-on-ok, per ADR-044's reference audit for this source.
  #
  # All workflow/context values arrive via `env:`, never interpolated directly
  # into the script text — a `${{ }}` expansion inside `run:` is expanded by
  # the Actions runner into raw script text before bash sees it, so any of
  # these values (ref_name and tag can carry attacker-influenced text, e.g. a
  # fork PR's branch name) could otherwise inject shell commands. `env:` sets
  # a real environment variable instead, which bash treats as inert data.
  # `jq -n --arg` builds the JSON so it's escaped, not string-concatenated.
  notify-build-completion:
    name: Notify Build Completion
    runs-on: ${{ fromJSON(inputs.runner) }}
    needs: [tags, docker-build-push]
    if: always()
    env:
      APP: ${{ inputs.app }}
      TAG: ${{ inputs.tag }}
      SHA: ${{ inputs.sha }}
      REF_NAME: ${{ github.ref_name }}
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RESULT: ${{ needs.docker-build-push.result }}
      IMAGE: ${{ needs.tags.outputs.full_image }}
      REGISTRY: ${{ needs.tags.outputs.registry_url }}
      DIGEST: ${{ needs.docker-build-push.outputs.digest }}
      WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
      WEBHOOK_TOKEN: ${{ secrets.N8N_DEPLOY_TOKEN }}
    steps:
      - name: Notify via Secure Webhook
        run: |
          BUILD_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"

          if [ "$RESULT" = "success" ]; then
            SEVERITY="log"
            TITLE="Docker build completed: ${APP} ${TAG}"
            BODY="${IMAGE} (${DIGEST}) pushed to ${REGISTRY}. Branch ${REF_NAME}, commit ${SHA}. ${BUILD_URL}"
          elif [ "$RESULT" = "failure" ]; then
            SEVERITY="page"
            TITLE="Docker build FAILED: ${APP} ${TAG}"
            BODY="Branch ${REF_NAME}, commit ${SHA}. ${BUILD_URL}"
          else
            echo "Build result was '$RESULT' (cancelled/skipped) — no notification"
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg severity "$SEVERITY" \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            '{domain: "dev", severity: $severity, title: $title, body: $body, source: "github-actions/ci-publish"}')

          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_TOKEN" ]; then
            echo "::warning::Webhook URL or token not configured, skipping notification"
            exit 0
          fi

          for i in {1..3}; do
            echo "Sending notification attempt $i/3..."

            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $WEBHOOK_TOKEN" \
              -d "$PAYLOAD" \
              --max-time 30 \
              --retry 0 2>/dev/null)

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Docker build notification sent successfully (HTTP $HTTP_CODE)"
              break
            else
              echo "❌ Notification attempt $i failed (HTTP $HTTP_CODE)"
              [ $i -lt 3 ] && echo "Retrying in 5 seconds..." && sleep 5
            fi
          done || echo "⚠️ All notification attempts failed, but build was successful"
