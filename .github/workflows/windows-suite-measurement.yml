# One-off measurement for #2865 AC2: does the Windows full-suite failure count
# grow between the commit before the subprocess-encoding work and master?
# Runs only on the pull request that adds it; that PR is closed unmerged.
name: Windows suite measurement

on:
  pull_request:
    paths:
      - .github/workflows/windows-suite-measurement.yml

permissions:
  contents: read

jobs:
  suite:
    name: Full suite (Windows, ${{ matrix.label }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: before
            ref: 8ca8660fa1b6015797de27c11a849de1de4c9fa4
          - label: master
            ref: 0afe22d52f0840a59c4f6afa7d7fb696722c0b78
    steps:
      - name: Allow long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry>=1.8,<2.0"

      - name: Install project and dev deps
        run: poetry install

      - name: Record the locale codec
        run: >-
          poetry run python -c "import locale, sys;
          print(locale.getpreferredencoding(False), sys.flags.utf8_mode)"

      - name: Full suite
        continue-on-error: true
        run: poetry run pytest -n auto --dist loadfile -q --tb=line -rfE --junitxml=results-${{ matrix.label }}.xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.label }}
          path: results-${{ matrix.label }}.xml

  compare:
    name: Compare failures
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: results-*
          merge-multiple: true

      - name: Diff failing test ids
        shell: python
        run: |
          import os
          import xml.etree.ElementTree as ET

          def failing(path):
              ids = set()
              for case in ET.parse(path).iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      ids.add(f"{case.get('classname')}::{case.get('name')}")
              return ids

          before = failing("results-before.xml")
          master = failing("results-master.xml")
          new = sorted(master - before)
          fixed = sorted(before - master)
          lines = [
              f"before (8ca8660f): {len(before)} failing",
              f"master (0afe22d5): {len(master)} failing",
              f"new on master: {len(new)}",
              *[f"  + {i}" for i in new],
              f"no longer failing: {len(fixed)}",
              *[f"  - {i}" for i in fixed],
          ]
          text = "\n".join(lines)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("```\n" + text + "\n```\n")
