---
name: review-attestation

# TOOL-021 (#1140). A PR here can be green with no review behind it: a reviewer
# reports its own status, and a skipped review is not a failed one. Eleven PRs
# across 2026-08-17/19 carried a green reviewer check and no review; seven
# merged. TWO reviewers run on this repo and both fail open, independently — so
# the defect is not one vendor's status lying.
#
# This job answers one question — did a review happen — and publishes it as a
# commit status. Logic and its tests live in `toolkit/features/review_attestation.py`
# and `tests/test_review_attestation.py`, matching `spec-gate.yml`: the negative
# case then runs on every commit instead of needing a live PR to exercise.

on:
  pull_request:
    branches: [master]
    # `labeled`/`unlabeled` and `edited` are load-bearing, not completeness: the
    # escape is a label AND a body section, so either one can flip the verdict
    # without a single file changing.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  # Re-evaluate after our own reviewer runs. Comments authored with
  # GITHUB_TOKEN emit NO events at all, so `issue_comment` never fires for a
  # reviewer we run ourselves and the verdict would be computed seconds after
  # the PR opens and never revised.
  #
  # NOTE: `pr-agent` does not exist yet — it arrives with TOOL-021 Part 2. Until
  # then this trigger is inert, and it is declared now rather than later only
  # because the two must land close together; a reviewer whose output the gate
  # never re-reads would be called unreviewed on every PR it reviewed. If Part 2
  # is abandoned, delete this trigger rather than leaving it to look active.
  workflow_run:
    workflows: [pr-agent]
    types: [completed]

concurrency:
  # `github.run_id` was the workflow_run fallback, which gives every
  # workflow_run its own group and so never collapses two. Keyed on the head
  # SHA instead, they group with the rest of the work on that commit.
  group: >-
    review-attestation-${{ github.event.pull_request.number
    || github.event.issue.number || github.event.workflow_run.head_sha }}
  # Cancel only on events that REPLACE the state being judged; never on events
  # that ADD to it. A push supersedes the commit under review, so cancelling is
  # right. A comment, a label or a body edit is new evidence about the SAME
  # commit, and cancelling there is what made `gh pr checks` show `cancelled`
  # in its fail column on a perfectly healthy gate — repeatedly, because a
  # reviewer speaking is itself a trigger here.
  #
  # Walked through this workflow's own actions, since it carries a
  # `pull_request_review` trigger the upstream does not have:
  #   created/edited/labeled/unlabeled -> no cancel (evidence added)
  #   synchronize/opened/reopened      -> cancel (new commit to judge)
  #   submitted/dismissed              -> cancel (the verdict itself changed)
  #   completed (workflow_run)         -> cancel (re-read after the reviewer ran)
  #
  # The race this accepts, stated rather than hidden: an older run may now
  # finish after a newer one. It is not a stale-verdict risk, because the job
  # resolves the PR through the API at its own execution time rather than from
  # the event payload — a late-finishing older run reads the same current state
  # the newer one did. The window where it could read pre-comment state and
  # publish after is seconds wide, and the next event re-evaluates regardless.
  cancel-in-progress: >-
    ${{ !contains(fromJSON('["labeled", "unlabeled", "edited", "created"]'),
    github.event.action) }}

permissions:
  contents: read
  pull-requests: read
  statuses: write   # the commit status is the product
  # Download the `pr-number` artifact the reviewer run uploads (#1184). This
  # is the narrowest scope that reaches `actions/runs/{id}/artifacts`, and it
  # is read-only on purpose: the gate must never be able to start, cancel or
  # re-run a workflow whose output it judges.
  actions: read

jobs:
  attestation:
    # `issue_comment` fires on issues too, and only a pull request has a review
    # state to attest to.
    if: >
      github.event_name == 'pull_request'
      || github.event_name == 'pull_request_review'
      || github.event.issue.pull_request
      || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    # This gate answers a one-second question and is the most frequently run
    # workflow here. A hung run would otherwise hold a runner for the 6h
    # default while the status it owes stays unpublished.
    timeout-minutes: 15
    steps:
      # Pinned to the BASE branch, never the PR's head.
      #
      # This is the whole security of the gate. The classifier and the reviewer
      # registry are files in this tree, so checking out the PR would let a PR
      # edit `toolkit/features/review_attestation.py` to pass unconditionally, or
      # add its own login to `harness/review-attestation.json`, and attest
      # itself — the gate disableable by the thing it judges. Found upstream in
      # GUARD-002 before it shipped.
      #
      # `pull_request_target` would also fix it and is the usual advice, but it
      # is the bigger hammer: a writable token in the base repo's context, the
      # standard privilege-escalation footgun. Not needed, because this job
      # reads the PR only through the API and never builds, executes or reads
      # the PR's tree.
      #
      # The ref is the repository's OWN default branch, never
      # `github.event.pull_request.base.ref`. The base is attacker-influenced —
      # the PR author picks the target — and `branches: [master]` already
      # restricts this workflow to PRs against it, so reading it back from the
      # event buys nothing and puts a chosen value into a checkout ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry>=1.8,<2.0"

      # This job is the most frequently run workflow in the repo by a wide
      # margin: it fires on six pull_request types, on comments, on reviews and
      # on workflow_run, because each of those can change the verdict. Measured
      # 2026-08-19, it was 17 of the 40 runs started in a 15-minute window.
      #
      # Without the cache each of those pays a full dependency resolve to answer
      # a question that takes about a second. Keyed on the lock file, so a
      # dependency change invalidates it and nothing else does.
      #
      # First cache in this repo's workflows. `spec-gate.yml` has the same shape
      # and would benefit, but it runs a fraction as often — not changed here, to
      # keep this diff about the workflow that actually pays the cost.
      - name: Cache Poetry's package cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py3.12-

      - name: Install project deps
        # See check-config-drift.yml: do NOT add `--no-root`, the package must be
        # installed for importlib.metadata.version("toolkit") to resolve.
        run: poetry install --only main

      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number || github.event.issue.number }}
          RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          # A block scalar, so the interpreter receives it at column zero. Inline
          # after `python -c` it is one 225-character line, which yamllint
          # rejects and no reader forgives.
          #
          # `archive.open(...).read(32)` and NOT `archive.read(...)`: the second
          # decompresses the whole member before slicing it. The content is
          # attacker-reachable — a fork PR controls `pr-agent.yml` on the
          # `pull_request` path — so the bound has to sit on the decompression,
          # not on the result. Measured: a 194 KB member claiming 200 MB stops
          # at 13 MB of RSS in 0.03s.
          #
          # Python, not `unzip`, because this job already sets Python up and
          # already parses with it. A route that degrades to silence when a tool
          # happens to be absent is the exact failure this gate exists to end.
          READ_PR_NUMBER: |
            import sys
            import zipfile

            archive = zipfile.ZipFile(sys.argv[1])
            members = [m for m in archive.namelist() if m.endswith(".txt")]
            head = archive.open(members[0]).read(32) if members else b""
            sys.stdout.write(head.decode("utf-8", "replace"))
        # A `workflow_run` gets three routes, tried in descending order of how
        # directly each one knows the answer:
        #
        #   1. `workflow_run.pull_requests` — populated when the reviewer run was
        #      itself triggered by the PR. Exact, and free.
        #   2. The `pr-number` artifact that run uploaded (#1184; the sending
        #      half is #1202). The ONLY route that works on the `/review` path:
        #      a comment has no head ref, so GitHub schedules that run against
        #      the DEFAULT BRANCH — route 1 arrives empty and route 3 is asking
        #      which PRs have master's tip as their head, which is none.
        #   3. `commits/{head_sha}/pulls`. An inference rather than a handoff,
        #      kept because it is still a lookup and it covers a reviewer run
        #      whose artifact expired or never uploaded. On the comment path it
        #      answers about master and may name the PR that was merged INTO it;
        #      route 2 running first is what keeps that from mattering.
        #
        # If none of the three yields a PR the job SKIPS rather than passing: a
        # run with nothing to judge must not publish a green status for a PR it
        # never looked at. There is deliberately no fourth route
        # (mlorentedev/dotfiles#1128) — a recovery that INVENTS a reference
        # turns a silently-broken gate into a silently-permissive one, which is
        # strictly worse than the skip it replaces.
        #
        # #1184 states a property this looks like it breaks: "the reviewer must
        # not be able to tell the gate which PR it reviewed." It is preserved,
        # and the distinction is between NAMING and JUDGING. The artifact
        # carries a number, never a verdict; the gate then re-fetches that PR
        # and classifies it from its own comments, labels and body. So the worst
        # a hostile artifact achieves — and a fork PR does control
        # `pr-agent.yml` on the `pull_request` path — is an honest
        # re-evaluation of some other PR, publishing that PR's real verdict. It
        # cannot manufacture a green one.
        run: |
          set -euo pipefail
          number=""
          if [ "$EVENT" = "workflow_run" ]; then
            number="$(printf '%s' "$RUN_PRS" \
              | python -c 'import json,sys; d=json.load(sys.stdin) or []; print(d[0]["number"] if d else "")')"

            if [ -z "$number" ] && [ -n "$RUN_ID" ]; then
              # A missing artifact is a legitimate state, not an error: a run
              # cancelled while PENDING (#1203) executes no steps at all, and
              # `workflow_run: [completed]` fires for it regardless. Every call
              # on this route therefore falls through instead of failing the
              # job — `set -e` is active, and an unguarded `gh api` would end it
              # here rather than at route 3.
              artifact_id="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?name=pr-number" \
                --jq '.artifacts[0].id // ""' 2>/dev/null || true)"
              if [ -n "$artifact_id" ]; then
                gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
                  > pr-number-artifact.zip 2>/dev/null || true
                candidate="$(python -c "$READ_PR_NUMBER" pr-number-artifact.zip \
                  2>/dev/null | tr -d '[:space:]' || true)"
                # Validated HERE, and not left to the shared assertion below,
                # which exits 1 because a non-numeric value there means an
                # assumption broke. On this route it means nothing of the sort —
                # it means the artifact was hostile or truncated. So it demotes
                # to "route 2 found nothing" and route 3 runs, instead of
                # letting any PR fail this gate's job by uploading a letter.
                case "$candidate" in
                  ''|*[!0-9]*)
                    echo "artifact 'pr-number' held no usable PR reference; falling through" ;;
                  *)
                    number="$candidate"
                    echo "resolved PR #${number} from the reviewer run's artifact" ;;
                esac
              fi
            fi

            if [ -z "$number" ] && [ -n "$RUN_HEAD" ]; then
              number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RUN_HEAD}/pulls" --jq '.[0].number // ""')"
            fi
          else
            number="$PR_FROM_EVENT"
          fi
          if [ -z "$number" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No pull request resolved for this event; nothing to attest."
            exit 0
          fi
          # Digits only, before it reaches GITHUB_OUTPUT. Every path above
          # yields an integer today, so this asserts rather than sanitises —
          # but an output is a file written line by line, and a value carrying
          # a newline writes a second variable. Fails closed.
          case "$number" in
            ''|*[!0-9]*)
              echo "::error::resolved PR reference is not a number: $number"
              exit 1 ;;
          esac
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.head.sha' \
            | { read -r sha; echo "sha=$sha" >> "$GITHUB_OUTPUT"; }

      - name: Fetch the PR payload
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
        # Written to a file by `gh` itself. The body must never reach a `run:`
        # script as `${{ ... }}`: that is a script-injection vector on a public
        # repo, and a body containing backticks becomes command substitution and
        # is silently emptied. Both have been observed in this repo.
        run: |
          set -euo pipefail
          gh pr view "$NUMBER" \
            --json number,state,labels,body,comments,reviews,author,files \
            > pr-payload.json

      - name: Classify
        id: attest
        if: steps.pr.outputs.skip != 'true'
        run: |
          set +e
          out="$(poetry run toolkit tools review-attestation --payload-file pr-payload.json 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          # A random delimiter, not a literal `EOF`. The classifier's output
          # quotes values taken from the PR, so a fixed delimiter is a line an
          # input could contain — and a heredoc that terminates early writes
          # whatever follows as further outputs.
          delim="summary_$(openssl rand -hex 8)"
          # The STATE, not only the code. `attested` and `disclosed` both exit 0
          # and mean opposite things about whether anyone read this PR; the
          # published status used to flatten them into "a review happened".
          state_word="$(printf '%s\n' "$out" | grep -oE '\b(attested|exempt|disclosed|declined|pending)\b' | tail -n 1)"
          {
            echo "code=$code"
            echo "state_word=${state_word:-unknown}"
            echo "summary<<$delim"
            printf '%s\n' "$out" | tail -n 5
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the commit status
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.pr.outputs.sha }}
          CODE: ${{ steps.attest.outputs.code }}
          STATE_WORD: ${{ steps.attest.outputs.state_word }}
        # A commit STATUS, never a check-run. A check-run belongs to the run that
        # created it and can never be revised, so a later attestation — the
        # reviewer finally speaking — could not clear an earlier red.
        run: |
          set -euo pipefail
          # A DECLARED UNREVIEWED MERGE MUST NOT READ AS A REVIEWED ONE. Both
          # exit 0, and the status is the durable artefact — what branch
          # protection reads, and what a human sees months later. Saying "a
          # review happened" over a declared escape recreates precisely the
          # condition TOOL-021 was filed for: a green check with no review
          # behind it.
          if [ "$CODE" = "0" ] && [ "$STATE_WORD" = "disclosed" ]; then
            state="success"; description="NOT reviewed — unreviewed merge declared"
          elif [ "$CODE" = "0" ] && [ "$STATE_WORD" = "exempt" ]; then
            state="success"; description="exempt from review"
          elif [ "$CODE" = "0" ]; then state="success"; description="a review happened"
          elif [ "$CODE" = "1" ]; then state="failure"; description="not reviewed, and not declared as such"
          else state="error"; description="could not determine whether this PR was reviewed"
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="$state" \
            -f context="review-attestation" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      # Fails the JOB only when the gate could not do its work — never when it
      # did its work and the answer was "no".
      #
      # "Not reviewed" is a VERDICT, and the commit status is where a verdict
      # belongs: it is what branch protection reads and it already blocks the
      # merge by itself. Failing the job as well republished that verdict into
      # the checks list, where a red entry means "something is broken". Since
      # every PR is unreviewed for a while, the normal state of a perfectly
      # healthy PR was a red job, sitting next to the cancelled runs above.
      #
      # That is how a red signal stops being read. This gate exists because a
      # green check nobody questioned let 35 of 40 PRs merge unreviewed; fixing
      # that by training the same indifference toward red would be a poor
      # trade. One verdict, one channel.
      #
      # The upstream reached the same conclusion first and drew the line finer:
      # it exempts `pending` on the pull_request path but still fails on
      # `declined`, on the grounds that a reviewer saying it could not review is
      # actionable the moment it is said. That is the better rule THERE and the
      # wrong one here, on kubelab's own evidence: two of this repo's three
      # reviewers are quota-exhausted, so a `declined` notice arrives on
      # essentially every PR within seconds of opening. Under that rule the job
      # would be red on every correct PR until PR-Agent finishes — which is
      # exactly the state both rules exist to prevent. The distinction is worth
      # revisiting if a quota reviewer ever comes back.
      #
      # Exit code 2 is different in kind and still fails the job: it means the
      # classifier could not determine the state at all. That is the gate
      # malfunctioning rather than reporting, it is not visible in the status
      # beyond an `error` nobody is required to read, and "I could not tell"
      # delivered as silence is the defect this whole mechanism exists to end.
      - name: Fail the run only when the gate itself could not answer
        if: steps.pr.outputs.skip != 'true'
        env:
          CODE: ${{ steps.attest.outputs.code }}
          SUMMARY: ${{ steps.attest.outputs.summary }}
        # The verdict is printed here rather than left in the step that computed
        # it, so the reason is in the last step somebody opens either way.
        run: |
          set -euo pipefail
          printf '%s\n' "$SUMMARY"
          if [ "$CODE" = "0" ] || [ "$CODE" = "1" ]; then
            exit 0
          fi
          echo "::error::the attestation gate could not determine this PR's review state" >&2
          exit "$CODE"
