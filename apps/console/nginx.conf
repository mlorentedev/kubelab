# Serves the console's static build at `/` on the console host. Traefik sends `/console/` to
# the API and everything else here (ADR-074 D5), and both routes carry the Authelia
# ForwardAuth, so this server never sees an unauthenticated request through the ingress.
#
# Cache policy, by path, set once at the server level so no location needs an `add_header`
# of its own (which would drop the security set below). `immutable` is a promise that the
# bytes behind a name never change, so it goes only where the name is a content hash:
# Astro's `/_astro/`. The page revalidates every time: it names those hashed files, and a
# stale copy would point at assets a new build no longer ships.
map $uri $path_cache_control {
    ~^/_astro/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

# An error revalidates whatever its path. Without this a 404 or a 405 for a hashed asset's
# name would go out as immutable and a cache could keep it for a year.
map $status $cache_control {
    ~^[45]   "no-cache";
    default  $path_cache_control;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # A relative `Location` keeps a redirect on the edge's host and scheme: an absolute one
    # would name this container's plain port 8080.
    absolute_redirect off;

    # Security headers. These must equal Traefik's `secure-headers` middleware
    # (infra/k8s/base/edge/secure-headers.yaml), because through the ingress the edge's values
    # replace these and the divergence is invisible from outside. What the origin declares is
    # what serves when the middleware is absent: `docker run`, a port-forward, or a route that
    # omits it. HSTS and CSP are the edge's to send: TLS terminates there.
    # tests/test_console_image.py holds the equality.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control $cache_control always;

    location / {
        try_files $uri $uri/ =404;
    }
}
