# In Progress sweep for the bitácora board (GOV-005, #1417).
#
# Measured 2026-08-25: 28 open issues carried Status "In Progress"; 21 of them
# no Priority; #678 had carried it for 68 days without a single comment or edit
# since filing. "In Progress" had stopped meaning anything was in flight.
#
# `toolkit board sweep` makes each of the 28 decisions below true on the board.
# The decision, not the mechanism, is what took the judgment: an issue whose
# `updatedAt` never moved past its `createdAt` — no comment, no edit — carried
# no evidence of work and moves to `Backlog`. An issue with a current, named
# thread behind it (an open incident, a decision made this session, an active
# sub-issue) keeps `In Progress` and gets the `Priority` it was missing. None of
# the 28 had an explicit "blocked by #N" in its body, so `Blocked` is unused
# here — the field exists on the board for the next issue that names one.
#
# This is a one-time, reviewed list, not an ongoing classifier like
# board-streams.yaml's prefix map: the next sweep re-measures the column fresh
# rather than replaying this file.

project:
  owner: mlorentedev
  number: 1
  repo: mlorentedev/kubelab

status_field: Status
priority_field: Priority

# stays: In Progress is accurate; priority is written if the issue lacks one.
stays:
  823:
    priority: P1   # GOV-002 — this sweep is itself the active work
