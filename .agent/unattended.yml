# Arming envelope for the 2026-10-17 unattended run. Committed on the run branch;
# the run reads only the committed copy. A PR whose diff touches this file is never merged.
version: 1
run_id: "2026-10-17-ai024"
armed_by: manu
armed_at: 2026-10-17T04:30:00Z
expires_at: 2026-10-17T07:30:00Z
objective: >-
  Shepherd the AI-024 PRs the run opened (#2370 spec, #2373 Grafana token route) and the merged #2365
  to a triaged state, prove #2365 live on ace2, and archive the zombie spec TOOL-009.
scope:
