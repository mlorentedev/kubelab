# Arming envelope for one unattended run. The run reads the committed copy only.
version: 1
run_id: "ap-20261102-kubelab-tooling"
armed_by: manu
armed_at: 2026-11-02T05:55:00Z
expires_at: 2026-11-02T17:50:00Z
objective: >-
  Land the operator-free toolkit, ansible and runbook debt listed in the queue,
  one verified PR per ticket, leaving no peer lane disturbed.
scope:
  write_paths:
    - "infra/ansible/roles/**"
    - "infra/ansible/playbooks/**"
    - "infra/stacks/services/observability/uptime/**"
    - "tests/**"
    - "toolkit/**"
    - "Makefile"
    - "scripts/**"
    - "docs/lessons/**"
    - "docs/runbooks/**"
    - ".agent/runs/**"
  frozen_paths:
    - ".github/**"
    - "harness/**"
    - "**/AGENTS.md"
    - "**/CLAUDE.md"
    - "infra/config/secrets/**"
    - "infra/config/values/**"
    - "infra/k8s/**"
    - "toolkit/features/backup_*"
    - "toolkit/features/platform_manifest.py"
    - "toolkit/features/secrets_manager.py"
    - "toolkit/features/credentials.py"
    - "toolkit/features/oidc_clients.py"
    - "infra/ansible/roles/node_backup/**"
    - "docs/runbooks/*offsite*"
  max_files: 16
  max_loc: 300
allowed_commands: [dotf, gh, git, make, poetry]
queue:
  source: bitacora
  filter: >-
    In order: #2847, #2873, #2866, #2870, #2896, #2540, #2945, #2712, #2755.
    Skip any item assigned to someone else or whose paths a peer's open PR holds.
  max_items: 9
budget:
  max_iterations: 11
  max_minutes_per_iteration: 60
  max_consecutive_failures: 2
authority:
  merge: standing-grant
  push: true
  open_pr: true
  advisor_tier: top
