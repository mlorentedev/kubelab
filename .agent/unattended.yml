# Arming envelope for one unattended run. Read from the committed copy only.
version: 1
run_id: "20261111-loadtest"
armed_by: manu
armed_at: 2026-11-11T07:40:08Z
expires_at: 2026-11-11T19:40:08Z
objective: >-
  Establish what makes the staging load-test knee move between 1,200 and 2,000/s
  (#3102), with the measurement captured through make load-test and the finding
  recorded, landing each change with tests and its knowledge.
scope:
  write_paths:
    - "toolkit/**"
    - "tests/**"
    - "docs/**"
    - "specs/**"
    - "infra/load-test/**"
    - "Makefile"
  frozen_paths:
    - ".github/**"
    - "harness/**"
    - "**/AGENTS.md"
    - "**/CLAUDE.md"
    - ".agent/**"
    - "infra/config/secrets/**"
    - "infra/k8s/overlays/prod/**"
    - "infra/ansible/**"
    - "release-please-config.json"
    - ".release-please-manifest.json"
  max_files: 12
  max_loc: 300
allowed_commands: [dotf, gh, git, make, poetry, kubectl-readonly]
queue:
  source: bitacora
  filter: "issue #3102 (load-test knee), plus defects found while working it"
  max_items: 3
budget:
  max_iterations: 6
  max_minutes_per_iteration: 90
  max_consecutive_failures: 2
authority:
  merge: standing-grant
  push: true
  open_pr: true
  advisor_tier: top
  staging_load_test: true       # make load-test ENV=staging only; check Argo kubelab-staging targetRevision first
  staging_deploy: false         # no cluster or host change; read-only kubectl
  prod_ansible: false           # not granted for this run
