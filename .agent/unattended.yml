# Arming envelope for the short close-out run of the IDP-042 registry lane.
# The operator stepped away for about two hours on 2026-10-18 and asked for a
# stable, clean point for tomorrow: finish the PRs this lane opened, sweep the
# worktrees with the peer sessions, and hand off. No new tickets.
# #2526 touches .github/workflows/promote-prod.yml, so it is never merged here.
version: 1
run_id: "2026-10-18-registry-close"
armed_by: manu
armed_at: 2026-10-18T22:55:00Z
expires_at: 2026-10-19T00:55:00Z
objective: >-
  Leave the IDP-042 registry lane at a stable, clean point: #2526 ready and triaged,
  finished worktrees listed for removal, handoff written.
scope:
  write_paths:
    - "tests/**"
    - "toolkit/**"
    - "Makefile"
    - ".github/workflows/promote-prod.yml"
    - "specs/IDP-042-product-contract-registry/tasks.md"
    - ".agent/runs/**"
  frozen_paths:
    - ".github/merge-grant.yml"
    - ".github/workflows/release*.yml"
    - "harness/**"
    - "**/AGENTS.md"
    - "**/*.enc.yaml"
    - ".agent/unattended.yml"
    - "toolkit/features/oidc_clients.py"
    - "toolkit/features/credentials.py"
  max_files: 12
  max_loc: 300
allowed_commands: [dotf, gh, git, make, poetry]
queue:
  source: bitacora
  filter: >-
    PRs this lane opened: #2526 (IDP-042 PR 5). The worktree sweep is report-only:
    commands for the operator, nothing removed by the run.
  max_items: 1
budget:
  max_iterations: 4
  max_minutes_per_iteration: 25
  max_consecutive_failures: 2
authority:
  merge: never
  push: true
  open_pr: false
  advisor_tier: top
