# - #2733: option A (reset-failed on a delivered recovery). #2722: option A (hold the Docker packages on
#   the Beelink) plus a lower runner job timeout; the Beelink provision stays the operator's. #2726: as proposed.
# - #2744 and #2742: /spec fast --issue N each, landed under the grant; a WIP refusal parks the item.
