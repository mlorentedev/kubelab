# Pre-commit hooks for mlorente.dev
# Install: poetry run pre-commit install
# Run manually: poetry run pre-commit run --all-files

# A hook with no `stages:` of its own defaults to EVERY stage. Hooks are
# dispatched machine-wide via `core.hooksPath`, so every git hook type fires
# `pre-commit hook-impl`, and each stage-agnostic hook here ran once per
# commit, once per checkout, and once per push — 3x redundant, not 3x safer
# (DX-001, #895). Pinning the default to pre-commit is a tightening, not a
# relaxation: it drops the pre-push re-check (the net for a `--no-verify`
# commit), but the real gate for that case is CI (gitleaks-action +
# GitGuardian on the PR), not a local hook that --no-verify already bypasses
# for everything else. A hook that genuinely needs another stage can still
# declare its own `stages:` — that overrides this default.
default_stages: [pre-commit]

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags
        exclude: 'infra/ansible/templates/|infra/helm/.*/templates/'
      - id: check-json
        exclude: 'apps/blog/jekyll-site/'
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: detect-private-key
      - id: check-executables-have-shebangs

  # Python formatting and linting (ruff replaces black + isort + flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff-format
        files: ^toolkit/
      - id: ruff
        args: [--fix]
        files: ^toolkit/

  # Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
        files: ^toolkit/
        args: [--ignore-missing-imports]
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - pydantic
          - pydantic-settings
          - python-dotenv
          - typer
          - rich
          - jinja2
          - argon2-cffi
          - cryptography

  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Custom checks for project consistency
  - repo: local
    hooks:
      # Check for env file commits
      - id: check-env-files
        name: Safety net - prevent accidental .env file commits
        entry: >-
          bash -c 'git diff --cached --name-only |
          grep -E "\.env\.(dev|staging|prod)$" |
          grep -v ".example$" &&
          echo "Attempting to commit real .env file! Config lives in values/*.yaml" &&
          exit 1 || true'
        language: system
        pass_filenames: false

      # Derive the lesson index counters instead of trusting what was typed.
      #
      # The counters are shared mutable state that every lesson PR writes, and
      # git merges the line as text without raising a conflict -- so a branch
      # correct when authored is wrong the moment another lesson PR merges
      # first (#1649). Four collisions in two days across three parallel
      # sessions; one merge produced a self-consistent lie, a counter that
      # balanced while the row indexing a real lesson had been dropped.
      #
      # TWO stages, and the second is not belt-and-braces -- it covers the case
      # the first structurally cannot.
      #
      # MEASURED, after an earlier version of this claimed otherwise: git does
      # NOT run pre-commit for a merge that resolves cleanly. Merging a branch
      # carrying a new lesson produced `Merge made by the 'ort' strategy`, no
      # hook output, 433 files and 432 declared -- the exact defect, arriving by
      # the exact route that caused all four collisions, straight past the hook
      # meant to stop it.
      #
      # So `pre-commit` catches the lesson being written, and `pre-push` catches
      # the one that arrived by merge. Nothing reaches CI stale, which is the
      # whole point: CI already had a red light for this, seven minutes late.
      - id: lessons-index-counts
        name: Derive lesson index counters from the files
        entry: poetry run -- toolkit tools lessons-index --fix
        language: system
        files: '^docs/lessons/.*\.md$'
        pass_filenames: false
        stages: [pre-commit]

      # The second stage is NOT declared here. This repo sets `core.hooksPath`
      # to share hooks across worktrees, and its `pre-push` is its own script
      # (`.github/hooks/pre-push.sh`) which does not invoke pre-commit at all --
      # so a hook declared here with `stages: [pre-push]` would be configuration
      # nothing runs. The push-time check lives in that script instead, and
      # `test_a_second_stage_covers_the_merge_route` asserts it is wired there.

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.46.0
    hooks:
      - id: markdownlint
        args: ['--fix', '--disable', 'MD013', 'MD033', 'MD041']
        exclude: 'CHANGELOG.md'

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        exclude: '(infra/helm/.*/templates/|infra/ansible/|apps/blog/|apps/wiki/|infra/config/secrets/|infra/k8s/cluster/)'
        # Config lives in the repo .yamllint (single SSOT) — no inline override.

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker
        args:
          - '--ignore'
          - 'DL3008'
          - '--ignore'
          - 'DL3013'
          - '--ignore'
          - 'DL3015'
          - '--ignore'
          - 'DL3018'
          - '--ignore'
          - 'DL3028'
          - '--ignore'
          - 'DL3042'
          - '--ignore'
          - 'DL3059'
          - '--ignore'
          - 'DL3062'
          - '--ignore'
          - 'DL3016'
          - '--ignore'
          - 'DL4006'

# Global configuration
default_language_version:
  python: python3.12

# Files to exclude
exclude: |
  (?x)^(
      \.archive/.*|
      \.bckp/.*|
      \.tmp/.*|
      \.claude/.*|
      \.vscode/.*|
      apps/wiki/site/.*|
      \.git/.*|
      \.venv/.*|
      node_modules/.*|
      __pycache__/.*
  )$
