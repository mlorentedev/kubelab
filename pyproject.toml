[tool.poetry]
name = "toolkit"
version = "0.0.1"
description = "Unified infrastructure management toolkit"
authors = ["mlorentedev <contact@mlorente.dev>"]
readme = "README.md"
packages = [{include = "toolkit"}]

[tool.poetry.dependencies]
python = "^3.12"
typer = "^0.27.2"
rich = "^15.0.0"
pydantic = "^2.13.5"
pydantic-settings = "^2.15.0"
jinja2 = "^3.1.6"
argon2-cffi = "^25.1.0" # For Argon2 password hashing
pyyaml = "^6.0.3" # For YAML configuration files
cryptography = "^50.0.2" # For JWKS RSA key generation
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.7"
pymdown-extensions = "^12.1"
mkdocs-glightbox = "^0.5.2"
mkdocs-minify-plugin = "^0.8.0"
mkdocs-git-revision-date-localized-plugin = "^1.6.0"
uptime-kuma-api = "^1.2.1"
bcrypt = "^5.0.0"
ruamel-yaml = "^0.19"
httpx = "^0.28.1" # HTTP client for registry tag verification (deployment promote)

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.10"
mypy = "^2.4.0"
pre-commit = "^4.6.2"
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
pytest-mock = "^3.16.0"
types-requests = "^2.33.0.20261006"
mutmut = "^3.8.0"
jmespath = "^1.1.0"

[tool.poetry.scripts]
toolkit = "toolkit.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["toolkit"]

[tool.ruff.lint]
# E: pycodestyle errors
# W: pycodestyle warnings
# F: Pyflakes
# I: isort (Importante para ordenar imports)
# B: flake8-bugbear (encuentra bugs potenciales)
# C901: cyclomatic complexity, enforced only where it has been paid down (below)
select = ["E", "W", "F", "I", "B", "C901"]
ignore = [
    "B008",  # Typer uses function calls in defaults (standard pattern)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# The bar binds the restore drills, which share their phases in restore_drill.py
# (BACKUP-072, #2015), and every module named here once brought under it
# (TOOL-098, #2030). The rest of the toolkit is not yet; widen this pattern as
# each module is brought down, never the other way.
"!toolkit/features/{*drill*,generator_ansible,board_sweep,break_glass,docker_service}.py" = ["C901"]

[tool.ruff.format]
# Configuración del formateador (estilo Black)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["toolkit"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["sh.*", "yaml.*", "argon2.*", "uptime_kuma_api.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=toolkit",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-branch",
    "-m", "not e2e and not infra",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "e2e: End-to-end tests (require network access to target environment)",
    "infra: Infrastructure tests (require VPN + SSH access to homelab nodes)",
    "requires_sops: Needs real SOPS decryption (age key); skipped where unavailable",
    "allow_host_clients(reason): may spawn kubectl/ssh/helm and the other clients the conftest barrier refuses; reason= required (#1886)",
]

[tool.coverage.run]
source = ["toolkit"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mutmut]
source_paths = ["toolkit/features/observability.py"]
runner = "python -m pytest tests/test_observability.py -c /dev/null"
