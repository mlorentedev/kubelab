services:
  loki:
    image: ${APPS_SERVICES_OBSERVABILITY_LOKI_IMAGE}
    container_name: ${APPS_SERVICES_OBSERVABILITY_LOKI_NAME}
    restart: ${RESTART_POLICY}
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    # No healthcheck: the image is distroless (no shell, no wget), so any
    # in-container probe here can never pass. Readiness is `GET /ready`, checked
    # by the K8s httpGet probe (tests/test_dev_loki_compose.py).
    networks:
      - default

  vector:
    image: ${APPS_SERVICES_OBSERVABILITY_LOKI_VECTOR_IMAGE}
    container_name: ${APPS_SERVICES_OBSERVABILITY_LOKI_NAME}-vector
    restart: ${RESTART_POLICY}
    # Without it the image loads its bundled /etc/vector/vector.yaml, a demo that
    # prints synthetic events to the console, and ignores the file mounted below:
    # dev Vector shipped nothing to Loki (found 2026-09-26, SEC-021 follow-up).
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ../../../../config/loki/vector.toml:/etc/vector/vector.toml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Started, not healthy: Vector retries its Loki sink, as it must in K8s,
    # where nothing orders the two.
    depends_on:
      loki:
        condition: service_started
    networks:
      - default

volumes:
  loki_data:

networks:
  default:
    name: ${NETWORK_NAME}
    external: true
