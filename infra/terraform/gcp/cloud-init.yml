#cloud-config
# NOTE: `# yamllint disable-file` does NOT work in a cloud-config file and is
# deliberately absent. yamllint honours that directive only on the FIRST line,
# and the first line must be `#cloud-config` for cloud-init to recognise the
# file at all -- the two requirements are mutually exclusive. So the `missing
# starting space in comment` warning on line 1 is permanent and harmless (a
# warning, not an error), and every real yamllint ERROR in this file must be
# fixed rather than suppressed. infra/terraform/aws/cloud-init.yml carries the
# directive and it has never done anything there either.
# KubeLab Argo CD hub bootstrap — Headscale mesh + K3s on a GCP Spot VM (ADR-063).
#
# THIS RUNS ON EVERY INSTANCE THE MIG CREATES, NOT ONLY THE FIRST.
# A managed instance group *recreates* rather than restarts, so each preemption
# is a from-scratch build with a fresh boot disk, executed unattended and
# possibly months after this template was written. Every step below therefore
# has to be safe to run cold, with no operator present and no state carried over.
#
# Scope: this file takes the node all the way to "Argo CD reconciling its
# spokes", which is further than the AWS hub's cloud-init reaches. That is
# finding F1, and it is not gold-plating -- aws1 survives a Spot interruption
# because a stop/restart preserves its EBS volume, so Argo CD is still there
# afterwards. A MIG has no such volume: every preemption is a fresh disk, so a
# hub that stops at "K3s ready" is a hub that never comes back on its own.
#
# WHICH spokes it manages comes from `managed_spokes`, and that is the
# migration's core invariant expressed as configuration: exactly one hub writes
# to any given spoke at any moment. gcp1 starts with staging while aws1 keeps
# prod.
#
# What is already fixed here is finding F2. aws1 baked a long-lived Headscale
# pre-auth key into user_data, survivable only because user_data was rendered
# fresh at each deliberate replacement. Under a MIG that key would sit in the
# template until it expired, after which a recreated VM would silently never
# join the mesh. So this file stores no pre-auth key: it reads the API key from
# Secret Manager and MINTS ITS OWN, single-use and short-lived — the same
# just-in-time pattern every other node in the fleet already uses.

hostname: ${hostname}
timezone: ${timezone}
manage_etc_hosts: true

users:
  - name: ${deploy_user}
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_public_key}

package_update: true
packages:
  - curl
  - jq
  - ca-certificates

# 2 GB swap, cloud-init-managed so it survives every recreate. Lesson 2026-03-22
# on the AWS hub: 2 GB of RAM alone OOM-kills sshd under K3s + Argo CD, and swap
# configured by hand does not survive a replacement.
swap:
  filename: /swapfile
  size: 2147483648
  maxsize: 2147483648

write_files:
  # The chart values, the Applications and the cluster-secret template, embedded
  # from the repository at plan time. Base64 for two reasons: YAML nested inside
  # YAML survives no quoting scheme reliably, and a dollar-brace sequence inside
  # chart values would otherwise collide with templatefile interpolation.
  #
  # Embedded rather than fetched: CLAUDE.md forbids cloning repositories on
  # deployment targets, and a boot that depends on reaching github.com is a boot
  # that fails when GitHub does. The repo files stay the SSOT -- these are copies
  # made by `terraform apply`, so they cannot drift without a plan showing it.
  - path: /opt/kubelab/argocd-values.yaml
    permissions: "0644"
    encoding: b64
    content: ${argocd_values_b64}
  - path: /opt/kubelab/argocd-applications.yaml
    permissions: "0644"
    encoding: b64
    content: ${applications_b64}
  - path: /opt/kubelab/cluster-secret.yaml.tpl
    permissions: "0644"
    encoding: b64
    content: ${cluster_secret_tpl_b64}

  # Kept as a file rather than inlined into runcmd so a failed boot can be
  # re-run by hand: `bash /opt/kubelab/bootstrap.sh` after SSHing in. An
  # unattended failure is otherwise only readable through serial console output.
  - path: /opt/kubelab/bootstrap.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      LOG=/var/log/kubelab-bootstrap.log
      exec > >(tee -a "$LOG") 2>&1
      echo "=== kubelab bootstrap $(date -Is) ==="

      # Every network call is BOUNDED. An unbounded curl that stalls leaves
      # cloud-init running forever, and the MIG counts the VM as healthy the
      # whole time -- a hub that never finishes booting and never reports that
      # it did not. Bounded failure is recoverable (the MIG recreates); an
      # indefinite hang is not.
      #
      # `retry` applies ONLY to idempotent reads and downloads. It is
      # deliberately absent from the pre-auth POST below: a request that times
      # out may still have created the key server-side, so retrying would mint
      # keys nobody consumes.
      curl_opts=(-sf --connect-timeout 10 --max-time 30)
      curl_retry=(--retry 5 --retry-delay 3 --retry-connrefused)

      # --- Secret Manager, via the instance's own service account -------------
      # No credential is stored on the instance or in the template's metadata:
      # the metadata server mints a short-lived token, and the service account
      # holds secretAccessor on this ONE secret.
      meta="http://metadata.google.internal/computeMetadata/v1"
      token=$(curl "$${curl_opts[@]}" "$${curl_retry[@]}" -H "Metadata-Flavor: Google" \
        "$meta/instance/service-accounts/default/token" | jq -r .access_token)
      sm="https://secretmanager.googleapis.com/v1/projects/${project_id}/secrets"
      api_key=$(curl "$${curl_opts[@]}" "$${curl_retry[@]}" -H "Authorization: Bearer $token" \
        "$sm/${headscale_api_key_secret}/versions/latest:access" \
        | jq -r .payload.data | base64 -d)
      if [ -z "$api_key" ] || [ "$api_key" = "null" ]; then
        echo "FATAL: could not read ${headscale_api_key_secret} from Secret Manager" >&2
        exit 1
      fi
      hs_auth=(-H "Authorization: Bearer $api_key")

      # --- Recycle the stale Headscale node ----------------------------------
      # Headscale names nodes by GIVEN-NAME, and a re-registration while the old
      # record still exists lands as `${hostname}-<random>`. That breaks the
      # Ansible inventory, the kubeconfig server URL and the prod Argo CD
      # EndpointSlice at once — silently, because the old records keep resolving
      # until they do not. Under a MIG this path runs on every preemption, so it
      # is load-bearing rather than incidental.
      #
      # THE PREDICATE BELOW USED TO READ `select(.givenName==$n and .online==false)`
      # and it never matched anything. Measured 2026-08-24 (#1369) on a real
      # preemption: the MIG rebuilt the hub in 18 seconds, this line printed
      # "no stale Headscale node to recycle" while the predecessor sat in the
      # very response it had just parsed, the replacement registered as
      # `gcp1-mj5bsge9`, and `argo.kubelab.live` went down.
      #
      # Two independent reasons, either of which alone is fatal:
      #
      #   - `.online == false` compares against a field that IS NOT THERE.
      #     proto3 JSON omits false booleans, so an offline node carries no
      #     `online` key at all and the comparison is `null == false` -> false.
      #     The condition does not select offline nodes; it selects none.
      #   - the field spelling differs by marshaller. Headscale's CLI emits
      #     `given_name`; the REST gateway is documented as camelCase but was not
      #     verified from this path, and a wrong guess here fails silently in
      #     exactly the same way. Both spellings are accepted rather than picked.
      #
      # `.online` is gone entirely, not corrected. At this point in boot THIS
      # node has not registered yet, so any node already carrying this hostname
      # is by definition a predecessor — its liveness is not information we need,
      # and asking for it is what broke this. The equivalent repair from a
      # workstation is `toolkit infra headscale recycle-stale`, which does check
      # liveness because it runs where a healthy node COULD hold the name.
      node_id=$(curl "$${curl_opts[@]}" "$${curl_retry[@]}" "$${hs_auth[@]}" "${headscale_url}/api/v1/node" \
        | jq -r --arg n "${hostname}" '.nodes[] | select((.givenName // .given_name) == $n) | .id' | head -1)
      if [ -n "$node_id" ]; then
        curl "$${curl_opts[@]}" -X DELETE "$${hs_auth[@]}" "${headscale_url}/api/v1/node/$node_id"
        echo "deleted stale Headscale node $node_id (${hostname})"
      else
        echo "no stale Headscale node to recycle"
      fi

      # --- Mint a single-use pre-auth key (finding F2) ------------------------
      # Short-lived and non-reusable: it is consumed seconds from now, so its
      # whole lifetime is this script. Nothing durable holds a mesh credential.
      expiry=$(date -u -d '+15 minutes' +%Y-%m-%dT%H:%M:%SZ)
      # No --retry here, on purpose: see the note by curl_opts.
      authkey=$(curl "$${curl_opts[@]}" -X POST "$${hs_auth[@]}" -H 'Content-Type: application/json' \
        -d "{\"user\":\"2\",\"reusable\":false,\"ephemeral\":false,\"expiration\":\"$expiry\"}" \
        "${headscale_url}/api/v1/preauthkey" | jq -r .preAuthKey.key)
      if [ -z "$authkey" ] || [ "$authkey" = "null" ]; then
        echo "FATAL: Headscale refused to mint a pre-auth key" >&2
        exit 1
      fi

      # --- Join the mesh ------------------------------------------------------
      # accept-routes stays TRUE: the hub is remote and reaches the homelab LAN
      # through rpi4's advertised route. (LAN-resident nodes must set it false —
      # see CLAUDE.md — but that hazard does not apply here.)
      curl "$${curl_opts[@]}" "$${curl_retry[@]}" --max-time 120 -L https://tailscale.com/install.sh | sh
      tailscale up \
        --login-server=${headscale_url} \
        --authkey="$authkey" \
        --hostname=${hostname} \
        --accept-routes=true \
        --timeout=60s
      ts_ip=$(tailscale ip -4)
      echo "joined mesh as ${hostname} ($ts_ip)"

      # --- K3s ----------------------------------------------------------------
      # No Traefik and no servicelb: the hub serves no ingress, Argo CD's UI is
      # exposed through the prod VPS. resolv-conf points at systemd-resolved's
      # real file because /etc/resolv.conf is the 127.0.0.53 stub, which pods
      # cannot reach.
      # --node-name is PINNED, and that is not cosmetic. Without it K3s derives
      # the node name from the OS hostname at the moment it starts, and on GCP
      # that value is still in flux: the guest environment sets the instance's
      # full internal DNS name before cloud-init's `hostname:` directive applies.
      # K3s therefore registered as
      # `gcp1-bxjh.europe-west4-b.c.kubelab-hub.internal` on the first boot.
      #
      # Measured consequence, 2026-08-22: a later `make provision NODE=gcp1`
      # restarted K3s once the hostname had settled, it re-registered as `gcp1`,
      # and the cluster ended up with TWO Node objects for ONE machine — same
      # internal IP, the old one NotReady. Every pod bound to the dead name sat
      # `Terminating` forever because no kubelet was left to confirm deletion,
      # and `argocd-application-controller-0` is a StatefulSet ordinal, so its
      # replacement could not start while the ghost held the name. With no
      # application controller the hub reconciles nothing at all.
      #
      # The name is also load-bearing elsewhere: the Ansible inventory, the
      # kubeconfig server URL and the Headscale given-name all say `gcp1`. A node
      # name derived from a race is a node name that can disagree with all three.
      curl "$${curl_opts[@]}" "$${curl_retry[@]}" --max-time 120 -L https://get.k3s.io | \
        INSTALL_K3S_VERSION="${k3s_version}" sh -s - server \
        --disable=traefik --disable=servicelb \
        --write-kubeconfig-mode=644 \
        --node-name=${hostname} \
        --resolv-conf=/run/systemd/resolve/resolv.conf \
        --tls-san=${hostname}.kubelab.internal \
        --tls-san="$ts_ip"

      # EXPORTED, not assumed. kubectl survives without this because K3s ships a
      # wrapper defaulting to the same path; helm has no such convention and
      # falls back to localhost:8080. Measured on the first real boot:
      #
      #   Error: Kubernetes cluster unreachable: Get
      #   "http://localhost:8080/version": dial tcp [::1]:8080: connection refused
      #
      # The namespace was created, K3s came up, and Argo CD was never installed --
      # cloud-init exiting `status: error` on a node the MIG considered healthy.
      # That is finding F1 not working, on the recreate path F1 exists for.
      #
      # Set before the first kubectl too, so the script stops being correct by
      # accident: the same command through a different kubectl, or as another
      # user, would address nothing.
      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

      for _ in $(seq 1 60); do
        kubectl get nodes >/dev/null 2>&1 && break
        sleep 5
      done
      kubectl get nodes >/dev/null 2>&1 || { echo "FATAL: K3s did not become ready" >&2; exit 1; }
      kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

      # --- Argo CD (finding F1) -----------------------------------------------
      # aws1 does not do this: a Spot stop/restart preserves its EBS volume, so
      # Argo CD survives an interruption there and only a deliberate replacement
      # re-runs `make deploy-argocd`. A MIG has no such volume. Every preemption
      # is a fresh disk, so anything not done here is not done at all.

      # The metadata token is short-lived and K3s took minutes. Refresh rather
      # than reuse: an expired token here would fail every secret read at once,
      # which reads like "Secret Manager is broken" rather than "the token aged".
      token=$(curl "$${curl_opts[@]}" "$${curl_retry[@]}" -H "Metadata-Flavor: Google" \
        "$meta/instance/service-accounts/default/token" | jq -r .access_token)

      sm_get() {
        curl "$${curl_opts[@]}" "$${curl_retry[@]}" -H "Authorization: Bearer $token" \
          "$sm/$1/versions/latest:access" | jq -r .payload.data | base64 -d
      }

      # helm, PINNED. Unpinned, `upgrade --install` resolves to the newest chart
      # in the repo, so a preemption at 3am would also be a major upgrade of the
      # management plane. The version mirrors argocd.chart_version in
      # common.yaml, which `make deploy-argocd` reads too.
      curl "$${curl_opts[@]}" "$${curl_retry[@]}" --max-time 180 -L \
        "https://get.helm.sh/helm-${helm_version}-linux-amd64.tar.gz" -o /tmp/helm.tgz
      tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
      install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
      rm -rf /tmp/helm.tgz /tmp/linux-amd64

      # Secrets land as FILES on tmpfs, never on argv and never in this log.
      #
      # `--set-file` rather than `--set` is the load-bearing choice. `--set` puts
      # the value in helm's argv, readable by `ps` for the life of the install,
      # and this script tees its output to /var/log. Building a values file with
      # a heredoc would be worse still: a bcrypt hash begins `$2y$`, and an
      # unquoted heredoc lets the shell expand that to nothing -- silently
      # installing a blank admin password that works right up until someone
      # tries to log in.
      secdir=/dev/shm/kubelab-argocd
      rm -rf "$secdir" && mkdir -p "$secdir" && chmod 700 "$secdir"
      umask 077
      sm_get "${secret_admin_hash}" > "$secdir/admin"
      sm_get "${secret_oidc}"       > "$secdir/oidc"
      sm_get "${secret_slack}"      > "$secdir/slack"
      sm_get "${secret_github}"     > "$secdir/github"
      for f in admin oidc slack github; do
        if [ ! -s "$secdir/$f" ]; then
          rm -rf "$secdir"
          echo "FATAL: secret '$f' came back empty from Secret Manager" >&2
          exit 1
        fi
      done

      helm repo add argo https://argoproj.github.io/argo-helm
      helm repo update argo
      helm upgrade --install argocd argo/argo-cd \
        --version "${argocd_chart_version}" \
        --namespace argocd --create-namespace \
        -f /opt/kubelab/argocd-values.yaml \
        --set-file "configs.secret.argocdServerAdminPassword=$secdir/admin" \
        --set-file "configs.secret.extra.oidc\.authelia\.clientSecret=$secdir/oidc" \
        --set-file "notifications.secret.items.slack-webhook-url=$secdir/slack" \
        --set-file "configs.secret.githubSecret=$secdir/github" \
        --timeout 10m
      rm -rf "$secdir"

      # --- Spokes -------------------------------------------------------------
      # ONLY the spokes this hub is configured to manage. That is the migration's
      # invariant: exactly one hub writes to any given spoke at any moment. The
      # spoke-side RBAC is NOT touched -- the ServiceAccount and its token are
      # persistent spoke state, shared with whichever hub is live, and
      # re-applying them would open a permission gap for the other one.
      for env in ${managed_spokes}; do
        server=$(printf '%s' '${spoke_servers}' | jq -r --arg e "$env" '.[$e] // empty')
        if [ -z "$server" ]; then
          echo "FATAL: no apiserver URL for spoke '$env'" >&2
          exit 1
        fi
        spokedir=/dev/shm/kubelab-spoke
        rm -rf "$spokedir" && mkdir -p "$spokedir" && chmod 700 "$spokedir"
        sm_get "argocd-spokes-$env-token" > "$spokedir/token"
        sm_get "argocd-spokes-$env-ca"    > "$spokedir/ca"
        if [ ! -s "$spokedir/token" ] || [ ! -s "$spokedir/ca" ]; then
          rm -rf "$spokedir"
          echo "FATAL: spoke '$env' credentials missing from Secret Manager" >&2
          exit 1
        fi
        # Rendered through a file and piped, so no credential reaches argv here
        # either. `sed` reads the token from the file rather than taking it as a
        # pattern argument.
        awk -v env="$env" -v server="$server" \
            -v tok="$(cat "$spokedir/token")" -v ca="$(cat "$spokedir/ca")" \
            '{ gsub(/CLUSTER_NAME/, env); gsub(/CLUSTER_SERVER/, server);
               gsub(/BEARER_TOKEN/, tok); gsub(/CA_DATA_BASE64/, ca); print }' \
            /opt/kubelab/cluster-secret.yaml.tpl | kubectl apply -f -
        rm -rf "$spokedir"
        echo "registered spoke $env ($server)"
      done

      # The Applications themselves. Embedded at plan time for the managed
      # spokes only, so this cannot install an Application whose cluster secret
      # was never created.
      kubectl apply -f /opt/kubelab/argocd-applications.yaml

      echo "=== bootstrap complete $(date -Is) ==="

runcmd:
  # SSH hardening before anything reaches the network. UseDNS off in particular:
  # a stale PTR record makes sshd hang on connect, which presents as an
  # unreachable host long before Ansible can say anything useful.
  - sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - echo 'UseDNS no' >> /etc/ssh/sshd_config
  - systemctl restart ssh
  - /opt/kubelab/bootstrap.sh
