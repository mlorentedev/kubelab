---
# Backing endpoint for the `argocd` Service in `argocd.yaml`.
#
# This one document is deliberately OUTSIDE the Kustomize overlay, and it is the
# only part of the Argo CD route that has to be: gcp1 is a Spot instance in a MIG,
# so its Tailscale IP rotates on every recreate and the value cannot be committed.
# Observed twice on gcp1 alone (.21 -> .24 -> .12 across August 2026), and on aws1
# before it (.4 -> .7 in May 2026) — the reason this pattern exists at all.
# `RESOLVE_GCP1_TAILSCALE_IP` is substituted at apply time from MagicDNS by
# `toolkit infra k8s render-apply` (ADR-047 D3 / TOOL-009 T4: "rpi3/aws1
# EndpointSlices via a small toolkit command each"). Applied by
# `make argocd-repoint`, which `make gcp1-replace` invokes as its last step and
# `make deploy-argocd` calls too — the recreate is the one event that changes
# this value, so the target that performs the recreate is the one that must
# repoint.
#
# That sentence used to read "which is exactly the step `make gcp1-replace`
# already tells you to run", and it was false: gcp1-replace never invoked or
# mentioned it. A comment asserting that another target performs a step is
# documentation, not a dependency (lesson-375) — which is why the claim above is
# now a `$(MAKE)` line you can grep for, and a test asserts it stays one.
#
# The port below is a NodePort on the hub, and it is NOT hub-specific: both hubs
# served 30080 during the handover, verified by request rather than by reading
# the Service, which is what made repointing safe to do in one step.
#
# Nothing reconciles this object; it is listed in `OUT_OF_BAND` in
# `tests/test_orphan_manifests.py` so that fact stays visible.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: argocd-external
  namespace: kubelab
  labels:
    kubernetes.io/service-name: argocd
    app.kubernetes.io/name: argocd
    app.kubernetes.io/component: gitops
    app.kubernetes.io/part-of: kubelab
addressType: IPv4
ports:
  - name: http
    port: 30080
    protocol: TCP
endpoints:
  - addresses:
      - "RESOLVE_GCP1_TAILSCALE_IP"  # resolved at deploy time via: dig gcp1.kubelab.internal
    conditions:
      ready: true
