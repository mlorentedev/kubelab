---
# Backing endpoint for the `argocd` Service in `argocd.yaml`.
#
# This one document is deliberately OUTSIDE the Kustomize overlay, and it is the
# only part of the Argo CD route that has to be: aws1 is a Spot instance, so its
# Tailscale IP rotates on every replacement (it moved .4 -> .7 in May 2026) and
# the value cannot be committed. `RESOLVE_AWS1_TAILSCALE_IP` is substituted at
# apply time from MagicDNS by `toolkit infra k8s render-apply`
# (ADR-047 D3 / TOOL-009 T4: "rpi3/aws1 EndpointSlices via a small toolkit
# command each"). Applied by `make deploy-argocd`, which is exactly the step
# `make aws1-replace` already tells you to run after a replacement — the one
# event that changes this value.
#
# Nothing reconciles this object; it is listed in `OUT_OF_BAND` in
# `tests/test_orphan_manifests.py` so that fact stays visible.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: argocd-external
  namespace: kubelab
  labels:
    kubernetes.io/service-name: argocd
    app.kubernetes.io/name: argocd
    app.kubernetes.io/component: gitops
    app.kubernetes.io/part-of: kubelab
addressType: IPv4
ports:
  - name: http
    port: 30080
    protocol: TCP
endpoints:
  - addresses:
      - "RESOLVE_AWS1_TAILSCALE_IP"  # resolved at deploy time via: dig aws1.kubelab.internal
    conditions:
      ready: true
