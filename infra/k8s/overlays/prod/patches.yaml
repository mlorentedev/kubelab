---
# Override base grafana-config with prod domain
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: kubelab
data:
  GF_SERVER_ROOT_URL: "https://grafana.kubelab.live"
  GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://auth.kubelab.live/api/oidc/authorization"
  GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://auth.kubelab.live/api/oidc/token"
  GF_AUTH_GENERIC_OAUTH_API_URL: "https://auth.kubelab.live/api/oidc/userinfo"
  GF_LOG_LEVEL: "info"
---
# Override base grafana IngressRoute with prod domain
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: kubelab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.kubelab.live`)
      kind: Rule
      middlewares:
        - name: secure-headers
          namespace: kubelab
        - name: rate-limit
          namespace: kubelab
        - name: crowdsec-bouncer
          namespace: kubelab
        - name: authelia
          namespace: kubelab
        - name: error-pages
          namespace: kubelab
      services:
        - name: grafana
          port: 3000
  tls:
    certResolver: letsencrypt
---
# Override base authelia IngressRoute with prod domain
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authelia
  namespace: kubelab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.kubelab.live`)
      kind: Rule
      middlewares:
        # A strategic-merge patch REPLACES this list rather than merging into
        # it, so every middleware the route needs must be restated here. This
        # patch exists to override the domain; `secure-headers` was lost in the
        # restatement and prod served without it until SEC-008 (#1097).
        - name: secure-headers
          namespace: kubelab
        - name: rate-limit
          namespace: kubelab
        - name: crowdsec-bouncer
          namespace: kubelab
      services:
        - name: authelia
          port: 9091
  tls:
    certResolver: letsencrypt
---
# Override base loki IngressRoute — internal only in prod (no public access)
# Route to a non-existent domain so it never matches real traffic
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: loki
  namespace: kubelab
  annotations:
    kubelab.dev/note: "Loki is internal-only in prod — no public ingress"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`loki.internal.kubelab.local`)
      kind: Rule
      middlewares:
        # A strategic-merge patch REPLACES this list rather than merging into
        # it, so every middleware the route needs must be restated here. This
        # patch exists to override the domain; `secure-headers` was lost in the
        # restatement and prod served without it until SEC-008 (#1097).
        - name: secure-headers
          namespace: kubelab
        - name: rate-limit
          namespace: kubelab
        - name: authelia
          namespace: kubelab
      services:
        - name: loki
          port: 3100
  tls:
    # MUST be an explicit null, not `tls: {}`. An empty map in a strategic-merge
    # patch is a no-op: it says "change nothing about tls", so the base's
    # `certResolver: letsencrypt` survives into the rendered output. An explicit
    # null is what deletes the key. This file carried `tls: {}` with a comment
    # claiming the resolver was gone, while prod ran with it for months and
    # Traefik retried an ACME order for a `.local` domain roughly once a day —
    # an order Let's Encrypt can never fulfil, since it only issues for public
    # TLDs. Verify any change here with `kubectl kustomize infra/k8s/overlays/prod`
    # and read the emitted `tls:` block; the comment is not the behaviour.
    certResolver: null
---
# n8n's prod ConfigMap is NOT patched here any more. `n8n-config` is generated
# (#1705), and a strategic-merge patch cannot target a generated object by its
# base name — the emitted name carries a content hash. The prod overrides moved
# to a `configMapGenerator` with `behavior: merge` in this overlay's
# kustomization.yaml, which also means they are applied BEFORE hashing, so
# staging and prod get different hashes. That difference is the evidence the
# overlay is live; identical hashes would mean it was silently dropped.
---
# Override base n8n IngressRoute with prod domain
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n
  namespace: kubelab
spec:
  entryPoints:
    - websecure
  routes:
    # Webhook ingress bypasses Authelia: n8n enforces its own Header Auth on the
    # /webhook/ node (403 without the bearer). Without this, Authelia ForwardAuth
    # 303-redirects every POST to the login page and the notification fabric is
    # unreachable in prod (NOTIFY-001). More specific match + explicit higher
    # priority so it wins over the UI route below.
    - match: Host(`n8n.kubelab.live`) && PathPrefix(`/webhook/`)
      kind: Rule
      priority: 100
      middlewares:
        - name: secure-headers
          namespace: kubelab
        - name: rate-limit
          namespace: kubelab
        - name: crowdsec-bouncer
          namespace: kubelab
      services:
        - name: n8n
          port: 5678
    - match: Host(`n8n.kubelab.live`)
      kind: Rule
      middlewares:
        - name: secure-headers
          namespace: kubelab
        - name: rate-limit
          namespace: kubelab
        - name: crowdsec-bouncer
          namespace: kubelab
        - name: authelia
          namespace: kubelab
      services:
        - name: n8n
          port: 5678
  tls:
    certResolver: letsencrypt
---
# Override base uptime-kuma IngressRoute with prod domain
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma
  namespace: kubelab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`status.kubelab.live`)
      kind: Rule
      middlewares:
        - name: secure-headers
          namespace: kubelab
        - name: rate-limit
          namespace: kubelab
        - name: crowdsec-bouncer
          namespace: kubelab
        - name: error-pages
          namespace: kubelab
      services:
        - name: uptime-kuma
          port: 3001
  tls:
    certResolver: letsencrypt
---
# Override base catch-all IngressRoute with prod wildcard cert
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catch-all
  namespace: kubelab
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostRegexp(`.+\.kubelab\.live`)
      kind: Rule
      priority: 1
      middlewares:
        - name: rate-limit
          namespace: kubelab
      services:
        - name: errors
          port: 80
  tls:
    certResolver: letsencrypt
    domains:
      - main: "kubelab.live"
        sans:
          - "*.kubelab.live"
---
# Override base homepage IngressRoute with prod domain
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage
  namespace: kubelab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`home.kubelab.live`)
      kind: Rule
      middlewares:
        - name: secure-headers
          namespace: kubelab
        - name: rate-limit
          namespace: kubelab
        - name: error-pages
          namespace: kubelab
        - name: crowdsec-bouncer
          namespace: kubelab
      services:
        - name: homepage
          port: 3000
  tls:
    certResolver: letsencrypt
---
# Override base vikunja IngressRoute with prod domain
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vikunja
  namespace: kubelab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tasks.kubelab.live`)
      kind: Rule
      middlewares:
        - name: secure-headers
          namespace: kubelab
        - name: rate-limit
          namespace: kubelab
        - name: crowdsec-bouncer
          namespace: kubelab
      services:
        - name: vikunja
          port: 3456
  tls:
    certResolver: letsencrypt
