        - name: rate-limit
          namespace: kubelab
        - name: crowdsec-bouncer
          namespace: kubelab
        - name: error-pages
          namespace: kubelab
      services:
        - name: minio
          port: 9000
  tls:
    certResolver: letsencrypt
---
