apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubelab

resources:
  - ../../base
  - generated/deployments.yaml
  - generated/services.yaml
  - generated/configmaps.yaml
  - generated/ingress.yaml
  - redirect-kubelab.yaml
  - backup.yaml
  - traefik-dashboard.yaml
  - headscale.yaml
  - gitea.yaml
  - argocd.yaml
  # argocd-endpointslice.yaml excluded — has the RESOLVE_GCP1_TAILSCALE_IP
  # placeholder (aws1's Spot IP rotates), applied by `make deploy-argocd` with
  # dynamic IP resolution (MagicDNS). Only that ONE document is excluded: the
  # Service and IngressRoute in argocd.yaml carry no placeholder and belong
  # under GitOps like every other external service here (kubelab#970).
  # secrets managed via: toolkit infra k8s apply-secrets --env prod (ADR-014)

# Override base authelia-config with prod-specific domains, policies, OIDC clients.
# Hash suffix triggers auto rolling restart on change (SECRET-RELOAD-001a refactor).
# Replaces the base-generated authelia-config ConfigMap.
configMapGenerator:
  - name: authelia-config
    namespace: kubelab
    behavior: replace
    files:
      - authelia-config/configuration.yml

  # Route prod's alerts to the push tier (OBS-007). `merge` — not `replace` —
  # so the base's contact-points.yaml and templates.yaml carry through untouched
  # and only this one key is overridden. Using `replace` here would silently drop
  # the contact points and leave prod routing to a receiver that does not exist.
  - name: grafana-alerting
    namespace: kubelab
    behavior: merge
    files:
      - grafana-alerting/policies.yaml

  # Prod's domain + bucket overrides for vikunja-config. `merge` — only these
  # three keys change, the rest (DB connection, OIDC client ID, S3 endpoint)
  # carry through from the base untouched.
  - name: vikunja-config
    namespace: kubelab
    behavior: merge
    envs:
      - vikunja-config/vikunja.env

# Override base resources with prod-specific domains and config
patches:
  - path: patches.yaml
