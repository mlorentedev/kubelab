---
# Argo CD — external service on the GCP hub (gcp1.kubelab.internal)
# Prod Traefik proxies argo.kubelab.live to the GCP hub's argocd-server via Tailscale.
# Same EndpointSlice pattern as Headscale (ADR-023 Phase 3).
#
# The backing EndpointSlice lives in `argocd-endpointslice.yaml`, NOT here: it
# carries a RESOLVE_* placeholder and is therefore the only part of this service
# that cannot go through Kustomize/Argo CD. Splitting it out keeps the Service
# and the route under GitOps like every other external service in this overlay
# (cf. `headscale.yaml`, whose EndpointSlice IS committed because the VPS IP is
# stable). Before that split the whole file sat outside the overlay, so SEC-004's
# rate-limit middleware reached git but never the cluster — see kubelab#970 and
# `tests/test_orphan_manifests.py`.
apiVersion: v1
kind: Service
metadata:
  name: argocd
  namespace: kubelab
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/component: gitops
    app.kubernetes.io/part-of: kubelab
    kubelab.live/location: external
  annotations:
    kubelab.live/host: gcp1
    kubelab.live/description: "Argo CD on GCP hub (gcp1.kubelab.internal via Tailscale)"
spec:
  ports:
    - name: http
      port: 30080
      targetPort: 30080
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: kubelab
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/component: gitops
    app.kubernetes.io/part-of: kubelab
    kubelab.live/location: external
spec:
  entryPoints:
    - websecure
  routes:
    # AUTH-020 (#2482): Argo CD always renders "Log in via", so a browser opening `/` with no
    # session cookie is sent to /auth/login, which answers 303 to Authelia. Only the exact root:
    # the CLI, gRPC-web, /api/webhook and the SPA's own paths never match it.
    # tests/test_argocd_sign_in_redirect.py pins the shape.
    - match: Host(`argo.kubelab.live`) && Path(`/`) && !HeaderRegexp(`Cookie`, `(^|;\s*)argocd\.token=`)
      kind: Rule
      priority: 100
      middlewares:
        - name: secure-headers
          namespace: kubelab
        - name: rate-limit
          namespace: kubelab
        - name: crowdsec-bouncer
          namespace: kubelab
        - name: argocd-sign-in
          namespace: kubelab
      services:
        - name: argocd
          port: 30080
    # No explicit priority: Traefik ranks this rule by its length, above the catch-all's 1
    # and below the redirect's 100. Declaring 1 tied it with the catch-all, and a Traefik
    # restart sent all of Argo CD to the errors service (lesson-717).
    - match: Host(`argo.kubelab.live`)
      kind: Rule
      middlewares:
        - name: secure-headers
          namespace: kubelab
        - name: rate-limit
          namespace: kubelab
        - name: crowdsec-bouncer
          namespace: kubelab
        # No authelia ForwardAuth — Argo CD uses native OIDC (ARGO-010)
      services:
        - name: argocd
          port: 30080
  tls:
    certResolver: letsencrypt
---
# The router above decides which requests are redirected, so the regex matches anything:
# anchored on `/$` it let `/?x=1` through unredirected (measured on traefik:v3.6).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: argocd-sign-in
  namespace: kubelab
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/component: gitops
    app.kubernetes.io/part-of: kubelab
spec:
  redirectRegex:
    regex: ".*"
    replacement: "https://argo.kubelab.live/auth/login"
    permanent: false
