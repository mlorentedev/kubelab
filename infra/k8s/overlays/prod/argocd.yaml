---
# Argo CD — external service on AWS hub (aws1.kubelab.internal)
# Prod Traefik proxies argo.kubelab.live to aws1 argocd-server via Tailscale VPN.
# Same EndpointSlice pattern as Headscale (ADR-023 Phase 3).
#
# The backing EndpointSlice lives in `argocd-endpointslice.yaml`, NOT here: it
# carries a RESOLVE_* placeholder and is therefore the only part of this service
# that cannot go through Kustomize/Argo CD. Splitting it out keeps the Service
# and the route under GitOps like every other external service in this overlay
# (cf. `headscale.yaml`, whose EndpointSlice IS committed because the VPS IP is
# stable). Before that split the whole file sat outside the overlay, so SEC-004's
# rate-limit middleware reached git but never the cluster — see kubelab#970 and
# `tests/test_orphan_manifests.py`.
apiVersion: v1
kind: Service
metadata:
  name: argocd
  namespace: kubelab
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/component: gitops
    app.kubernetes.io/part-of: kubelab
    kubelab.live/location: external
  annotations:
    kubelab.live/host: aws1
    kubelab.live/description: "Argo CD on AWS hub (aws1.kubelab.internal via Tailscale)"
spec:
  ports:
    - name: http
      port: 30080
      targetPort: 30080
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: kubelab
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/component: gitops
    app.kubernetes.io/part-of: kubelab
    kubelab.live/location: external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argo.kubelab.live`)
      kind: Rule
      middlewares:
        - name: secure-headers
          namespace: kubelab
        - name: rate-limit
          namespace: kubelab
        - name: crowdsec-bouncer
          namespace: kubelab
        # No authelia ForwardAuth — Argo CD uses native OIDC (ARGO-010)
      services:
        - name: argocd
          port: 30080
  tls:
    certResolver: letsencrypt
