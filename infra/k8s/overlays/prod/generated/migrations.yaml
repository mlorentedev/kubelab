# The API's Atlas migrations (DATA-007). Both names carry a hash of the migration
# directory: a Job's spec is immutable, so a new migration needs a new Job, and an
# unchanged one applies as a no-op under kubectl and Argo CD alike. A Job and not
# an initContainer because the API must start while Postgres is down.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-migrations-0af59188bc
  namespace: kubelab
  labels:
    app.kubernetes.io/name: api-migrate
    app.kubernetes.io/part-of: kubelab
    app.kubernetes.io/managed-by: toolkit
data:
  20261102000000_forge_read_model.sql: |
    -- The forge task view's read model (CONSOLE-004, ADR-066 amendment A2 and A6).
    -- A cache: every row but the unprojected events can be rebuilt from the forges.

    -- One row per source. as_of only moves on a successful full read, so a source
    -- that cannot be read keeps its last known time and is never shown as empty.
    CREATE TABLE forge_source (
        forge            text        NOT NULL,
        owner            text        NOT NULL,
        repo             text        NOT NULL,
        as_of            timestamptz,
        source_reachable boolean     NOT NULL DEFAULT false,
        last_attempt_at  timestamptz,
        PRIMARY KEY (forge, owner, repo)
    );

    CREATE TABLE forge_item (
        forge      text        NOT NULL,
        owner      text        NOT NULL,
        repo       text        NOT NULL,
        number     integer     NOT NULL,
        kind       text        NOT NULL CHECK (kind IN ('issue', 'pull')),
        title      text        NOT NULL,
        state      text        NOT NULL CHECK (state IN ('open', 'closed')),
        author     text        NOT NULL,
        assignees  text[]      NOT NULL DEFAULT '{}',
        labels     text[]      NOT NULL DEFAULT '{}',
        url        text        NOT NULL,
        updated_at timestamptz NOT NULL,
        PRIMARY KEY (forge, owner, repo, number),
        FOREIGN KEY (forge, owner, repo) REFERENCES forge_source (forge, owner, repo) ON DELETE CASCADE
    );

    CREATE INDEX forge_item_queue ON forge_item (state, updated_at DESC);

    -- A webhook is stored before it is projected, so a failed projection replays.
    -- The unique delivery id is what makes the same delivery project once.
    CREATE TABLE forge_event (
        forge        text        NOT NULL,
        delivery_id  text        NOT NULL,
        event_type   text        NOT NULL,
        payload      jsonb       NOT NULL,
        received_at  timestamptz NOT NULL DEFAULT now(),
        projected_at timestamptz,
        PRIMARY KEY (forge, delivery_id)
    );

    CREATE INDEX forge_event_pending ON forge_event (received_at) WHERE projected_at IS NULL;

  atlas.sum: |
    h1:sZwQdOc/Yp5NjkbnCj4XI7UmXzBXFCtpv5Xk4hjYjOw=
    20261102000000_forge_read_model.sql h1:vPcaxFZHALwGGJMNHjzj5XrHFyU4Z5wbwn1FFpvksdI=

---
apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate-0af59188bc
  namespace: kubelab
  labels:
    app.kubernetes.io/name: api-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: kubelab
    app.kubernetes.io/managed-by: toolkit
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: kubelab
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      volumes:
        - name: migrations
          configMap:
            name: api-migrations-0af59188bc
      containers:
        - name: atlas
          image: arigaio/atlas:1.3.0
          args:
            - migrate
            - apply
            - --dir
            - file:///migrations
            - --url
            # Expanded by the kubelet. The password is a URL-safe token (SecretKind.RANDOM_TOKEN).
            - postgres://api:$(POSTGRES_TENANT_PASSWORD)@postgres:5432/api?sslmode=disable
          env:
            - name: POSTGRES_TENANT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: POSTGRES_TENANT_PASSWORD
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          resources:
            limits:
              memory: 128Mi
              cpu: "0.2"
            requests:
              memory: 32Mi
              cpu: "0.02"
