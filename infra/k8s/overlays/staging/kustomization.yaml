apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubelab

resources:
  - ../../base
  - generated/deployments.yaml
  - generated/services.yaml
  - generated/configmaps.yaml
  - generated/ingress.yaml
  - generated/hooks.yaml
  - generated/claims.yaml
  - generated/networkpolicies.yaml
  - generated/migrations.yaml
  - redirect-kubelab.yaml
  - traefik-dashboard.yaml
  - pihole.yaml
  - gitea.yaml
  - stuck-backend.yaml
  - imagesensortool-networkpolicy.yaml
  # secrets managed via: toolkit infra k8s apply-secrets --env staging (ADR-014)

# resume's no-success rule (RES-HOST-001 G): staging only, because it alerts on no
# data and prod runs no resume yet. `merge` adds one key and keeps every base file;
# `replace` would drop them all.
configMapGenerator:
  - name: grafana-alerting
    namespace: kubelab
    behavior: merge
    files:
      - grafana-alerting/resume-rules.yaml
