---
# Traefik Dashboard IngressRoute.
# Requires: api.dashboard=true + providers.kubernetesCRD.allowCrossNamespace=true
# in HelmChartConfig (managed by Ansible k3s_server role)
#
# SEC-005 (#1538): routes to `api@internal` rather than to the `traefik` Service
# on port 9000. See the prod copy of this file for the full reasoning -- in
# short, a port in a LoadBalancer Service is published to the host by
# klipper-lb, which gave the API an unauthenticated second door past every
# middleware below. Keep the two overlays in step.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: kubelab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.staging.kubelab.live`)
      kind: Rule
      middlewares:
        - name: secure-headers
          namespace: kubelab
        - name: rate-limit
          namespace: kubelab
        - name: crowdsec-bouncer
          namespace: kubelab
        - name: authelia
          namespace: kubelab
      services:
        - name: api@internal
          kind: TraefikService
  tls:
    certResolver: letsencrypt
