---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api
  namespace: kubelab
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: kubelab
    app.kubernetes.io/managed-by: toolkit
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.staging.kubelab.live`)
      kind: Rule
      services:
        - name: api
          port: 8080
      middlewares:
        - name: secure-headers
        - name: rate-limit
        - name: error-pages
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web
  namespace: kubelab
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: kubelab
    app.kubernetes.io/managed-by: toolkit
spec:
  entryPoints:
    - websecure
  routes:
    # Same-origin proxy (ADR-054). Declared before the host catch-all and with an
    # explicit priority so a relative path reaches its own service, not this app.
    - match: Host(`staging.mlorente.dev`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: api
          port: 8080
      middlewares:
        - name: secure-headers
        - name: rate-limit
        - name: error-pages
    - match: Host(`staging.mlorente.dev`)
      kind: Rule
      services:
        - name: web
          port: 8080
      middlewares:
        - name: secure-headers
        - name: rate-limit
        - name: error-pages
  tls:
    certResolver: letsencrypt
