---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resume-data
  namespace: kubelab
  labels:
    app.kubernetes.io/name: resume
    app.kubernetes.io/part-of: kubelab
    app.kubernetes.io/managed-by: toolkit
  annotations:
    # A claim the contract stops declaring leaves its PVC, and the data on it, in place;
    # deleting a volume is an explicit, ticketed change, never a side effect of a sync.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: resume-daily
  namespace: kubelab
  labels:
    app.kubernetes.io/name: resume
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/part-of: kubelab
    app.kubernetes.io/managed-by: toolkit
spec:
  schedule: "0 6 * * *"
  # The contract states its schedule in UTC.
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      # Finished Jobs expire within a day; the CronJob's own status keeps the last success.
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: resume
            app.kubernetes.io/component: cronjob
            app.kubernetes.io/part-of: kubelab
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: resume-data
          imagePullSecrets:
            - name: pull-ghcr-io
          containers:
            - name: daily
              image: ghcr.io/mlorentedev/resume:sha-a0e3aae
              imagePullPolicy: IfNotPresent
              command: ["resume", "daily"]
              envFrom:
                - configMapRef:
                    name: resume-config
                - secretRef:
                    name: resume-secrets
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                limits:
                  memory: 512Mi
                  cpu: "0.5"
                requests:
                  memory: 256Mi
                  cpu: "0.25"
