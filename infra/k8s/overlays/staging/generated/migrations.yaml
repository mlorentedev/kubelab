# The API's Atlas migrations (DATA-007). Both names carry a hash of the migration
# directory: a Job's spec is immutable, so a new migration needs a new Job, and an
# unchanged one applies as a no-op under kubectl and Argo CD alike. A Job and not
# an initContainer because the API must start while Postgres is down.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-migrations-830a591182
  namespace: kubelab
  labels:
    app.kubernetes.io/name: api-migrate
    app.kubernetes.io/part-of: kubelab
    app.kubernetes.io/managed-by: toolkit
data:
  20261102000000_forge_read_model.sql: |
    -- The forge task view's read model (CONSOLE-004, ADR-066 amendment A2 and A6).
    -- A cache: every row but the unprojected events can be rebuilt from the forges.

    -- One row per source. as_of only moves on a successful full read, so a source
    -- that cannot be read keeps its last known time and is never shown as empty.
    CREATE TABLE forge_source (
        forge            text        NOT NULL,
        owner            text        NOT NULL,
        repo             text        NOT NULL,
        as_of            timestamptz,
        source_reachable boolean     NOT NULL DEFAULT false,
        last_attempt_at  timestamptz,
        PRIMARY KEY (forge, owner, repo)
    );

    CREATE TABLE forge_item (
        forge      text        NOT NULL,
        owner      text        NOT NULL,
        repo       text        NOT NULL,
        number     integer     NOT NULL,
        kind       text        NOT NULL CHECK (kind IN ('issue', 'pull')),
        title      text        NOT NULL,
        state      text        NOT NULL CHECK (state IN ('open', 'closed')),
        author     text        NOT NULL,
        assignees  text[]      NOT NULL DEFAULT '{}',
        labels     text[]      NOT NULL DEFAULT '{}',
        url        text        NOT NULL,
        updated_at timestamptz NOT NULL,
        PRIMARY KEY (forge, owner, repo, number),
        FOREIGN KEY (forge, owner, repo) REFERENCES forge_source (forge, owner, repo) ON DELETE CASCADE
    );

    CREATE INDEX forge_item_queue ON forge_item (state, updated_at DESC);

    -- A webhook is stored before it is projected, so a failed projection replays.
    -- The unique delivery id is what makes the same delivery project once.
    CREATE TABLE forge_event (
        forge        text        NOT NULL,
        delivery_id  text        NOT NULL,
        event_type   text        NOT NULL,
        payload      jsonb       NOT NULL,
        received_at  timestamptz NOT NULL DEFAULT now(),
        projected_at timestamptz,
        PRIMARY KEY (forge, delivery_id)
    );

    CREATE INDEX forge_event_pending ON forge_event (received_at) WHERE projected_at IS NULL;

  20261112000000_console_usage.sql: |
    -- The console's usage counter (CONSOLE-004, ADR-066 amendment A8): one row per operator
    -- identity and UTC day on which the console page was opened. Vikunja retires only after
    -- the console is opened on 5 of 14 consecutive days, read from here.
    -- Not part of the read model: no forge can rebuild it, so it is never truncated with the
    -- forge tables, and the nightly pg_dumpall of this database is what keeps it.
    CREATE TABLE console_usage (
        identity   text        NOT NULL,
        day        date        NOT NULL,
        first_seen timestamptz NOT NULL,
        PRIMARY KEY (identity, day)
    );

  20261113000000_forge_stats.sql: |
    -- The statistics view of the forge read model (CONSOLE-004 AC6): what Grafana's read-only
    -- role selects, and the only thing it can select. It carries counts' inputs and no
    -- identity: no title, URL, author or assignee login, no free-text label, and no issue
    -- number (owner, repo and number rebuild an item's address). A column added here is a
    -- decision, and store/forge_stats_test.go lists the allowed ones.
    --
    -- A plain view, so it runs with its owner's rights: the role needs SELECT on the view and
    -- nothing on forge_item or forge_source. Do not make it security_invoker.
    --
    -- One row per item, and one row per source that holds none, so a source never read or
    -- read empty still shows its freshness. The model keeps no created_at or closed_at, so
    -- updated_at is the only age an item has.
    CREATE VIEW forge_stats AS
    SELECT
        s.forge,
        s.owner,
        s.repo,
        s.as_of,
        s.source_reachable,
        s.last_attempt_at,
        i.kind,
        i.state,
        i.updated_at,
        (SELECT substr(l, length('status:') + 1) FROM unnest(i.labels) AS l
          WHERE starts_with(l, 'status:') ORDER BY l LIMIT 1) AS status,
        (SELECT substr(l, length('priority:') + 1) FROM unnest(i.labels) AS l
          WHERE starts_with(l, 'priority:') ORDER BY l LIMIT 1) AS priority,
        (SELECT substr(l, length('area:') + 1) FROM unnest(i.labels) AS l
          WHERE starts_with(l, 'area:') ORDER BY l LIMIT 1) AS area
    FROM forge_source AS s
    LEFT JOIN forge_item AS i USING (forge, owner, repo);

    -- The role is created by the toolkit's Postgres provisioner (`make provision-postgres-tenant`),
    -- which a tenant's migration cannot do, so it may not exist yet when this runs. The
    -- provisioner grants the same SELECT when it runs after this migration; either order ends
    -- with the grant in place.
    DO $$
    BEGIN
      IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'forge_stats') THEN
        GRANT SELECT ON forge_stats TO forge_stats;
      END IF;
    END
    $$;

  atlas.sum: |
    h1:RkpSZ/APF21OT3pGJT7Of/OPoiM0FHTSdA9FJMfJvb0=
    20261102000000_forge_read_model.sql h1:vPcaxFZHALwGGJMNHjzj5XrHFyU4Z5wbwn1FFpvksdI=
    20261112000000_console_usage.sql h1:rTi+cJev6TDu65OL/U5FmGzxmeJkyrxlmPQCKS7ZmMI=
    20261113000000_forge_stats.sql h1:BhsPLYv+8HYAmBbhSwQbEALEbiQmsdvpyZ4UG4PVfqI=

---
apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate-830a591182
  namespace: kubelab
  labels:
    app.kubernetes.io/name: api-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: kubelab
    app.kubernetes.io/managed-by: toolkit
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: kubelab
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      volumes:
        - name: migrations
          configMap:
            name: api-migrations-830a591182
      containers:
        - name: atlas
          image: arigaio/atlas:1.3.0
          args:
            - migrate
            - apply
            - --dir
            - file:///migrations
            - --url
            # Expanded by the kubelet. The password is a URL-safe token (SecretKind.RANDOM_TOKEN).
            - postgres://api:$(POSTGRES_TENANT_PASSWORD)@postgres:5432/api?sslmode=disable
          env:
            - name: POSTGRES_TENANT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: POSTGRES_TENANT_PASSWORD
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          resources:
            limits:
              memory: 128Mi
              cpu: "0.2"
            requests:
              memory: 32Mi
              cpu: "0.02"
