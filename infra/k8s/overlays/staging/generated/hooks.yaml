---
apiVersion: batch/v1
kind: Job
metadata:
  name: web-route-probe-api
  namespace: kubelab
  labels:
    app.kubernetes.io/name: web-route-probe-api
    app.kubernetes.io/component: route-probe
    app.kubernetes.io/part-of: kubelab
    app.kubernetes.io/managed-by: toolkit
  annotations:
    argocd.argoproj.io/hook: PostSync
    # BeforeHookCreation stays: naming HookSucceeded alone drops Argo CD's
    # default, and a kept failed Job would then refuse every later sync by name.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  # Counts from creation, image pull included: a cold pull must not fail a sync.
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-route-probe-api
        app.kubernetes.io/component: route-probe
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: route-probe
          image: curlimages/curl:8.11.1
          command:
            - /bin/sh
            - -c
            - |
              set -- -sS -o /dev/null --max-time 20 \
                --connect-to "$PROBE_HOST:443:$PROBE_CONNECT_TO" \
                -X "$PROBE_METHOD" -w '%{http_code} %{content_type}'
              [ -n "$PROBE_BODY" ] && set -- "$@" --data-raw "$PROBE_BODY"
              got=$(curl "$@" "https://$PROBE_HOST$PROBE_PATH") || true
              want="$EXPECT_STATUS $EXPECT_CONTENT_TYPE"
              case "$got" in
                "$want"*) echo "route-probe: $PROBE_METHOD $PROBE_HOST$PROBE_PATH answered '$got'"; exit 0 ;;
              esac
              echo "route-probe: $PROBE_METHOD $PROBE_HOST$PROBE_PATH answered '$got', expected '$want'" >&2
              exit 1
          env:
            - name: PROBE_HOST
              value: "staging.mlorente.dev"
            - name: PROBE_CONNECT_TO
              value: traefik.kube-system.svc:443
            - name: PROBE_METHOD
              value: "POST"
            - name: PROBE_PATH
              value: "/"
            - name: PROBE_BODY
              value: '{'
            - name: EXPECT_STATUS
              value: "400"
            - name: EXPECT_CONTENT_TYPE
              value: "text/plain"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 32Mi
---
# The probe only calls out (NET-002: every workload has an Ingress policy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-route-probe-api-ingress
  namespace: kubelab
  labels:
    app.kubernetes.io/name: web-route-probe-api
    app.kubernetes.io/part-of: kubelab
    app.kubernetes.io/managed-by: toolkit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-route-probe-api
  policyTypes:
    - Ingress
