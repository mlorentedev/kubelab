# dev_node / CDE — ace2 bare metal (On-demand compute node)
# LAN: 172.16.1.5, Tailscale: 100.64.0.5
# SSOT: networking.nodes.ace2.lan_ip, networking.nodes.ace2.tailscale_ip in common.yaml
#
# Staging-overlay-only (matches pihole.yaml pattern): ace2 is reachable on LAN
# from ace1 (staging K3s server).
---
apiVersion: v1
kind: Service
metadata:
  name: dev-node
  namespace: kubelab
  labels:
    app.kubernetes.io/name: dev-node
    app.kubernetes.io/component: cde
    app.kubernetes.io/part-of: kubelab
    kubelab.live/location: external
  annotations:
    kubelab.live/host: ace2
    kubelab.live/description: "Developer node / CDE on ace2 bare metal (172.16.1.5)"
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: dev-node-external
  namespace: kubelab
  labels:
    kubernetes.io/service-name: dev-node
    app.kubernetes.io/name: dev-node
    app.kubernetes.io/component: cde
    app.kubernetes.io/part-of: kubelab
addressType: IPv4
ports:
  - name: http
    port: 8080
    protocol: TCP
endpoints:
  - addresses:
      - "172.16.1.5"   # = networking.nodes.ace2.lan_ip
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dev-node
  namespace: kubelab
  labels:
    app.kubernetes.io/name: dev-node
    app.kubernetes.io/component: cde
    app.kubernetes.io/part-of: kubelab
    kubelab.live/location: external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dev.kubelab.live`)
      kind: Rule
      middlewares:
        - name: secure-headers
          namespace: kubelab
        - name: rate-limit
          namespace: kubelab
        - name: authelia
          namespace: kubelab
      services:
        - name: dev-node
          port: 8080
  tls:
    certResolver: letsencrypt
