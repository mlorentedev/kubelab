# Pi-hole admin UI — RPi4 bare metal (Docker Compose, not K3s)
# LAN: 172.16.1.1, Tailscale: 100.64.0.10
# SSOT: networking.nodes.rpi4.lan_ip, networking.nodes.rpi4.tailscale_ip in common.yaml
#
# Staging-overlay-only (OPS-022, #969): the LAN EndpointSlice below is only
# reachable from a K3s node sharing RPi4's LAN — ace1 does, the VPS never
# will (ADR-028's 3 AM doctrine — RPi4 is on-demand homelab). Prod shipping
# this from base/ meant an IngressRoute it could never serve and certs
# ordered for a name it never answered. Same overlay-only pattern as prod's
# own headscale.yaml (overlays/prod/headscale.yaml).
---
apiVersion: v1
kind: Service
metadata:
  name: pihole
  namespace: kubelab
  labels:
    app.kubernetes.io/name: pihole
    app.kubernetes.io/component: dns
    app.kubernetes.io/part-of: kubelab
    kubelab.live/location: external
  annotations:
    kubelab.live/host: rpi4
    kubelab.live/description: "Pi-hole admin UI on RPi4 bare metal (172.16.1.1)"
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pihole-external
  namespace: kubelab
  labels:
    kubernetes.io/service-name: pihole
    app.kubernetes.io/name: pihole
    app.kubernetes.io/component: dns
    app.kubernetes.io/part-of: kubelab
addressType: IPv4
ports:
  - name: http
    port: 80
    protocol: TCP
endpoints:
  # Pi-hole is staging-only: RPi4 is never reachable from the VPS (different
  # LAN entirely, no VPN dependency involved). LAN IP works because ace1 and
  # RPi4 share LAN.
  - addresses:
      - "172.16.1.1"   # = networking.nodes.rpi4.lan_ip
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihole
  namespace: kubelab
  labels:
    app.kubernetes.io/name: pihole
    app.kubernetes.io/component: dns
    app.kubernetes.io/part-of: kubelab
    kubelab.live/location: external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pihole.kubelab.live`)
      kind: Rule
      # No authelia middleware — Pi-hole v6 has built-in auth (same pattern as n8n)
      middlewares:
        - name: secure-headers
          namespace: kubelab
        - name: crowdsec-bouncer
          namespace: kubelab
      services:
        - name: pihole
          port: 80
  tls:
    certResolver: letsencrypt
