# RES-HOST-001 A6 (AC8): sealed offline with `kubeseal --cert` against the certificate held in SOPS
# (infra.sealed_secrets.tls_crt, staging). Its plaintext is not a credential: a controller running the
# operator's key unseals it to the digest annotated here; one that minted its own key cannot unseal it.
# Check with `toolkit infra k8s verify-sealed-secrets --env staging`; reseal after any key rotation.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sealed-secrets-probe
  namespace: kube-system
  annotations:
    kubelab.live/plaintext-sha256: 832b8f21d8c10d7ab26569ba7fd0b3dd3ac893d486159530e75873cf3309cbb3
spec:
  encryptedData:
    probe: 
  template:
    metadata:
      name: sealed-secrets-probe
      namespace: kube-system
