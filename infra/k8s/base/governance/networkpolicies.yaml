---
# Vikunja is the only client. The API reads no INFRA_POSTGRES_* yet (every
# ConfigMap carries them, ADR-036); add it here when it connects. Grafana and
# n8n use SQLite. Tenant provisioning and drills use `kubectl exec`, not the
# network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: kubelab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vikunja
      ports:
        - protocol: TCP
          port: 5432
---
# IngressRoute loki, the Grafana datasource, the Vector sink, and n8n's sre-auto-triage.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-ingress
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: kubelab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vector
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: n8n
      ports:
        - protocol: TCP
          port: 3100
---
