# Ingress allowlist for every workload in `kubelab` (NET-002, #378).
#
# A pod selected by a policy with `policyTypes: [Ingress]` refuses every
# connection no rule allows, so these policies together are the namespace's
# default-deny for ingress, written per workload so each one moves with its
# service when ADR-067 D5 gives products their own namespace. Egress stays open:
# its destinations (SMTP, R2, Cloudflare, the forges) are not in the manifests.
#
# Each source was derived from the rendered overlays (an IngressRoute or a
# Middleware means Traefik; an in-cluster address in a ConfigMap means its pod)
# and from `infra/n8n/workflows/`. A workflow created only in the n8n editor is
# not in git, so a new internal call it makes needs a rule here first.
#
# Grafana's policy lives in `services/grafana.yaml` (SEC-014), PR-Agent's in the
# prod overlay. Kubelet probes and `kubectl port-forward` are not pod-to-pod
# traffic, so break-glass is unaffected.
# `tests/test_networkpolicy_coverage.py` fails on a workload no policy selects,
# on a policy that selects nothing, and on a source that matches no pod.
---
# IngressRoute api.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: kubelab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
---
