---
# IDP-031 — namespace resource governance, phase 1.
#
# This LimitRange is the floor the future ResourceQuota stands on, and it has to
# be live and proven BEFORE that quota exists. A ResourceQuota rejects any pod
# that omits a dimension the quota constrains, and this namespace ships two
# initContainers that declare no resources at all:
#
#   apprise/seed-config        — seeds /config from the apprise-secrets Secret
#   crowdsec/inject-whitelist  — writes the Tailscale whitelist before startup
#
# Add a `limits.memory` quota without these defaults and both pods stop being
# admissible. That is the whole reason this object ships on its own first; see
# specs/IDP-031-namespace-resource-governance/proposal.md.
#
# The values mirror the tier postgres, gitea, authelia and crowdsec already run
# at, so they are calibrated against real workloads in this namespace rather
# than picked as round numbers. The same pair is asserted independently in
# tests/infra/test_k3s.py and is deliberately NOT read from this file — a test
# that sources its expectation from the manifest it validates passes for any
# value. Changing the defaults is meant to require editing both places.
#
# No `max`/`min` here on purpose: this object only supplies defaults. Bounding
# the ceiling is the quota's job in phase 2.
apiVersion: v1
kind: LimitRange
metadata:
  name: kubelab-defaults
  namespace: kubelab
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
      default:
        memory: 256Mi
