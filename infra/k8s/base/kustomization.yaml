apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubelab

resources:
  - namespace.yaml
  - governance/limitrange.yaml
  - governance/resourcequota.yaml
  - edge/errors.yaml
  - external/uptime-kuma.yaml
  - edge/secure-headers.yaml
  - edge/rate-limit.yaml
  - edge/vpn-whitelist.yaml
  - services/grafana.yaml
  - services/loki.yaml
  - services/vector.yaml
  - services/redis.yaml
  - services/postgres.yaml
  - services/authelia.yaml
  - services/crowdsec.yaml
  - services/n8n.yaml
  - services/vikunja.yaml
  - services/apprise.yaml
  - services/minio.yaml
  - services/homepage.yaml
  - services/quota-watcher.yaml
  - services/r2-backup-watcher.yaml
  - services/disk-watcher.yaml

configMapGenerator:
  # Homepage config — hash suffix triggers rolling update on config change (RELIAB-002)
  - name: homepage-config
    namespace: kubelab
    files:
      - services/homepage-config/settings.yaml
      - services/homepage-config/services.yaml
      - services/homepage-config/bookmarks.yaml
      - services/homepage-config/widgets.yaml
      - services/homepage-config/kubernetes.yaml
      - services/homepage-config/docker.yaml
      - services/homepage-config/custom.css
      - services/homepage-config/custom.js
    options:
      annotations:
        # custom.js embeds six base64 SVG diagrams (~246 KB, 92% of the object),
        # which pushes the serialized ConfigMap past the 262144-byte cap on
        # kubectl's `last-applied-configuration` annotation. Client-side apply
        # writes the whole object into that annotation; server-side apply
        # writes no such annotation, so the ceiling becomes the 1 MiB ConfigMap
        # limit instead (OPS-015 / #938).
        #
        # Scoped to this ONE generator deliberately. App-wide SSA would change
        # field-ownership semantics for ~90 resources to fix a single object.
        # Migration risk here is nil: the hash suffix makes every regeneration a
        # NEW object name, so there is no client-side manager history to conflict
        # with — the failing `homepage-config-t88c6mm6ch` was never created.
        #
        # This raises the ceiling; it does not bound the growth. The object gains
        # ~32 KB per upstream renderer change (TOOL-027 / #941), which is the
        # durable fix.
        argocd.argoproj.io/sync-options: ServerSideApply=true

  # Authelia config — hash suffix triggers auto rolling restart on configuration.yml change
  # (SECRET-RELOAD-001a fix: configuration.yml is mounted via subPath so updates would otherwise
  # freeze at mount time, AND Authelia does not hot-reload configuration.yml).
  # Prod overlay replaces this CM via `behavior: replace` in overlays/prod/kustomization.yaml.
  - name: authelia-config
    namespace: kubelab
    files:
      - services/authelia-config/configuration.yml

  # Vikunja's env vars, same rationale as authelia-config above (lesson-404):
  # nothing re-reads a plain ConfigMap after container start. This is also
  # why VIKUNJA_FILES_S3_ENABLED silently no-op'd for as long as it did --
  # the pod never restarted on its own to notice the value even mattered.
  # Prod overlay merges its bucket/domain overrides via `behavior: merge` in
  # overlays/prod/kustomization.yaml.
  - name: vikunja-config
    namespace: kubelab
    envs:
      - services/vikunja-config/vikunja.env

  - name: authelia-assets
    namespace: kubelab
    files:
      - services/authelia-assets/logo.png
      - services/authelia-assets/favicon.ico
    options:
      disableNameSuffixHash: true

  - name: grafana-dashboards
    namespace: kubelab
    files:
      - services/grafana-dashboards/kubelab-logs-overview.json
    options:
      disableNameSuffixHash: true

  # Grafana's environment. Keeps the name hash for the same reason
  # grafana-alerting below does, and the stronger version of it: env vars are
  # injected once at container start and Grafana re-reads none of them, so an
  # unhashed ConfigMap changes while the running pod keeps the old value and
  # Argo CD reports Synced/Healthy — a silent no-op, not a visible failure.
  # Found by review on #1446, where a new OAuth role-mapping variable would
  # have landed in prod's ConfigMap and never reached the process.
  #
  # `envs:` (not `files:`) so each line becomes its own ConfigMap key, matching
  # the `envFrom: configMapRef` the Deployment already uses.
  - name: grafana-config
    namespace: kubelab
    envs:
      - services/grafana-config/grafana.env
    options:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: kubelab

  # Grafana alerting provisioning (OBS-007). NOTE the deliberate difference from
  # its grafana-dashboards sibling directly above: that one disables the name
  # hash, this one keeps it. Dashboards are re-read on a timer
  # (`updateIntervalSeconds: 60` in grafana-dashboard-provider), so a stable name
  # is fine there. Alerting provisioning is read ONCE at Grafana startup, so
  # without the hash suffix a rule change would land on disk and never take
  # effect. The hash makes every change a new object name, which rolls the pod.
  # Same rationale as authelia-config. Do not "align" this with the sibling.
  #
  # `policies.yaml` is replaced per environment via `behavior: merge` in the prod
  # overlay — prod pages, staging archives.
  - name: grafana-alerting
    namespace: kubelab
    files:
      - services/grafana-alerting/contact-points.yaml
      - services/grafana-alerting/templates.yaml
      - services/grafana-alerting/policies.yaml
      - services/grafana-alerting/rules.yaml
      - services/grafana-alerting/quota-rules.yaml
      - services/grafana-alerting/r2-backup-rules.yaml
      - services/grafana-alerting/inhibit-rules.yaml
      - services/grafana-alerting/sre-rules.yaml
      - services/grafana-alerting/disk-rules.yaml
      - services/grafana-alerting/slo-rules.yaml
      # Rules that are retired and must be actively DELETED from Grafana's
      # database. Dropping a file from this list does not remove the rule --
      # measured on both clusters, #1583. Whatever leaves this list gets a uid
      # in deleted-rules.yaml, in the same change.
      - services/grafana-alerting/deleted-rules.yaml
      # `security-rules.yaml` was here and is deliberately gone (OBS-015).
      #
      # It held one rule, "CrowdSec automated perimeter IP ban surge", which
      # fired continuously from 2026-08-23 and was never once true. Its LogQL
      # counted log LINES matching `(?i)(ban|decision|blocked|remediation)` --
      # and the bouncer's own `GET /v1/decisions/stream` poll, once every 60s,
      # matches `decision`. Measured: 20 lines per 10m window against a `> 5`
      # threshold, forever, on an idle CrowdSec.
      #
      # Do NOT re-add a corrected version of it yet. The deeper finding is that
      # the alert described a capability this deployment does not have: with
      # klipper-lb masquerading every source IP (#1067), the bouncer compares
      # `10.42.0.x` against a blocklist of public addresses and can never match
      # -- 0 dropped requests in 7 days across 13 protected routes. A fixed
      # query would simply never fire instead of always firing.
      #
      # Security alerting here becomes meaningful once #1067 lands and the
      # bouncer sees real client IPs. See docs/lessons/observability/
      # lesson-412-an-alert-on-a-capability-that-does-not-exist.md.

# Image tags synced from infra/config/values/common.yaml (SSOT).
# Run `make sync-k8s-images` to refresh after bumping versions.
images:
  - name: n8nio/n8n
    newTag: 2.12.3
  - name: caronc/apprise
    newTag: 1.5.0
  - name: grafana/loki
    newTag: 3.6.4
  - name: timberio/vector
    newTag: 0.43.1-alpine
  - name: ghcr.io/gethomepage/homepage
    newTag: v1.13.2
  - name: authelia/authelia
    newTag: 4.39.15
  - name: redis
    newTag: 7-alpine
  - name: crowdsecurity/crowdsec
    newTag: v1.7.6
  - name: quay.io/minio/minio
    newTag: RELEASE.2025-09-07T16-13-09Z
  - name: postgres
    newTag: 16-alpine
  - name: docker.io/mlorentedev/kubelab-errors
    newTag: 1.1.6
  # Custom apps web/api: per-env tags via `toolkit deployment promote` (overlays).
  # errors is synced from edge.errors.version above (DELIVERY-003 single SSOT).
  - name: docker.io/mlorentedev/kubelab-web
    newTag: "1.0.1"
  - name: docker.io/mlorentedev/kubelab-api
    newTag: "1.0.0"
