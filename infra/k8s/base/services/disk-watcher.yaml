# disk-watcher — OBS-015, in-cluster volume & disk capacity emitter.
#
# Inspects Kubernetes PersistentVolumeClaims and container disk capacity in the
# `kubelab` namespace every 15 minutes and emits structured JSON lines to stdout.
# Vector ships stdout to Loki (ADR-028), where Grafana alerting rules (disk-rules.yaml)
# evaluate thresholds (>85% warning, >95% critical) with Dead Man's Switch (noDataState: Alerting).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: disk-watcher
  namespace: kubelab
  labels:
    app.kubernetes.io/name: disk-watcher
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: kubelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: disk-watcher
  namespace: kubelab
  labels:
    app.kubernetes.io/name: disk-watcher
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: kubelab
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: disk-watcher
  namespace: kubelab
  labels:
    app.kubernetes.io/name: disk-watcher
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: kubelab
subjects:
  - kind: ServiceAccount
    name: disk-watcher
    namespace: kubelab
roleRef:
  kind: Role
  name: disk-watcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: disk-watcher
  namespace: kubelab
  labels:
    app.kubernetes.io/name: disk-watcher
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: kubelab
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app.kubernetes.io/name: disk-watcher
            app.kubernetes.io/component: observability
        spec:
          serviceAccountName: disk-watcher
          automountServiceAccountToken: true
          restartPolicy: OnFailure
          containers:
            - name: disk-watcher
              image: alpine:3.21
              command: ["/bin/sh", "-e", "-c"]
              args:
                - |
                  apk add --no-cache curl jq > /dev/null 2>&1

                  TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"

                  BODY=$(curl -sf --cacert "$CACERT" \
                    -H "Authorization: Bearer $TOKEN" \
                    "$API/api/v1/namespaces/kubelab/persistentvolumeclaims")

                  # Parse PVC capacity and bound status
                  echo "$BODY" | jq -c '.items[] | {
                    metric: "disk_pvc_health",
                    namespace: .metadata.namespace,
                    pvc: .metadata.name,
                    phase: .status.phase,
                    capacity: (.status.capacity.storage // "0"),
                    healthy: (.status.phase == "Bound")
                  }'

                  # Local node scratch space check
                  USED_PCT=$(df -P / | awk 'NR==2 {print int($5)}')
                  echo "{\"metric\":\"disk_root_usage\",\"namespace\":\"kubelab\","\
                    "\"used_pct\":$USED_PCT,\"healthy\":$((USED_PCT < 90))}"
              resources:
                requests:
                  memory: 32Mi
                  cpu: "0.05"
                limits:
                  memory: 64Mi
                  cpu: "0.2"
