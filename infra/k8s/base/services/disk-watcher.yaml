# disk-watcher — OBS-015, in-cluster volume & disk capacity emitter.
#
# Inspects Kubernetes PersistentVolumeClaims and container disk capacity in the
# `kubelab` namespace every 15 minutes and emits structured JSON lines to stdout.
# Vector ships stdout to Loki (ADR-028), where Grafana alerting rules (disk-rules.yaml)
# evaluate thresholds (>85% warning, >95% critical) with Dead Man's Switch (noDataState: Alerting).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: disk-watcher
  namespace: kubelab
  labels:
    app.kubernetes.io/name: disk-watcher
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: kubelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: disk-watcher
  namespace: kubelab
  labels:
    app.kubernetes.io/name: disk-watcher
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: kubelab
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: disk-watcher
  namespace: kubelab
  labels:
    app.kubernetes.io/name: disk-watcher
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: kubelab
subjects:
  - kind: ServiceAccount
    name: disk-watcher
    namespace: kubelab
roleRef:
  kind: Role
  name: disk-watcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: disk-watcher
  namespace: kubelab
  labels:
    app.kubernetes.io/name: disk-watcher
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: kubelab
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app.kubernetes.io/name: disk-watcher
            app.kubernetes.io/component: observability
        spec:
          serviceAccountName: disk-watcher
          automountServiceAccountToken: true
          restartPolicy: OnFailure
          # WHY `healthy` IS A NUMBER, AND WHY THIS NOTE IS OUT HERE.
          #
          # The emitter below must yield 1/0, never a jq `==` comparison. That
          # comparison returns a JSON boolean, the LogQL `unwrap` stage needs a
          # float, and `true` is not one: the sample is dropped, the query
          # returns NO DATA, and `noDataState: Alerting` turns that into a
          # permanent "a PVC is not Bound" while all of them are. It shipped
          # that way on 2026-08-23 and fired in both environments for a day and
          # a half before anyone read it (#1377). The sibling metric further
          # down was always correct because the shell's `$(( ))` returns 0/1 —
          # so the one emitter written with a proper JSON tool is the one that
          # broke, and each half looked reasonable alone.
          #
          # This note sits HERE, in YAML, rather than inside the jq program,
          # because the program is passed as `jq -c '...'` — single-quoted BY
          # THE SHELL. #1378 put this same prose in there and it contained the
          # words "jq's" and "LogQL's"; each apostrophe closed that string and
          # the whole script stopped parsing. The CronJob then failed on every
          # run, which — via the same `noDataState: Alerting` described above —
          # made the alert fire while looking correct. YAML comments cannot do
          # that. `tests/test_embedded_shell_syntax.py` now catches the class,
          # but placement removes it. Keep prose out of the quoted program.
          containers:
            - name: disk-watcher
              image: alpine:3.21
              command: ["/bin/sh", "-e", "-c"]
              args:
                - |
                  apk add --no-cache curl jq > /dev/null 2>&1

                  TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"

                  BODY=$(curl -sf --cacert "$CACERT" \
                    -H "Authorization: Bearer $TOKEN" \
                    "$API/api/v1/namespaces/kubelab/persistentvolumeclaims")

                  # Parse PVC capacity and bound status
                  echo "$BODY" | jq -c '.items[] | {
                    metric: "disk_pvc_health",
                    namespace: .metadata.namespace,
                    pvc: .metadata.name,
                    phase: .status.phase,
                    capacity: (.status.capacity.storage // "0"),
                    # A NUMBER — see the note above this container, which is
                    # where the rationale lives now and why.
                    healthy: (if .status.phase == "Bound" then 1 else 0 end)
                  }'

                  # Local node scratch space check
                  USED_PCT=$(df -P / | awk 'NR==2 {print int($5)}')
                  echo "{\"metric\":\"disk_root_usage\",\"namespace\":\"kubelab\","\
                    "\"used_pct\":$USED_PCT,\"healthy\":$((USED_PCT < 90))}"
              resources:
                requests:
                  memory: 32Mi
                  cpu: "0.05"
                limits:
                  memory: 64Mi
                  cpu: "0.2"
