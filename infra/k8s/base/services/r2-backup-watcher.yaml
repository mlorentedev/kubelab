# r2-backup-watcher — the in-cluster reader of Cloudflare R2 backup health
# (OBS-015, BACKUP-055).
#
# Every 6h a Job runs `r2-backup-watcher/probe.sh` in the pinned restic image,
# with a READ-ONLY R2 token, against every node listed in `targets.txt`. It
# prints one `r2_backup_node` line per node and one fleet `r2_backup_health`
# line. Vector ships stdout to Loki (ADR-028), and the Grafana rule in
# grafana-alerting/r2-backup-rules.yaml thresholds on the fleet line's healthy==1.
# What each check means is in probe.sh; the pod shape below is pinned by
# tests/test_r2_backup_watcher_manifest.py.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: r2-backup-watcher
  namespace: kubelab
  labels:
    app.kubernetes.io/name: r2-backup-watcher
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: kubelab
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: r2-backup-watcher
  namespace: kubelab
  labels:
    app.kubernetes.io/name: r2-backup-watcher
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: kubelab
spec:
  # Every 6h, not daily. The rule that reads this emitter asks
  # `last_over_time(...[24h])` with `noDataState: Alerting`, so the producer's
  # period IS the alert's margin — and a daily producer against a 24h window
  # leaves none. One late or skipped run and the dead-man fires on a fleet
  # whose backups are fine.
  #
  # Measured 2026-08-23. Prod: the rule shipped at 04:40Z with no emitter
  # history in Loki, fired at 04:59Z, and only cleared at 06:19Z when the daily
  # 06:00 tick finally produced a line. Staging then got the same rule at
  # 07:06Z — past that day's only tick — and had no way to clear before 06:00
  # the following morning. A fresh environment inherits a ~23h alert saying
  # nodes may be unprotected, which is the shape that teaches people to close
  # this alert unread.
  #
  # 6h holds four samples inside the window, so one missed run is survivable
  # and the worst-case first-deploy noData is 6h rather than 24h. It also
  # matches #452's Tier 1 RPO, which is the interval anyone reasoning about
  # backup freshness here already has in their head. Cost is negligible: the
  # probe is a restic snapshot listing, and BACKUP-044 budgeted ~63k Class A
  # operations a month against 1M free.
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One run, one verdict. A retried pod would print a second fleet line and
      # the rule's `last_over_time` keeps only the last, so a flaky pass could
      # overwrite a real failure. The next run is at most 6h away.
      backoffLimit: 0
      # Floor, derived from the probe: nodes x (3 restic calls x RESTIC_TIMEOUT
      # + STATS_TIMEOUT) = 4 x (3 x 60 + 600) = 3120s. The real run takes ~3 min,
      # most of it the Beelink's `stats` (143s in staging, 2026-09-30); the
      # deadline is sized for the worst case the probe allows, not the typical
      # one. tests/test_r2_backup_watcher_manifest.py counts the calls.
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: r2-backup-watcher
            app.kubernetes.io/component: observability
        spec:
          restartPolicy: Never
          serviceAccountName: r2-backup-watcher
          automountServiceAccountToken: false
          # Longer than the longest single call, STATS_TIMEOUT. Kubelet signals
          # PID 1 only, and `sh` runs its trap once the running restic call
          # returns. With less, a deadline kill during `stats` would SIGKILL the
          # probe before its fleet line.
          terminationGracePeriodSeconds: 660
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            - name: r2-backup-watcher
              image: restic/restic
              # The image's entrypoint is restic itself. Run the probe with `sh`
              # (ConfigMap mode bits don't matter) and without `-e`: the probe
              # owns its exits, so that every one of them prints the fleet line.
              command: ["/bin/sh", "/etc/r2-backup-watcher/probe.sh"]
              envFrom:
                - secretRef:
                    name: r2-backup-watcher-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: probe
                  mountPath: /etc/r2-backup-watcher
                  readOnly: true
                # The probe's mktemp. restic itself runs with --no-cache, so
                # there is no cache directory to provide.
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  memory: 64Mi
                # restic loads each repository's index: 46 MiB peak measured in
                # staging (cgroup memory.peak, 2026-09-27). The headroom is
                # deliberate: indexes grow, and an OOM of the shell is a silent run.
                limits:
                  memory: 256Mi
          volumes:
            - name: probe
              configMap:
                name: r2-backup-watcher-probe
            - name: tmp
              emptyDir: {}
