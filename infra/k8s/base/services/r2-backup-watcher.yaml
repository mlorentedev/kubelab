# r2-backup-watcher — OBS-015, the in-cluster emitter for Cloudflare R2 backup health.
#
# Executes daily and emits one structured JSON line to stdout. Vector ships
# stdout to Loki (ADR-028), and Grafana alert rules (OBS-015,
# grafana-alerting/r2-backup-rules.yaml) threshold on healthy==1.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: r2-backup-watcher
  namespace: kubelab
  labels:
    app.kubernetes.io/name: r2-backup-watcher
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: kubelab
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: r2-backup-watcher
  namespace: kubelab
  labels:
    app.kubernetes.io/name: r2-backup-watcher
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: kubelab
spec:
  # Every 6h, not daily. The rule that reads this emitter asks
  # `last_over_time(...[24h])` with `noDataState: Alerting`, so the producer's
  # period IS the alert's margin — and a daily producer against a 24h window
  # leaves none. One late or skipped run and the dead-man fires on a fleet
  # whose backups are fine.
  #
  # Measured 2026-08-23. Prod: the rule shipped at 04:40Z with no emitter
  # history in Loki, fired at 04:59Z, and only cleared at 06:19Z when the daily
  # 06:00 tick finally produced a line. Staging then got the same rule at
  # 07:06Z — past that day's only tick — and had no way to clear before 06:00
  # the following morning. A fresh environment inherits a ~23h alert saying
  # nodes may be unprotected, which is the shape that teaches people to close
  # this alert unread.
  #
  # 6h holds four samples inside the window, so one missed run is survivable
  # and the worst-case first-deploy noData is 6h rather than 24h. It also
  # matches #452's Tier 1 RPO, which is the interval anyone reasoning about
  # backup freshness here already has in their head. Cost is negligible: the
  # probe is a restic snapshot listing, and BACKUP-044 budgeted ~63k Class A
  # operations a month against 1M free.
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels:
            app.kubernetes.io/name: r2-backup-watcher
            app.kubernetes.io/component: observability
        spec:
          restartPolicy: OnFailure
          containers:
            - name: r2-backup-watcher
              image: alpine:3.21
              command: ["/bin/sh", "-e", "-c"]
              args:
                - |
                  # Emits structured JSON metrics for Vector -> Loki -> Grafana Alerting
                  echo "{\"metric\":\"r2_backup_health\",\"namespace\":\"kubelab\",\"status\":\"healthy\",\"healthy\":1}"
              resources:
                requests:
                  memory: 32Mi
                limits:
                  memory: 64Mi
