# Grafana alerting — disk saturation & PersistentVolumeClaim health rules (OBS-015).
#
# Reads structured JSON log lines from `disk-watcher` (services/disk-watcher.yaml).
# Evaluates PVC lifecycle phase and root filesystem saturation.
---
apiVersion: 1

groups:
  - orgId: 1
    name: storage
    folder: kubelab
    interval: 15m
    rules:
      - uid: obs015-pvc-unbound-failure
        title: PersistentVolumeClaim unbound or failed
        condition: C
        for: 15m
        # `OK`, and only because `obs042-disk-watcher-silent` below watches the
        # watcher (#1668). Silence of the whole stream is the other rule's question.
        #
        # `OK` did NOT shorten how long a deleted claim stays FIRING: ~90 minutes
        # under `Alerting` (staging, 2026-09-05) and 89.5 minutes under `OK`
        # (staging, 2026-11-03). Other claims keep the result non-empty, so
        # noDataState never applies. The deleted claim's series goes missing
        # instead: it leaves the `[30m]` window, then Grafana resolves it after
        # its missing-series evaluations at the 15m interval (#1668).
        noDataState: OK
        execErrState: Alerting
        annotations:
          # One cause. It used to hedge between an unbound claim and a stopped
          # watcher because it alerted on both; #1377 shows what the hedge cost.
          summary: >-
            A PersistentVolumeClaim in namespace kubelab has not been 'Bound' for 15 minutes,
            so the workload that mounts it cannot start. `kubectl get pvc -n kubelab` names the
            claim; its events say why provisioning failed.
          runbook_url: https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/runbook-notifications-and-alerting.md
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              # `by (namespace, pvc)` is load-bearing, not tidying (OBS-018).
              # disk-watcher is a CronJob: every 15m run is a NEW pod, and
              # Vector labels every Loki stream with `pod`. Without the
              # grouping, `unwrap` keys each series by (pod, pvc), so every
              # run starts a fresh series for the same PVC — the alert
              # instance for a genuinely unbound PVC goes stale and
              # false-Resolves after the 30m window, then a new instance
              # starts one step behind, forever. Grouping by identity the
              # PVC actually has survives the pod churn, so `for: 15m` means
              # what it says. Measured live in staging 2026-08-27: the
              # `ac2-drill-unbound` drill produced 4 simultaneous alerting
              # instances, one per CronJob pod, none older than 30 minutes.
              expr: >-
                last_over_time(
                  {container="disk-watcher"}
                    | json
                    | metric=`disk_pvc_health`
                    | unwrap healthy
                  [30m]
                ) by (namespace, pvc)
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              datasource:
                type: __expr__
                uid: __expr__

      - uid: obs042-disk-watcher-silent
        title: disk-watcher stopped reporting PVC health
        condition: C
        for: 15m
        # The liveness half of #1668's split. The query is POSITIVE and has no
        # grouping, so it returns one series while the watcher reports and
        # nothing when it stops; `noDataState: Alerting` does the firing, and
        # the notice says "(no data)", which is the literal cause here. The
        # threshold below never trips on real data (a count is >= 1); it exists
        # because a rule needs a condition.
        #
        # Not `absent_over_time`: that returns a series only on silence, so
        # paired with `Alerting` it would fire on a healthy watcher.
        #
        # 45m against a 15m schedule is three samples: one late run is
        # survivable, two are not (#1320).
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            No PVC health line from disk-watcher in 45 minutes, so no PersistentVolumeClaim is being
            measured and the unbound-claim rule cannot fire. Check `kubectl get cronjob disk-watcher
            -n kubelab` first: suspended, failing, or a last run older than 30m is the cause. If its
            runs are current, the lines are not reaching Loki: read the Vector pod's log.
          runbook_url: https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/runbook-notifications-and-alerting.md
        data:
          - refId: A
            relativeTimeRange:
              from: 2700
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              expr: >-
                sum(count_over_time(
                  {container="disk-watcher"}
                    | json
                    | metric=`disk_pvc_health`
                  [45m]
                ))
          - refId: B
            relativeTimeRange:
              from: 2700
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 2700
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              datasource:
                type: __expr__
                uid: __expr__

      - uid: obs042-disk-root-silent
        title: disk-watcher stopped reporting root disk usage
        condition: C
        for: 15m
        # The liveness half of the root rule's split, the same shape as
        # `obs042-disk-watcher-silent` above. It counts its own metric, not the
        # PVC one: disk-watcher writes both lines from one run, and a run that
        # fails between them leaves one present and the other gone.
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            No root disk usage line from disk-watcher in 45 minutes, so no node's root filesystem is
            being measured and the saturation rule cannot fire. Check `kubectl get cronjob
            disk-watcher -n kubelab` first: suspended, failing, or a last run older than 30m is the
            cause. If its runs are current and PVC lines still arrive, the root measurement itself
            fails: read the CronJob's last pod log.
          runbook_url: https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/runbook-notifications-and-alerting.md
        data:
          - refId: A
            relativeTimeRange:
              from: 2700
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              expr: >-
                sum(count_over_time(
                  {container="disk-watcher"}
                    | json
                    | metric=`disk_root_usage`
                  [45m]
                ))
          - refId: B
            relativeTimeRange:
              from: 2700
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 2700
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              datasource:
                type: __expr__
                uid: __expr__

      - uid: obs015-disk-root-saturation
        title: Node root filesystem disk space critical (>90%)
        condition: C
        for: 15m
        # `OK` since the split: silence pages through `obs042-disk-root-silent`
        # above, so this rule has one cause and its summary names it.
        #
        # It said `Alerting` from 2026-09-05 until the split, and `OK` before
        # that with no liveness rule at all. The defect then was invisible because
        # both rules read the SAME stream: if `disk-watcher` stops, the PVC rule
        # above goes red and this one goes green, from one cause. So the node
        # whose disk is unwatched is exactly the node that looks fine.
        #
        # Found reviewing OPS-024, which planned to feed node-level producers into
        # this rule — the plan would have added five nodes to a rule that reports
        # health when nobody is reporting. Not hypothetical: #1377 is the same
        # rule family firing on a stopped watcher for a day and a half, which is
        # also the evidence that `Alerting` DOES fire on no-data here.
        #
        # NOTE for OPS-024: the on-demand nodes (ADR-028 — beelink, rpi4, ace2,
        # jetson) are off by design, so when a producer for them exists this rule
        # cannot be the one that watches them; silence is their normal state.
        # Today the only producer is the in-cluster CronJob on always-on nodes,
        # which is why its silence pages and why adding those nodes to the
        # liveness rule later would be wrong.
        noDataState: OK
        execErrState: Error
        annotations:
          summary: >-
            A node's root filesystem is above 90%; the node is in the alert's labels. A silent
            disk-watcher does not fire this rule: that pages as "disk-watcher stopped reporting
            root disk usage".
          runbook_url: https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/runbook-notifications-and-alerting.md
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              # Same per-pod-churn class as obs015-pvc-unbound-failure above,
              # grouped by the identity this metric actually carries: `node`,
              # not `pod` (OBS-018 AC5).
              expr: >-
                last_over_time(
                  {container="disk-watcher"}
                    | json
                    | metric=`disk_root_usage`
                    | unwrap used_pct
                  [30m]
                ) by (node)
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
              datasource:
                type: __expr__
                uid: __expr__
