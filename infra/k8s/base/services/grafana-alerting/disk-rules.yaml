# Grafana alerting — disk saturation & PersistentVolumeClaim health rules (OBS-015).
#
# Reads structured JSON log lines from `disk-watcher` (services/disk-watcher.yaml).
# Evaluates PVC lifecycle phase and root filesystem saturation.
---
apiVersion: 1

groups:
  - orgId: 1
    name: storage
    folder: kubelab
    interval: 15m
    rules:
      - uid: obs015-pvc-unbound-failure
        title: PersistentVolumeClaim unbound or failed
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          # TWO CAUSES, and the text must not assert one of them. `noDataState`
          # below is `Alerting`, which is the right default for a metric that
          # must never go quiet — but it means this rule fires both when a PVC
          # is genuinely unbound AND when the watcher stops reporting. Reading
          # only the first into the summary is what let #1377 run for a day and
          # a half: the alert said "a storage backend outage is preventing
          # provisioning" while every PVC in both clusters was Bound and the
          # real fault was a query that could not parse its own input.
          summary: >-
            Either a PersistentVolumeClaim in namespace kubelab is not 'Bound',
            or the disk-watcher stopped reporting — this rule alerts on no data too.
            Check `kubectl get pvc -n kubelab` first: if every claim is Bound, the fault
            is in the watcher or the query, not in storage.
          runbook_url: https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/backup-restore.md
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              # `by (namespace, pvc)` is load-bearing, not tidying (OBS-018).
              # disk-watcher is a CronJob: every 15m run is a NEW pod, and
              # Vector labels every Loki stream with `pod`. Without the
              # grouping, `unwrap` keys each series by (pod, pvc), so every
              # run starts a fresh series for the same PVC — the alert
              # instance for a genuinely unbound PVC goes stale and
              # false-Resolves after the 30m window, then a new instance
              # starts one step behind, forever. Grouping by identity the
              # PVC actually has survives the pod churn, so `for: 15m` means
              # what it says. Measured live in staging 2026-08-27: the
              # `ac2-drill-unbound` drill produced 4 simultaneous alerting
              # instances, one per CronJob pod, none older than 30 minutes.
              expr: >-
                last_over_time(
                  {container="disk-watcher"}
                    | json
                    | metric=`disk_pvc_health`
                    | unwrap healthy
                  [30m]
                ) by (namespace, pvc)
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              datasource:
                type: __expr__
                uid: __expr__

      - uid: obs015-disk-root-saturation
        title: Node root filesystem disk space critical (>90%)
        condition: C
        for: 15m
        # `Alerting`, matching the sibling rule above, and for the same reason it
        # gives: a metric that must never go quiet cannot treat silence as health.
        #
        # This said `OK` until 2026-09-05, and the asymmetry was invisible because
        # both rules read the SAME stream: if `disk-watcher` stops, the PVC rule
        # above goes red and this one goes green, from one cause. So the node
        # whose disk is unwatched is exactly the node that looks fine.
        #
        # Found reviewing OPS-024, which planned to feed node-level producers into
        # this rule — the plan would have added five nodes to a rule that reports
        # health when nobody is reporting. Not hypothetical: #1377 is the same
        # rule family firing on a stopped watcher for a day and a half, which is
        # also the evidence that `Alerting` DOES fire on no-data here.
        #
        # NOTE for OPS-024: the on-demand nodes (ADR-028 — beelink, rpi4, ace2,
        # jetson) are off by design, so when a producer for them exists this rule
        # cannot be the one that watches them; silence is their normal state.
        # Today the only producer is the in-cluster CronJob on always-on nodes,
        # which is why `Alerting` is correct NOW and why adding those nodes here
        # later would be wrong.
        noDataState: Alerting
        execErrState: Error
        annotations:
          # TWO CAUSES, and the summary must not assert one of them. #1377 cost a
          # day and a half on the rule above by naming only the interesting cause,
          # so the responder chased a storage fault while the real fault was the
          # watcher. The cheap check goes first, in the text, not in a runbook.
          summary: >-
            Either a node's root filesystem crossed 90%, or the disk-watcher stopped reporting —
            this rule alerts on no data too. Check `kubectl get cronjob disk-watcher -n kubelab`
            first: if it is suspended, failing, or its last run is older than 30m, the fault is the
            watcher and no node is being measured at all.
          runbook_url: https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/runbook-notifications-and-alerting.md
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              # Same per-pod-churn class as obs015-pvc-unbound-failure above,
              # grouped by the identity this metric actually carries: `node`,
              # not `pod` (OBS-018 AC5).
              expr: >-
                last_over_time(
                  {container="disk-watcher"}
                    | json
                    | metric=`disk_root_usage`
                    | unwrap used_pct
                  [30m]
                ) by (node)
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
              datasource:
                type: __expr__
                uid: __expr__
