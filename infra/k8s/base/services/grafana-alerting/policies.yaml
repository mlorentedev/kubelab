# Grafana alerting — the root notification policy (OBS-007).
#
# THIS IS THE PER-ENVIRONMENT FILE. The prod overlay ships its own copy selecting
# `apprise-page`; this base copy is the staging value, following the repo idiom of
# base-carries-staging + overlay-patches (see the authelia-config generator).
#
# Keep this file minimal. Everything that is genuinely shared — the contact
# points and the message body — lives in the sibling files precisely so that the
# duplicated-across-environments surface stays this small.
#
# Grafana ships a default root policy whose receiver is the literal string
# `empty`, so without this file alerts are evaluated and then discarded. That is
# not a hypothetical: `empty` is what was measured in staging on 2026-08-10.
---
apiVersion: 1

policies:
  - orgId: 1
    # staging -> archive channel. Staging is on-demand and non-critical, so it
    # alerts without interrupting (ADR-044 tiers; decided in the spec 2026-08-09).
    receiver: apprise-log
    group_by:
      - grafana_folder
      - alertname
    # Batch the first notification briefly so a burst of related ACME failures
    # arrives as one message rather than one per domain.
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # TOOL-093 (#1957): tell the PR's author as well as the operator.
      #
      # THE FIRST ROUTE IS THE ROOT'S OWN RECEIVER AGAIN, ON PURPOSE. In an
      # Alertmanager tree the root's receiver is only the fallback for an alert no child
      # matches: `continue` on the second route lets the walk reach further SIBLINGS, it
      # does not also notify the parent. Without this entry the failure alert would stop
      # reaching the operator the day the route below is added. Measured on grafana-oss
      # 13.0.2 on 2026-10-18: with only the second route, the alert reached n8n and the
      # tier's receiver got nothing. `tests/test_forge_review_failed_route.py` walks the
      # rendered tree and fails if either receiver goes missing.
      #
      # Matched by alertname, which Grafana sets to the rule's title; the test derives the
      # title from the rule, so a rename cannot orphan the routes. The rule stays firing
      # for its 15 minute window, so the long repeat keeps one failure from being two
      # comments.
      - receiver: apprise-log
        object_matchers:
          - ["alertname", "=", "Forge reviewer failed to review a pull request"]
        continue: true
      - receiver: forge-review-failed
        object_matchers:
          - ["alertname", "=", "Forge reviewer failed to review a pull request"]
        repeat_interval: 24h
