# Grafana alerting — CrowdSec threat detection & IP ban surge rules (OBS-015).
#
# Reads security decision and bouncer logs from `crowdsec` (services/crowdsec.yaml).
# Alerts on automated perimeter defenses blocking malicious actors.
---
apiVersion: 1

groups:
  - orgId: 1
    name: security
    folder: kubelab
    interval: 5m
    rules:
      - uid: obs015-crowdsec-ban-surge
        title: CrowdSec automated perimeter IP ban surge
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: >-
            CrowdSec perimeter bouncer triggered elevated IP ban decisions (>5 bans in 10m).
            Active port scan, brute force, or L7 exploit attempt mitigated on ingress.
          runbook_url: https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/runbook-notifications-and-alerting.md
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              expr: >-
                sum(
                  count_over_time(
                    {container="crowdsec"}
                      |~ "(?i)(ban|decision|blocked|remediation)"
                    [10m]
                  )
                )
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
              datasource:
                type: __expr__
                uid: __expr__
