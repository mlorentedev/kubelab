# Grafana alerting — Cloudflare R2 backup integrity and fleet coverage rules (OBS-015).
#
# Reads structured JSON log lines from `r2-backup-watcher` (services/r2-backup-watcher.yaml).
# Runs in both environments from the shared base; the root notification policy
# decides which Apprise tier it reaches (prod pages, staging archives).
---
apiVersion: 1

groups:
  - orgId: 1
    name: backup
    folder: kubelab
    interval: 10m
    rules:
      - uid: obs015-r2-backup-health
        title: Cloudflare R2 backup integrity or coverage failure
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            Cloudflare R2 backup integrity verification or fleet snapshot coverage
            check failed. One or more nodes may be unprotected or the destination bucket unreachable.
          runbook_url: https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/backup-restore.md
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              # `by (namespace)` (OBS-018 AC5): r2-backup-watcher is a CronJob
              # too, so the same per-pod series churn applies — lower stakes
              # here since the 24h window dwarfs `for: 10m`, but duplicate
              # instances (one per run) is still the wrong shape.
              expr: >-
                last_over_time(
                  {container="r2-backup-watcher"}
                    | json
                    | metric=`r2_backup_health`
                    | unwrap healthy
                  [24h]
                ) by (namespace)
          - refId: B
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              datasource:
                type: __expr__
                uid: __expr__
