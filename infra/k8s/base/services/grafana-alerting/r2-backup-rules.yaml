# Grafana alerting — Cloudflare R2 backup integrity and fleet coverage rules (OBS-015).
#
# Reads structured JSON log lines from `r2-backup-watcher` (services/r2-backup-watcher.yaml).
# Runs in both environments from the shared base; the root notification policy
# decides which Apprise tier it reaches (prod pages, staging archives).
---
apiVersion: 1

groups:
  - orgId: 1
    name: backup
    folder: kubelab
    interval: 10m
    rules:
      - uid: obs015-r2-backup-health
        title: Cloudflare R2 backup integrity or coverage failure
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            The R2 backup watcher reports a node whose repository is unreadable, empty,
            missing a declared source or missing the capture sentinel, or it stopped
            reporting, since this rule alerts on no data too. Read the watcher's
            `r2_backup_node` lines first (`toolkit obs logs`): they name the node and the
            reason. No lines at all means coverage is unknown, not that it is good.
          runbook_url: https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/offsite-backup-restore.md#r2-backup-alert
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              # `by (namespace)` (OBS-018 AC5): r2-backup-watcher is a CronJob
              # too, so the same per-pod series churn applies — lower stakes
              # here since the 24h window dwarfs `for: 10m`, but duplicate
              # instances (one per run) is still the wrong shape.
              expr: >-
                last_over_time(
                  {container="r2-backup-watcher"}
                    | json
                    | metric=`r2_backup_health`
                    | unwrap healthy
                  [24h]
                ) by (namespace)
          - refId: B
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              datasource:
                type: __expr__
                uid: __expr__
      - uid: backup057-r2-backup-size
        title: Cloudflare R2 backups near the free tier
        condition: C
        for: 10m
        # An unknown size is dropped by `unwrap` (it prints `null`), so a day
        # without one is no data, and that pages: an unmeasured fleet is when an
        # overflow would go unseen. tests/test_alerting_no_data_is_not_health.py
        # requires it of every rule over a CronJob stream.
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            The node repositories in R2 hold more than 80% of the free tier's storage,
            or the watcher has reported no size for a day. R2 bills overage with no hard
            stop, and the bucket lock (BACKUP-057) keeps data for its retention window
            whatever `forget` decides. Read the watcher's `r2_backup_node` lines: each
            carries its node's `raw_bytes`, and `null` means that node's `stats` failed.
          runbook_url: https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/offsite-backup-restore.md#r2-backup-alert
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              # The fleet line: its sum is null unless every node was sized, so a
              # partial run never reads as a smaller fleet.
              expr: >-
                last_over_time(
                  {container="r2-backup-watcher"}
                    | json
                    | metric=`r2_backup_health`
                    | unwrap raw_bytes
                  [24h]
                ) by (namespace)
          - refId: B
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    # 80% of backup.r2.free_tier_bytes in common.yaml.
                    params: [8000000000]
              datasource:
                type: __expr__
                uid: __expr__
