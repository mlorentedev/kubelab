# Grafana alerting — Cloudflare R2 backup integrity and fleet coverage rules (OBS-015).
#
# Reads structured JSON log lines from `r2-backup-watcher` (services/r2-backup-watcher.yaml).
# Runs in both environments from the shared base; the root notification policy
# decides which Apprise tier it reaches (prod pages, staging archives).
---
apiVersion: 1

groups:
  - orgId: 1
    name: backup
    folder: kubelab
    interval: 10m
    rules:
      - uid: obs015-r2-backup-health
        title: Cloudflare R2 backup integrity or coverage failure
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            The R2 backup watcher reports a node whose repository is unreadable, empty,
            missing a declared source or missing the capture sentinel, or it stopped
            reporting, since this rule alerts on no data too. Read the watcher's
            `r2_backup_node` lines first (`toolkit obs logs`): they name the node and the
            reason. No lines at all means coverage is unknown, not that it is good.
          runbook_url: https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/offsite-backup-restore.md#r2-backup-alert
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              # `by (namespace)` (OBS-018 AC5): r2-backup-watcher is a CronJob
              # too, so the same per-pod series churn applies — lower stakes
              # here since the 24h window dwarfs `for: 10m`, but duplicate
              # instances (one per run) is still the wrong shape.
              expr: >-
                last_over_time(
                  {container="r2-backup-watcher"}
                    | json
                    | metric=`r2_backup_health`
                    | unwrap healthy
                  [24h]
                ) by (namespace)
          - refId: B
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              datasource:
                type: __expr__
                uid: __expr__
      - uid: backup057-r2-backup-size
        title: Cloudflare R2 backups near the free tier
        condition: C
        for: 10m
        # An unknown size is dropped by `unwrap` (it prints `null`), so a day
        # without one is no data, and that pages: an unmeasured fleet is when an
        # overflow would go unseen. tests/test_alerting_no_data_is_not_health.py
        # requires it of every rule over a CronJob stream.
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            The backup buckets in R2 hold more than 80% of the free tier's storage, or the
            watcher has reported no size for a day. R2 bills overage with no hard stop, and
            the bucket lock (BACKUP-057) keeps data for its retention window whatever
            `forget` decides. The fleet line's `stored_bytes` is every backup bucket listed
            at its root; each `r2_backup_node` line carries its node's prefix. `null` means
            a listing failed: the reason is in the init container's stream,
            `{container="r2-size"}`.
          runbook_url: https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/offsite-backup-restore.md#cost-and-quota
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              # The fleet line: the sum of every bucket the watcher names, listed at
              # its root (BACKUP-075), null unless every bucket was measured, so a
              # partial run never reads as a smaller bill.
              expr: >-
                last_over_time(
                  {container="r2-backup-watcher"}
                    | json
                    | metric=`r2_backup_health`
                    | unwrap stored_bytes
                  [24h]
                ) by (namespace)
          - refId: B
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    # 80% of backup.r2.free_tier_bytes in common.yaml.
                    params: [8000000000]
              datasource:
                type: __expr__
                uid: __expr__
      # BACKUP-032: an on-demand node that is up and has stopped shipping. Its
      # failure hook needs the ship to run, and its Uptime Kuma heartbeat is
      # muted for the `on-demand` tag, so a ship that never starts paged nobody.
      # The age is multiplied by `reachable`, never filtered on it: a node that
      # is off answers 0, so "every on-demand node off" is a value and not "no
      # data". Evaluated against fixture lines from the real probe by
      # tests/test_r2_backup_freshness_rule.py.
      - uid: backup032-on-demand-freshness
        title: On-demand node is up and its R2 backup is stale
        condition: C
        # Longer than the watcher's 6 h schedule, so two consecutive probes must
        # agree: one stale line is a node that booted moments before the probe.
        for: 7h
        # No data has two causes: the watcher stopped (the health rule pages for
        # that too, so expect both), or no node in targets.txt is on-demand.
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            An on-demand node answered the watcher on two consecutive probes and its newest
            snapshot in R2 is older than 3 hours, three times its hourly schedule: it is up and
            not shipping. If every node is quiet and this still fires, it is "no data": the
            watcher stopped, or no node is on-demand, and the health rule is paging too.
          runbook_url: >-
            https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/offsite-backup-restore.md#on-demand-backup-stale
        data:
          - refId: A
            relativeTimeRange:
              from: 25200
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              # Per node: age x reachable. `class` is emitted by the probe from
              # targets.txt; both operands must select the same nodes.
              # The probe's `node` is extracted as `backup_node`: Vector already
              # sets a `node` stream label (the K8s node the Job ran on), so a
              # plain `| json` renames the probe's field and `by (node)` would
              # fold every backup node into one series (lesson-512).
              expr: >-
                last_over_time(
                  {container="r2-backup-watcher"}
                    | json backup_node="node", metric="metric", class="class", snapshot_age_seconds="snapshot_age_seconds"
                    | metric=`r2_backup_node`
                    | class=`on-demand`
                    | unwrap snapshot_age_seconds
                  [7h]
                ) by (backup_node)
                *
                last_over_time(
                  {container="r2-backup-watcher"}
                    | json backup_node="node", metric="metric", class="class", reachable="reachable"
                    | metric=`r2_backup_node`
                    | class=`on-demand`
                    | unwrap reachable
                  [7h]
                ) by (backup_node)
          - refId: B
            relativeTimeRange:
              from: 25200
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 25200
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    # 3 x node_backup_interval (1 h), in seconds.
                    params: [10800]
              datasource:
                type: __expr__
                uid: __expr__
      # BACKUP-032: a node's repository lost more than half its size between two
      # probes (operator decision, 2026-10-02). A prune that removed real data, or
      # a source that started capturing an empty directory. The size is never a
      # health check in the probe, so this judgement lives here.
      - uid: backup032-r2-backup-shrink
        title: A node's R2 backup shrank by more than half
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            A node's repository in R2 is less than half the size it was one probe earlier.
            Check the node's newest snapshot holds every source and its data, not just the
            directories, before the next `forget` removes the older ones. The alert resolves
            by itself once the earlier probe leaves the 9 h window: read it, do not wait it out.
            Or the watcher stopped and there is no data: with no node lines at all, start
            with the health rule's runbook.
          runbook_url: https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/offsite-backup-restore.md#r2-backup-shrank
        data:
          - refId: A
            relativeTimeRange:
              from: 32400
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              # 9 h holds the current probe and the one before it (6 h apart).
              # A `null` size is dropped by `unwrap`, so a failed listing keeps the
              # last known size instead of reading as a drop. The size counts
              # every object under the node's prefix, so a daily prune lowers it a
              # little; with 30-day retention that is far from half. `backup_node`, not
              # `node`: see the freshness rule above (lesson-512).
              expr: >-
                last_over_time(
                  {container="r2-backup-watcher"}
                    | json backup_node="node", metric="metric", stored_bytes="stored_bytes"
                    | metric=`r2_backup_node`
                    | unwrap stored_bytes
                  [9h]
                ) by (backup_node)
                /
                first_over_time(
                  {container="r2-backup-watcher"}
                    | json backup_node="node", metric="metric", stored_bytes="stored_bytes"
                    | metric=`r2_backup_node`
                    | unwrap stored_bytes
                  [9h]
                ) by (backup_node)
          - refId: B
            relativeTimeRange:
              from: 32400
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 32400
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [0.5]
              datasource:
                type: __expr__
                uid: __expr__
