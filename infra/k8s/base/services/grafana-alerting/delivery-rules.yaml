# Grafana alerting — Argo CD did not apply master HEAD (GITOPS-003 AC2, #2645).
#
# Reads the `argo_delivery` lines of `delivery-watcher` (services/delivery-watcher.yaml).
# Runs in both environments from the shared base; the root notification policy
# decides which Apprise tier it reaches (prod pages, staging archives). A red
# staging line can mean the staging Application is repointed at a feature
# branch, or the homelab was off: master HEAD then has no staging status.
---
apiVersion: 1

groups:
  - orgId: 1
    name: delivery
    folder: kubelab
    interval: 5m
    rules:
      - uid: gitops003-argo-delivery
        title: Argo CD has not applied master HEAD
        condition: C
        # Two consecutive runs of the 10-minute watcher must agree: `last_over_time`
        # holds one run's line until the next replaces it.
        for: 10m
        # A GitHub that could not be asked prints no `healthy` (watch.py), and so
        # does a watcher that stopped. Both are no data, and both must page.
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            master HEAD has a failed `argocd/kubelab-<env>` status, or has had no `success`
            for more than 10 minutes after it landed, or the watcher has printed no verdict
            for 30 minutes. The watcher's line (`toolkit obs logs`, container
            `delivery-watcher`) names the commit, its age and the status; a line with a
            `reason` and no `healthy` means GitHub could not be asked.
          runbook_url: >-
            https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/gitops-delivery-promotion.md#deploy-verify-is-red
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              # `by (namespace)` (OBS-018 AC5): a CronJob makes a new pod per run.
              expr: >-
                last_over_time(
                  {container="delivery-watcher"}
                    | json
                    | metric=`argo_delivery`
                    | unwrap healthy
                  [30m]
                ) by (namespace)
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              datasource:
                type: __expr__
                uid: __expr__
