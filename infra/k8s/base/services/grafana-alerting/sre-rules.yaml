# Grafana alerting — SRE Watchdog Heartbeat & Synthetic Health Rules (OBS-015).
#
# 1. Dead Man's Switch (Watchdog): continuously evaluates Loki log ingestion
#    and Vector pipeline activity. If the evaluation pipeline dies or is silenced,
#    noDataState: Alerting converts silence into an immediate alert.
# 2. TLS Certificate Expiry: early warning alert if certificates or ACME renewals
#    are failing within 14 days of expiration.
---
apiVersion: 1

groups:
  - orgId: 1
    name: sre-watchdog
    folder: kubelab
    interval: 5m
    rules:
      - uid: obs015-deadmansswitch-heartbeat
        title: SRE Dead Man's Switch Watchdog Heartbeat
        condition: C
        for: 0s
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            Continuous SRE watchdog heartbeat signal. If this signal goes silent or ceases evaluation,
            the cluster observability pipeline or network reachability is compromised.
          runbook_url: https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/runbook-notifications-and-alerting.md
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              expr: >-
                sum(count_over_time({namespace="kubelab"}[10m]))
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              datasource:
                type: __expr__
                uid: __expr__

      - uid: obs015-tls-early-warning
        title: TLS certificate renewal failure or expiration imminent
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: >-
            Traefik ingress reported repeated ACME certificate renewal failures or TLS validation errors.
            Action is required to prevent public endpoint TLS outages.
          runbook_url: https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/acme-alerting.md
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              expr: >-
                sum by (domain) (
                  count_over_time(
                    {container="traefik"}
                      |~ "(?i)certificate.*(expir|renew|fail|error)"
                      | regexp `domains=(?:\x1b\[[0-9;]*m)*\["(?P<domain>[^"]+)"`
                    [10m]
                  )
                )
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__
