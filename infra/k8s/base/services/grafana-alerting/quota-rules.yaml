# Grafana alerting — the namespace quota utilization rules (OBS-010).
#
# Own file, own group, deliberately separate from rules.yaml's `certificates`
# group (OBS-007) — different concern, and this way the two specs never touch
# the same file. Runs in both environments from the shared base, exactly like
# rules.yaml; the root notification policy decides which Apprise tier it
# reaches (prod pages, staging archives), reusing the fabric #799 already
# built rather than adding a second one.
#
# Reads structured JSON log lines from `quota-watcher` (services/quota-watcher.yaml),
# which queries the live kubelab ResourceQuota (IDP-031/#811) every 5 minutes
# since this repo's observability stack has no metrics datasource (ADR-028 is
# Loki-only) to scrape it from directly.
---
apiVersion: 1

groups:
  - orgId: 1
    name: quota
    folder: kubelab
    # Matches quota-watcher's own schedule exactly — see that manifest's
    # comment. A single sample every 5 minutes, evaluated every 5 minutes,
    # against a 10-minute LogQL window, so a breach is seen by two
    # consecutive evaluations and `for: 5m` can be satisfied without
    # depending on the scrape landing inside one window (same shape as the
    # ACME rule in rules.yaml).
    interval: 5m
    rules:
      - uid: obs010-quota-requests
        title: Namespace quota utilization high (requests.memory)
        condition: C
        # IDP-031's measured surge (full staging deploy + rollout restart,
        # 2026-08-12) peaked well under a minute. `for: 5m` cannot be
        # satisfied by anything that short — see proposal.md → Risks for the
        # full measurement this bound is derived from, and
        # test_rules_persist_through_a_routine_surge for the assertion.
        for: 5m
        # INVERTED from the ACME rule on purpose: there, no matching log
        # lines means certificates are fine. Here, no matching log lines
        # means quota-watcher itself stopped running — RBAC broken, CronJob
        # failing, API unreachable — and the quota could be at 100% with
        # nobody told. Silence must alert, not go quiet.
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            kubelab namespace requests.memory utilization crossed 80% of its
            ResourceQuota ceiling (IDP-031/#811). Deploys are still
            succeeding, but the room to grow the namespace without hitting
            admission rejection is shrinking.
          runbook_url: https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/quota-alerting.md
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              expr: >-
                last_over_time(
                  {container="quota-watcher"}
                    | json
                    | dimension=`requests.memory`
                    | unwrap pct
                  [10m]
                )
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
              datasource:
                type: __expr__
                uid: __expr__

      - uid: obs010-quota-limits
        title: Namespace quota utilization high (limits.memory)
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            kubelab namespace limits.memory utilization crossed 80% of its
            ResourceQuota ceiling (IDP-031/#811) — the load-bearing dimension,
            5.7% headroom by design. Deploys are still succeeding, but the
            room to grow the namespace without hitting admission rejection is
            shrinking.
          runbook_url: https://github.com/mlorentedev/kubelab/blob/master/docs/runbooks/quota-alerting.md
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              expr: >-
                last_over_time(
                  {container="quota-watcher"}
                    | json
                    | dimension=`limits.memory`
                    | unwrap pct
                  [10m]
                )
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
              datasource:
                type: __expr__
                uid: __expr__
