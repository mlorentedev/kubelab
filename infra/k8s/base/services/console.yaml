# The forge console (CONSOLE-004): its own host, guarded whole by Authelia, served by
# the api binary. The host is `infra.forge.console_domain` in common.yaml (staging
# override in staging.yaml); the prod domain is patched in overlays/prod/patches.yaml.
# The api answers /console only for this host, so the public api host never serves it.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: console
  namespace: kubelab
  labels:
    app.kubernetes.io/name: console
    app.kubernetes.io/part-of: kubelab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`console.staging.kubelab.live`)
      kind: Rule
      middlewares:
        - name: secure-headers
        - name: rate-limit
        - name: error-pages
        - name: authelia
      services:
        - name: api
          port: 8080
  tls:
    certResolver: letsencrypt
