---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: kubelab
  labels:
    app.kubernetes.io/name: vikunja
    app.kubernetes.io/component: core
    app.kubernetes.io/part-of: kubelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vikunja
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vikunja
        app.kubernetes.io/component: core
        app.kubernetes.io/part-of: kubelab
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -w 2 postgres 5432; do echo "waiting for postgres..."; sleep 2; done;']
      volumes:
        # 1.0.0's image runs non-root and /app/vikunja is not writable by it.
        # Originally added when local storage crash-looped the pod on boot
        # (mkdir /app/vikunja/files: permission denied) with files.type still
        # defaulting to "local" -- see ADR-066 amendment for how that happened.
        # Kept as a safety net even with files.type=s3: files.s3.tempdir
        # defaults under files.basepath, and it is unverified whether s3 mode
        # ever touches this path (e.g. for streaming uploads).
        - name: vikunja-files
          emptyDir: {}
      containers:
        - name: vikunja
          image: vikunja/vikunja:1.0.0
          ports:
            - name: http
              containerPort: 3456
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vikunja-config
            - secretRef:
                name: vikunja-secrets
          volumeMounts:
            - name: vikunja-files
              mountPath: /app/vikunja/files
          livenessProbe:
            httpGet:
              path: /api/v1/info
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/info
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 128Mi
              cpu: "0.1"
            limits:
              memory: 256Mi
              cpu: "0.5"
---
apiVersion: v1
kind: Service
metadata:
  name: vikunja
  namespace: kubelab
  labels:
    app.kubernetes.io/name: vikunja
    app.kubernetes.io/component: core
    app.kubernetes.io/part-of: kubelab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vikunja
  ports:
    - name: http
      port: 3456
      targetPort: http
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vikunja
  namespace: kubelab
  labels:
    app.kubernetes.io/name: vikunja
    app.kubernetes.io/component: core
    app.kubernetes.io/part-of: kubelab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tasks.staging.kubelab.live`)
      kind: Rule
      middlewares:
        - name: secure-headers
        - name: rate-limit
        - name: crowdsec-bouncer
      services:
        - name: vikunja
          port: 3456
  tls:
    certResolver: letsencrypt
