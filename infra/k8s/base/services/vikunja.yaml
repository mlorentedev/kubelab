---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vikunja-config
  namespace: kubelab
  labels:
    app.kubernetes.io/name: vikunja
    app.kubernetes.io/component: core
    app.kubernetes.io/part-of: kubelab
data:
  VIKUNJA_SERVICE_PUBLICURL: "https://tasks.staging.kubelab.live/"
  VIKUNJA_DATABASE_TYPE: "postgres"
  VIKUNJA_DATABASE_HOST: "postgres"
  VIKUNJA_DATABASE_PORT: "5432"
  VIKUNJA_DATABASE_USER: "vikunja"
  VIKUNJA_DATABASE_DATABASE: "vikunja"
  VIKUNJA_DATABASE_MAXOPENCONNECTIONS: "20"
  VIKUNJA_DATABASE_MAXIDLECONNECTIONS: "5"
  # Disabled until real R2 credentials exist in SOPS (TOOL-050 item 2, #1492) --
  # 1.0.0 validates file-storage connectivity at startup and crash-loops on a
  # misconfigured/unreachable backend, so enabling this without real keys is
  # worse than the 0.24.6 behavior of silently failing individual uploads.
  VIKUNJA_FILES_S3_ENABLED: "false"
  VIKUNJA_FILES_S3_ENDPOINT: "https://r2.cloudflarestorage.com"
  VIKUNJA_FILES_S3_BUCKET: "kubelab-vikunja"
  VIKUNJA_FILES_S3_REGION: "auto"
  VIKUNJA_AUTH_OPENID_ENABLED: "true"
  VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHELIA_NAME: "Authelia"
  VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHELIA_AUTHURL: "https://auth.staging.kubelab.live"
  VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHELIA_CLIENTID: "vikunja-oidc"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: kubelab
  labels:
    app.kubernetes.io/name: vikunja
    app.kubernetes.io/component: core
    app.kubernetes.io/part-of: kubelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vikunja
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vikunja
        app.kubernetes.io/component: core
        app.kubernetes.io/part-of: kubelab
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -w 2 postgres 5432; do echo "waiting for postgres..."; sleep 2; done;']
      volumes:
        - name: openid-config
          configMap:
            name: vikunja-openid-config
        # 1.0.0's image runs non-root and /app/vikunja is not writable by it, so
        # local-storage fallback (VIKUNJA_FILES_S3_ENABLED=false, above) needs an
        # explicit writable mount or the pod crash-loops on boot. Ephemeral by
        # design: this only matters while S3 is disabled pending real R2
        # credentials (TOOL-050 item 2, #1492) -- once R2 is enabled, uploads
        # never touch local disk and this volume goes unused.
        - name: vikunja-files
          emptyDir: {}
      containers:
        - name: vikunja
          image: vikunja/vikunja:1.0.0
          ports:
            - name: http
              containerPort: 3456
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vikunja-config
            - secretRef:
                name: vikunja-secrets
          volumeMounts:
            - name: openid-config
              mountPath: /etc/vikunja/config.yml
              subPath: config.yml
              readOnly: true
            - name: vikunja-files
              mountPath: /app/vikunja/files
          livenessProbe:
            httpGet:
              path: /api/v1/info
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/info
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 128Mi
              cpu: "0.1"
            limits:
              memory: 256Mi
              cpu: "0.5"
---
apiVersion: v1
kind: Service
metadata:
  name: vikunja
  namespace: kubelab
  labels:
    app.kubernetes.io/name: vikunja
    app.kubernetes.io/component: core
    app.kubernetes.io/part-of: kubelab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vikunja
  ports:
    - name: http
      port: 3456
      targetPort: http
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vikunja
  namespace: kubelab
  labels:
    app.kubernetes.io/name: vikunja
    app.kubernetes.io/component: core
    app.kubernetes.io/part-of: kubelab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tasks.staging.kubelab.live`)
      kind: Rule
      middlewares:
        - name: secure-headers
        - name: rate-limit
        - name: crowdsec-bouncer
      services:
        - name: vikunja
          port: 3456
  tls:
    certResolver: letsencrypt
