---
# OPS-054: the only change `make load-test` makes to the cluster, and the way it
# measures the platform instead of SEC-004's limiter (30/s, burst 150, per host).
#
# Outside infra/k8s, deliberately: no overlay can pick it up, and the blanket check
# in tests/test_rate_limit_coverage.py covers what can reach a cluster through one.
# The run applies this file, measures, and
# deletes it, so between runs every route carries `rate-limit` and the invariant in
# tests/infra/test_rate_limit.py holds with no exception. Argo CD never tracks it,
# so master moving during a run does not touch it. The shared Middleware is not
# edited: every request without the header below keeps going through the limiter.
#
# Same hosts as the real routes, so no new DNS name or certificate. Same chain as
# the real routes minus `rate-limit`. The header's value is not a secret, but it is
# not reusable either (#3012): `arm()` draws a fresh one per run, renders it over the
# placeholder below and applies the result from stdin, and nothing records it. A
# route a dead run leaves behind therefore bypasses nothing anyone can send, and the
# next run's apply replaces it. tests/infra/test_rate_limit.py still fails on a
# leftover, and `make load-test-clear ENV=staging` removes it.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: load-test
  namespace: kubelab
  labels:
    app.kubernetes.io/name: load-test
    app.kubernetes.io/part-of: kubelab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.staging.kubelab.live`) && Path(`/health`) && Header(`X-Load-Test`, `__LOAD_TEST_BYPASS_VALUE__`)
      kind: Rule
      priority: 1000
      services:
        - name: api
          port: 8080
      middlewares:
        - name: secure-headers
        - name: error-pages
    - match: Host(`staging.mlorente.dev`) && Path(`/`) && Header(`X-Load-Test`, `__LOAD_TEST_BYPASS_VALUE__`)
      kind: Rule
      priority: 1000
      services:
        - name: web
          port: 8080
      middlewares:
        - name: secure-headers
        - name: error-pages
  tls:
    certResolver: letsencrypt
