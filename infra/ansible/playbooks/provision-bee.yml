---
# =============================================================================
# Beelink Provisioning — On-Demand Platform Node (ADR-028)
#
# Deploys: base system, SSH hardening, Docker, Tailscale,
# then MinIO (object storage) + GitHub Actions Runner + Glances.
# Removes legacy bare-metal Ollama (retired outright by AI-007; the idempotent
# cleanup stays to guard a re-imaged node).
#
# Usage:
#   make provision NODE=bee ENV=staging
#   toolkit infra ansible run -p provision-bee -e staging
#   toolkit infra ansible run -p provision-bee -e staging --tags services
#
# First run (before Tailscale): use BOOTSTRAP=1 to auto-use LAN IP
#   make provision NODE=bee ENV=staging BOOTSTRAP=1
# =============================================================================

# ---------------------------------------------------------------------------
# Play 0: Pre-flight validation
# ---------------------------------------------------------------------------
- name: "Pre-flight: validate Beelink connectivity"
  hosts: beelink
  gather_facts: false
  become: false
  tags: [always]   # Pre-flight checks must run regardless of --tags filter
  tasks:
    - name: Verify SSH + Python connectivity
      ansible.builtin.ping:

    - name: Verify become (sudo) works
      command: sudo -n true
      become: true
      changed_when: false

    - name: Verify SSH private key exists on controller
      stat:
        path: "{{ _ssh_key_path }}"
      delegate_to: localhost
      register: _ssh_key
      failed_when: not _ssh_key.stat.exists
      vars:
        _ssh_key_path: "{{ ansible_ssh_private_key_file | default('~/.ssh/id_ed25519') }}"

    - name: Verify target connectivity (IP is fatal, DNS may be repairable)
      ansible.builtin.include_tasks: _includes/check-internet.yml

    - name: Pre-flight VPS reachability check (SSOT-shared)
      ansible.builtin.include_tasks: _includes/check-vps-reachable.yml

# ---------------------------------------------------------------------------
# Play 1: Full provisioning
# ---------------------------------------------------------------------------
- name: Provision Beelink — On-demand platform node
  hosts: beelink
  become: true
  gather_facts: true

  vars:
    deploy_env: staging
    # Gitea is a singleton whose identity is PROD's, even though this node is
    # provisioned under staging (ADR-061: the axes are independent — "prod is an
    # environment, not a location"). It keeps prod's domain, so prod Authelia
    # validates its OIDC client against a hash derived from *prod's* client
    # secret; rendering it with staging's would break SSO after deploy, at login,
    # with nothing in the deploy output pointing at the cause. The two values are
    # confirmed different, so this is not a distinction without a difference.
    #
    # Deliberately NOT solved by moving Gitea's secrets to common.enc.yaml, which
    # is how the Argo CD hub singleton does it: `secrets hash` resolves only
    # {env}.enc.yaml and MINTS A NEW CLIENT SECRET when the source is missing.
    # The hub survives that because its specs are kind=HUB_MANAGED and the hash
    # loop skips them; Gitea's are ARGON2_HASH and would not be skipped. See #1057.
    #
    # This governs BOTH vaults and values. Secrets are the obvious half; the
    # values half is not, and was caught only by reading a live response: staging.yaml
    # overrides gitea.domain, so resolving it from `config` handed Gitea
    # gitea.staging.kubelab.live as its ROOT_URL on the node that is supposed to be
    # serving the prod name. Once a service stops belonging to its node's
    # environment, every per-environment resolution is suspect, not just the vault.
    gitea_identity_env: prod

  pre_tasks:
    - name: Load base config (SSOT)
      include_vars:
        file: "{{ playbook_dir }}/../../config/values/common.yaml"
        name: common
      tags: [always]

    - name: Load environment overrides
      include_vars:
        file: "{{ playbook_dir }}/../../config/values/{{ deploy_env }}.yaml"
        name: env_overrides
      tags: [always]

    - name: Merge configs (env overrides win)
      set_fact:
        config: "{{ common | combine(env_overrides, recursive=True) }}"
      tags: [always]

    - name: Decrypt common secrets (controller-side)
      command: sops -d {{ playbook_dir }}/../../config/secrets/common.enc.yaml
      register: sops_common
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      no_log: true
      tags: [always]   # secrets must load for any tag selection (e.g. --tags runner)

    - name: Decrypt env secrets (controller-side)
      command: sops -d {{ playbook_dir }}/../../config/secrets/{{ deploy_env }}.enc.yaml
      register: sops_env
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      no_log: true
      tags: [always]   # secrets must load for any tag selection (e.g. --tags runner)

    - name: Merge secrets (env overrides common)
      set_fact:
        secrets: "{{ (sops_common.stdout | from_yaml) | combine(sops_env.stdout | from_yaml, recursive=True) }}"
      no_log: true
      tags: [always]   # secrets must load for any tag selection (e.g. --tags runner)

    # Separate vault AND values tree for the one service on this node whose
    # environment identity is not deploy_env. Built into their own facts rather
    # than merged over `config`/`secrets`, so they cannot silently change what
    # MinIO or the runner resolve.
    - name: Load Gitea's environment overrides (SSOT)
      include_vars:
        file: "{{ playbook_dir }}/../../config/values/{{ gitea_identity_env }}.yaml"
        name: gitea_env_overrides
      tags: [always]

    - name: Merge Gitea config (its own env overrides common)
      set_fact:
        gitea_config: "{{ common | combine(gitea_env_overrides, recursive=True) }}"
      tags: [always]

    - name: Decrypt Gitea's environment secrets (controller-side)
      command: sops -d {{ playbook_dir }}/../../config/secrets/{{ gitea_identity_env }}.enc.yaml
      register: sops_gitea_env
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      no_log: true
      tags: [always]

    - name: Merge Gitea secrets (its own env overrides common)
      set_fact:
        gitea_secrets: "{{ (sops_common.stdout | from_yaml) | combine(sops_gitea_env.stdout | from_yaml, recursive=True) }}"
      no_log: true
      tags: [always]

    - name: Generate Headscale pre-auth key (via VPS)
      command: >
        docker exec headscale headscale preauthkeys create
        --user {{ config.apps.services.core.headscale.infra_user_id }} --reusable --expiration 1h
      delegate_to: kubelab-vps
      become: false
      changed_when: false
      register: _headscale_preauth
      tags: [tailscale]

    - name: Set Tailscale auth key fact
      set_fact:
        _tailscale_auth_key: "{{ _headscale_preauth.stdout | trim }}"
      no_log: true
      tags: [tailscale]

  roles:
    - role: ../roles/base_system
      tags: [base]
      vars:
        system_timezone: "{{ config.global.timezone }}"
        netplan_interface: "{{ config.networking.nodes.beelink.lan_interface }}"
        netplan_address: "{{ config.networking.nodes.beelink.lan_ip }}/24"
        netplan_gateway: "{{ config.networking.nodes.rpi4.lan_ip }}"
        firewall_tailnet_ports:
          - "{{ config.apps.services.data.minio.default_port_api }}"
          - "{{ config.apps.services.data.minio.default_port_console }}"
          - "{{ config.apps.services.observability.glances.default_port }}"
          - "{{ config.apps.services.core.gitea.default_port }}"
          - "{{ config.apps.services.core.gitea.ssh_port }}"

    - role: ../roles/ssh_hardening
      tags: [ssh]

    - role: ../roles/docker
      tags: [docker]

    - role: ../roles/dns_resilience
      tags: [dns, tailscale]
      vars:
        headscale_ip: "{{ config.networking.vps.public_ip }}"
        headscale_domain: "{{ config.apps.services.core.headscale.domain }}"

    - role: ../roles/tailscale
      tags: [tailscale]
      vars:
        tailscale_headscale_url: "https://{{ config.apps.services.core.headscale.domain }}"
        tailscale_accept_routes: false  # LAN node — must NOT accept subnet routes
        tailscale_auth_key: "{{ _tailscale_auth_key | default('') }}"

    - role: ../roles/beelink_services
      tags: [services, minio, runner, gitea]
      vars:
        restart_policy: "{{ config.global.restart_policy }}"
        tailscale_ip: "{{ config.networking.nodes.beelink.tailscale_ip }}"
        # Gitea (ADR-061 singleton). Every value below resolves through
        # gitea_config / gitea_secrets, never `config` / `secrets` — see the
        # gitea_identity_env note above for why the distinction is load-bearing
        # and not defensive noise.
        gitea_image: "{{ gitea_config.apps.services.core.gitea.image }}"
        gitea_domain: "{{ gitea_config.apps.services.core.gitea.domain }}"
        gitea_http_port: "{{ gitea_config.apps.services.core.gitea.default_port }}"
        gitea_ssh_port: "{{ gitea_config.apps.services.core.gitea.ssh_port }}"
        gitea_ssh_host: "{{ gitea_config.apps.services.core.gitea.ssh_host }}"
        # SEC-GITEA-001 (#1389). `health_path` has been declared in common.yaml
        # since the move and was read by NOTHING: the compose healthcheck
        # hardcoded /api/v1/version instead. That divergence was invisible while
        # both endpoints answered anonymously, and became a container-down the
        # moment REQUIRE_SIGNIN_VIEW closed the API — the probe was authenticating
        # by not needing to. Measured: /api/healthz still returns 200 with signin
        # required, /api/v1/version returns 403.
        gitea_health_path: "{{ gitea_config.apps.services.core.gitea.health_path }}"
        gitea_cpu_limit: "{{ gitea_config.apps.services.core.gitea.resources.cpu_limit }}"
        gitea_memory_limit: "{{ gitea_config.apps.services.core.gitea.resources.memory_limit }}"
        # ADR-062 D3 / AUTH-004 AC1. Was `gitea_secrets.basic_auth.user` — the
        # Traefik basic-auth credential, aliased into application identity with no
        # semantic relationship to it. That alias made Gitea's admin username a
        # SECRET, and therefore a thing `credentials-generate` would rotate: on
        # 2026-08-23 it did, the bootstrap below then tried to create a second
        # admin, collided on the shared contact e-mail, and aborted before
        # reaching its own `update-oauth` — so the rotated OIDC secret never
        # landed and prod SSO stayed down. An identity resolved from a secret
        # store is an identity something else is entitled to change.
        #
        # `gitea_config` is `common.yaml` merged with the prod values file, so a
        # plaintext common.yaml key resolves here; `gitea_admin_email` below
        # already relies on exactly that.
        gitea_admin_user: "{{ gitea_config.apps.auth.identities.superadmin }}"
        gitea_admin_password: "{{ gitea_secrets.apps.services.core.gitea.admin_password }}"
        # SSOT-014c: the config loader injects this for K8s, but Ansible reads the
        # raw values file, where only apps.contact.email exists.
        gitea_admin_email: "{{ gitea_config.apps.contact.email }}"
        gitea_secret_key: "{{ gitea_secrets.apps.services.core.gitea.secret_key }}"
        gitea_oidc_client_secret: "{{ gitea_secrets.apps.services.core.gitea.oidc_client_secret }}"
        # Must be PROD Authelia: the client secret above is prod's, and the issuer
        # in an OIDC flow is request-dependent, so pointing discovery at staging
        # would hand out tokens the prod client registration cannot validate.
        gitea_oidc_discovery_url: >-
          https://{{ gitea_config.apps.services.security.authelia.domain }}/.well-known/openid-configuration
        # AUTH-004 C5 — machine identity. The NAME resolves through the identity
        # map like the humans'; a literal here would be the alias shape that
        # renamed Gitea's only admin on 2026-08-23.
        gitea_bot_user: "{{ gitea_config.apps.auth.identities.machine }}"
        gitea_bot_email: "{{ gitea_config.apps.auth.identities.machine }}@{{ gitea_config.apps.services.core.gitea.domain }}"
        # Scopes come from common.yaml, not from a literal here. Both grants used
        # to be strings in this file, and the requirements that justify them live
        # in the Python that makes the calls — two declarations with nothing
        # checking they agree. That produced a real outage of a capability rather
        # than of a service: the admin token minted fine with a scope that could
        # not read `/admin/orgs`, so the mint reported success, `secrets-audit`
        # counted the key present, and the reconciler 403'd. The grant is now
        # declared once and `tests/test_gitea_token_scopes.py` ties it to the
        # requirement. The rationale for each scope moved next to the declaration.
        gitea_bot_scopes: "{{ gitea_config.apps.services.core.gitea.token_scopes.bot }}"
        # Empty on the run that mints it; present on every run after. The mint and
        # record tasks are gated on this, so provisioning converges to no-op.
        gitea_bot_token: "{{ gitea_secrets.apps.services.core.gitea.bot_token | default('') }}"
        # The superadmin's API token (TOOL-035). Minted by the same mechanism and
        # gated the same way. Two reasons it exists, and only the first is obvious:
        # Gitea puts the creating account in a new organization's `Owners` team, so
        # D1 forbids the bot creating them; and the reconciler's READS need it too,
        # because the bot cannot see an organization it is not a member of and
        # would report an existing private org as absent (lesson-408's corollary).
        # That second reason is exactly what the original grant could not do: the
        # reads it names go through `/admin/orgs`, which needs `read:admin`. The
        # comment was right and the string beside it was wrong, which is the whole
        # argument for the grant living next to its rationale in common.yaml.
        gitea_admin_scopes: "{{ gitea_config.apps.services.core.gitea.token_scopes.admin }}"
        gitea_admin_token: "{{ gitea_secrets.apps.services.core.gitea.admin_token | default('') }}"
        # MinIO
        minio_image: "{{ config.apps.services.data.minio.image }}"
        minio_api_port: "{{ config.apps.services.data.minio.default_port_api }}"
        minio_console_port: "{{ config.apps.services.data.minio.default_port_console }}"
        # ADR-062 D3 / AUTH-004 AC1, and the same fix as `gitea_admin_user`
        # above — this is the second of the two delivery paths that leg named.
        # Was `secrets.apps.services.data.minio.root_user`, a SOPS key that
        # `credentials generate` seeded from the same `common_username` that
        # feeds `basic_auth.user`. Its live value equalled the declared
        # superadmin by COINCIDENCE, not by resolution, so nothing looked
        # broken while the next rotation was entitled to rename MinIO's root
        # account — the shape that took prod SSO down on 2026-08-23 via Gitea.
        #
        # `config` is `common.yaml` merged with the env overrides (set_fact
        # above), so the plaintext identity map resolves here.
        minio_root_user: "{{ config.apps.auth.identities.superadmin }}"
        minio_root_password: "{{ secrets.apps.services.data.minio.root_password }}"
        minio_cpu_limit: "{{ config.apps.services.data.minio.resources.cpu_limit }}"
        minio_memory_limit: "{{ config.apps.services.data.minio.resources.memory_limit }}"
        # GitHub Actions Runner
        runner_image: "{{ config.apps.services.automation.github_runner.image }}"
        runner_repo_url: "{{ config.apps.services.automation.github_runner.repo_url }}"
        runner_access_token: "{{ secrets.apps.services.automation.github_runner.token }}"
        runner_group: "{{ config.apps.services.automation.github_runner.runner_group }}"
        runner_labels: "{{ config.apps.services.automation.github_runner.labels }}"
        runner_cpu_limit: "{{ config.apps.services.automation.github_runner.resources.cpu_limit }}"
        runner_memory_limit: "{{ config.apps.services.automation.github_runner.resources.memory_limit }}"
        # Gitea Actions runner (TOOL-035 PR3). A sibling of the GitHub runner
        # above, never a replacement -- the two forges speak different protocols
        # and neither runner can serve the other's jobs.
        act_runner_name: "{{ config.apps.services.automation.gitea_runner.name }}"
        act_runner_enabled: "{{ config.apps.services.automation.gitea_runner.enabled }}"
        act_runner_image: "{{ config.apps.services.automation.gitea_runner.image }}"
        act_runner_token: "{{ secrets.apps.services.automation.gitea_runner.registration_token | default('', true) }}"
        act_runner_labels: "{{ config.apps.services.automation.gitea_runner.labels }}"
        act_runner_capacity: "{{ config.apps.services.automation.gitea_runner.capacity }}"
        act_runner_container_options: "{{ config.apps.services.automation.gitea_runner.container_options }}"
        act_runner_cpu_limit: "{{ config.apps.services.automation.gitea_runner.resources.cpu_limit }}"
        act_runner_memory_limit: "{{ config.apps.services.automation.gitea_runner.resources.memory_limit }}"
        act_runner_log_retention_days: "{{ config.apps.services.automation.gitea_runner.log_retention_days }}"
        act_runner_artifact_retention_days: "{{ config.apps.services.automation.gitea_runner.artifact_retention_days }}"
        act_runner_run_retention_days: "{{ config.apps.services.automation.gitea_runner.run_retention_days }}"

    - role: ../roles/glances
      tags: [monitoring, glances]
      vars:
        restart_policy: "{{ config.global.restart_policy }}"
        tailscale_ip: "{{ config.networking.nodes.beelink.tailscale_ip }}"
        glances_image: "{{ config.apps.services.observability.glances.image }}"
        glances_port: "{{ config.apps.services.observability.glances.default_port }}"
        glances_cpu_limit: "{{ config.apps.services.observability.glances.resources.cpu_limit }}"
        glances_memory_limit: "{{ config.apps.services.observability.glances.resources.memory_limit }}"

    # The fleet's failure-notification path, and the fleet webhook secret it
    # reads. Ordered BEFORE node_maintenance deliberately: that role's unit
    # declares `OnFailure=kubelab-notify@%n.service`, and this one installs the
    # template it names while removing the single-purpose unit it replaces.
    - role: ../roles/node_notify
      # `maintenance` and NOT a `notify` tag of its own, deliberately. This role
      # REMOVES the unit `kubelab-maintenance.service` still names until
      # node_maintenance re-templates it, so a selector that reaches this role
      # without reaching that one leaves the node notification-dark: systemd
      # logs "unit not found" on the next failure and nobody is told.
      #
      # Found by a `--check` run scoped to a `notify` tag that used to exist
      # here. Sharing node_maintenance's tag makes the unsafe scoping
      # unreachable rather than merely documented, which is the difference
      # between a rule and a comment. Asserted in tests/test_node_notify_role.py.
      tags: [maintenance]

    # ANSIBLE-035: install-only (maintenance_run_cleanup: false) — cleanup
    # runs on the timer's own weekly schedule, not synchronously on every
    # provisioning run. See roles/node_maintenance/defaults/main.yml.
    - role: ../roles/node_maintenance
      tags: [maintenance]
      vars:
        maintenance_run_cleanup: false
