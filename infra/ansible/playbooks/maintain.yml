---
# =============================================================================
# Node Maintenance — disk cleanup + optional auto-maintenance timer
#
# Runs on any node. Targets selected via --limit.
#
# Usage:
#   make maintain NODE=aws1                 Cleanup aws1
#   make maintain NODE=ace1                 Cleanup ace1
#   make maintain NODE=all                  Cleanup all nodes
#   make maintain NODE=aws1 TIMER=1         Cleanup + install weekly timer
#
# Direct:
#   toolkit infra ansible run -p maintain -e staging -l kubelab-aws1
# =============================================================================

- name: Node maintenance
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load base config (SSOT)
      include_vars:
        file: "{{ playbook_dir }}/../../config/values/common.yaml"
        name: common

    # Only `common.enc.yaml`, and that is sufficient rather than a shortcut:
    # the one secret this playbook's roles need is
    # apps.services.automation.notify.fleet_webhook_secret, which lives there
    # deliberately so it resolves identically on every node regardless of its
    # own deploy_env (see SECRET_CATALOG). This playbook has no deploy_env of
    # its own to decrypt an env file with.
    - name: Decrypt common secrets (controller-side)
      command: sops -d {{ playbook_dir }}/../../config/secrets/common.enc.yaml
      register: sops_common
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      no_log: true

    - name: Parse decrypted secrets
      set_fact:
        secrets: "{{ sops_common.stdout | from_yaml }}"
      no_log: true

  roles:
    # `make maintain TIMER=1` re-installs kubelab-maintenance.service, whose
    # OnFailure names kubelab-notify@%n.service, and node_maintenance also
    # removes the single-purpose notifier it replaces. Without this role that
    # command leaves the node STRICTLY WORSE than it found it: the old path
    # deleted and the new one absent, reported by systemd as "unit not found"
    # on the next failure and by nobody else.
    #
    # `make maintain` is reachable without ever re-provisioning in between, so
    # it cannot assume provisioning already ran. Caught by the pairing guard in
    # tests/test_node_notify_role.py on its first execution, not by reading
    # this file.
    - role: ../roles/node_notify

    - role: ../roles/node_maintenance
      vars:
        maintenance_install_timer: "{{ install_timer | default(false) | bool }}"
        maintenance_is_k3s_node: "{{ 'k3s_servers' in group_names or 'hub' in group_names }}"
