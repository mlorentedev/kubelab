---
# =============================================================================
# RPi4 Gateway Provisioning
#
# Full provisioning of the RPi4 gateway node: base system, SSH hardening,
# gateway networking (nftables NAT, dnsmasq DHCP, IP forwarding),
# Docker, Tailscale VPN, Pi-hole, and CoreDNS.
#
# Prerequisites:
#   - Ubuntu Server flashed on the SD card; the gateway role renders netplan
#   - See docs/runbooks/rpi4-bootstrap.md
#
# Usage:
#   make provision NODE=rpi4 ENV=prod
#   toolkit infra ansible run -p provision-rpi4 -e prod
#   toolkit infra ansible run -p provision-rpi4 -e prod --tags gateway
#   toolkit infra ansible run -p provision-rpi4 -e prod --tags coredns
# =============================================================================

# ---------------------------------------------------------------------------
# Play 0: Pre-flight validation (no changes to target)
# ---------------------------------------------------------------------------
- name: "Pre-flight: validate RPi4 connectivity"
  hosts: gateway
  gather_facts: false
  become: false
  tags: [always]   # Pre-flight checks must run regardless of --tags filter
  tasks:
    - name: Verify SSH + Python connectivity
      ansible.builtin.ping:

    # `become: false`, so `sudo -n` runs as the SSH user and fails when NOPASSWD
    # is absent, rather than as root after an escalation that cannot fail
    # (#1229, guarded by tests/test_nopasswd_preflight.py).
    - name: Verify NOPASSWD sudo works
      command: sudo -n true
      become: false
      changed_when: false

- name: Provision RPi4 gateway
  hosts: gateway
  become: true
  gather_facts: true

  vars:
    # RPi4 is infrastructure — always uses prod config (base_domain: kubelab.live)
    # Hardcoded to prevent CLI -e deploy_env=staging from breaking CoreDNS zones
    _rpi4_env: prod

  pre_tasks:
    - name: Load base config (SSOT)
      include_vars:
        file: "{{ playbook_dir }}/../../config/values/common.yaml"
        name: common
      tags: [always]

    - name: Load environment overrides
      include_vars:
        file: "{{ playbook_dir }}/../../config/values/{{ _rpi4_env }}.yaml"
        name: env_overrides
      tags: [always]

    - name: Merge configs (env overrides win)
      set_fact:
        config: "{{ common | combine(env_overrides, recursive=True) }}"
      tags: [always]

    # ADR-075 D7: applying the uplink can cut a session that rides the tailnet it
    # carries. Checked here, before any role, because the gateway role runs after
    # others that change the edge: from inside it, a refused run had already made
    # them (#2775). Every run that applies the gateway role is checked.
    - name: Check that the run comes over the homelab LAN
      assert:
        that: ansible_host == config.networking.nodes.rpi4.lan_ip
        fail_msg: >-
          ERROR: this run reaches the edge at {{ ansible_host }}, not at its LAN address.
          WHY: edge changes run over the homelab LAN, because applying the uplink can cut a
          session that rides the tailnet (ADR-075 D7).
          FIX: from the laptop on the switch, run `make provision NODE=rpi4 ENV=prod BOOTSTRAP=1`.
        quiet: true
      when:
        - "'all' in ansible_run_tags or 'tagged' in ansible_run_tags or 'gateway' in ansible_run_tags"
        - "'gateway' not in ansible_skip_tags"
      tags: [always]

    - name: Decrypt common secrets (controller-side)
      command: sops -d {{ playbook_dir }}/../../config/secrets/common.enc.yaml
      register: sops_common
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      no_log: true
      tags: [always]  # secrets must load for any tag selection (e.g. --tags maintenance)

    - name: Decrypt env secrets (controller-side)
      command: sops -d {{ playbook_dir }}/../../config/secrets/{{ _rpi4_env }}.enc.yaml
      register: sops_env
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      no_log: true
      tags: [always]

    - name: Merge secrets (env overrides common)
      set_fact:
        secrets: "{{ (sops_common.stdout | from_yaml) | combine(sops_env.stdout | from_yaml, recursive=True) }}"
      no_log: true
      tags: [always]

  roles:
    # FIRST, as on rpi3, and before the gateway role in any case. The regulatory
    # domain is the site's (`networking.edge.uplink.regdomain`), which the gateway
    # role sets through modprobe.d (#2670). A value on the command line would always
    # win, because kmod applies it after modprobe.d and the kernel keeps the last
    # value, so it is removed here (#2668). The removal takes effect at the next
    # boot. No reboot without -e rpi_boot_allow_reboot=true.
    - role: ../roles/rpi_boot
      tags: [boot]
      vars:
        rpi_boot_absent_params:
          - cfg80211.ieee80211_regdom

    - role: ../roles/base_system
      tags: [base]
      vars:
        base_system_hostname: "{{ config.networking.nodes.rpi4.hostname }}"
        base_system_timezone: "{{ config.global.timezone }}"

    - role: ../roles/ssh_hardening
      tags: [ssh]

    # The fleet's failure-notification path, and the fleet webhook secret it
    # reads. Applied BEFORE every role whose units name its templates
    # (`OnFailure=kubelab-notify@`, `OnSuccess=kubelab-notify-recovered@`): a
    # unit started first runs with no template behind the name, and systemd
    # drops each page as "not found" until this role runs (#2728).
    - role: ../roles/node_notify
      # `maintenance` and NOT a `notify` tag of its own, deliberately.
      # node_maintenance re-points its unit at this role's template and then
      # removes the single-purpose notifier it replaces, so a selector that
      # reaches one of the two without the other leaves the node
      # notification-dark: systemd logs "unit not found" on the next failure
      # and nobody is told.
      #
      # Found by a `--check` run scoped to a `notify` tag that used to exist
      # here. Sharing node_maintenance's tag makes the unsafe scoping
      # unreachable rather than merely documented, which is the difference
      # between a rule and a comment. Asserted in tests/test_node_notify_role.py.
      # `gateway` too: the edge's lease check, shaper and liveness page through
      # this notifier, so `TAGS=gateway` must install it (and node_maintenance
      # with it), as `agent_stack` does on ace2.
      tags: [maintenance, gateway]

    - role: ../roles/gateway
      tags: [gateway]
      vars:
        gateway_interface: "eth0"
        gateway_lan_cidr: "{{ config.networking.nodes.rpi4.lan_ip }}/24"
        gateway_uplink_interface: "{{ config.networking.edge.uplink.interface }}"
        gateway_uplink_kind: "{{ config.networking.edge.uplink.kind }}"
        gateway_uplink_regdomain: "{{ config.networking.edge.uplink.regdomain }}"
        gateway_uplink_mac: "{{ secrets.networking.edge.uplink.mac | default('') }}"
        gateway_uplink_ssid: "{{ secrets.networking.edge.uplink.ssid | default('') }}"
        gateway_uplink_psk: "{{ secrets.networking.edge.uplink.psk | default('') }}"
        gateway_uplink_down_kbit: "{{ config.networking.edge.uplink.bandwidth.down_kbit }}"
        gateway_uplink_up_kbit: "{{ config.networking.edge.uplink.bandwidth.up_kbit }}"
        gateway_lease_check_networks:
          lan: "{{ config.networking.lan_cidr }}"
          lab: "{{ config.networking.edge.lab_wifi.cidr }}"
          tailnet: "{{ config.networking.tailscale_cidr }}"
        gateway_ap_interface: "{{ config.networking.edge.lab_wifi.interface }}"
        gateway_ap_channel: "{{ config.networking.edge.uplink.channel }}"
        gateway_ap_cidr: "{{ config.networking.edge.lab_wifi.cidr }}"
        gateway_ap_address: "{{ config.networking.edge.lab_wifi.gateway }}"
        gateway_ap_dhcp_range_start: "{{ config.networking.edge.lab_wifi.dhcp_range.start }}"
        gateway_ap_dhcp_range_end: "{{ config.networking.edge.lab_wifi.dhcp_range.end }}"
        gateway_ap_reservations: "{{ config.networking.edge.lab_wifi.reservations | map('extract', config.networking.nodes) | list }}"
        gateway_ap_ssid: "{{ secrets.networking.edge.lab_wifi.ssid | default('') }}"
        gateway_ap_psks:
          - keyid: current
            psk: "{{ secrets.networking.edge.lab_wifi.psk | default('') }}"
        gateway_dhcp_reservations:
          - mac: "{{ config.networking.nodes.ace1.mac }}"
            hostname: "kubelab-ace1"
            ip: "{{ config.networking.nodes.ace1.lan_ip }}"
          - mac: "{{ config.networking.nodes.ace2.mac }}"
            hostname: "kubelab-ace2"
            ip: "{{ config.networking.nodes.ace2.lan_ip }}"
          - mac: "{{ config.networking.nodes.beelink.mac }}"
            hostname: "kubelab-bee"
            ip: "{{ config.networking.nodes.beelink.lan_ip }}"
          - mac: "{{ config.networking.nodes.jetson.mac }}"
            hostname: "kubelab-jet1"
            ip: "{{ config.networking.nodes.jetson.lan_ip }}"

    - role: ../roles/docker
      tags: [docker]

    - role: ../roles/dns_resilience
      tags: [dns, tailscale]
      vars:
        headscale_ip: "{{ config.networking.vps.public_ip }}"
        headscale_domain: "{{ config.apps.services.core.headscale.domain }}"

    - role: ../roles/tailscale
      tags: [tailscale]
      vars:
        tailscale_headscale_url: "https://{{ config.apps.services.core.headscale.domain }}"
        tailscale_accept_dns: false
        tailscale_accept_routes: false
        tailscale_advertise_routes: "{{ config.networking.lan_cidr }}"
        # The user `make headscale-rejoin` mints the edge's key under.
        tailscale_headscale_user_id: "{{ config.apps.services.core.headscale.infra_user_id }}"

    - role: ../roles/coredns
      tags: [coredns]

    - role: ../roles/glances
      tags: [monitoring, glances]
      vars:
        restart_policy: "{{ config.global.restart_policy }}"
        tailscale_ip: "{{ config.networking.nodes.rpi4.tailscale_ip }}"
        glances_image: "{{ config.apps.services.observability.glances.image }}"
        glances_port: "{{ config.apps.services.observability.glances.default_port }}"
        glances_cpu_limit: "{{ config.apps.services.observability.glances.resources.cpu_limit }}"
        glances_memory_limit: "{{ config.apps.services.observability.glances.resources.memory_limit }}"

    # ANSIBLE-035: install-only (maintenance_run_cleanup: false) — cleanup
    # runs on the timer's own weekly schedule, not synchronously on every
    # provisioning run. See roles/node_maintenance/defaults/main.yml.
    - role: ../roles/node_maintenance
      tags: [maintenance, gateway]
      vars:
        maintenance_run_cleanup: false
