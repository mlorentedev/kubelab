---
# =============================================================================
# RPi3 Provisioning — External Monitoring Node
#
# Deploys: base system hardening (ufw, journald persistence), SSH
# hardening, Uptime Kuma + Glances via Docker Compose.
# RPi3 is Debian 13 (trixie), aarch64, Docker + Tailscale already installed.
# The docker role is deliberately NOT included here — it hardcodes Docker's
# Ubuntu apt repo and rpi3's existing Docker install is of unknown origin
# (no docker-ce dpkg entries at all, per #959). See ANSIBLE-036.
# Primary access via Tailscale (100.64.0.6). LAN fallback via WiFi
# (10.0.0.157/24, wlan0) — see SSOT-003 + ssh-config Host rpi3-lan.
# WiFi credentials managed at OS level (NetworkManager / wpa_supplicant);
# this playbook does NOT touch netplan — wlan0 is configured out-of-band.
#
# Usage:
#   make provision NODE=rpi3 ENV=prod
#   toolkit infra ansible run -p provision-rpi3 -e prod
#   toolkit infra ansible run -p provision-rpi3 -e prod --tags services
#
# Note: No BOOTSTRAP mode needed — RPi3 ansible_host is the Tailscale IP.
# For Tailscale-down forensics, SSH via 'rpi3-lan' alias instead (LAN path).
# =============================================================================

# ---------------------------------------------------------------------------
# Play 0: Pre-flight validation
# ---------------------------------------------------------------------------
- name: "Pre-flight: validate RPi3 connectivity"
  hosts: rpi3
  gather_facts: false
  become: false
  tags: [always]   # Pre-flight checks must run regardless of --tags filter
  tasks:
    - name: Verify SSH + Python connectivity
      ansible.builtin.ping:

    - name: Verify become (sudo) works
      command: sudo -n true
      become: true
      changed_when: false

    - name: Verify Docker is running
      command: docker info
      become: true
      changed_when: false

# ---------------------------------------------------------------------------
# Play 1: Provisioning
# ---------------------------------------------------------------------------
- name: Provision RPi3 — External monitoring node
  hosts: rpi3
  become: true
  gather_facts: true

  vars:
    deploy_env: prod

  pre_tasks:
    - name: Load base config (SSOT)
      include_vars:
        file: "{{ playbook_dir }}/../../config/values/common.yaml"
        name: common
      tags: [always]

    - name: Load environment overrides
      include_vars:
        file: "{{ playbook_dir }}/../../config/values/{{ deploy_env }}.yaml"
        name: env_overrides
      tags: [always]

    - name: Merge configs (env overrides win)
      set_fact:
        config: "{{ common | combine(env_overrides, recursive=True) }}"
      tags: [always]

    - name: Decrypt common secrets (controller-side)
      command: sops -d {{ playbook_dir }}/../../config/secrets/common.enc.yaml
      register: sops_common
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      no_log: true
      tags: [always]  # secrets must load for any tag selection (e.g. --tags maintenance)

    - name: Merge secrets
      set_fact:
        secrets: "{{ sops_common.stdout | from_yaml }}"
      no_log: true
      tags: [always]

  roles:
    # FIRST, deliberately. A container's memory limit is fixed at create time,
    # so if the kernel gains the memory cgroup controller only after the service
    # roles below have run, every limit they declared was already discarded and
    # stays discarded until something recreates the container. Ordering this
    # first makes a from-scratch provision correct in one pass.
    #
    # No-op on a node that already exposes the controller, and inert without
    # -e rpi_boot_allow_reboot=true (this node is prod's monitoring of record;
    # nothing reboots it as a side effect). See ANSIBLE-040.
    - role: ../roles/rpi_boot
      tags: [boot]

    - role: ../roles/base_system
      tags: [base]
      vars:
        system_timezone: "{{ config.global.timezone }}"
        # No netplan_* vars: rpi3's WiFi (wlan0) is configured out-of-band
        # (NetworkManager/wpa_supplicant), not by this playbook — see the
        # header comment above. base_system's netplan task only fires when
        # netplan_address is defined, so omitting it here is a no-op, not
        # a gap.
        firewall_tailnet_ports:
          - "{{ config.apps.services.observability.uptime_kuma.default_port }}"
          - "{{ config.apps.services.observability.glances.default_port }}"

    - role: ../roles/ssh_hardening
      tags: [ssh]

    - role: ../roles/dns_resilience
      tags: [dns]
      vars:
        headscale_ip: "{{ config.networking.vps.public_ip }}"
        headscale_domain: "{{ config.apps.services.core.headscale.domain }}"

    - role: ../roles/rpi3_services
      tags: [services, uptime_kuma]
      vars:
        uptime_kuma_image: "{{ config.apps.services.observability.uptime_kuma.image }}"
        uptime_kuma_port: "{{ config.apps.services.observability.uptime_kuma.default_port }}"
        restart_policy: "{{ config.global.restart_policy }}"
        # Consumed by the compose port bind (see the comment in the template).
        tailscale_ip: "{{ config.networking.nodes.rpi3.tailscale_ip }}"

    - role: ../roles/glances
      tags: [monitoring, glances]
      vars:
        restart_policy: "{{ config.global.restart_policy }}"
        tailscale_ip: "{{ config.networking.nodes.rpi3.tailscale_ip }}"
        glances_image: "{{ config.apps.services.observability.glances.image }}"
        glances_port: "{{ config.apps.services.observability.glances.default_port }}"
        glances_cpu_limit: "{{ config.apps.services.observability.glances.resources.cpu_limit }}"
        glances_memory_limit: "{{ config.apps.services.observability.glances.resources.memory_limit }}"

    # The fleet's failure-notification path, and the fleet webhook secret it
    # reads. Ordered BEFORE node_maintenance deliberately: that role's unit
    # declares `OnFailure=kubelab-notify@%n.service`, and this one installs the
    # template it names while removing the single-purpose unit it replaces.
    - role: ../roles/node_notify
      tags: [notify, maintenance]

    # ANSIBLE-035: install-only (maintenance_run_cleanup: false) — cleanup
    # runs on the timer's own weekly schedule, not synchronously on every
    # provisioning run. See roles/node_maintenance/defaults/main.yml.
    - role: ../roles/node_maintenance
      tags: [maintenance]
      vars:
        maintenance_run_cleanup: false
