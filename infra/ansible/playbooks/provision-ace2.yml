---
# =============================================================================
# ace2 Provisioning — On-Demand Developer Node / CDE (ADR-028, ADR-058 D1)
#
# Full provisioning: base system, SSH hardening, Docker, Tailscale, Glances,
# then the self-hosted CDE. Ollama was retired here by AI-007; its teardown is
# carried by the dev_node role, since removing a role does not undo its work.
#
# Usage:
#   make provision NODE=ace2 ENV=staging
#   toolkit infra ansible run -p provision-ace2 -e staging
#   toolkit infra ansible run -p provision-ace2 -e staging --tags services
#
# First run (before Tailscale): use BOOTSTRAP=1 to auto-use LAN IP
#   make provision NODE=ace2 ENV=staging BOOTSTRAP=1
# =============================================================================

# ---------------------------------------------------------------------------
# Play 0: Pre-flight validation (no changes to target)
# ---------------------------------------------------------------------------
- name: "Pre-flight: validate ace2 connectivity"
  hosts: ace2
  gather_facts: false
  become: false
  tags: [always]   # Pre-flight checks must run regardless of --tags filter
  tasks:
    - name: Verify SSH + Python connectivity
      ansible.builtin.ping:

    - name: Verify become (sudo) works
      command: sudo -n true
      become: true
      changed_when: false

    - name: Verify SSH private key exists on controller
      stat:
        path: "{{ _ssh_key_path }}"
      delegate_to: localhost
      register: _ssh_key
      failed_when: not _ssh_key.stat.exists
      vars:
        _ssh_key_path: "{{ ansible_ssh_private_key_file | default('~/.ssh/id_ed25519') }}"

    - name: Verify target has internet (apt, Docker, Tailscale need it)
      command: curl -sf --connect-timeout 5 https://get.docker.com -o /dev/null
      changed_when: false

    - name: Pre-flight VPS reachability check (SSOT-shared)
      ansible.builtin.include_tasks: _includes/check-vps-reachable.yml

# ---------------------------------------------------------------------------
# Play 1: Full provisioning
# ---------------------------------------------------------------------------
- name: Provision ace2 — On-demand LLM compute node
  hosts: ace2
  become: true
  gather_facts: true

  vars:
    deploy_env: staging

  pre_tasks:
    - name: Load base config (SSOT)
      include_vars:
        file: "{{ playbook_dir }}/../../config/values/common.yaml"
        name: common
      tags: [always]

    - name: Load environment overrides
      include_vars:
        file: "{{ playbook_dir }}/../../config/values/{{ deploy_env }}.yaml"
        name: env_overrides
      tags: [always]

    - name: Merge configs (env overrides win)
      set_fact:
        config: "{{ common | combine(env_overrides, recursive=True) }}"
      tags: [always]

    # `always`, matching the config loads above. Without it a tagged run
    # (`TAGS=dev_node`, the command AC4 prescribes) skips decryption entirely,
    # leaving `secrets` undefined — so every role var sourced from SOPS silently
    # resolves to its default. Observed 2026-08-08: the dev_node identity tasks
    # skipped on a full provision while the play still reported failed=0.
    - name: Decrypt common secrets (controller-side)
      command: sops -d {{ playbook_dir }}/../../config/secrets/common.enc.yaml
      register: sops_common
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      no_log: true
      tags: [always]

    - name: Decrypt env secrets (controller-side)
      command: sops -d {{ playbook_dir }}/../../config/secrets/{{ deploy_env }}.enc.yaml
      register: sops_env
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      no_log: true
      tags: [always]

    - name: Merge secrets (env overrides common)
      set_fact:
        secrets: "{{ (sops_common.stdout | from_yaml) | combine(sops_env.stdout | from_yaml, recursive=True) }}"
      no_log: true
      tags: [always]

    - name: Generate Headscale pre-auth key (via VPS)
      command: >
        docker exec headscale headscale preauthkeys create
        --user {{ config.apps.services.core.headscale.infra_user_id }} --reusable --expiration 1h
      delegate_to: kubelab-vps
      become: false
      changed_when: false
      register: _headscale_preauth
      tags: [tailscale]

    - name: Set Tailscale auth key fact
      set_fact:
        _tailscale_auth_key: "{{ _headscale_preauth.stdout | trim }}"
      no_log: true
      tags: [tailscale]

  roles:
    - role: ../roles/base_system
      tags: [base]
      vars:
        system_timezone: "{{ config.global.timezone }}"
        netplan_interface: "{{ config.networking.nodes.ace2.lan_interface }}"
        netplan_address: "{{ config.networking.nodes.ace2.lan_ip }}/24"
        netplan_gateway: "{{ config.networking.nodes.rpi4.lan_ip }}"

    - role: ../roles/ssh_hardening
      tags: [ssh]

    - role: ../roles/docker
      tags: [docker]

    - role: ../roles/tailscale
      tags: [tailscale]
      vars:
        tailscale_headscale_url: "https://{{ config.apps.services.core.headscale.domain }}"
        tailscale_accept_routes: false  # LAN node — must NOT accept subnet routes
        tailscale_auth_key: "{{ _tailscale_auth_key | default('') }}"

    - role: ../roles/glances
      tags: [monitoring, glances]
      vars:
        restart_policy: "{{ config.global.restart_policy }}"
        tailscale_ip: "{{ config.networking.nodes.ace2.tailscale_ip }}"
        glances_image: "{{ config.apps.services.observability.glances.image }}"
        glances_port: "{{ config.apps.services.observability.glances.default_port }}"
        glances_cpu_limit: "{{ config.apps.services.observability.glances.resources.cpu_limit }}"
        glances_memory_limit: "{{ config.apps.services.observability.glances.resources.memory_limit }}"

    # Centralized self-hosted CDE (ADR-058 D1 / ANSIBLE-028). Since AI-007 this
    # role owns the node outright and carries the Ollama teardown, because
    # deleting ace2_services does not undo what it installed.
    - role: ../roles/dev_node
      tags: [dev_node, cde]
      vars:
        dev_node_user: "{{ config.networking.ssh_users.homelab }}"
        # Machine identity (ANSIBLE-033). Sourced from COMMON secrets, decrypted
        # controller-side above — the node never sees an age key. `default('')`
        # is what makes the role's "not configured" path reachable: an operator
        # without the secret gets a provisioned node with no identity, not a
        # failed play or an empty credential handed to `gh`.
        dev_node_github_token: "{{ secrets.apps.services.automation.dev_node.github_token | default('') }}"

    # The fleet's failure-notification path, and the fleet webhook secret it
    # reads. Ordered BEFORE node_maintenance deliberately: that role's unit
    # declares `OnFailure=kubelab-notify@%n.service`, and this one installs the
    # template it names while removing the single-purpose unit it replaces.
    - role: ../roles/node_notify
      tags: [notify, maintenance]

    # ANSIBLE-035: install-only (maintenance_run_cleanup: false) — cleanup
    # runs on the timer's own weekly schedule, not synchronously on every
    # provisioning run. See roles/node_maintenance/defaults/main.yml. Adjacent
    # to but not overlapping with dev_node's own housekeeping timers (git gc,
    # language caches, agent workspace resets — ANSIBLE-030/#858): this is
    # node-generic disk hygiene, that is dev-workload hygiene.
    - role: ../roles/node_maintenance
      tags: [maintenance]
      vars:
        maintenance_run_cleanup: false
