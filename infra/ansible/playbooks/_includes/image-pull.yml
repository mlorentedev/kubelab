---
# Pull a stack's images, sized first against the lab edge's downlink (#2742).
# Imported (not included) so the caller's tags apply.
#
#   - import_tasks: "{{ playbook_dir }}/_includes/image-pull.yml"
#     vars:
#       image_pull_name: Open WebUI
#       image_pull_images: ["{{ agent_stack_webui.image }}"]
#
# The images are pulled by name, so the pull needs nothing on disk. A role runs it
# before any write whose change a later task acts on: a refused pull then leaves
# the node as it was, and the rerun still sees that change (#2812). Every image a
# role's Compose stack would fetch must be in the list, which
# tests/test_image_pull_budget.py checks against the role's templates.
#
# A node behind the edge shares the uplink the edge shapes to
# networking.edge.uplink.bandwidth.down_kbit (ADR-075), so a multi-GB pull there
# takes most of an hour, and on 2026-10-27 one ended in an EOF after 52 minutes.
# The play of such a node sets image_pull_down_kbit from that key, and
# image_pull_goodput, the share of it a pull gets, from pull_goodput beside it. The
# include then estimates the bytes to fetch before pulling, states the estimate,
# refuses past image_pull_budget_seconds unless image_pull_allow_slow, and bounds
# each attempt by the estimate plus dockerd's pauses. A retry runs the pull again
# from nothing: on the overlay2 store a failed pull drops every layer it fetched
# (measured on ace2, 2026-10-30), so the retry that keeps progress is dockerd's own,
# per layer, up to docker_max_download_attempts, which the play passes to the
# daemon's role too (#2834). dockerd pauses 5k seconds after its k-th failed attempt
# at a layer, so the bound adds 5·n(n−1)/2 seconds: past it the pull is killed
# and every layer dropped. Unset, the attempts are Docker's own 5, what a daemon
# nothing configures keeps. Without image_pull_down_kbit the pull is bounded by
# image_pull_timeout_seconds and nothing is estimated. Set explicitly, image_pull_timeout_seconds bounds each
# attempt on any node: the lever for an estimate that is wrong, such as a held
# tag that has since moved.

- name: Estimate the download of {{ image_pull_name }}
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/files/image-pull-estimate.py {{ ansible_architecture }}
      {{ image_pull_images | join(' ') }}
    executable: python3
  register: _image_pull_estimate
  changed_when: false
  # Reads the registry and the local images, so a dry run reports the estimate.
  check_mode: false
  when: image_pull_down_kbit | default(0) | int > 0

- name: Size the pull of {{ image_pull_name }} against the edge's downlink
  ansible.builtin.set_fact:
    _image_pull_bytes: "{{ (_image_pull_estimate.stdout | from_json).bytes | int }}"
    _image_pull_seconds: >-
      {{ (((_image_pull_estimate.stdout | from_json).bytes | int) * 8
          / ((image_pull_down_kbit | int) * 1000 * (image_pull_goodput | default(1) | float)))
         | round(0, 'ceil') | int }}
    _image_pull_pauses: >-
      {{ 5 * (docker_max_download_attempts | default(5) | int)
           * ((docker_max_download_attempts | default(5) | int) - 1) // 2 }}
  when: image_pull_down_kbit | default(0) | int > 0

# Stated whether or not the pull goes ahead: a run without -v shows nothing of a
# registered result, and the duration is what the operator lacked (#2742).
- name: State the estimate for {{ image_pull_name }}
  ansible.builtin.debug:
    msg: >-
      {{ image_pull_name }}: {{ _image_pull_bytes | int | filesizeformat }} to fetch
      ({% for item in (_image_pull_estimate.stdout | from_json).images %}{{ item.image }}
      {{ item.bytes | filesizeformat }}{{ ', ' if not loop.last }}{% endfor %}), about
      {{ ((_image_pull_seconds | int) / 60) | round(1) }} min at the
      {{ ((image_pull_goodput | default(1) | float) * 100) | round | int }}% of the edge's
      {{ image_pull_down_kbit }} kbit/s a pull gets, against a budget of
      {{ ((image_pull_budget_seconds | default(1800) | int) / 60) | round | int }} min.
      dockerd's pauses between its {{ docker_max_download_attempts | default(5) | int }}
      attempts at a layer can add {{ ((_image_pull_pauses | int) / 60) | round(1) }} min.
  when: image_pull_down_kbit | default(0) | int > 0

- name: Refuse a pull of {{ image_pull_name }} that outlasts its budget
  ansible.builtin.assert:
    that: >-
      image_pull_down_kbit | default(0) | int == 0
      or _image_pull_seconds | int <= image_pull_budget_seconds | default(1800) | int
      or image_pull_allow_slow | default(false) | bool
    fail_msg: >-
      ERROR: pulling {{ image_pull_name }} fetches up to
      {{ ((_image_pull_bytes | default(0) | int) / 1e9) | round(2) }} GB, about
      {{ ((_image_pull_seconds | default(0) | int) / 60) | round | int }} min at the edge's
      {{ image_pull_down_kbit | default(0) }} kbit/s, past the
      {{ ((image_pull_budget_seconds | default(1800) | int) / 60) | round | int }} min budget.
      WHY: the node is behind the lab edge, whose uplink is shaped to
      networking.edge.uplink.bandwidth.down_kbit (ADR-075). A pull that long holds the
      play, and one that breaks midway is retried (#2742).
      FIX: rerun with EXTRA='image_pull_allow_slow=true' to pull anyway, each attempt bounded
      by twice the estimate, or raise image_pull_budget_seconds.
    quiet: true

- name: Pull {{ image_pull_name }}
  ansible.builtin.shell: >-
    set -e;
    for image in {{ image_pull_images | map('quote') | join(' ') }}; do docker pull "$image"; done
  register: _image_pull
  # `docker pull` reports on stdout, where `docker compose pull` used stderr. An
  # image already present reads "Image is up to date".
  changed_when: "'Downloaded newer image' in (_image_pull.stdout | default(''))"
  # Polled rather than held: each poll is its own SSH round trip, so the pull
  # does not depend on one session staying up for an hour.
  async: >-
    {{ image_pull_timeout_seconds | int
       if image_pull_timeout_seconds | default(none) is not none
       else ((_image_pull_seconds | int) * 2 + 300 + (_image_pull_pauses | int))
       if image_pull_down_kbit | default(0) | int > 0
       else 3600 }}
  poll: 15
  retries: "{{ image_pull_retries | default(2) }}"
  delay: 30
  until: _image_pull is succeeded
