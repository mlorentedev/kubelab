---
# A play that reads `secrets` stops here when it built none, rather than
# templating every `| default('')` to an empty credential and reporting
# failed=0 (#893, #1100). Imported right after the play's SOPS merge, with
# `tags: [always]`: on `import_tasks` the tags reach the assert, while on
# `include_tasks` they would stay on the include line, and `--tags <role>`
# would skip the assert in the very run it exists for.
#
# It does not catch a tree that loaded but lacks one key: that key's
# `| default('')` still templates to empty.
#
# `allow_missing_secrets=true` (`EXTRA='allow_missing_secrets=true'`) lets a
# play that built no `secrets` go on, and says so in the run's output. It does
# not provision a node without the operator's SOPS key: every play that loads
# secrets runs `sops -d` first, which fails on its own without the key.
- name: Require the play's secrets
  ansible.builtin.assert:
    that: secrets is defined or (allow_missing_secrets | default(false) | bool)
    fail_msg: >-
      This play reads `secrets` but built none, so every credential it delivers
      would be empty. Run its SOPS pre_tasks, which carry `tags: [always]`, or
      pass allow_missing_secrets=true to run without them on purpose.
    success_msg: >-
      {{ 'The play built its secrets.' if secrets is defined else
         'allow_missing_secrets is set: this run delivers no credential from SOPS.' }}
