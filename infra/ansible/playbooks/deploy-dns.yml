---
- name: Deploy DNS gateway (CoreDNS + Pi-hole)
  hosts: gateway
  # The image estimate reads the layers for ansible_architecture, a platform fact.
  gather_facts: true
  gather_subset: [min]

  vars:
    deploy_env: prod  # RPi4 DNS gateway serves all envs — prod config is the baseline
    # The edge's own image pulls leave by the uplink it shapes (_includes/image-pull.yml, #2742).
    image_pull_down_kbit: "{{ config.networking.edge.uplink.bandwidth.down_kbit }}"

  pre_tasks:
    - name: Load base config (SSOT)
      include_vars:
        file: "{{ playbook_dir }}/../../config/values/common.yaml"
        name: common
      tags: [always]

    - name: Load environment overrides
      include_vars:
        file: "{{ playbook_dir }}/../../config/values/{{ deploy_env }}.yaml"
        name: env_overrides

    - name: Merge configs (env overrides win)
      set_fact:
        config: "{{ common | combine(env_overrides, recursive=True) }}"

  roles:
    - role: ../roles/coredns
      tags: [dns, coredns]
