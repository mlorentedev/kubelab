---
# Ansible Galaxy collections required by kubelab roles
# Install: make setup-ansible
#
# Exact versions, never floors (ANSIBLE-070, #2735). `ansible-galaxy collection
# install -r` does nothing while an installed version satisfies a floor, so a
# floor left each controller on whatever it installed first: ansible.posix 2.1.0,
# a release behind the authorized_key privilege-escalation fix. An exact pin moves
# an installed version to it, Renovate's ansible-galaxy manager bumps it, and
# `make provision`/`make deploy` refuse a controller that holds anything else.
collections:
  - name: community.docker
    version: "5.0.6"
  - name: community.general
    version: "12.4.0"
  - name: ansible.posix
    version: "2.2.2"
