---
tailscale_headscale_url: ""
tailscale_accept_dns: true
tailscale_accept_routes: false
tailscale_advertise_routes: ""
tailscale_auth_key: ""
# Mint a single-use, one-hour key on Headscale when the node is off the mesh and
# no key was passed in. `make headscale-rejoin` sets it per run.
tailscale_mint_key: false
tailscale_headscale_host: kubelab-vps
tailscale_headscale_user_id: ""
# Re-run `tailscale up` every 5 minutes when the node reports itself stopped or
# logged out (#2675). Off by default: the edge's play turns it on, the node the
# lab's DNS and its LAN route depend on. Off also removes a watchdog a node
# already has.
tailscale_watchdog: false
