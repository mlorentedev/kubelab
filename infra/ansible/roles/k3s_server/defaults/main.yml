---
# K3s install — environment-specific values come from playbook (SSOT: config.k3s.*)
k3s_version: ""
k3s_install_script_url: "https://get.k3s.io"
k3s_install_script_path: "/tmp/k3s-install.sh"

# Server config
k3s_tls_san: []           # Built by playbook from config.networking.*
k3s_kubeconfig_mode: "0600"
k3s_node_labels: []
k3s_resolv_conf: ""  # Override pod DNS (e.g. /run/systemd/resolve/resolv.conf for systemd-resolved hosts)

# kube-controller-manager — terminated pod GC threshold.
# K3s default 12500 → on low-RAM hubs (e.g. t4g.small) one OOM loop can leave
# thousands of zombie pods saturating etcd. RELIAB-009 §9.3: hub.yaml overrides
# to 100. Staging/prod keep the K3s default.
k3s_terminated_pod_gc_threshold: 12500

# K3s embedded etcd snapshot retention. Default 5; on small EBS volumes
# (e.g. 8GB hub) each snapshot is ~30-40MB and aged ones bloat /var/lib/rancher.
# RELIAB-009 follow-up (2026-05-10 incident): give the hub more disk headroom
# so a §9.3 bulk-delete log spike doesn't trip the kubelet disk-pressure
# threshold (85%). Staging/prod with larger volumes keep the K3s default.
k3s_etcd_snapshot_retention: 5

# Traefik HelmChartConfig — ports from SSOT (config.k3s.traefik.*)
k3s_configure_traefik: true
k3s_traefik_http_port: 80
k3s_traefik_https_port: 443

# Traefik ACME (Let's Encrypt) — from SSOT (config.edge.traefik.*)
k3s_traefik_acme_enabled: false
k3s_traefik_acme_email: ""
k3s_traefik_acme_dns_provider: "cloudflare"
k3s_traefik_acme_dns_resolvers: "{{ config.networking.public_resolvers | map('regex_replace', '$', ':53') | join(',') }}"
k3s_traefik_acme_secret_name: "cloudflare-api-token"
k3s_traefik_acme_cloudflare_token: ""  # From SOPS (secrets.cloudflare.acme_dns_token)
# Before asking Let's Encrypt to validate, lego checks the DNS-01 record against the
# zone's authoritative nameservers over UDP 53. A site that answers every outbound UDP
# 53 query itself (the lab's, measured 2026-10-27) only ever shows it a cached NXDOMAIN,
# so every renewal times out. Let's Encrypt validates from its own network either way:
# false replaces the local check with a fixed delay, in both environments (#2699).
k3s_traefik_acme_propagation_checks: false

# Traefik plugins, loaded from the node (#2565). A remote plugin is downloaded from
# plugins.traefik.io at every start, and when that fails Traefik starts with every
# plugin disabled and drops each router that uses one, while the pod stays Ready. The
# role fetches each source here instead, at provision time, verified by sha256, into
# one directory per version. The name is the one Middlewares use under `spec.plugin`.
# The source is the module's GitHub tag archive, so `module` must be a GitHub path.
k3s_traefik_local_plugins_dir: /var/lib/kubelab/traefik-plugins
k3s_traefik_local_plugins:
  - name: bouncer
    module: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
    version: v1.5.1
    sha256: a0fe391765d347726e260cd32d767c56e417910ff6e2c61bd2563c50c7b20ed3
  # api-key (ADR-035 Stage 1): used by Middlewares api-key-* rendered from
  # infra/k8s/overlays/<env>/middlewares/*.yaml.tpl via `make apply-middleware-secrets
  # ENV=<env>`. It answers 403 for any rejected request, and accepts both X-API-Key and
  # Authorization: Bearer (Bearer for Stage 2 OIDC forward-compat).
  - name: api-key
    module: github.com/dtomlinson91/traefik-api-key-middleware
    version: v0.1.2
    sha256: bf36f5c93ae3948ba669d40d8d95084cf4b4f028fe0f7a2c41ca430a28227eda

# Kubeconfig fetch to controller
k3s_fetch_kubeconfig: false
k3s_kubeconfig_local_path: "~/.kube/k3s-config"
k3s_api_address: "{{ ansible_host }}"

# Readiness tuning
k3s_readiness_retries: 30
k3s_readiness_delay: 10
k3s_token_wait_timeout: 120
