---
# =============================================================================
# Node Maintenance — disk cleanup + optional systemd timer
# Works on all node types: K3s, Docker, hub, gateway
#
# ANSIBLE-035: the cleanup tasks below are gated behind maintenance_run_cleanup
# (default true), independently of maintenance_install_timer (also default
# true). Provisioning playbooks include this role to install the timer but
# pass maintenance_run_cleanup: false, so `make provision` never ALSO runs a
# synchronous cleanup pass -- cleanup only runs on the timer's own weekly
# schedule, or via `make maintain TIMER=1`'s explicit manual invocation.
# See defaults/main.yml for why that matters (apt cache, Docker/K3s caches).
# =============================================================================

# --- Forensic sanity check (ANSIBLE-023) ---
# Persistent journald is configured by base_system role. Surface a warning if
# /var/log/journal is missing so an unprovisioned node is noticed during the
# next scheduled maintenance run.
- name: Probe persistent journal directory
  stat:
    path: /var/log/journal
  register: _journal_dir
  changed_when: false
  when: maintenance_run_cleanup | bool

- name: Warn if persistent journal directory is missing
  debug:
    msg: >-
      WARNING: /var/log/journal missing — journald is volatile, crash forensics
      will be lost on reboot. Re-run base_system role (ANSIBLE-023).
  when: maintenance_run_cleanup | bool and not _journal_dir.stat.exists

# --- Pre-cleanup report ---
- name: Report disk usage (before)
  command: df -h /
  register: _disk_before
  changed_when: false
  when: maintenance_run_cleanup | bool

- name: Show disk before
  debug:
    msg: "BEFORE: {{ _disk_before.stdout_lines | default([]) | last | default('N/A (check mode)') }}"
  when: maintenance_run_cleanup | bool

# --- security patching (SEC-010) ------------------------------------------
# BEFORE the cleanup below, which deletes /var/lib/apt/lists: patching after it
# would re-download every index it had just removed.
#
# This role has TWO implementations of the same work — these Ansible tasks for
# `make maintain`, and kubelab-maintenance.sh for the weekly timer. The patch
# step has to exist in both, or the command an operator runs by hand does
# something different from the one that runs unattended. A guard asserts they
# agree, because two implementations of one behaviour is exactly how they stop
# agreeing.
- name: Record which packages are ALREADY held
  # Raised in review of #1258. Blanket-unholding at the end of the run destroys
  # a hold an operator placed deliberately — pinning a package is how you stop
  # an upgrade you already know breaks something, and this role would have
  # silently undone it on the next weekly tick.
  #
  # So the run releases only the holds IT created, and to know which those are
  # it has to see the prior state first.
  command: apt-mark showhold
  register: _holds_before
  changed_when: false
  failed_when: false
  when: maintenance_run_cleanup | bool and maintenance_security_updates | bool
        and ansible_facts.pkg_mgr == 'apt'

- name: Hold packages whose upgrade would restart a live workload
  # docker/containerd restarting stops every container — on ace1 that is K3s
  # itself. `tailscale` is the path this fleet is administered over: a failed
  # upgrade removes the way in to fix it.
  #
  # Only what is not already held, so `_holds_created` is exactly this run's
  # additions and the release below cannot overreach.
  command: "apt-mark hold {{ item }}"
  loop: "{{ maintenance_patch_blacklist | difference(_holds_before.stdout_lines | default([])) }}"
  register: _holds_created
  changed_when: false
  # A hold on a package that is NOT INSTALLED fails, and that is fine: not every
  # node runs docker or k3s. A hold that fails on an INSTALLED package is a
  # different thing entirely, and the next task refuses to upgrade over it.
  failed_when: false
  when: maintenance_run_cleanup | bool and maintenance_security_updates | bool
        and ansible_facts.pkg_mgr == 'apt'

- name: Determine whether any hold failed on an INSTALLED package
  # The distinction the blanket `failed_when: false` was hiding. Upgrading with
  # docker unheld on a node that runs docker is the exact outcome the hold list
  # exists to prevent — and it would have proceeded silently.
  #
  # Told apart by apt's own output rather than by package facts, because this
  # role never runs `package_facts` — a filter on `ansible_facts.packages`
  # would have matched nothing on every node and produced a guard that can
  # never fire. Measured on beelink 2026-08-22:
  #
  #   apt-mark hold docker-ce  (installed)      -> rc=0
  #   apt-mark hold k3s        (not installed)  -> rc=100, "Unable to locate package"
  #
  # So a non-zero rc WITHOUT that message is a hold that failed on a package
  # apt does know about, which is the case worth stopping for.
  set_fact:
    _unprotected: >-
      {{ _holds_created.results | default([])
         | selectattr('rc', 'defined')
         | selectattr('rc', '!=', 0)
         | rejectattr('stderr', 'search', 'Unable to locate package')
         | map(attribute='item')
         | list }}
  when: maintenance_run_cleanup | bool and maintenance_security_updates | bool
        and ansible_facts.pkg_mgr == 'apt'

- name: Apply security updates
  # `only_upgrade` semantics: already-installed packages only, security pocket
  # only. A full dist-upgrade unattended is how a routine Tuesday becomes an
  # outage on a fleet with no on-call.
  apt:
    update_cache: true
    upgrade: "no"
    default_release: "{{ ansible_facts.distribution_release }}-security"
    name: "*"
    state: latest
    only_upgrade: true
  register: _security_patch
  # A node that cannot patch still needs its disk cleaned. The RPi4 is the
  # standing proof — its apt has been unable to resolve `bzip2` since #1198 —
  # and a run that aborted there would have stopped vacuuming journals on a
  # node with 8GB of storage, trading a CVE for a full disk.
  failed_when: false
  # ...but NOT while a runtime package it should have held is unprotected.
  # Skipping the upgrade leaves the node unpatched, which is recoverable;
  # upgrading with docker unheld restarts every container on it, which is not.
  when: maintenance_run_cleanup | bool and maintenance_security_updates | bool
        and ansible_facts.pkg_mgr == 'apt'
        and (_unprotected | default([]) | length) == 0

- name: Report a package that could not be held
  debug:
    msg: >-
      {{ inventory_hostname }}: security patching SKIPPED — could not hold
      {{ _unprotected | join(', ') }}, which {{ 'is' if _unprotected | length == 1 else 'are' }}
      installed here. Upgrading without that hold would restart the workload it
      protects. Patch this node deliberately.
  when: maintenance_run_cleanup | bool and maintenance_security_updates | bool
        and (_unprotected | default([]) | length) > 0

- name: Release only the holds THIS RUN created
  # `maintenance_patch_blacklist` minus what was already held, so an operator's
  # deliberate pin survives. The hold lasts the run, not longer — and not less.
  command: "apt-mark unhold {{ item }}"
  loop: "{{ maintenance_patch_blacklist | difference(_holds_before.stdout_lines | default([])) }}"
  changed_when: false
  failed_when: false
  when: maintenance_run_cleanup | bool and maintenance_security_updates | bool
        and ansible_facts.pkg_mgr == 'apt'

- name: Report the patch outcome
  debug:
    msg: >-
      security patching:
      {{ 'FAILED — ' ~ (_security_patch.msg | default('see above'))
         if _security_patch.failed | default(false)
         else ('applied' if _security_patch.changed | default(false) else 'already current') }}
  when: maintenance_run_cleanup | bool and maintenance_security_updates | bool
        and ansible_facts.pkg_mgr == 'apt'

- name: Check whether a reboot is pending
  # A kernel installed is not a kernel running. Nothing here reboots — the VPS
  # carries Headscale, so an unattended reboot that does not come back removes
  # the VPN used to reach it — so the state is reported and the operator decides.
  stat:
    path: /var/run/reboot-required
  register: _reboot_required
  when: maintenance_report_reboot_required | bool

- name: Report a pending reboot
  debug:
    msg: >-
      {{ inventory_hostname }}: REBOOT REQUIRED — a patched kernel is on disk and
      the old one is still running. Reboot deliberately; nothing here will.
  when: maintenance_report_reboot_required | bool
        and _reboot_required.stat.exists | default(false)

# --- APT cleanup ---
- name: Clean APT cache
  command: apt-get clean
  changed_when: false
  when: maintenance_run_cleanup | bool and ansible_facts.pkg_mgr == 'apt'

- name: Remove APT package lists
  file:
    path: /var/lib/apt/lists
    state: absent
  when: maintenance_run_cleanup | bool and ansible_facts.pkg_mgr == 'apt'

- name: Recreate APT lists directory
  file:
    path: /var/lib/apt/lists/partial
    state: directory
    mode: "0700"
  when: maintenance_run_cleanup | bool and ansible_facts.pkg_mgr == 'apt'

# --- Journal cleanup ---
- name: Vacuum journal logs to {{ maintenance_journal_max_size }}
  command: journalctl --vacuum-size={{ maintenance_journal_max_size }}
  register: _journal
  changed_when: "'Deleted' in _journal.stdout"
  when: maintenance_run_cleanup | bool

# --- Rotated rsyslog cleanup (RELIAB-009 follow-up) ---
- name: Find rotated rsyslog files older than {{ maintenance_rotated_log_retention_days }} days
  find:
    paths: /var/log
    file_type: file
    age: "{{ maintenance_rotated_log_retention_days }}d"
    patterns:
      - 'syslog.*'
      - '*.log.*'
      - 'btmp.*'
      - 'wtmp.*'
      - 'lastlog.*'
    recurse: false
  register: _rotated_logs
  when: maintenance_run_cleanup | bool

- name: Delete rotated rsyslog files
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _rotated_logs.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: maintenance_run_cleanup | bool and _rotated_logs.matched | int > 0

- name: Find active /var/log/syslog if larger than {{ maintenance_active_log_max_mb }}MB
  find:
    paths: /var/log
    file_type: file
    patterns: ['syslog']
    size: "{{ maintenance_active_log_max_mb }}m"
    recurse: false
  register: _oversize_syslog
  when: maintenance_run_cleanup | bool and maintenance_active_log_max_mb | int > 0

- name: "Safety: truncate oversize active syslog to 0 bytes"
  copy:
    content: ""
    dest: "{{ item.path }}"
    owner: syslog
    group: adm
    mode: "0640"
  loop: "{{ _oversize_syslog.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - maintenance_run_cleanup | bool
    - maintenance_active_log_max_mb | int > 0
    - _oversize_syslog.matched | default(0) | int > 0

# --- Snap cleanup ---
- name: Check snap refresh retention
  command: snap get system refresh.retain
  register: _snap_retain_check
  changed_when: false
  ignore_errors: true
  when: maintenance_run_cleanup | bool

- name: Set snap refresh retention to {{ maintenance_snap_retain }}
  command: snap set system refresh.retain={{ maintenance_snap_retain }}
  when: >-
    maintenance_run_cleanup | bool and
    _snap_retain_check.stdout | default('') | trim != maintenance_snap_retain | string
  ignore_errors: true

- name: Remove disabled snap revisions
  shell: |
    snap list --all 2>/dev/null | awk '/disabled/{print $1, $3}' | \
    while read name rev; do snap remove "$name" --revision="$rev" 2>/dev/null; done
  register: _snap_clean
  changed_when: _snap_clean.stdout | length > 0
  ignore_errors: true
  when: maintenance_run_cleanup | bool

# --- Docker cleanup (docker_hosts group) ---
- name: Prune unused Docker images
  command: docker image prune -af
  when: maintenance_run_cleanup | bool and 'docker_hosts' in group_names
  register: _docker_prune
  changed_when: "'Total reclaimed space' in _docker_prune.stdout"
  ignore_errors: true

- name: Warn if Docker prune failed
  debug:
    msg: "WARNING: Docker image prune failed — {{ _docker_prune.stderr | default('unknown') }}"
  when: _docker_prune is defined and _docker_prune.rc | default(0) != 0

- name: Prune Docker build cache
  command: docker builder prune -af
  when: maintenance_run_cleanup | bool and 'docker_hosts' in group_names
  register: _docker_builder
  changed_when: "'Total reclaimed space' in _docker_builder.stdout"
  ignore_errors: true

- name: Remove stopped Docker containers
  command: docker container prune -f
  when: maintenance_run_cleanup | bool and 'docker_hosts' in group_names
  register: _docker_container_prune
  changed_when: "'Total reclaimed space' in _docker_container_prune.stdout"
  ignore_errors: true

- name: Find running ad-hoc buildx builder containers
  # docker/setup-buildx-action creates a randomly-named
  # "buildx_buildkit_builder-<uuid>" container per CI job via the
  # docker-container driver. The ephemeral self-hosted GH runner that created
  # it (EPHEMERAL: 1) is destroyed after every job; the BuildKit container it
  # left on the host's shared Docker daemon is not, and `docker buildx ls`
  # cannot see it — that command only reads the CLI's own local state under
  # ~/.docker/buildx/instances, not the host's containers, so `docker builder
  # prune` above never reaches it either.
  #
  # A buildx node container is supposed to stop itself when idle — multiarch0,
  # the one this fleet does manage (beelink_services), shows "inactive"
  # between builds. One that has been running for the host's entire uptime is
  # orphaned, not mid-build. Measured on beelink 2026-08-27: four such
  # containers, all predating ADR-030's 2026-06-26 hosted-primary amendment.
  # #1456.
  command: docker ps --filter "name=buildx_buildkit_builder-" --format "{% raw %}{{.Names}} ({{.Status}}){% endraw %}"
  register: _orphan_buildx
  changed_when: false
  ignore_errors: true
  when: maintenance_run_cleanup | bool and 'docker_hosts' in group_names

- name: Warn about orphaned buildx builder containers
  # Not auto-removed: this timer cannot tell an orphan apart from a build
  # genuinely in progress, and killing a live build unattended is worse than
  # leaving a stray container running. Same posture as the reboot-required
  # check above — report, and an operator clears it with `docker rm -f`.
  debug:
    msg: >-
      WARNING: {{ inventory_hostname }} has {{ _orphan_buildx.stdout_lines | default([]) | length }}
      ad-hoc buildx builder container(s) still running (not the managed
      "multiarch" builder): {{ _orphan_buildx.stdout_lines | default([]) | join(', ') }}.
      Verify none is mid-build, then `docker rm -f <name>`.
  when: >-
    maintenance_run_cleanup | bool and 'docker_hosts' in group_names and
    (_orphan_buildx.stdout_lines | default([]) | length) > 0

# --- K3s cleanup (k3s_servers or hub nodes) ---
- name: Prune unused container images (crictl)
  command: crictl rmi --prune
  when: >-
    maintenance_run_cleanup | bool and
    ('k3s_servers' in group_names or maintenance_is_k3s_node | bool)
  register: _crictl
  changed_when: _crictl.stdout_lines | default([]) | length > 0
  ignore_errors: true

# --- Temp files (skip symlinks for security) ---
- name: Find temp files older than {{ maintenance_tmp_max_days }} days
  find:
    paths: [/tmp, /var/tmp]
    file_type: file
    age: "{{ maintenance_tmp_max_days }}d"
    age_stamp: atime
    excludes: []
  register: _tmp_clean
  when: maintenance_run_cleanup | bool

- name: Delete old temp files
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _tmp_clean.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: maintenance_run_cleanup | bool and _tmp_clean.matched | int > 0

# --- Post-cleanup report ---
- name: Report disk usage (after)
  command: df -h /
  register: _disk_after
  changed_when: false
  when: maintenance_run_cleanup | bool

- name: Show cleanup summary
  debug:
    msg: |
      BEFORE: {{ _disk_before.stdout_lines | default([]) | last | default('N/A') }}
      AFTER:  {{ _disk_after.stdout_lines | default([]) | last | default('N/A') }}
  when: maintenance_run_cleanup | bool

# --- Systemd timer (optional) ---
- name: Install maintenance script
  template:
    src: kubelab-maintenance.sh.j2
    dest: /opt/kubelab-maintenance.sh
    mode: "0700"
  when: maintenance_install_timer | bool

- name: Install maintenance service unit
  template:
    src: kubelab-maintenance.service.j2
    dest: /etc/systemd/system/kubelab-maintenance.service
    mode: "0644"
  when: maintenance_install_timer | bool

- name: Install maintenance timer unit
  template:
    src: kubelab-maintenance.timer.j2
    dest: /etc/systemd/system/kubelab-maintenance.timer
    mode: "0644"
  when: maintenance_install_timer | bool

# The OnFailure notify path lives in the `node_notify` role now: one
# `kubelab-notify@.service` template serving every unit in the fleet, plus the
# fleet webhook secret it reads. This role only declares the linkage, in
# kubelab-maintenance.service.j2.

- name: Enable and start maintenance timer
  systemd:
    name: kubelab-maintenance.timer
    state: started
    enabled: true
    daemon_reload: true
  when: maintenance_install_timer | bool

# --- retire the single-purpose notifier -----------------------------------
# Deliberately AFTER the reload above, which is what makes it safe: at this
# point kubelab-maintenance.service on disk names kubelab-notify@%n.service,
# systemd has re-read it, and nothing references the old unit any more.
#
# Run before that reload -- which is where these tasks first lived, in
# node_notify -- and the file is gone while systemd still has the previous
# version of the consumer loaded and pointing at it. A maintenance failure in
# that window invokes a target that no longer exists. Seconds wide and
# vanishingly unlikely, but it is a window that did not need to exist.
- name: Remove the superseded notify unit
  file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop: "{{ maintenance_superseded_notify_units }}"
  register: superseded_units_removed
  when: maintenance_install_timer | bool

- name: Remove the superseded notify script and its secret
  file:
    path: "{{ item }}"
    state: absent
  loop: "{{ maintenance_superseded_notify_files }}"
  when: maintenance_install_timer | bool

# Only when something was actually removed, so a re-provision of an
# already-migrated node reports no change.
- name: Drop the removed unit from systemd's view
  systemd:
    daemon_reload: true
  when:
    - maintenance_install_timer | bool
    - superseded_units_removed.changed
