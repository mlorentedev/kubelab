---
# =============================================================================
# Node Maintenance — disk cleanup + optional systemd timer
# Works on all node types: K3s, Docker, hub, gateway
#
# ANSIBLE-035: the cleanup tasks below are gated behind maintenance_run_cleanup
# (default true), independently of maintenance_install_timer (also default
# true). Provisioning playbooks include this role to install the timer but
# pass maintenance_run_cleanup: false, so `make provision` never ALSO runs a
# synchronous cleanup pass -- cleanup only runs on the timer's own weekly
# schedule, or via `make maintain TIMER=1`'s explicit manual invocation.
# See defaults/main.yml for why that matters (apt cache, Docker/K3s caches).
# =============================================================================

# --- Forensic sanity check (ANSIBLE-023) ---
# Persistent journald is configured by base_system role. Surface a warning if
# /var/log/journal is missing so an unprovisioned node is noticed during the
# next scheduled maintenance run.
- name: Probe persistent journal directory
  stat:
    path: /var/log/journal
  register: _journal_dir
  changed_when: false
  when: maintenance_run_cleanup | bool

- name: Warn if persistent journal directory is missing
  debug:
    msg: >-
      WARNING: /var/log/journal missing — journald is volatile, crash forensics
      will be lost on reboot. Re-run base_system role (ANSIBLE-023).
  when: maintenance_run_cleanup | bool and not _journal_dir.stat.exists

# --- Pre-cleanup report ---
- name: Report disk usage (before)
  command: df -h /
  register: _disk_before
  changed_when: false
  when: maintenance_run_cleanup | bool

- name: Show disk before
  debug:
    msg: "BEFORE: {{ _disk_before.stdout_lines | default([]) | last | default('N/A (check mode)') }}"
  when: maintenance_run_cleanup | bool

# --- APT cleanup ---
- name: Clean APT cache
  command: apt-get clean
  changed_when: false
  when: maintenance_run_cleanup | bool and ansible_facts.pkg_mgr == 'apt'

- name: Remove APT package lists
  file:
    path: /var/lib/apt/lists
    state: absent
  when: maintenance_run_cleanup | bool and ansible_facts.pkg_mgr == 'apt'

- name: Recreate APT lists directory
  file:
    path: /var/lib/apt/lists/partial
    state: directory
    mode: "0700"
  when: maintenance_run_cleanup | bool and ansible_facts.pkg_mgr == 'apt'

# --- Journal cleanup ---
- name: Vacuum journal logs to {{ maintenance_journal_max_size }}
  command: journalctl --vacuum-size={{ maintenance_journal_max_size }}
  register: _journal
  changed_when: "'Deleted' in _journal.stdout"
  when: maintenance_run_cleanup | bool

# --- Rotated rsyslog cleanup (RELIAB-009 follow-up) ---
- name: Find rotated rsyslog files older than {{ maintenance_rotated_log_retention_days }} days
  find:
    paths: /var/log
    file_type: file
    age: "{{ maintenance_rotated_log_retention_days }}d"
    patterns:
      - 'syslog.*'
      - '*.log.*'
      - 'btmp.*'
      - 'wtmp.*'
      - 'lastlog.*'
    recurse: false
  register: _rotated_logs
  when: maintenance_run_cleanup | bool

- name: Delete rotated rsyslog files
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _rotated_logs.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: maintenance_run_cleanup | bool and _rotated_logs.matched | int > 0

- name: Find active /var/log/syslog if larger than {{ maintenance_active_log_max_mb }}MB
  find:
    paths: /var/log
    file_type: file
    patterns: ['syslog']
    size: "{{ maintenance_active_log_max_mb }}m"
    recurse: false
  register: _oversize_syslog
  when: maintenance_run_cleanup | bool and maintenance_active_log_max_mb | int > 0

- name: "Safety: truncate oversize active syslog to 0 bytes"
  copy:
    content: ""
    dest: "{{ item.path }}"
    owner: syslog
    group: adm
    mode: "0640"
  loop: "{{ _oversize_syslog.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - maintenance_run_cleanup | bool
    - maintenance_active_log_max_mb | int > 0
    - _oversize_syslog.matched | default(0) | int > 0

# --- Snap cleanup ---
- name: Check snap refresh retention
  command: snap get system refresh.retain
  register: _snap_retain_check
  changed_when: false
  ignore_errors: true
  when: maintenance_run_cleanup | bool

- name: Set snap refresh retention to {{ maintenance_snap_retain }}
  command: snap set system refresh.retain={{ maintenance_snap_retain }}
  when: >-
    maintenance_run_cleanup | bool and
    _snap_retain_check.stdout | default('') | trim != maintenance_snap_retain | string
  ignore_errors: true

- name: Remove disabled snap revisions
  shell: |
    snap list --all 2>/dev/null | awk '/disabled/{print $1, $3}' | \
    while read name rev; do snap remove "$name" --revision="$rev" 2>/dev/null; done
  register: _snap_clean
  changed_when: _snap_clean.stdout | length > 0
  ignore_errors: true
  when: maintenance_run_cleanup | bool

# --- Docker cleanup (docker_hosts group) ---
- name: Prune unused Docker images
  command: docker image prune -af
  when: maintenance_run_cleanup | bool and 'docker_hosts' in group_names
  register: _docker_prune
  changed_when: "'Total reclaimed space' in _docker_prune.stdout"
  ignore_errors: true

- name: Warn if Docker prune failed
  debug:
    msg: "WARNING: Docker image prune failed — {{ _docker_prune.stderr | default('unknown') }}"
  when: _docker_prune is defined and _docker_prune.rc | default(0) != 0

- name: Prune Docker build cache
  command: docker builder prune -af
  when: maintenance_run_cleanup | bool and 'docker_hosts' in group_names
  register: _docker_builder
  changed_when: "'Total reclaimed space' in _docker_builder.stdout"
  ignore_errors: true

# --- K3s cleanup (k3s_servers or hub nodes) ---
- name: Prune unused container images (crictl)
  command: crictl rmi --prune
  when: >-
    maintenance_run_cleanup | bool and
    ('k3s_servers' in group_names or maintenance_is_k3s_node | bool)
  register: _crictl
  changed_when: _crictl.stdout_lines | default([]) | length > 0
  ignore_errors: true

# --- Temp files (skip symlinks for security) ---
- name: Find temp files older than {{ maintenance_tmp_max_days }} days
  find:
    paths: [/tmp, /var/tmp]
    file_type: file
    age: "{{ maintenance_tmp_max_days }}d"
    age_stamp: atime
    excludes: []
  register: _tmp_clean
  when: maintenance_run_cleanup | bool

- name: Delete old temp files
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _tmp_clean.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: maintenance_run_cleanup | bool and _tmp_clean.matched | int > 0

# --- Post-cleanup report ---
- name: Report disk usage (after)
  command: df -h /
  register: _disk_after
  changed_when: false
  when: maintenance_run_cleanup | bool

- name: Show cleanup summary
  debug:
    msg: |
      BEFORE: {{ _disk_before.stdout_lines | default([]) | last | default('N/A') }}
      AFTER:  {{ _disk_after.stdout_lines | default([]) | last | default('N/A') }}
  when: maintenance_run_cleanup | bool

# --- Systemd timer (optional) ---
- name: Install maintenance script
  template:
    src: kubelab-maintenance.sh.j2
    dest: /opt/kubelab-maintenance.sh
    mode: "0700"
  when: maintenance_install_timer | bool

- name: Install maintenance service unit
  template:
    src: kubelab-maintenance.service.j2
    dest: /etc/systemd/system/kubelab-maintenance.service
    mode: "0644"
  when: maintenance_install_timer | bool

- name: Install maintenance timer unit
  template:
    src: kubelab-maintenance.timer.j2
    dest: /etc/systemd/system/kubelab-maintenance.timer
    mode: "0644"
  when: maintenance_install_timer | bool

# The OnFailure notify path lives in the `node_notify` role now: one
# `kubelab-notify@.service` template serving every unit in the fleet, plus the
# fleet webhook secret it reads. This role only declares the linkage, in
# kubelab-maintenance.service.j2.

- name: Enable and start maintenance timer
  systemd:
    name: kubelab-maintenance.timer
    state: started
    enabled: true
    daemon_reload: true
  when: maintenance_install_timer | bool

# --- retire the single-purpose notifier -----------------------------------
# Deliberately AFTER the reload above, which is what makes it safe: at this
# point kubelab-maintenance.service on disk names kubelab-notify@%n.service,
# systemd has re-read it, and nothing references the old unit any more.
#
# Run before that reload -- which is where these tasks first lived, in
# node_notify -- and the file is gone while systemd still has the previous
# version of the consumer loaded and pointing at it. A maintenance failure in
# that window invokes a target that no longer exists. Seconds wide and
# vanishingly unlikely, but it is a window that did not need to exist.
- name: Remove the superseded notify unit
  file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop: "{{ maintenance_superseded_notify_units }}"
  register: superseded_units_removed
  when: maintenance_install_timer | bool

- name: Remove the superseded notify script and its secret
  file:
    path: "{{ item }}"
    state: absent
  loop: "{{ maintenance_superseded_notify_files }}"
  when: maintenance_install_timer | bool

# Only when something was actually removed, so a re-provision of an
# already-migrated node reports no change.
- name: Drop the removed unit from systemd's view
  systemd:
    daemon_reload: true
  when:
    - maintenance_install_timer | bool
    - superseded_units_removed.changed
