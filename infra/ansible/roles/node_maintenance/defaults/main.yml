---
maintenance_journal_max_size: "20M"
maintenance_snap_retain: 2
maintenance_tmp_max_days: 7
# ANSIBLE-035: the timer is now a property of provisioning, not an
# imperative follow-up (make maintain NODE=x TIMER=1). Default true so
# every node that includes this role gets it, unless a playbook opts out.
maintenance_install_timer: true
# DAILY on the CI node, weekly elsewhere (OPS-024, #1657). Measured on the
# Beelink 2026-10-04: every build-cache entry was under five days old, so the
# weekly prune was running, and two busy CI days (~700 Gitea tasks) still left
# 31 GB of build cache, 5 GB of exited job containers and 19 GB of images. A
# weekly bound lets a single busy week fill a 98 GB disk; a daily one bounds it
# to a day. The cost is a re-pull of `runner-images` after each prune, which
# act_runner's `force_pull: true` already pays on every job anyway.
maintenance_timer_schedule: "{{ 'daily' if maintenance_docker_reclaim | bool else 'weekly' }}"
# Override for nodes with K3s but not in k3s_servers group (e.g. aws1 hub)
maintenance_is_k3s_node: false

# ANSIBLE-035: gates the disk-cleanup tasks (APT/journal/rsyslog/snap/
# Docker/crictl/temp-file) independently of maintenance_install_timer.
# Provisioning playbooks set this false: including the role to install the
# timer must NOT also run a synchronous cleanup pass on every
# `make provision` -- that would wipe /var/lib/apt/lists right after
# base_system populates it (the exact empty-cache state that produces a
# false `vim`-style failure under --check, see OPS-017/#1059) and would
# evict ace1's staging K3s image cache / beelink's CI build cache on every
# re-provision via `docker image/builder prune -af`. Cleanup is meant to
# run on the timer's own weekly schedule, or via `make maintain TIMER=1`'s
# explicit manual invocation -- both of which inherit this `true` default.
maintenance_run_cleanup: true

# --- security patching (SEC-010) ------------------------------------------
# The timer cleaned disk and patched NOTHING. Eight nodes accumulated CVEs
# with no automation and no report; the VPS among them, which is the only
# internet-facing host and the Headscale bootstrap dependency.
#
# `security` ONLY. A full `dist-upgrade` on an unattended timer is how a
# routine Tuesday becomes an outage: this fleet has no on-call, and the
# blacklist below cannot anticipate every package a full upgrade would touch.
maintenance_security_updates: true

# Packages NEVER upgraded by the timer, because upgrading them RESTARTS the
# thing they belong to, unattended, on a node nobody is watching:
#   docker/containerd — restarting the runtime stops every container. On ace1
#     that is K3s itself; on beelink it is Gitea and the CI runner.
#   k3s              — the cluster.
#   tailscale        — the path this fleet is administered over. A failed
#     upgrade removes the way in to fix it.
# These are patched deliberately, by an operator who can watch, which is what
# `make maintain NODE=x` is for.
maintenance_patch_blacklist:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker.io
  - containerd
  - k3s
  - tailscale

# A kernel installed is not a kernel running. `unattended-upgrades` never
# reboots here — see the role's tasks for why the VPS in particular must not —
# so the run REPORTS whether a reboot is pending instead. Left unreported, a
# patched-on-disk node reads as safe while running the old kernel, which is
# worse than not patching: it manufactures confidence.
maintenance_report_reboot_required: true

# Rotated rsyslog files (syslog.1, syslog.2.gz, kern.log.1, auth.log.*…) older
# than N days. logrotate keeps 7 by default; on low-disk nodes the spike from
# a single bad day (e.g. K3s futex deadlock spamming syslog) can fill before
# the nightly rotation. RELIAB-009 incident 2026-05-10: 201MB in syslog.1.
maintenance_rotated_log_retention_days: 3

# Safety net against runaway loggers BEFORE logrotate's nightly cron runs:
# if the ACTIVE /var/log/syslog exceeds this size, truncate to 0. Set to 0
# to disable. RELIAB-009 incident 2026-05-10.
maintenance_active_log_max_mb: 100

# --- OnFailure notify ------------------------------------------------------
# The mechanism moved to roles/node_notify (BACKUP-044 Part 5). This role keeps
# the `OnFailure=kubelab-notify@%n.service` linkage on its own unit; the domain,
# the secret file and the script are that role's SSOT now.
#
# The single-purpose notifier this role used to install is removed HERE, not
# there, and the order is the reason. Ansible is additive, so deleting the
# install tasks alone would strand these on every node that ever ran them (the
# `dev_node` precedent in CLAUDE.md) -- but removing them from node_notify would
# delete the unit file while systemd still has the OLD kubelab-maintenance.service
# loaded and naming it. The removal therefore runs after this role re-templates
# its own unit and reloads, at which point nothing references them.
#
# No `systemctl disable` step, and that is checked rather than assumed: the old
# unit had no [Install] section, so it was never enabled and there is no symlink
# to break. It was only ever reachable through the OnFailure= this role declares.
maintenance_superseded_notify_units:
  - kubelab-maintenance-notify.service
maintenance_superseded_notify_files:
  - /opt/kubelab-maintenance-notify.sh
  - /opt/kubelab-maintenance-notify-secret

# --- CI residue reclaim (OPS-024, #1657) ------------------------------------
# act_runner (0.2.13, gitea/act v0.261.7) removes a job's two named volumes in
# a cleanup that runs only after the job container STARTED: `job_executor.go`
# chains it behind `startContainer()`, so a job cancelled during setup (nine of
# ten measured leaks, cancelled 1-5s after start, mid-`docker pull`) or a runner
# lost mid-job (the tenth: the node went down) skips it, and Docker's `--rm`
# never removes NAMED volumes. No setting in this version changes that, so the
# residue is bounded here, by the same filter the emergency `make node-reclaim`
# uses: toolkit/features/docker_reclaim.py, copied to the node as-is.
#
# On by inventory group, not by a per-playbook flag: `platform_nodes` is the CI
# node (ADR-028), and both callers of this role -- provision-bee and `make
# maintain` -- see the same group, so neither can install a timer without it.
maintenance_docker_reclaim: "{{ 'platform_nodes' in group_names }}"
maintenance_docker_reclaim_script: /opt/kubelab-docker-reclaim.py
# The source the role copies. Resolved from the role, not the playbook, so it
# is the same file whichever playbook runs this.
maintenance_docker_reclaim_source: "{{ role_path }}/../../../../toolkit/features/docker_reclaim.py"
# Unattended, so wider than the module's 4h default (an operator watching a
# `make node-reclaim` plan can go lower). A day is far above anything this
# fleet runs: act_runner kills a job container after 3h (`sleep 10800`).
maintenance_docker_reclaim_min_age_hours: 24
# What the reclaim may never take, as DATA: common.yaml's `backup` block, which
# the module turns into names (`protected_volumes`) and refuses to run without.
# Read through `role_path` for the same reason as the source above.
maintenance_backup_declaration_file: /opt/kubelab-backup-declaration.json
maintenance_backup_declaration: >-
  {{ (lookup('ansible.builtin.file', role_path ~ '/../../../config/values/common.yaml')
      | from_yaml).backup }}

# --- disk pressure is a failure, not a log line (OPS-024 invariant 4) -------
# After cleanup, a root filesystem at or above this percentage fails the run,
# so `OnFailure=kubelab-notify@` tells someone. Mirrors the live threshold in
# tests/infra/test_nodes.py (80, and 92 on the hub, whose 8 GB disk sits high
# by design); tests/test_node_maintenance_docker_reclaim.py keeps them equal.
# The alarm runs at the timer's cadence. A continuous signal is OBS-027 (#1727)
# step 3.
maintenance_disk_alert_percent: "{{ 92 if 'hub' in group_names else 80 }}"
