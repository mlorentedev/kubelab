---
base_packages:
  - curl
  - wget
  - git
  - htop
  - vim
  - tmux
  - jq
  - unzip
  - ca-certificates
  - gnupg
  - lsb-release
  - python3-pip
  - apt-transport-https
  - software-properties-common
  - iotop
  - sysstat
  - ncdu
  - net-tools
  # Not `dnsutils`: on Debian trixie it's a pure virtual package (Provides
  # only, no dpkg entry of its own -- `dpkg -l dnsutils` reports `un`), so
  # Ansible's apt module -- which pre-checks the literal requested name
  # against dpkg rather than resolving Provides the way apt-get itself does
  # -- reports `changed: true` on every single run even though apt-get logs
  # "0 upgraded, 0 newly installed". On Ubuntu 24.04 `dnsutils` happens to be
  # a real transitional package (dpkg `ii`), so the module gets it right
  # there -- naming the real provider makes both OSes correct instead of
  # relying on an Ubuntu-only coincidence. Found via rpi3 (OPS-017), the
  # first Debian-family node to ever run this role.
  - bind9-dnsutils

# Entries in base_packages that only exist on Ubuntu, not Debian (OPS-017).
# software-properties-common ships `add-apt-repository` — PPA tooling for a
# concept Debian doesn't have; nothing in this repo's roles actually needs
# the package itself. `apt_repository` (used by roles/docker and
# roles/dev_node) talks to python3-apt directly, not this CLI. Filtered by
# the real `ansible_facts['distribution']` fact in tasks/main.yml rather than
# a per-node override — same reasoning ANSIBLE-035 gives for rejecting a
# per-node key: it invites drift nobody audits.
base_packages_ubuntu_only:
  - software-properties-common

system_timezone: "Europe/Madrid"

firewall_enabled: true
firewall_allowed_ports:
  - { port: 22, proto: tcp }
  - { port: 80, proto: tcp }
  - { port: 443, proto: tcp }
  - { port: 41641, proto: udp }

# Per-node tailnet-only ports (interface_in: tailscale0). Empty by default;
# declared per node in its provision playbook. See the task comment in
# tasks/main.yml for what this can and cannot restrict.
firewall_tailnet_ports: []

deploy_base_dir: "/opt"

# --- Persistent journald + log retention bounds (ANSIBLE-023) ---
# rpi3 outage 2026-05-11: journald ran volatile, crash forensics lost on power cycle.
# These are explicit (do not rely on Storage=auto) and capped for low-disk nodes.
journald_storage: "persistent"
journald_system_max_use: "20M"
journald_system_keep_free: "50M"
journald_runtime_max_use: "10M"

# --- Logrotate cadence (ANSIBLE-023) ---
# Default logrotate.timer is daily — a burst between runs can fill the FS.
# Hourly cadence means per-file `size` directives in /etc/logrotate.d/* trigger
# near-real-time. RandomizedDelaySec spreads jitter across the fleet.
logrotate_schedule: "hourly"
logrotate_randomized_delay: "10m"

# --- rsyslog active-file size cap (ANSIBLE-023) ---
# Add `size <N>` to the /var/log/syslog block in /etc/logrotate.d/rsyslog so
# logrotate rotates the active file before it crosses N (defense in depth on
# top of node_maintenance maintenance_active_log_max_mb truncate).
# Silently skipped on nodes where rsyslog is inactive (e.g. rpi3 trixie).
rsyslog_logrotate_size_cap: "50M"
