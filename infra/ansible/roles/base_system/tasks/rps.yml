---
# Receive packet steering (#3375). The udev rule sets the mask whenever the
# interface appears (boot, driver reload). This run writes it now, only where a
# queue differs, and reads it back: a step that matched nothing would otherwise
# report ok on a node still steering nothing (lesson-620). It writes sysfs and
# never triggers udev, because a `change` on the LAN interface reaches the
# network stack's own rules too.
- name: The mask this run declares (0 is the kernel's default, steering off)
  ansible.builtin.set_fact:
    _rps_want: "{{ base_system_rps_mask if base_system_rps_enabled | bool else '0' }}"

- name: Render the receive packet steering rule
  ansible.builtin.template:
    src: rps.rules.j2
    dest: "{{ base_system_rps_rules_path }}"
    owner: root
    group: root
    mode: "0644"
  when: base_system_rps_enabled | bool

- name: Remove the rule when steering is off
  ansible.builtin.file:
    path: "{{ base_system_rps_rules_path }}"
    state: absent
  when: not (base_system_rps_enabled | bool)

- name: Set the steering mask on every receive queue that differs
  ansible.builtin.shell: |
    set -eu
    want=$((0x{{ _rps_want }}))
    changed=0
    for q in /sys/class/net/{{ base_system_rps_interface | quote }}/queues/rx-*/rps_cpus; do
      have=$((0x$(tr -d ',' < "$q")))
      if [ "$have" -ne "$want" ]; then echo {{ _rps_want }} > "$q"; changed=1; fi
    done
    echo "changed=$changed"
  args:
    executable: /bin/bash
  register: _rps_write
  changed_when: "'changed=1' in _rps_write.stdout"

- name: Read the receive queues' steering masks back
  ansible.builtin.shell: cat /sys/class/net/{{ base_system_rps_interface | quote }}/queues/rx-*/rps_cpus
  register: _rps_masks
  changed_when: false
  check_mode: false

- name: Every receive queue carries the declared mask
  ansible.builtin.assert:
    that:
      - _rps_masks.stdout_lines | length > 0
      - _rps_masks.stdout_lines | map('replace', ',', '') | map('int', base=16) | unique | list
        == [_rps_want | int(base=16)]
    fail_msg: >-
      {{ base_system_rps_interface }} reads {{ _rps_masks.stdout_lines }}, not {{ _rps_want }}.
  when: not ansible_check_mode
