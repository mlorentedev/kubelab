---
coredns_image: "coredns/coredns:1.12.1"
# The LAN resolver: a deploy pulls this, so a rolling tag would upgrade it unasked.
# The dev stack (infra/stacks/services/core/pihole) runs the same tag; bump both.
pihole_image: "pihole/pihole:2026.10.0"
# Absolute, like every other service under /opt. A remote `~` is the home of
# whoever the task runs as, so `~/coredns` was /home/<user>/coredns from
# deploy-dns.yml and /root/coredns from provision-rpi4.yml: one stack, two
# directories, each caller moving the containers to its own copy (ANSIBLE-064).
coredns_remote_dir: /opt/coredns
# The basename is also the compose project name, which names the Pi-hole
# volume (`coredns_pihole_data`). The compose file pins it, so the volume no
# longer depends on where the directory is.
coredns_project: coredns
# Where `~/coredns` resolved before ANSIBLE-064. Removed once the stack is
# healthy from coredns_remote_dir.
coredns_legacy_dirs:
  - /root/coredns
  - "/home/{{ common.networking.ssh_users.homelab }}/coredns"
coredns_port: 5353
# CoreDNS `health` plugin, published for external probing because the image is
# distroless and cannot be probed from inside. `ready` (:8181) stays unpublished.
coredns_health_port: 8080
pihole_port: 53
pihole_web_port: 80
pihole_timezone: "America/Denver"
# Derived from the SSOT here, once, rather than passed by each playbook. Two
# playbooks run this role (deploy-dns.yml and provision-rpi4.yml) and each
# copied the mapping by hand, so the copies drifted: #1278 added
# `coredns_health_bind_ip` to one, and `make provision NODE=rpi4` has failed on
# it since (#1982). Every caller loads common.yaml as `common` in its
# pre_tasks; defaults are templated lazily, so that is in place by the time a
# task reads them.
#
# common.yaml, not the env-merged `config`: the RPi4 gateway serves DNS for
# every environment, so it takes the base values, never an env override.
restart_policy: "{{ common.global.restart_policy }}"
base_domain: "{{ common.global.base_domain }}"
staging_domain: "staging.{{ common.global.base_domain }}"
staging_zones: "{{ common.networking.staging_zones }}"
vps_public_ip: "{{ common.networking.vps.public_ip }}"
# Where CoreDNS binds its health port: loopback, because a node address may not
# exist when Docker starts, and a failed bind drops the whole container's port
# publication. See the comment in docker-compose.yml.j2.
coredns_health_bind_ip: "127.0.0.1"
node_ips:
  vps: "{{ common.networking.vps.tailscale_ip }}"
  ace1: "{{ common.networking.nodes.ace1.tailscale_ip }}"
  ace2: "{{ common.networking.nodes.ace2.tailscale_ip }}"
  rpi3: "{{ common.networking.nodes.rpi3.tailscale_ip }}"
  rpi4: "{{ common.networking.nodes.rpi4.tailscale_ip }}"
  beelink: "{{ common.networking.nodes.beelink.tailscale_ip }}"
  jetson: "{{ common.networking.nodes.jetson.tailscale_ip }}"
# The public DNS records, the list Cloudflare publishes (infra/terraform/dns).
# The LAN prod zone is rendered from it, so a record cannot point one way in
# public DNS and another on the LAN (#2212).
coredns_public_records: "{{ lookup('file', role_path ~ '/../../../terraform/dns/services.json') | from_json }}"
service_domains:
  vpn: "{{ common.apps.services.core.headscale.domain }}"
  status: "{{ common.apps.services.observability.uptime_kuma.domain }}"
  jetson: "jetson.{{ common.global.base_domain }}"
