---
# The role runs as root whatever its caller declares. deploy-dns.yml has no
# `become` and provision-rpi4.yml has it at play level, and a role whose result
# depends on which one called it has two results (ANSIBLE-064).
- name: DNS gateway stack (CoreDNS + Pi-hole)
  become: true
  block:
    - name: Create CoreDNS directory
      file:
        path: "{{ coredns_remote_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Template docker-compose.yml
      template:
        src: docker-compose.yml.j2
        dest: "{{ coredns_remote_dir }}/docker-compose.yml"
        mode: "0644"
      register: coredns_compose

    # The edge's own pulls leave by the uplink it shapes, so its plays size them
    # like a node behind it (#2742). Before the config templates: a pull refused
    # after a Corefile change would stop the play before its restart, and the
    # rerun, seeing no change, would leave CoreDNS on the old Corefile.
    - name: Pull the DNS stack's images
      ansible.builtin.import_tasks: "{{ playbook_dir }}/_includes/image-pull.yml"
      vars:
        image_pull_name: the DNS stack
        image_pull_images: ["{{ coredns_image }}", "{{ pihole_image }}"]
        image_pull_command: docker compose -f {{ coredns_remote_dir }}/docker-compose.yml pull

    - name: Template Corefile
      template:
        src: Corefile.j2
        dest: "{{ coredns_remote_dir }}/Corefile"
        mode: "0644"
      register: corefile

    - name: Template pihole-forwarding.conf
      template:
        src: pihole-forwarding.conf.j2
        dest: "{{ coredns_remote_dir }}/pihole-forwarding.conf"
        mode: "0644"
      register: pihole_conf

    # A container whose start failed on a bind is left attached to no network.
    # dockerd brings it back that way at every boot, with its ports requested
    # and none in effect, and `up -d` sees an unchanged spec (#2732). The shared
    # check notices it and the start below recreates (#2500).
    - name: Check for a port binding that was never established
      import_tasks: "{{ playbook_dir }}/_includes/compose-port-drift.yml"
      vars:
        compose_port_drift_file: "{{ coredns_remote_dir }}/docker-compose.yml"

    - name: Start DNS stack
      command: >-
        docker compose -f {{ coredns_remote_dir }}/docker-compose.yml up -d
        {{ '--force-recreate' if compose_port_drift | bool else '' }}
      register: dns_start
      changed_when: "'Started' in dns_start.stderr or 'Created' in dns_start.stderr"

    - name: Restart CoreDNS on config change
      command: docker compose -f {{ coredns_remote_dir }}/docker-compose.yml restart coredns
      when: corefile.changed
      notify: verify coredns

    # Pi-hole v6 quirk: reloaddns does NOT reload dnsmasq configs, so a change
    # to the forwarding config needs the restart. A Corefile change does not:
    # it only needs Pi-hole's cache emptied, which the flush below does.
    - name: Restart Pi-hole on config change
      command: docker restart pihole
      when: pihole_conf.changed
      notify: verify pihole

    - name: Wait for CoreDNS
      command: dig @127.0.0.1 -p {{ coredns_port }} {{ service_domains.vpn | default(base_domain) }} +short
      register: coredns_test
      retries: 6
      delay: 5
      until: (coredns_test.rc == 0) or ansible_check_mode
      changed_when: false
      check_mode: false
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Wait for Pi-hole
      uri:
        url: "http://127.0.0.1:{{ pihole_web_port }}/admin/"
        status_code: [200, 302]
      register: pihole_test
      retries: 6
      delay: 5
      until: pihole_test.status in [200, 302]

    # Pi-hole caches what CoreDNS answered for the record's TTL (3600s from the
    # hosts plugin), so a moved record kept its old address for up to an hour
    # after a green deploy (#2213, lesson-560). `pihole reloaddns` sends FTL a
    # HUP, which empties that cache in the same process: the restart this
    # replaces cost the LAN about ten seconds of resolution, the flush none
    # (DNS-007, lesson-639). After both waits, so CoreDNS already answers from
    # the new Corefile and FTL is up. A restart above already emptied the cache.
    - name: Empty Pi-hole's cache on a Corefile change
      command: docker exec pihole pihole reloaddns
      when: corefile.changed and not pihole_conf.changed
      notify: verify pihole

    # The HTTP wait above proves the admin UI, not DNS. This asks Pi-hole for a
    # staging name, which only resolves if Pi-hole loaded the forwarding config
    # and reaches CoreDNS: the path clients actually use. Same address match as
    # the compose healthcheck, because `dig +short` prints errors on stdout.
    - name: Wait for Pi-hole to resolve through CoreDNS
      command: dig @127.0.0.1 -p {{ pihole_port }} {{ staging_domain }} +short
      register: pihole_dns
      retries: 6
      delay: 5
      until: (pihole_dns.stdout_lines | select('match', '^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$') | list | length > 0) or ansible_check_mode
      changed_when: false
      check_mode: false
      ignore_errors: "{{ ansible_check_mode }}"

    # After every wait, so a stack that did not come up from coredns_remote_dir
    # fails the play before the copies it could fall back to are removed.
    - name: Remove the directories ~/coredns used to resolve to (ANSIBLE-064)
      file:
        path: "{{ item }}"
        state: absent
      loop: "{{ coredns_legacy_dirs }}"
