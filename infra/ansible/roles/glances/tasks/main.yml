---
# =============================================================================
# Shared Glances role (DASH-DT-014a)
# One role for all nodes. Binds to {{ tailscale_ip }}:{{ glances_port }} only
# (beelink pattern — more secure than 0.0.0.0).
# Replaces today's three patterns: beelink_services inline, rpi3_services
# inline, ad-hoc on VPS+rpi4 (those are migrated in DASH-DT-014b / PR3b).
# =============================================================================

# Self-migration: stop any previous ad-hoc deploy whose compose file
# is named `docker-compose.yml` (legacy) before templating ours as
# `compose.yml`. The legacy container_name 'glances' would collide otherwise.
- name: Detect legacy ad-hoc compose file
  stat:
    path: "{{ glances_deploy_dir }}/docker-compose.yml"
  register: _legacy_glances_compose

- name: Stop legacy ad-hoc Glances stack
  command: docker compose -f {{ glances_deploy_dir }}/docker-compose.yml down --remove-orphans
  when: _legacy_glances_compose.stat.exists
  register: _legacy_down
  changed_when: "'Stopped' in _legacy_down.stderr or 'Removed' in _legacy_down.stderr"

- name: Remove legacy ad-hoc compose file
  file:
    path: "{{ glances_deploy_dir }}/docker-compose.yml"
    state: absent

# Belt-and-suspenders: even if a prior run already removed the compose file,
# an orphan `glances` container (broken / restart loop / from an old
# inline-services deploy with a different compose project, or a bare
# `docker run` without any label) would still hold the container_name and
# break `compose up`. Detect the compose project label first to keep this
# step idempotent on healthy nodes managed by this role's own compose.
- name: Detect compose project of any existing 'glances' container
  command: docker inspect glances --format '{% raw %}{{index .Config.Labels "com.docker.compose.project"}}{% endraw %}'
  register: _orphan_project
  changed_when: false
  failed_when: false

- name: Force-remove orphan container (not managed by this role's compose)
  command: docker rm -f glances
  when:
    - _orphan_project.rc == 0           # container exists
    - _orphan_project.stdout != 'glances'  # not labeled with our project
  changed_when: true

- name: Create Glances deployment directory
  file:
    path: "{{ glances_deploy_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# Must precede the compose template: the compose file bind-mounts this path,
# and Docker silently creates a *directory* at a bind source that does not
# exist yet — which Glances would then skip, leaving the API wide open with no
# error anywhere.
#
# Registered rather than notifying `Restart glances`: a handler fires at the
# END of the play, i.e. AFTER "Verify Glances health" below. A config-only
# change would then be validated against the container that is about to be
# replaced, and the play would go green on a Glances that had not read the new
# file yet. Registering instead lets the recreate happen before the check.
- name: Template Glances configuration file
  template:
    src: glances.conf.j2
    dest: "{{ glances_deploy_dir }}/glances.conf"
    owner: root
    group: root
    mode: "0644"
  register: _glances_conf

- name: Template Glances Docker Compose stack
  template:
    src: compose.yml.j2
    dest: "{{ glances_deploy_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart glances

- name: Pull Glances image
  command: docker compose -f {{ glances_deploy_dir }}/compose.yml pull
  register: _pull
  changed_when: "'Pull complete' in _pull.stderr or 'Downloaded' in _pull.stderr"

# A container's resource limits are fixed at CREATE time, so a limit declared
# while the kernel could not enforce it stays discarded through every restart —
# including a reboot — until something recreates the container. Plain `up -d`
# will not: the compose spec is unchanged, so Compose sees nothing to do.
#
# That is not hypothetical. On the RPi3 the memory cgroup controller was absent,
# so Docker silently dropped `memory` while applying `cpus` from the same block,
# and `common.yaml` spent months declaring a 256M limit the kernel discarded
# (ANSIBLE-040). Comparing what was declared against what the kernel actually
# granted is what turns that silent discard into a self-healing condition — and
# it is the check that would have caught the bug in the first place.
- name: Read the memory limit currently applied to the container
  command: docker inspect glances --format '{% raw %}{{.HostConfig.Memory}}{% endraw %}'
  register: _glances_applied_memory
  changed_when: false
  failed_when: false

- name: Detect drift between the declared and the applied memory limit
  set_fact:
    _glances_memory_drift: >-
      {{ _glances_applied_memory.rc == 0
         and (_glances_applied_memory.stdout | trim | int)
             != (glances_memory_limit | human_to_bytes) }}

- name: Report a discarded memory limit
  debug:
    msg: >-
      Declared memory limit {{ glances_memory_limit }}
      ({{ glances_memory_limit | human_to_bytes }} bytes) is not the one in force
      ({{ _glances_applied_memory.stdout | trim }}) — recreating the container.
      If this repeats on every run, the kernel is not enforcing memory limits at
      all: check that `memory` appears in /sys/fs/cgroup/cgroup.controllers.
  when: _glances_memory_drift | bool

# `--force-recreate` when glances.conf actually changed, or when the limit in
# force does not match the declared one. Plain `up -d` compares the compose
# spec, not the contents of a bind-mounted file nor the live container's
# HostConfig, so it is a no-op in both cases — the container would keep serving
# the old allowlist, or running unbounded, while this task reported success.
- name: Start Glances container
  command: >-
    docker compose -f {{ glances_deploy_dir }}/compose.yml up -d
    {{ '--force-recreate' if (_glances_conf.changed or _glances_memory_drift | bool) else '' }}
  register: _compose_up
  changed_when: "'Started' in _compose_up.stderr or 'Created' in _compose_up.stderr"

- name: Verify Glances health
  uri:
    url: "http://{{ tailscale_ip }}:{{ glances_port }}/api/4/quicklook"
    method: GET
    status_code: 200
    timeout: 10
  retries: "{{ glances_health_retries }}"
  delay: "{{ glances_health_delay }}"

- name: Report Glances status
  debug:
    msg: "Glances live on http://{{ tailscale_ip }}:{{ glances_port }}/api/4/quicklook"
