---
# =============================================================================
# Beelink Services — MinIO + GH Runner (ADR-028: on-demand platform).
# Glances was extracted to the shared `roles/glances/` role (DASH-DT-014b).
# Replaces the bare-metal Ollama that once ran here. It moved to ace2 in 2026
# and was retired outright by AI-007; the cleanup below stays because it guards
# a re-imaged node, and its cost is one systemctl probe.
# =============================================================================

# --- Cleanup legacy Ollama (bare metal) ---
- name: Check if Ollama service exists
  command: systemctl cat ollama
  register: _ollama_check
  changed_when: false
  # `failed_when: false`, not `ignore_errors: true`. Both let the play continue,
  # but ignore_errors still prints a red `fatal:` — and this probe is EXPECTED to
  # fail on every node where the cleanup already ran, i.e. everywhere since
  # AI-007 retired Ollama (2026-08-09). A green play that prints a fatal on every
  # run teaches the operator to skim past red output, which is the same habit
  # this role's sibling warns about in roles/glances/defaults/main.yml: "a check
  # that fails on a working deploy is worse than no check". The probe's non-zero
  # rc is still the signal — it is consumed by the `when` on the tasks below.
  failed_when: false
  # `systemctl cat` only reads unit files, so running it during a dry run changes
  # nothing and is what makes the dry run able to answer. Without this, Ansible
  # skips every `command:` in check mode, `_ollama_check` comes back with no `rc`
  # at all, and the `when` below raises instead of gating — `make provision
  # NODE=bee CHECK=1` reported a failure on a node where the real run is clean.
  check_mode: false

- name: Stop Ollama systemd service
  systemd:
    name: ollama
    state: stopped
    enabled: false
  # `default(1)` = "assume Ollama is absent unless the probe said otherwise".
  # The probe carries no `cleanup` tag, so `--tags cleanup` runs these tasks
  # without it and `_ollama_check` is undefined — a second path to the same
  # crash that `check_mode: false` above closes for dry runs. Defaulting to the
  # absent case is the safe direction: it skips a cleanup rather than acting on
  # an unmeasured node.
  when: (_ollama_check.rc | default(1)) == 0
  tags: [cleanup]

- name: Remove Ollama binary and service files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/ollama
    - /etc/systemd/system/ollama.service
    - /etc/systemd/system/ollama.service.d
  tags: [cleanup]

- name: Reload systemd after Ollama removal
  systemd:
    daemon_reload: true
  when: (_ollama_check.rc | default(1)) == 0
  tags: [cleanup]

# --- Create directories ---
- name: Create deployment directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ beelink_deploy_dir }}"
    - "{{ beelink_minio_data_dir }}"
    - "{{ beelink_runner_work_dir }}"
    - "{{ beelink_gitea_data_dir }}"

# --- Template compose + secrets ---
- name: Template Docker Compose stack
  template:
    src: compose.yml.j2
    dest: "{{ beelink_deploy_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart beelink services

# Mounted read-only into the container and run by the task at the end of this
# file. Carries no secrets — it reads them from the container's environment —
# so it is world-readable, unlike compose.yml.
- name: Install Gitea bootstrap script
  copy:
    src: gitea-bootstrap.sh
    dest: "{{ beelink_deploy_dir }}/gitea-bootstrap.sh"
    owner: root
    group: root
    mode: "0755"
  # ANSIBLE-054 (#1400). compose mounts this FILE, not its directory, and a
  # single-file bind mount pins the inode. `copy` replaces through a tempfile and
  # a rename, so the host gets a new inode and the running container keeps the
  # old one until it restarts — a replaced script reports success and does not
  # run. Measured while landing #1400: run 1 installed the new script and then
  # executed the previous one; the marker only appeared during run 2, after run
  # 1's handler had re-resolved the mount.
  #
  # This was invisible before, because the old script announced `Updated` on
  # every provision and so restarted the container every time by accident. That
  # accident is exactly what #1400 removes, which is what makes this notify
  # load-bearing rather than tidy.
  notify: Restart gitea
  tags: [gitea]

# --- Boot ordering: bind address must exist before Docker publishes on it ---
- name: Install the Tailscale address wait helper
  copy:
    src: wait-for-tailscale-addr.sh
    dest: "{{ beelink_deploy_dir }}/wait-for-tailscale-addr.sh"
    owner: root
    group: root
    mode: "0755"
  tags: [boot]

- name: Install the Compose stack systemd unit
  template:
    src: kubelab-compose.service.j2
    dest: /etc/systemd/system/kubelab-compose.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for kubelab-compose
  tags: [boot]

- name: Enable the Compose stack unit at boot
  systemd:
    name: kubelab-compose.service
    enabled: true
    daemon_reload: true
  tags: [boot]

# --- Multi-arch build support ---
- name: Install QEMU user static for multi-arch builds
  apt:
    name: qemu-user-static
    state: present

- name: Check if binfmt_misc QEMU is registered
  stat:
    path: /proc/sys/fs/binfmt_misc/qemu-aarch64
  register: _binfmt

- name: Register QEMU binfmt_misc
  command: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
  when: not _binfmt.stat.exists

- name: Check if buildx builder is healthy
  command: docker buildx inspect multiarch
  register: _buildx_check
  changed_when: false
  # Read-only probe whose result is consumed by a condition, so check mode must
  # not skip it: a skipped `command:` registers no stdout, and the condition then
  # reads a value nothing measured. Same defect as the Ollama probe above
  # (ANSIBLE-054, #1400) — `until` never matches, so it retries to exhaustion and
  # fails a dry run on a node where the real run is clean.
  check_mode: false
  ignore_errors: true

- name: Clean stale buildx builder state
  shell: |
    docker buildx rm multiarch 2>/dev/null || true
    rm -rf /root/.docker/buildx/instances/multiarch 2>/dev/null || true
  when: _buildx_check.rc != 0
  changed_when: true

- name: Create Docker buildx builder
  command: docker buildx create --name multiarch --driver docker-container --use
  when: _buildx_check.rc != 0

# --- Deploy ---
- name: Pull service images
  command: docker compose -f {{ beelink_deploy_dir }}/compose.yml pull
  register: _pull
  changed_when: "'Pull complete' in _pull.stderr or 'Downloaded' in _pull.stderr"

- name: Start services
  command: docker compose -f {{ beelink_deploy_dir }}/compose.yml up -d
  register: _compose_up
  changed_when: "'Started' in _compose_up.stderr or 'Created' in _compose_up.stderr"

# --- Health checks ---
- name: Wait for MinIO container to be running
  command: docker inspect --format '{% raw %}{{.State.Status}}{% endraw %}' minio
  register: _minio_state
  # Read-only probe whose result is consumed by a condition, so check mode must
  # not skip it: a skipped `command:` registers no stdout, and the condition then
  # reads a value nothing measured. Same defect as the Ollama probe above
  # (ANSIBLE-054, #1400) — `until` never matches, so it retries to exhaustion and
  # fails a dry run on a node where the real run is clean.
  check_mode: false
  until: _minio_state.stdout == "running"
  retries: 12
  delay: 5
  changed_when: false

- name: Verify MinIO health
  uri:
    url: "http://{{ tailscale_ip }}:{{ minio_api_port }}/minio/health/live"
    method: GET
    status_code: 200
    timeout: 10
  retries: 5
  delay: 5

- name: Verify GitHub Runner container is running
  command: docker inspect --format '{% raw %}{{.State.Status}}{% endraw %}' github-runner
  register: _runner_state
  # Read-only probe whose result is consumed by a condition, so check mode must
  # not skip it: a skipped `command:` registers no stdout, and the condition then
  # reads a value nothing measured. Same defect as the Ollama probe above
  # (ANSIBLE-054, #1400) — `until` never matches, so it retries to exhaustion and
  # fails a dry run on a node where the real run is clean.
  check_mode: false
  retries: 3
  delay: 10
  until: _runner_state.stdout == "running"
  changed_when: false

# --- Gitea (ADR-061 singleton) ---
- name: Wait for Gitea to report healthy
  command: docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' gitea
  register: _gitea_health
  # Read-only probe whose result is consumed by a condition, so check mode must
  # not skip it: a skipped `command:` registers no stdout, and the condition then
  # reads a value nothing measured. Same defect as the Ollama probe above
  # (ANSIBLE-054, #1400) — `until` never matches, so it retries to exhaustion and
  # fails a dry run on a node where the real run is clean.
  check_mode: false
  until: _gitea_health.stdout == "healthy"
  retries: 18
  delay: 5
  changed_when: false
  tags: [gitea]

# `healthy` is asserted from inside the container, so on its own it says nothing
# about whether the port is reachable. This is the check that covers the bind
# address — the failure mode that left Gitea's advertised SSH URL dead on K3s for
# as long as it existed there.
- name: Verify Gitea answers on its Tailscale address
  uri:
    url: "http://{{ tailscale_ip }}:{{ gitea_http_port }}{{ gitea_health_path }}"
    method: GET
    status_code: 200
    timeout: 10
  retries: 5
  delay: 5
  register: _gitea_version
  tags: [gitea]

- name: Verify Gitea SSH is reachable on its Tailscale address
  wait_for:
    host: "{{ tailscale_ip }}"
    port: "{{ gitea_ssh_port }}"
    state: started
    timeout: 30
  tags: [gitea]

- name: Bootstrap Gitea admin user and OIDC provider
  command: docker exec gitea sh /scripts/bootstrap.sh
  register: _gitea_bootstrap
  changed_when: "'Created' in _gitea_bootstrap.stdout or 'Updated' in _gitea_bootstrap.stdout"
  # The script's writes go to SQLite; the running web process keeps the auth
  # source it parsed at startup. `changed` here therefore means "the database
  # was updated", never "the service is serving the new value" — the handler is
  # what closes that gap, and its absence is what left prod SSO broken through a
  # successful provision on 2026-08-23.
  notify: Restart gitea
  tags: [gitea]

# --- Machine identity: the token (AUTH-004 C5, ADR-062 D1) --------------------
# The ACCOUNT and its login block live in gitea-bootstrap.sh, next to the admin
# user, for two reasons. The script is a real shell, so the quoting survives
# (an equivalent pipeline embedded in a `command:` here was mangled by YAML
# folding plus argv splitting before it ever reached the container); and the
# task that installs it already notifies `Restart gitea`, so lesson-396's
# single-file bind-mount trap is already closed for it.
#
# Only the minting stays here, because it is the one step whose output has to
# come back to the controller: the age key is here, not in the container.

- name: Mint the machine account's scoped token
  # NOT idempotent: generate-access-token always succeeds and always returns a
  # NEW token, orphaning the previous one inside Gitea with no record of which
  # consumer holds which. Gated on the recorded secret being absent, so a
  # re-provision with a token already in SOPS does nothing at all.
  # `argv`, not a string. The string form goes through YAML folding and then
  # argv splitting, and this command does not survive the round trip: measured,
  # the inner `su git -c "..."` lost its quoting, so `su` read `gitea` as the
  # command and `admin user generate-access-token ...` as positional arguments.
  # It failed, and a partial invocation had already minted a token under
  # `generate-access-token`'s DEFAULT name and DEFAULT scopes ("all") - the worst
  # possible outcome, because an over-scoped credential was created while the
  # task reported failure. `argv` passes the list verbatim.
  command:
    argv:
      - docker
      - exec
      - gitea
      - su
      - git
      - -c
      - >-
        gitea admin user generate-access-token
        --username {{ gitea_bot_user }}
        --token-name kubelab-provisioning
        --scopes {{ gitea_bot_scopes }}
        --raw
  register: _gitea_bot_token
  when: not gitea_bot_token
  changed_when: _gitea_bot_token.rc == 0
  no_log: true
  tags: [gitea]

- name: Record the machine token in SOPS
  # Delegated to the controller, which is where the age key is. The value goes in
  # through STDIN, never through argv: an argument list is world-readable in
  # /proc for the lifetime of the process.
  command: "{{ playbook_dir }}/../../../.venv/bin/toolkit secrets set apps.services.core.gitea.bot_token --env {{ gitea_identity_env }} --stdin"
  args:
    stdin: "{{ _gitea_bot_token.stdout }}"
  delegate_to: localhost
  become: false
  when: not gitea_bot_token
  changed_when: true
  no_log: true
  tags: [gitea]

- name: Mint the superadmin's scoped token
  # Same mechanism, same non-idempotence, same gate as the machine token above:
  # generate-access-token always mints a NEW token, so this is gated on the
  # recorded secret being absent and a re-provision does nothing at all.
  #
  # `argv` for the reason measured on the task above — the string form loses its
  # quoting through YAML folding plus argv splitting, and a partial invocation
  # already minted a token with generate-access-token's DEFAULT scopes ("all")
  # while reporting failure. An over-scoped superadmin credential is a worse
  # outcome here than it was there.
  command:
    argv:
      - docker
      - exec
      - gitea
      - su
      - git
      - -c
      - >-
        gitea admin user generate-access-token
        --username {{ gitea_admin_user }}
        --token-name kubelab-reconciler
        --scopes {{ gitea_admin_scopes }}
        --raw
  register: _gitea_admin_token
  when: not gitea_admin_token
  changed_when: _gitea_admin_token.rc == 0
  no_log: true
  tags: [gitea]

- name: Record the superadmin token in SOPS
  # Delegated to the controller, which is where the age key is. STDIN, never
  # argv: an argument list is world-readable in /proc for the process lifetime.
  command: "{{ playbook_dir }}/../../../.venv/bin/toolkit secrets set apps.services.core.gitea.admin_token --env {{ gitea_identity_env }} --stdin"
  args:
    stdin: "{{ _gitea_admin_token.stdout }}"
  delegate_to: localhost
  become: false
  when: not gitea_admin_token
  changed_when: true
  no_log: true
  tags: [gitea]

- name: Report service status
  debug:
    msg: >-
      Gitea {{ _gitea_version.json.version | default('?') }} on
      {{ tailscale_ip }}:{{ gitea_http_port }} (ssh {{ gitea_ssh_port }}),
      MinIO on {{ minio_api_port }}/{{ minio_console_port }}, GH Runner running
