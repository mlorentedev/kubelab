---
# =============================================================================
# Beelink Services — MinIO + GH Runner (ADR-028: on-demand platform).
# Glances was extracted to the shared `roles/glances/` role (DASH-DT-014b).
# Replaces the bare-metal Ollama that once ran here. It moved to ace2 in 2026
# and was retired outright by AI-007; the cleanup below stays because it guards
# a re-imaged node, and its cost is one systemctl probe.
# =============================================================================

# --- Cleanup legacy Ollama (bare metal) ---
- name: Check if Ollama service exists
  command: systemctl cat ollama
  register: _ollama_check
  changed_when: false
  # `failed_when: false`, not `ignore_errors: true`. Both let the play continue,
  # but ignore_errors still prints a red `fatal:` — and this probe is EXPECTED to
  # fail on every node where the cleanup already ran, i.e. everywhere since
  # AI-007 retired Ollama (2026-08-09). A green play that prints a fatal on every
  # run teaches the operator to skim past red output, which is the same habit
  # this role's sibling warns about in roles/glances/defaults/main.yml: "a check
  # that fails on a working deploy is worse than no check". The probe's non-zero
  # rc is still the signal — it is consumed by `when: _ollama_check.rc == 0`.
  failed_when: false

- name: Stop Ollama systemd service
  systemd:
    name: ollama
    state: stopped
    enabled: false
  when: _ollama_check.rc == 0
  tags: [cleanup]

- name: Remove Ollama binary and service files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/ollama
    - /etc/systemd/system/ollama.service
    - /etc/systemd/system/ollama.service.d
  tags: [cleanup]

- name: Reload systemd after Ollama removal
  systemd:
    daemon_reload: true
  when: _ollama_check.rc == 0
  tags: [cleanup]

# --- Create directories ---
- name: Create deployment directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ beelink_deploy_dir }}"
    - "{{ beelink_minio_data_dir }}"
    - "{{ beelink_runner_work_dir }}"
    - "{{ beelink_gitea_data_dir }}"

# --- Template compose + secrets ---
- name: Template Docker Compose stack
  template:
    src: compose.yml.j2
    dest: "{{ beelink_deploy_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart beelink services

# Mounted read-only into the container and run by the task at the end of this
# file. Carries no secrets — it reads them from the container's environment —
# so it is world-readable, unlike compose.yml.
- name: Install Gitea bootstrap script
  copy:
    src: gitea-bootstrap.sh
    dest: "{{ beelink_deploy_dir }}/gitea-bootstrap.sh"
    owner: root
    group: root
    mode: "0755"
  tags: [gitea]

# --- Multi-arch build support ---
- name: Install QEMU user static for multi-arch builds
  apt:
    name: qemu-user-static
    state: present

- name: Check if binfmt_misc QEMU is registered
  stat:
    path: /proc/sys/fs/binfmt_misc/qemu-aarch64
  register: _binfmt

- name: Register QEMU binfmt_misc
  command: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
  when: not _binfmt.stat.exists

- name: Check if buildx builder is healthy
  command: docker buildx inspect multiarch
  register: _buildx_check
  changed_when: false
  ignore_errors: true

- name: Clean stale buildx builder state
  shell: |
    docker buildx rm multiarch 2>/dev/null || true
    rm -rf /root/.docker/buildx/instances/multiarch 2>/dev/null || true
  when: _buildx_check.rc != 0
  changed_when: true

- name: Create Docker buildx builder
  command: docker buildx create --name multiarch --driver docker-container --use
  when: _buildx_check.rc != 0

# --- Deploy ---
- name: Pull service images
  command: docker compose -f {{ beelink_deploy_dir }}/compose.yml pull
  register: _pull
  changed_when: "'Pull complete' in _pull.stderr or 'Downloaded' in _pull.stderr"

- name: Start services
  command: docker compose -f {{ beelink_deploy_dir }}/compose.yml up -d
  register: _compose_up
  changed_when: "'Started' in _compose_up.stderr or 'Created' in _compose_up.stderr"

# --- Health checks ---
- name: Wait for MinIO container to be running
  command: docker inspect --format '{% raw %}{{.State.Status}}{% endraw %}' minio
  register: _minio_state
  until: _minio_state.stdout == "running"
  retries: 12
  delay: 5
  changed_when: false

- name: Verify MinIO health
  uri:
    url: "http://{{ tailscale_ip }}:{{ minio_api_port }}/minio/health/live"
    method: GET
    status_code: 200
    timeout: 10
  retries: 5
  delay: 5

- name: Verify GitHub Runner container is running
  command: docker inspect --format '{% raw %}{{.State.Status}}{% endraw %}' github-runner
  register: _runner_state
  retries: 3
  delay: 10
  until: _runner_state.stdout == "running"
  changed_when: false

# --- Gitea (ADR-061 singleton) ---
- name: Wait for Gitea to report healthy
  command: docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' gitea
  register: _gitea_health
  until: _gitea_health.stdout == "healthy"
  retries: 18
  delay: 5
  changed_when: false
  tags: [gitea]

# `healthy` is asserted from inside the container, so on its own it says nothing
# about whether the port is reachable. This is the check that covers the bind
# address — the failure mode that left Gitea's advertised SSH URL dead on K3s for
# as long as it existed there.
- name: Verify Gitea answers on its Tailscale address
  uri:
    url: "http://{{ tailscale_ip }}:{{ gitea_http_port }}/api/v1/version"
    method: GET
    status_code: 200
    timeout: 10
  retries: 5
  delay: 5
  register: _gitea_version
  tags: [gitea]

- name: Verify Gitea SSH is reachable on its Tailscale address
  wait_for:
    host: "{{ tailscale_ip }}"
    port: "{{ gitea_ssh_port }}"
    state: started
    timeout: 30
  tags: [gitea]

- name: Bootstrap Gitea admin user and OIDC provider
  command: docker exec gitea sh /scripts/bootstrap.sh
  register: _gitea_bootstrap
  changed_when: "'Created' in _gitea_bootstrap.stdout or 'Updated' in _gitea_bootstrap.stdout"
  tags: [gitea]

- name: Report service status
  debug:
    msg: >-
      Gitea {{ _gitea_version.json.version | default('?') }} on
      {{ tailscale_ip }}:{{ gitea_http_port }} (ssh {{ gitea_ssh_port }}),
      MinIO on {{ minio_api_port }}/{{ minio_console_port }}, GH Runner running
