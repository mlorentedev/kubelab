---
beelink_deploy_dir: /opt/kubelab
beelink_runner_work_dir: /opt/runner/_work
# Gitea's repos + SQLite live here. Not backed up yet — the PVC backup CronJob
# that covered Gitea on K3s does not follow it here, and its replacement is
# blocked on #972 choosing a destination. Tracked as #1056.
beelink_gitea_data_dir: /opt/gitea/data
# Gitea's resolvers: public only, see the `dns:` comment in compose.yml.j2.
gitea_dns_servers: "{{ config.networking.public_resolvers }}"
glances_port: 61208
# The name the GitHub runner registers under. One value for the compose file and
# the registration check, so the check can never look for a name nothing uses (#3080).
runner_name: kubelab-bee

# --- Renovate for Gitea (IDP-036 AC2) ---
# The hourly run is enabled only once the account exists AND its token is recorded
# AND the github.com token is recorded: the forge token is minted by a running Gitea
# and recorded in SOPS during the provision that creates the account, so that
# provision installs nothing and the next one installs the timer. The github.com
# token is the operator's to record (the same value as ci-workflows' `RENOVATE_TOKEN`),
# and without it the `github>` preset cannot be fetched, so an enabled timer would
# fail on every tick. The three play variables have no default here on purpose: a play
# that forgot them fails on the undefined variable rather than quietly running
# nothing. A node missing any of them is disabled, and a timer an earlier provision
# left behind is stopped.
renovate_enabled: "{{ gitea_renovate_user | length > 0 and gitea_renovate_token | length > 0 and renovate_github_com_token | length > 0 }}"
# The engine's cap. Its peak is unmeasured: it is read on the first run
# (`docker stats kubelab-renovate`; the unit's cgroup holds only the docker client,
# so systemd's own memory figures do not see the engine) and recorded on #1384,
# and this value is then set from it. 1g is a starting bound
# that protects the forge sharing this 8 GB node, not a measurement.
renovate_memory_limit: 1g
# Where the global config is mounted in the engine's container, and so the value
# of RENOVATE_CONFIG_FILE. The container path never touches the host.
renovate_config_container_path: /opt/renovate/config.yaml

# Revoke a named token Gitea holds that this checkout's SOPS does not record. Off:
# another checkout may hold its value unmerged (#3428). Set per run, with
# EXTRA='gitea_revoke_unrecorded_tokens=true', only when the value is truly lost.
gitea_revoke_unrecorded_tokens: false
