---
# =============================================================================
# The agent's vault zone (ADR-068 D4 as amended 2026-10-08, spec AI-009 AC6).
# The agent writes files and nothing else: its sandbox mounts the clone
# read-only and the zone writable (hermes-config.yaml.j2). The sync unit, as the
# agent's user, commits the zone through the root-owned hook and pushes it with
# a token only systemd reads.
# =============================================================================

- name: Create the directories of the vault sync and its hooks
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ agent_stack_vault_libexec }}"
    - "{{ agent_stack_vault_hooks }}"

- name: Install the vault zone hook
  ansible.builtin.template:
    src: pre-commit-zone.sh.j2
    dest: "{{ agent_stack_vault_hooks }}/pre-commit"
    owner: root
    group: root
    mode: "0755"

# What the sync never stages: the gateway's lock files and the temporaries of an
# atomic write in the memories, which it creates 0600 as a subuid this user cannot
# read. Anchored to that directory, so an untracked file elsewhere in the clone
# still counts as a change outside the zone.
- name: Install the vault sync's ignore file
  ansible.builtin.copy:
    dest: "{{ agent_stack_vault_ignore }}"
    content: |
      # Managed by Ansible (role agent_stack): what the vault sync never stages.
      {{ agent_stack_vault_zone }}/memories/*.lock
      {{ agent_stack_vault_zone }}/memories/.mem_*
    owner: root
    group: root
    mode: "0644"

# Root's, outside the agent's home, like the hook: nothing of the agent's user
# can replace what the unit runs.
- name: Install the vault sync and its credential helper
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ agent_stack_vault_libexec }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - {src: vault-sync.sh.j2, dest: vault-sync}
    - {src: vault-credential.sh.j2, dest: vault-credential}

- name: Stop the vault sync when the token is not configured
  when: not (agent_stack_vault_configured | bool)
  block:
    - name: Look for a previously installed vault sync timer
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ agent_stack_vault_sync_unit }}.timer"
      register: _agent_stack_vault_prior

    - name: Disable the vault sync timer
      ansible.builtin.systemd:
        name: "{{ agent_stack_vault_sync_unit }}.timer"
        enabled: false
        state: stopped
      when: _agent_stack_vault_prior.stat.exists and not ansible_check_mode

    # The token must not outlive the sync. The clone stays: it is the zone's
    # unpushed work, if any.
    - name: Remove the vault token
      ansible.builtin.file:
        path: "{{ agent_stack_vault_token_file }}"
        state: absent

- name: Deploy the vault sync
  when: agent_stack_vault_configured | bool
  block:
    - name: Write the vault token for systemd to hand over
      ansible.builtin.copy:
        content: "{{ agent_stack_vault_token }}\n"
        dest: "{{ agent_stack_vault_token_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    # Empty and the agent's, so the unit's ReadWritePaths exists before the
    # first clone, which git makes into an empty directory without complaint.
    # 0711 lets the sandbox subuid traverse to its nested rw zone mount without
    # listing the clone; 0700 at this root would reject the zone itself.
    - name: Create the vault clone's directory
      ansible.builtin.file:
        path: "{{ agent_stack_vault_clone }}"
        state: directory
        owner: "{{ agent_stack_agent_user }}"
        group: "{{ agent_stack_agent_user }}"
        mode: "0711"

    - name: Install the vault sync units
      ansible.builtin.template:
        src: "vault-sync.{{ item }}.j2"
        dest: "/etc/systemd/system/{{ agent_stack_vault_sync_unit }}.{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [service, timer]

    # The run is the measurement: the first one clones, every one proves the
    # token, the hook and the push path. Not a change: the units are.
    - name: Run the vault sync once
      ansible.builtin.systemd:
        name: "{{ agent_stack_vault_sync_unit }}.service"
        state: started
        daemon_reload: true
      changed_when: false
      when: not ansible_check_mode

    - name: Verify the clone holds the zone the sandbox mounts
      ansible.builtin.stat:
        path: "{{ agent_stack_vault_clone }}/{{ agent_stack_vault_zone }}"
      register: _agent_stack_vault_zone_dir
      failed_when: not (_agent_stack_vault_zone_dir.stat.isdir | default(false))
      when: not ansible_check_mode

    # A sticky 01777 directory mixed root/sandbox/gateway ownership and made atomic
    # rename fail with EPERM (#3485). Find actual drift before changing anything: a
    # clean provision must not stop the gateway or its persistent sandboxes.
    - name: Read the memories directory before repairing it
      ansible.builtin.stat:
        path: "{{ agent_stack_vault_clone }}/{{ agent_stack_vault_zone }}/memories"
      register: _agent_stack_vault_memories

    - name: Find stale memory lock files
      ansible.builtin.find:
        paths: "{{ agent_stack_vault_clone }}/{{ agent_stack_vault_zone }}/memories"
        patterns: "*.lock"
        file_type: file
      register: _agent_stack_vault_memory_locks

    - name: Read vault-zone ownership before repairing it
      ansible.builtin.find:
        paths: "{{ agent_stack_vault_clone }}/{{ agent_stack_vault_zone }}"
        file_type: any
        recurse: true
      register: _agent_stack_vault_zone_objects

    # The host-side analyzer owns curator inputs. Everything else in the zone is the
    # gateway's, and must use the effective subuid rather than literal host uid 10000.
    - name: Select the vault-zone objects the gateway owns
      ansible.builtin.set_fact:
        _agent_stack_vault_gateway_objects: >-
          {{ _agent_stack_vault_zone_objects.files
             | rejectattr('path', 'match',
                          '^' ~ ((agent_stack_vault_clone ~ '/' ~ agent_stack_vault_zone ~ '/curator') | regex_escape) ~ '(/|$)')
             | list }}

    - name: Decide whether shared vault files need a stopped-writer repair
      ansible.builtin.set_fact:
        _agent_stack_vault_repair_needed: >-
          {{ (_agent_stack_vault_memory_locks.files | length > 0)
             or ((_agent_stack_vault_memories.stat.mode | default('0755')) != '0755')
             or ((_agent_stack_vault_memories.stat.uid | default(_agent_stack_hermes_host_uid | int) | int)
                 != (_agent_stack_hermes_host_uid | int))
             or ((_agent_stack_vault_memories.stat.gid | default(_agent_stack_hermes_host_gid | int) | int)
                 != (_agent_stack_hermes_host_gid | int))
             or (_agent_stack_vault_gateway_objects | selectattr('uid', 'defined')
                 | selectattr('uid', '!=', _agent_stack_hermes_host_uid | int) | list | length > 0)
             or (_agent_stack_vault_gateway_objects | selectattr('gid', 'defined')
                 | selectattr('gid', '!=', _agent_stack_hermes_host_gid | int) | list | length > 0) }}

    - name: Read whether the gateway runs before shared vault repair
      ansible.builtin.command: docker inspect hermes-kubelab --format '{% raw %}{{.State.Running}}{% endraw %}'
      become: true
      become_user: "{{ agent_stack_agent_user }}"
      environment: "{{ agent_stack_agent_daemon_env }}"
      register: _agent_stack_vault_hermes_running
      changed_when: false
      failed_when: false
      check_mode: false
      when: _agent_stack_vault_repair_needed | bool

    - name: Stop the gateway before repairing shared vault files
      ansible.builtin.command: >-
        docker compose -p {{ agent_stack_hermes_project }} -f {{ agent_stack_hermes_compose }} stop hermes
      become: true
      become_user: "{{ agent_stack_agent_user }}"
      environment: "{{ agent_stack_agent_daemon_env }}"
      register: _agent_stack_vault_hermes_stop
      changed_when: true
      when:
        - _agent_stack_vault_repair_needed | bool
        - not ansible_check_mode
        - (_agent_stack_vault_hermes_running.stdout | default('') | trim) == 'true'

    - name: Stop sandboxes before repairing shared vault files
      ansible.builtin.shell:
        cmd: >-
          ids=$(docker ps -aq --filter label=hermes-agent=1);
          if [ -n "$ids" ]; then docker rm -f $ids; fi
      become: true
      become_user: "{{ agent_stack_agent_user }}"
      environment: "{{ agent_stack_agent_daemon_env }}"
      register: _agent_stack_vault_sandboxes_stop
      changed_when: _agent_stack_vault_sandboxes_stop.stdout | length > 0
      when:
        - _agent_stack_vault_repair_needed | bool
        - not ansible_check_mode

    # Mounted over the gateway's data directory. It must exist before Compose, and
    # its owner is container uid/gid 10000 translated through the subordinate range.
    - name: Create the vault zone itself
      ansible.builtin.file:
        path: "{{ agent_stack_vault_clone }}/{{ agent_stack_vault_zone }}"
        state: directory
        owner: "{{ _agent_stack_hermes_host_uid }}"
        group: "{{ _agent_stack_hermes_host_gid }}"
        mode: "0755"
      when: not ansible_check_mode

    # With every writer stopped, an old lock is stale and cannot be split by unlinking
    # an inode another process is actively flocking. The ignore file remains the SSOT.
    - name: Remove stale memory lock files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ _agent_stack_vault_memory_locks.files | map(attribute='path') | list }}"
      when:
        - _agent_stack_vault_repair_needed | bool
        - not ansible_check_mode

    - name: Create the memories directory the gateway writes into
      ansible.builtin.file:
        path: "{{ agent_stack_vault_clone }}/{{ agent_stack_vault_zone }}/memories"
        state: directory
        owner: "{{ _agent_stack_hermes_host_uid }}"
        group: "{{ _agent_stack_hermes_host_gid }}"
        mode: "0755"
      when: not ansible_check_mode

    - name: Create the proposals directory the gateway writes into
      ansible.builtin.file:
        path: "{{ agent_stack_vault_clone }}/{{ agent_stack_vault_zone }}/proposals"
        state: directory
        owner: "{{ _agent_stack_hermes_host_uid }}"
        group: "{{ _agent_stack_hermes_host_gid }}"
        mode: "0755"
      when: not ansible_check_mode

    # Preserve each file's mode: Hermes creates memory files and locks 0600, and the
    # namespace-aware sync reads them without weakening that confidentiality boundary.
    - name: Reclaim existing vault-zone ownership
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ _agent_stack_hermes_host_uid }}"
        group: "{{ _agent_stack_hermes_host_gid }}"
      loop: "{{ _agent_stack_vault_gateway_objects }}"
      when:
        - not ansible_check_mode
        - item.path not in (_agent_stack_vault_memory_locks.files | map(attribute='path') | list)
        - >-
          item.path is not match(
            '^' ~ ((agent_stack_vault_clone ~ '/' ~ agent_stack_vault_zone ~ '/curator') | regex_escape) ~ '(/|$)')

    - name: Enable the vault sync timer
      ansible.builtin.systemd:
        name: "{{ agent_stack_vault_sync_unit }}.timer"
        enabled: true
        state: started
      when: not ansible_check_mode
