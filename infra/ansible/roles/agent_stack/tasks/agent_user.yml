---
# =============================================================================
# The agent's Unix user and its rootless Docker daemon (ADR-068 D2, spec
# AI-009 PR 2). ace2 holds staging credentials the dev user may read (ADR-058
# D3); the agent must not. So it gets its own user with no sudo and no `docker`
# group (that group is root on the host), and drives a daemon that runs inside
# its own user namespace. Hermes itself arrives in PR 3, on this daemon.
#
# The assert tasks at the end are the measurement: every provision proves the
# daemon is rootless, that it can limit a container, and that the agent cannot
# read what it must not. Each read runs under --check too (check_mode: false).
# =============================================================================

- name: Install the rootless Docker prerequisites
  ansible.builtin.apt:
    name: "{{ agent_stack_rootless_packages }}"
    state: present

- name: Create the agent's user
  ansible.builtin.user:
    name: "{{ agent_stack_agent_user }}"
    system: true
    home: "{{ agent_stack_agent_home }}"
    create_home: true
    shell: /usr/sbin/nologin
    groups: []
    append: false
  register: _agent_stack_agent

- name: Hold the agent's uid
  ansible.builtin.set_fact:
    _agent_stack_agent_uid: "{{ _agent_stack_agent.uid }}"

- name: Keep the agent's home private
  ansible.builtin.file:
    path: "{{ agent_stack_agent_home }}"
    state: directory
    owner: "{{ agent_stack_agent_user }}"
    group: "{{ agent_stack_agent_user }}"
    mode: "0700"

# A rootless daemon maps the container's uids onto this range. Declared here,
# because `useradd --system` allocates none.
- name: Declare the agent's subordinate ids
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^{{ agent_stack_agent_user }}:"
    line: "{{ agent_stack_agent_user }}:{{ agent_stack_agent_subid_start }}:{{ agent_stack_agent_subid_count }}"
    owner: root
    group: root
    mode: "0644"
  loop: [/etc/subuid, /etc/subgid]

- name: Read every user's subordinate ids
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: [/etc/subuid, /etc/subgid]
  register: _agent_stack_subids

# Double-quoted on purpose: YAML turns the "\n" below into a newline only in a
# double-quoted scalar. In a folded one it stays a backslash and an n, the
# files' real newlines never split, no line matches, and the overlap check
# loops over nothing (measured on ace2, 2026-10-01). The next assert makes that
# failure loud: the agent's own line must be among those parsed.
- name: Parse every user's subordinate ids
  ansible.builtin.set_fact:
    _agent_stack_subid_lines: "{{ _agent_stack_subids.results | map(attribute='content')
      | map('b64decode') | join('\n') | split('\n')
      | select('match', '^[^#:]+:[0-9]+:[0-9]+$') | list }}"

- name: Assert the agent's declared range was parsed back
  ansible.builtin.assert:
    that: >-
      _agent_stack_subid_lines
      | select('equalto', agent_stack_agent_user ~ ':' ~ agent_stack_agent_subid_start ~ ':' ~ agent_stack_agent_subid_count)
      | list | length == 2
    fail_msg: "The agent's line is missing from /etc/subuid or /etc/subgid, or the parse below checks nothing."
    quiet: true

# Two users sharing a range share files: a container of one would own the
# other's. useradd keeps its own allocations apart, but not from a declared one.
- name: Assert no other user's subordinate ids overlap the agent's
  ansible.builtin.assert:
    that: >-
      (item.split(':')[1] | int) >= (agent_stack_agent_subid_start + agent_stack_agent_subid_count)
      or (item.split(':')[1] | int) + (item.split(':')[2] | int) <= agent_stack_agent_subid_start
    fail_msg: "{{ item }} overlaps the agent's subordinate ids ({{ agent_stack_agent_subid_start }}:{{ agent_stack_agent_subid_count }})"
    quiet: true
  loop: "{{ _agent_stack_subid_lines | reject('match', '^' ~ agent_stack_agent_user ~ ':') | list }}"

# Linger starts the user's systemd manager at boot with no login session, so
# the agent's daemon (and later Hermes) come up when ace2 does.
- name: Keep the agent's user manager running without a login
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ agent_stack_agent_user }}
    creates: /var/lib/systemd/linger/{{ agent_stack_agent_user }}

- name: Start the agent's user manager
  ansible.builtin.systemd:
    name: "user@{{ _agent_stack_agent_uid }}.service"
    state: started

- name: Wait for the agent's user bus
  ansible.builtin.wait_for:
    path: "/run/user/{{ _agent_stack_agent_uid }}/bus"
    timeout: 30

- name: Install the agent's rootless Docker daemon
  ansible.builtin.command:
    cmd: dockerd-rootless-setuptool.sh install
    creates: "{{ agent_stack_agent_home }}/.config/systemd/user/docker.service"
  become_user: "{{ agent_stack_agent_user }}"
  environment:
    HOME: "{{ agent_stack_agent_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ _agent_stack_agent_uid }}"

- name: Keep the agent's daemon enabled
  ansible.builtin.systemd:
    name: docker.service
    scope: user
    enabled: true
    state: started
  become_user: "{{ agent_stack_agent_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ _agent_stack_agent_uid }}"

- name: Read the agent daemon's security options
  ansible.builtin.command:
    cmd: docker info --format '{% raw %}{{json .SecurityOptions}}{% endraw %}'
  become_user: "{{ agent_stack_agent_user }}"
  environment:
    DOCKER_HOST: "{{ agent_stack_agent_docker_host }}"
    XDG_RUNTIME_DIR: "/run/user/{{ _agent_stack_agent_uid }}"
  register: _agent_stack_agent_info
  changed_when: false
  check_mode: false

- name: Assert the agent's daemon runs rootless
  ansible.builtin.assert:
    that: "'name=rootless' in _agent_stack_agent_info.stdout"
    fail_msg: "The agent's daemon does not report rootless: {{ _agent_stack_agent_info.stdout }}"
    success_msg: The agent's daemon runs inside its user namespace.

# Hermes runs every command in a sandbox container with a memory and CPU limit
# (ADR-068 D2). A rootless daemon whose user lacks cgroup delegation discards
# those limits with a warning and still runs the container, so the exit code
# proves nothing: the container reads back the limits its cgroup actually holds.
- name: Run a limited container through the agent's daemon
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network none
      --memory {{ agent_stack_agent_probe_memory }} --cpus {{ agent_stack_agent_probe_cpus }}
      {{ agent_stack_agent_probe_image }}
      cat /sys/fs/cgroup/memory.max /sys/fs/cgroup/cpu.max
  become_user: "{{ agent_stack_agent_user }}"
  environment:
    DOCKER_HOST: "{{ agent_stack_agent_docker_host }}"
    XDG_RUNTIME_DIR: "/run/user/{{ _agent_stack_agent_uid }}"
  register: _agent_stack_agent_probe
  changed_when: false
  check_mode: false

- name: Assert the container held the limits it was given
  ansible.builtin.assert:
    that:
      - _agent_stack_agent_probe.stdout_lines[0] | int == agent_stack_agent_probe_memory | human_to_bytes
      - >-
        _agent_stack_agent_probe.stdout_lines[1]
        == ((agent_stack_agent_probe_cpus | float * 100000) | int | string) ~ ' 100000'
    fail_msg: >-
      The agent's container did not hold its limits (read {{ _agent_stack_agent_probe.stdout_lines }}).
      The user's cgroup lacks the cpu or memory controller: systemd delegates
      them through user@.service.
    success_msg: The agent's daemon enforces memory and CPU limits.

# The protection is the dev user's home mode, not this list: a home with no
# permission for others hides every file in it. The list is the evidence.
- name: Read the dev user's home mode
  ansible.builtin.stat:
    path: "{{ agent_stack_dev_home }}"
  register: _agent_stack_dev_home

- name: Assert the dev user's home is closed to other users
  ansible.builtin.assert:
    that: (_agent_stack_dev_home.stat.mode | int(base=8)) % 8 == 0
    fail_msg: "{{ agent_stack_dev_home }} is mode {{ _agent_stack_dev_home.stat.mode }}; other users can enter it."
    quiet: true

- name: Try every protected path as the agent
  ansible.builtin.command:
    cmd: test -r {{ item }}
  become_user: "{{ agent_stack_agent_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ _agent_stack_agent_uid }}"
  loop: "{{ agent_stack_protected_paths }}"
  register: _agent_stack_protected
  changed_when: false
  check_mode: false
  failed_when: _agent_stack_protected.rc == 0

# Read as root, which sees every source of sudo rules (files, drop-ins, LDAP), so a
# rule granted outside this role still fails the play.
- name: Read the sudo rules for the agent's user
  ansible.builtin.command:
    cmd: sudo -l -U {{ agent_stack_agent_user }}
  register: _agent_stack_agent_sudo
  changed_when: false
  check_mode: false

- name: Assert the agent's user holds no sudo rule
  ansible.builtin.assert:
    that: "'is not allowed to run sudo' in _agent_stack_agent_sudo.stdout"
    fail_msg: "{{ agent_stack_agent_user }} holds a sudo rule: {{ _agent_stack_agent_sudo.stdout }}"
    quiet: true
