---
# =============================================================================
# agent_stack: the operator's agent tooling on ace2 (ADR-068, spec
# AI-009-hermes-ace2): Open WebUI on the system daemon, then the agent's user,
# its rootless daemon and hermes-kubelab on that daemon.
# =============================================================================

- name: Create the agent stack directory
  ansible.builtin.file:
    path: "{{ agent_stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags: [agent_stack]

# Open WebUI signs its sessions with this key. Generated ON the node, once, the
# way dev_node mints its forge keypair: a random value nothing else needs to know
# has no reason to sit in SOPS, and keeping it out means one less secret the
# operator must mint before the node can be provisioned. Left unset, the image
# writes its own key inside the container's filesystem, not the data volume,
# so every recreate would log every user out.
- name: Generate the Open WebUI session key once
  ansible.builtin.shell:
    cmd: umask 077 && openssl rand -hex 32 > {{ agent_stack_dir }}/webui-secret-key
    creates: "{{ agent_stack_dir }}/webui-secret-key"
  tags: [agent_stack]

- name: Read the Open WebUI session key
  ansible.builtin.slurp:
    src: "{{ agent_stack_dir }}/webui-secret-key"
  register: _agent_stack_key_file
  # A dry run generates nothing, so on a node that never had the key there
  # is none to read: the templates then render an empty one, a change.
  ignore_errors: "{{ ansible_check_mode }}"
  no_log: true
  tags: [agent_stack]

- name: Hold the session key for the env template
  ansible.builtin.set_fact:
    _agent_stack_webui_secret_key: "{{ _agent_stack_key_file.content | default('') | b64decode | trim }}"
  no_log: true
  tags: [agent_stack]

# The API key only Open WebUI needs to know, both on this node: generated here
# once, like the session key above, so it never sits in SOPS. Before Open WebUI:
# its env file carries the key to Hermes (spec AI-009 AC4).
- name: Generate the Hermes API key once
  ansible.builtin.shell:
    cmd: umask 077 && openssl rand -hex 32 > {{ agent_stack_dir }}/hermes-api-key
    creates: "{{ agent_stack_dir }}/hermes-api-key"
  when: agent_stack_hermes_configured | bool
  tags: [agent_stack]

- name: Read the Hermes API key
  ansible.builtin.slurp:
    src: "{{ agent_stack_dir }}/hermes-api-key"
  register: _agent_stack_hermes_key_file
  # A dry run generates nothing, so on a node that never had the key there
  # is none to read: the templates then render an empty one, a change.
  ignore_errors: "{{ ansible_check_mode }}"
  when: agent_stack_hermes_configured | bool
  no_log: true
  tags: [agent_stack]

- name: Hold the API key for the env templates
  ansible.builtin.set_fact:
    _agent_stack_hermes_api_key: "{{ _agent_stack_hermes_key_file.content | default('') | b64decode | trim }}"
  when: agent_stack_hermes_configured | bool
  no_log: true
  tags: [agent_stack]

# The MCP bridge's key, the same way: only Open WebUI sends it and only the
# bridge checks it, both on this node (spec AI-009 AC9).
- name: Generate the MCP bridge key once
  ansible.builtin.shell:
    cmd: umask 077 && openssl rand -hex 32 > {{ agent_stack_dir }}/mcp-bridge-key
    creates: "{{ agent_stack_dir }}/mcp-bridge-key"
  when: agent_stack_mcp_bridge_configured | bool
  tags: [agent_stack]

- name: Read the MCP bridge key
  ansible.builtin.slurp:
    src: "{{ agent_stack_dir }}/mcp-bridge-key"
  register: _agent_stack_mcp_bridge_key_file
  # A dry run generates nothing, so on a node that never had the key there
  # is none to read: the templates then render an empty one, a change.
  ignore_errors: "{{ ansible_check_mode }}"
  when: agent_stack_mcp_bridge_configured | bool
  no_log: true
  tags: [agent_stack]

- name: Hold the MCP bridge key for the env templates
  ansible.builtin.set_fact:
    _agent_stack_mcp_bridge_key: "{{ _agent_stack_mcp_bridge_key_file.content | default('') | b64decode | trim }}"
  when: agent_stack_mcp_bridge_configured | bool
  no_log: true
  tags: [agent_stack]

# Without OIDC, Open WebUI's first visitor creates the admin account, and the
# tailnet includes the `work@` bridge identities, which the policy allows to
# reach every node (ADR-041 rule 1). So "not configured" means not started, never
# "started with a login form".
- name: Report that Open WebUI is not configured
  ansible.builtin.debug:
    msg: >-
      Open WebUI is NOT started: it needs both the OIDC client secret
      (apps.services.security.authelia.oidc_client_secret_open_webui) and the
      break-glass password (apps.services.ai.open_webui.admin_password) in prod
      SOPS. Mint them with `toolkit secrets set`, run `make sync-oidc-hashes
      ENV=prod`, merge, then provision again.
  when: not (agent_stack_webui_configured | bool)
  tags: [agent_stack]

# The same invariant on a node that WAS configured: a secret removed from SOPS
# must take Open WebUI down, not leave the last container serving.
- name: Stop Open WebUI when it is not configured
  when: not (agent_stack_webui_configured | bool)
  tags: [agent_stack]
  block:
    - name: Look for a previously deployed Compose project
      ansible.builtin.stat:
        path: "{{ agent_stack_dir }}/compose-webui.yml"
      register: _agent_stack_prior

    - name: Take the previous Open WebUI down
      ansible.builtin.command: >-
        docker compose -p {{ agent_stack_webui_project }}
        -f {{ agent_stack_dir }}/compose-webui.yml down
      when: _agent_stack_prior.stat.exists
      register: _agent_stack_down
      changed_when: "'Removed' in _agent_stack_down.stderr or 'Stopped' in _agent_stack_down.stderr"

    - name: Disable the Open WebUI unit
      ansible.builtin.systemd:
        name: agent-stack-webui.service
        enabled: false
      when: _agent_stack_prior.stat.exists and not ansible_check_mode

    # Removing the file is what makes the next unconfigured run a no-op, and it
    # takes the secret-bearing env file with it. The data volume stays.
    - name: Remove the rendered Open WebUI files
      ansible.builtin.file:
        path: "{{ agent_stack_dir }}/{{ item }}"
        state: absent
      loop: [compose-webui.yml, webui.env, mcp-bridge.env]

# The bridge leaves with the vault. `up --remove-orphans` below stops its
# container; this takes the key's env file and the build context with it.
- name: Remove the MCP bridge's files when it is not configured
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ agent_stack_dir }}/mcp-bridge.env"
    - "{{ agent_stack_mcp_bridge_dir }}"
  when: not (agent_stack_mcp_bridge_configured | bool)
  tags: [agent_stack]

- name: Deploy Open WebUI
  when: agent_stack_webui_configured | bool
  tags: [agent_stack]
  block:
    # Registered, not notified: the recreate has to happen before the drift
    # checks below read the container, not at the end of the play.
    - name: Render the Open WebUI env file
      ansible.builtin.template:
        src: webui.env.j2
        dest: "{{ agent_stack_dir }}/webui.env"
        owner: root
        group: root
        mode: "0600"
      register: _agent_stack_env
      no_log: true

    - name: Render the Open WebUI Compose project
      ansible.builtin.template:
        src: compose-webui.yml.j2
        dest: "{{ agent_stack_dir }}/compose-webui.yml"
        owner: root
        group: root
        mode: "0644"
      register: _agent_stack_compose

    # Before the project starts: Docker would create a missing bind source as
    # an empty directory, and the mirror is filled after Open WebUI is up.
    - name: Create the vault mirror's tree for the MCP bridge
      ansible.builtin.file:
        path: "{{ agent_stack_vault_mirror }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: ["", tree]
      when: agent_stack_mcp_bridge_configured | bool

    - name: Install the MCP bridge's build context
      ansible.builtin.copy:
        src: mcp-bridge/
        dest: "{{ agent_stack_mcp_bridge_dir }}/"
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"
      when: agent_stack_mcp_bridge_configured | bool

    - name: Render the MCP bridge env file
      ansible.builtin.template:
        src: mcp-bridge.env.j2
        dest: "{{ agent_stack_dir }}/mcp-bridge.env"
        owner: root
        group: root
        mode: "0600"
      when: agent_stack_mcp_bridge_configured | bool
      no_log: true

    - name: Pull the Open WebUI image
      ansible.builtin.command: >-
        docker compose -p {{ agent_stack_webui_project }}
        -f {{ agent_stack_dir }}/compose-webui.yml pull
      register: _agent_stack_pull
      changed_when: "'Pull complete' in _agent_stack_pull.stderr or 'Downloaded' in _agent_stack_pull.stderr"

    # Built from the context above. The image ID is the measurement: a cached
    # build of an unchanged context gives the same one, so a rerun is no change.
    - name: Read the MCP bridge image in use
      ansible.builtin.command: docker image inspect {{ agent_stack_mcp_bridge_image }} --format '{% raw %}{{.Id}}{% endraw %}'
      register: _agent_stack_bridge_before
      changed_when: false
      failed_when: false
      check_mode: false
      when: agent_stack_mcp_bridge_configured | bool

    - name: Build the MCP bridge image
      ansible.builtin.command: >-
        docker compose -p {{ agent_stack_webui_project }}
        -f {{ agent_stack_dir }}/compose-webui.yml build mcp-bridge
      when: agent_stack_mcp_bridge_configured | bool
      changed_when: false

    - name: Read the MCP bridge image built
      ansible.builtin.command: docker image inspect {{ agent_stack_mcp_bridge_image }} --format '{% raw %}{{.Id}}{% endraw %}'
      register: _agent_stack_bridge_after
      changed_when: _agent_stack_bridge_after.stdout != _agent_stack_bridge_before.stdout
      when: agent_stack_mcp_bridge_configured | bool and not ansible_check_mode

    # Same two checks as the glances role, for the same reasons: a port binding
    # and a memory limit are fixed at create time, and `up -d` with an unchanged
    # spec will not notice either one missing.
    - name: Read the port bindings requested vs the ones in effect
      ansible.builtin.command: >-
        docker inspect open-webui
        --format '{% raw %}{{len .HostConfig.PortBindings}}:{{len .NetworkSettings.Ports}}{% endraw %}'
      register: _agent_stack_ports
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read the memory limit in force
      ansible.builtin.command: docker inspect open-webui --format '{% raw %}{{.HostConfig.Memory}}{% endraw %}'
      register: _agent_stack_memory
      changed_when: false
      failed_when: false
      check_mode: false

    # Hermes is reached on this bridge's gateway: a container left on the old
    # Compose default network would answer health checks and never reach it.
    - name: Read the networks the container is attached to
      ansible.builtin.command: >-
        docker inspect open-webui
        --format '{% raw %}{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}{% endraw %}'
      register: _agent_stack_networks
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Decide whether the container must be recreated
      ansible.builtin.set_fact:
        _agent_stack_recreate: >-
          {{ _agent_stack_env.changed
             or (_agent_stack_ports.rc == 0
                 and (_agent_stack_ports.stdout | trim).split(':')[0] | int > 0
                 and (_agent_stack_ports.stdout | trim).split(':')[1] | int == 0)
             or (_agent_stack_memory.rc == 0
                 and (_agent_stack_memory.stdout | trim | int)
                     != (agent_stack_webui.memory_limit | human_to_bytes))
             or (_agent_stack_networks.rc == 0
                 and agent_stack_webui_bridge.network not in _agent_stack_networks.stdout.split()) }}

    # The recreate covers what `up -d` cannot see: a port binding or memory limit
    # lost at create time. An env file's content IS in Compose's hash (measured
    # 2026-10-07 on the agent's sidecar), so for it the flag is only redundant.
    - name: Start Open WebUI
      ansible.builtin.command: >-
        docker compose -p {{ agent_stack_webui_project }}
        -f {{ agent_stack_dir }}/compose-webui.yml up -d --remove-orphans
        {{ '--force-recreate' if _agent_stack_recreate | bool else '' }}
      register: _agent_stack_up
      changed_when: "'Started' in _agent_stack_up.stderr or 'Created' in _agent_stack_up.stderr"

    # Compose's default network until the bridge was declared (spec AI-009 AC4).
    - name: Remove Open WebUI's previous network
      ansible.builtin.command: docker network rm {{ agent_stack_webui_project }}_default
      register: _agent_stack_old_network
      changed_when: _agent_stack_old_network.rc == 0
      failed_when: >-
        _agent_stack_old_network.rc != 0
        and 'not found' not in _agent_stack_old_network.stderr

    - name: Verify Open WebUI answers on the Tailscale address
      ansible.builtin.uri:
        url: "{{ agent_stack_webui.scheme }}://{{ tailscale_ip }}:{{ agent_stack_webui.default_port }}{{ agent_stack_webui.health_path }}"
        status_code: 200
        timeout: 10
      register: _agent_stack_health
      until: _agent_stack_health.status == 200
      retries: 30
      delay: 5

    # The seed runs only on an empty database, so this is what proves the first
    # admin is ours and not a visitor's. It also catches SOPS and the database
    # disagreeing, the state a break-glass path must never be found in.
    - name: Verify the break-glass account is the seeded admin
      ansible.builtin.uri:
        url: "{{ agent_stack_webui.scheme }}://{{ tailscale_ip }}:{{ agent_stack_webui.default_port }}/api/v1/auths/signin"
        method: POST
        body_format: json
        body:
          email: "{{ agent_stack_webui_admin_email }}"
          password: "{{ agent_stack_webui_admin_password }}"
        status_code: [200, 400, 401, 403]
        timeout: 10
      register: _agent_stack_break_glass
      failed_when: >-
        _agent_stack_break_glass.status != 200
        or (_agent_stack_break_glass.json | default({})).get('role') != 'admin'
      no_log: true

    - name: Report the break-glass check
      ansible.builtin.debug:
        msg: "break-glass account {{ agent_stack_webui_admin_email }} signs in as admin"

    - name: Install the Tailscale address wait helper
      ansible.builtin.copy:
        src: wait-for-tailscale-addr.sh
        dest: "{{ agent_stack_dir }}/wait-for-tailscale-addr.sh"
        owner: root
        group: root
        mode: "0755"

    - name: Install the Open WebUI unit
      ansible.builtin.template:
        src: agent-stack-webui.service.j2
        dest: /etc/systemd/system/agent-stack-webui.service
        owner: root
        group: root
        mode: "0644"

    - name: Enable the Open WebUI unit at boot
      ansible.builtin.systemd:
        name: agent-stack-webui.service
        enabled: true
        daemon_reload: true
      when: not ansible_check_mode

# Imported, not included: an include is dynamic and its tasks do not inherit
# the role's `agent_stack` tag, so `--tags agent_stack` would skip all of them.
- name: Provision the agent's user and its rootless daemon
  ansible.builtin.import_tasks: agent_user.yml
  tags: [agent_stack]

# Before Hermes: its sandbox mounts the clone this makes.
- name: Provision the agent's vault clone and its sync
  ansible.builtin.import_tasks: vault_zone.yml
  tags: [agent_stack]

# After the sync: both read the vault with its token, from the same directory.
- name: Provision Open WebUI's read-only vault mirror
  ansible.builtin.import_tasks: vault_mirror.yml
  tags: [agent_stack]

# After the mirror: the probes read the vault through the bridge.
- name: Verify Open WebUI's MCP bridge
  ansible.builtin.import_tasks: mcp_bridge.yml
  tags: [agent_stack]

# After the agent's user: Hermes runs on the daemon that file provisions and proves.
- name: Provision hermes-kubelab on the agent's daemon
  ansible.builtin.import_tasks: hermes.yml
  tags: [agent_stack]
