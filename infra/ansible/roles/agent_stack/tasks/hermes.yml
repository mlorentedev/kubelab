---
# =============================================================================
# hermes-kubelab (ADR-068 D2, spec AI-009 PR 3): the gateway on the agent's
# rootless daemon, from agent_user.yml. Every docker call below runs as the
# agent's user against its own socket, except the two probes of the API's
# firewall, which run where Open WebUI does: on the system daemon.
#
# The last block is the measurement: the deny list is read back through the
# running gateway's own evaluator. A config Hermes failed to load leaves the
# list empty without stopping it (measured 2026-10-06 on v2026.9.24). Without
# the vault mounted, that list is the only command guard it applies.
# =============================================================================

# Before the gateway starts, so a first provision orders the next boot too.
- name: Install the unit that waits for Open WebUI's bridge
  when: agent_stack_hermes_configured | bool and agent_stack_webui_configured | bool
  block:
    - name: Render the bridge wait unit
      ansible.builtin.template:
        src: agent-stack-hermes-bind.service.j2
        dest: /etc/systemd/system/agent-stack-hermes-bind.service
        owner: root
        group: root
        mode: "0644"
      register: _agent_stack_hermes_bind_unit

    # Enabled, not started: it orders the boot, and now the address exists.
    - name: Enable the bridge wait unit at boot
      ansible.builtin.systemd:
        name: agent-stack-hermes-bind.service
        enabled: true
        daemon_reload: "{{ _agent_stack_hermes_bind_unit is changed }}"
      when: not ansible_check_mode

# A unit left waiting on a bridge nobody creates would delay the agent's manager
# by its whole timeout at every boot.
- name: Remove the unit that waits for Open WebUI's bridge
  when: not (agent_stack_hermes_configured | bool and agent_stack_webui_configured | bool)
  block:
    - name: Disable the bridge wait unit
      ansible.builtin.systemd:
        name: agent-stack-hermes-bind.service
        enabled: false
      register: _agent_stack_hermes_bind_disabled
      failed_when: >-
        _agent_stack_hermes_bind_disabled is failed
        and 'Could not find' not in (_agent_stack_hermes_bind_disabled.msg | default(''))

    - name: Delete the bridge wait unit
      ansible.builtin.file:
        path: /etc/systemd/system/agent-stack-hermes-bind.service
        state: absent

- name: Stop hermes-kubelab when it is not configured
  when: not (agent_stack_hermes_configured | bool)
  block:
    - name: Look for a previously deployed hermes-kubelab
      ansible.builtin.stat:
        path: "{{ agent_stack_hermes_compose }}"
      register: _agent_stack_hermes_prior

    - name: Take the previous hermes-kubelab down
      ansible.builtin.command: >-
        docker compose -p {{ agent_stack_hermes_project }} -f {{ agent_stack_hermes_compose }} down
      become_user: "{{ agent_stack_agent_user }}"
      environment: "{{ agent_stack_agent_daemon_env }}"
      when: _agent_stack_hermes_prior.stat.exists
      register: _agent_stack_hermes_down
      changed_when: "'Removed' in _agent_stack_hermes_down.stderr or 'Stopped' in _agent_stack_hermes_down.stderr"

    # The secret-bearing env file must not outlive the service. The data stays.
    - name: Remove the rendered hermes-kubelab files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ agent_stack_hermes_compose }}"
        - "{{ agent_stack_hermes_env }}"
        - "{{ agent_stack_hermes_ts_env }}"

    # The same rule as the one opened, comment included. A host that never ran
    # Hermes never had it, and ufw refuses to delete a rule it does not hold.
    - name: Close the Hermes API to Open WebUI's network
      community.general.ufw:
        rule: allow
        interface_in: "{{ agent_stack_webui_bridge.name }}"
        from_ip: "{{ agent_stack_webui_bridge.subnet }}"
        to_ip: "{{ agent_stack_webui_bridge.gateway }}"
        to_port: "{{ agent_stack_hermes.api_port }}"
        proto: tcp
        comment: hermes-kubelab API from Open WebUI
        delete: true
      register: _agent_stack_hermes_rule_closed
      failed_when: >-
        _agent_stack_hermes_rule_closed is failed
        and 'non-existent' not in (_agent_stack_hermes_rule_closed.msg | default('') ~ _agent_stack_hermes_rule_closed.stdout | default(''))

- name: Deploy hermes-kubelab
  when: agent_stack_hermes_configured | bool
  block:
    # Created once and then left alone: the image hands the directory to its
    # own runtime user at every start, so enforcing an owner here would undo
    # that at every provision and report a change each time.
    - name: Create the Hermes data directory
      ansible.builtin.command:
        cmd: install -d -o {{ agent_stack_agent_user }} -g {{ agent_stack_agent_user }} -m 0700 {{ agent_stack_hermes_home }}
        creates: "{{ agent_stack_hermes_home }}"

    - name: Render the hermes-kubelab env file
      ansible.builtin.template:
        src: hermes.env.j2
        dest: "{{ agent_stack_hermes_env }}"
        owner: "{{ agent_stack_agent_user }}"
        group: "{{ agent_stack_agent_user }}"
        mode: "0600"
      register: _agent_stack_hermes_env_file
      no_log: true

    # Outside the data directory and mounted read-only (see the role defaults):
    # the gateway reads it and can neither rewrite its approvals nor migrate it.
    - name: Render the hermes-kubelab config
      ansible.builtin.template:
        src: hermes-config.yaml.j2
        dest: "{{ agent_stack_hermes_config }}"
        owner: "{{ agent_stack_agent_user }}"
        group: "{{ agent_stack_agent_user }}"
        mode: "0644"
      register: _agent_stack_hermes_config

    # The sidecar rejoins from its state on its own, so a key is minted only when
    # it is not on the tailnet now. Asked of the sidecar, not read from its state
    # file: tailscaled writes that file at its first start, before any login, so
    # a first registration that failed would leave a file and never be retried.
    - name: Create the tailscale sidecar's state directory
      ansible.builtin.file:
        path: "{{ agent_stack_hermes_ts_state }}"
        state: directory
        owner: "{{ agent_stack_agent_user }}"
        group: "{{ agent_stack_agent_user }}"
        mode: "0700"

    # No container (a first deploy) fails at once; a starting one is waited for.
    - name: Ask the sidecar whether it is on the tailnet
      ansible.builtin.command: >-
        docker exec hermes-kubelab-tailscale tailscale status --json --peers=false
      become_user: "{{ agent_stack_agent_user }}"
      environment: "{{ agent_stack_agent_daemon_env }}"
      register: _agent_stack_hermes_ts_before
      until: >-
        _agent_stack_hermes_ts_before.rc != 0
        or (_agent_stack_hermes_ts_before.stdout | from_json).BackendState not in ['NoState', 'Starting']
        or ansible_check_mode
      retries: 15
      delay: 2
      changed_when: false
      failed_when: false
      check_mode: false
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Hold whether the sidecar is on the tailnet
      ansible.builtin.set_fact:
        _agent_stack_hermes_ts_on_tailnet: >-
          {{ _agent_stack_hermes_ts_before.rc == 0
             and (_agent_stack_hermes_ts_before.stdout | from_json).BackendState == 'Running' }}

    # Under the `agents` user, which owns `tag:hermes` (ADR-041). Single use and
    # one hour, so a key that outlives the registration opens nothing.
    - name: Mint the sidecar's preauth key on Headscale
      ansible.builtin.command: >-
        docker exec headscale headscale preauthkeys create
        --user {{ agent_stack_headscale_agents_user_id }} --tags tag:hermes --expiration 1h
      delegate_to: "{{ agent_stack_headscale_host }}"
      become: false
      when: not (_agent_stack_hermes_ts_on_tailnet | bool)
      register: _agent_stack_hermes_ts_mint
      no_log: true

    - name: Render the tailscale sidecar's env file
      ansible.builtin.template:
        src: hermes-tailscale.env.j2
        dest: "{{ agent_stack_hermes_ts_env }}"
        owner: "{{ agent_stack_agent_user }}"
        group: "{{ agent_stack_agent_user }}"
        mode: "0600"
      vars:
        _agent_stack_hermes_ts_key: "{{ _agent_stack_hermes_ts_mint.stdout | default('') | trim }}"
      register: _agent_stack_hermes_ts_env_file
      no_log: true

    - name: Render the hermes-kubelab Compose project
      ansible.builtin.template:
        src: compose-hermes.yml.j2
        dest: "{{ agent_stack_hermes_compose }}"
        owner: "{{ agent_stack_agent_user }}"
        group: "{{ agent_stack_agent_user }}"
        mode: "0644"

    - name: Pull the hermes-kubelab images
      ansible.builtin.command: >-
        docker {{ item }}
      loop:
        - compose -p {{ agent_stack_hermes_project }} -f {{ agent_stack_hermes_compose }} pull
        # The sandbox image is pulled now rather than at the first command,
        # which would otherwise wait on a multi-hundred-megabyte download.
        - pull {{ agent_stack_hermes.sandbox.image }}
      become_user: "{{ agent_stack_agent_user }}"
      environment: "{{ agent_stack_agent_daemon_env }}"
      register: _agent_stack_hermes_pull
      changed_when: >-
        'Pull complete' in _agent_stack_hermes_pull.stderr
        or 'Downloaded newer image' in _agent_stack_hermes_pull.stdout

    # Same check as Open WebUI's: a binding is fixed at create time, so a gateway
    # created before the bridge had its address runs with no port, and an
    # unchanged spec hash keeps `up -d` off it.
    - name: Read the Hermes port bindings requested vs the ones in effect
      ansible.builtin.command: >-
        docker inspect hermes-kubelab
        --format '{% raw %}{{len .HostConfig.PortBindings}}:{{len .NetworkSettings.Ports}}{% endraw %}'
      become_user: "{{ agent_stack_agent_user }}"
      environment: "{{ agent_stack_agent_daemon_env }}"
      register: _agent_stack_hermes_ports
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Hold whether the gateway runs unbound
      ansible.builtin.set_fact:
        _agent_stack_hermes_unbound: >-
          {{ _agent_stack_hermes_ports.rc == 0
             and (_agent_stack_hermes_ports.stdout | trim).split(':')[0] | int > 0
             and (_agent_stack_hermes_ports.stdout | trim).split(':')[1] | int == 0 }}

    # A mounted config is not in Compose's spec hash. An env_file's content is
    # (measured 2026-10-07: emptying the sidecar's recreated it at the next `up`),
    # so the flag is only certain for the config, and harmless for the rest.
    - name: Start hermes-kubelab
      ansible.builtin.command: >-
        docker compose -p {{ agent_stack_hermes_project }} -f {{ agent_stack_hermes_compose }} up -d
        {{ '--force-recreate' if (_agent_stack_hermes_env_file.changed or _agent_stack_hermes_config.changed
                                  or _agent_stack_hermes_ts_env_file.changed
                                  or _agent_stack_hermes_unbound | bool) else '' }}
      become_user: "{{ agent_stack_agent_user }}"
      environment: "{{ agent_stack_agent_daemon_env }}"
      register: _agent_stack_hermes_up
      changed_when: "'Started' in _agent_stack_hermes_up.stderr or 'Created' in _agent_stack_hermes_up.stderr"

    # A persistent sandbox is reused by its labels alone, whatever mounts it was
    # created with (v2026.9.24 `_attach_existing_container`), so a changed
    # config reaches commands only once the old one is gone. After the gateway
    # is recreated: a sandbox it starts from now on is made from the new config.
    - name: Remove the sandboxes made from the previous config
      ansible.builtin.shell:
        cmd: >-
          ids=$(docker ps -aq --filter label=hermes-agent=1);
          if [ -n "$ids" ]; then docker rm -f $ids; fi
      become_user: "{{ agent_stack_agent_user }}"
      environment: "{{ agent_stack_agent_daemon_env }}"
      when: _agent_stack_hermes_config.changed
      register: _agent_stack_hermes_sandboxes
      changed_when: _agent_stack_hermes_sandboxes.stdout | length > 0

    - name: Verify the Hermes API answers with its key
      ansible.builtin.uri:
        url: "http://{{ _agent_stack_hermes_bind }}:{{ agent_stack_hermes.api_port }}/v1/models"
        headers:
          Authorization: "Bearer {{ _agent_stack_hermes_api_key }}"
        status_code: 200
        timeout: 10
      register: _agent_stack_hermes_api
      until: _agent_stack_hermes_api.status == 200
      retries: 30
      delay: 5
      no_log: true

    # Socket Mode connects whether or not the bot is in the home channel, so this
    # proves the tokens and the connection, not delivery (see the runbook).
    - name: Verify the gateway is connected to Slack
      ansible.builtin.uri:
        url: "http://{{ _agent_stack_hermes_bind }}:{{ agent_stack_hermes.api_port }}/health/detailed"
        headers:
          Authorization: "Bearer {{ _agent_stack_hermes_api_key }}"
        status_code: 200
        timeout: 10
      register: _agent_stack_hermes_health
      until: ((_agent_stack_hermes_health.json | default({})).get('platforms', {}).get('slack', {})).get('state') == 'connected'
      retries: 24
      delay: 5
      when: agent_stack_slack_configured | bool
      no_log: true

    # Read from the sidecar itself: the tag is what the ACL matches, and a node
    # that registered without it would be matched by nothing, or by a user rule.
    # Open WebUI reaches the API at this host's address on its own bridge (spec
    # AI-009 AC4). The agent's daemon publishes through rootlesskit's listener in
    # the host's namespace, so that traffic crosses INPUT, where ufw denies by
    # default: this rule is the one network admitted, and the probe after the
    # next one proves the deny holds for every other.
    - name: Admit Open WebUI's network to the Hermes API
      community.general.ufw:
        rule: allow
        interface_in: "{{ agent_stack_webui_bridge.name }}"
        from_ip: "{{ agent_stack_webui_bridge.subnet }}"
        to_ip: "{{ agent_stack_webui_bridge.gateway }}"
        to_port: "{{ agent_stack_hermes.api_port }}"
        proto: tcp
        comment: hermes-kubelab API from Open WebUI
      when: agent_stack_webui_configured | bool

    # Containers of the system daemon, where Open WebUI runs: root's socket.
    - name: Reach the Hermes API from Open WebUI's network
      ansible.builtin.command:
        cmd: >-
          docker run --rm --network {{ agent_stack_webui_bridge.network }} {{ agent_stack_agent_probe_image }}
          nc -z -w 3 {{ agent_stack_webui_bridge.gateway }} {{ agent_stack_hermes.api_port }}
      register: _agent_stack_hermes_webui_network
      changed_when: false
      check_mode: false
      when: agent_stack_webui_configured | bool

    # The same address and port from another network: refused only if ufw, not
    # the bind, is what stands between them. The read-back above proved the
    # listener up, so a refusal here cannot come from a dead API.
    - name: Try the Hermes API from the system daemon's default network
      ansible.builtin.command:
        cmd: >-
          docker run --rm {{ agent_stack_agent_probe_image }}
          nc -z -w 3 {{ agent_stack_webui_bridge.gateway }} {{ agent_stack_hermes.api_port }}
      register: _agent_stack_hermes_other_network
      changed_when: false
      check_mode: false
      failed_when: "_agent_stack_hermes_other_network.rc == 0"
      when: agent_stack_webui_configured | bool

    - name: Verify the sidecar is on the tailnet as tag:hermes
      ansible.builtin.command: >-
        docker exec hermes-kubelab-tailscale tailscale status --json --peers=false
      become_user: "{{ agent_stack_agent_user }}"
      environment: "{{ agent_stack_agent_daemon_env }}"
      register: _agent_stack_hermes_ts_status
      until: >-
        _agent_stack_hermes_ts_status.rc == 0
        and (_agent_stack_hermes_ts_status.stdout | from_json).BackendState == 'Running'
        or ansible_check_mode
      retries: 30
      delay: 2
      changed_when: false
      failed_when: >-
        _agent_stack_hermes_ts_status.rc != 0
        or (_agent_stack_hermes_ts_status.stdout | from_json).BackendState != 'Running'
        or 'tag:hermes' not in ((_agent_stack_hermes_ts_status.stdout | from_json).Self.Tags | default([]))
      check_mode: false
      # A dry run of a fresh node has no sidecar to read.
      ignore_errors: "{{ ansible_check_mode }}"

    # The key is consumed: the container keeps no use for it, and the file no copy.
    - name: Empty the sidecar's env file once it is registered
      ansible.builtin.template:
        src: hermes-tailscale.env.j2
        dest: "{{ agent_stack_hermes_ts_env }}"
        owner: "{{ agent_stack_agent_user }}"
        group: "{{ agent_stack_agent_user }}"
        mode: "0600"
      vars:
        _agent_stack_hermes_ts_key: ""
      when: _agent_stack_hermes_ts_mint is changed
      no_log: true

    # Now, not at the next provision: the emptied file changes the sidecar's
    # Compose hash, and its state lets it rejoin without the key.
    - name: Recreate the sidecar without its consumed key
      ansible.builtin.command: >-
        docker compose -p {{ agent_stack_hermes_project }} -f {{ agent_stack_hermes_compose }} up -d tailscale
      become_user: "{{ agent_stack_agent_user }}"
      environment: "{{ agent_stack_agent_daemon_env }}"
      when: _agent_stack_hermes_ts_mint is changed

    - name: Verify the sidecar rejoined from its state alone
      ansible.builtin.command: >-
        docker exec hermes-kubelab-tailscale tailscale status --json --peers=false
      become_user: "{{ agent_stack_agent_user }}"
      environment: "{{ agent_stack_agent_daemon_env }}"
      register: _agent_stack_hermes_ts_rejoined
      until: >-
        _agent_stack_hermes_ts_rejoined.rc == 0
        and (_agent_stack_hermes_ts_rejoined.stdout | from_json).BackendState == 'Running'
        or ansible_check_mode
      retries: 30
      delay: 2
      changed_when: false
      check_mode: false
      ignore_errors: "{{ ansible_check_mode }}"
      when: _agent_stack_hermes_ts_mint is changed

    # One command each rule must refuse, and every command a rule lets through,
    # read through the gateway's own evaluator as the gateway's own user.
    - name: Evaluate a command each deny rule must refuse
      ansible.builtin.command:
        argv: "{{ _agent_stack_hermes_evaluate + item.split() }}"
      become_user: "{{ agent_stack_agent_user }}"
      environment: "{{ agent_stack_agent_daemon_env }}"
      loop: "{{ agent_stack_deny_rules | map(attribute='blocks') | map('first') | list }}"
      register: _agent_stack_hermes_refused
      changed_when: false
      failed_when: (_agent_stack_hermes_refused.stdout | from_json).verdict not in _agent_stack_hermes_refused_verdicts
      check_mode: false

    - name: Evaluate every command the deny rules let through
      ansible.builtin.command:
        argv: "{{ _agent_stack_hermes_evaluate + item.split() }}"
      become_user: "{{ agent_stack_agent_user }}"
      environment: "{{ agent_stack_agent_daemon_env }}"
      loop: "{{ agent_stack_deny_rules | map(attribute='allows') | flatten }}"
      register: _agent_stack_hermes_allowed
      changed_when: false
      failed_when: (_agent_stack_hermes_allowed.stdout | from_json).verdict not in _agent_stack_hermes_passed_verdicts
      check_mode: false
