---
# agent_stack: the operator's agent tooling on ace2 (ADR-068, spec
# AI-009-hermes-ace2). Values come from `apps.services.ai.*` in common.yaml via
# provision-ace2.yml; these defaults only name the layout on the node.
agent_stack_dir: /opt/agent-stack
agent_stack_webui_project: agent-stack-webui

# Inputs set by the playbook (no defaults on purpose, so a missing SSOT key
# fails the play instead of rendering an empty value):
#   tailscale_ip (the fleet name, so the boot-race guard in
#   tests/test_tailscale_bound_ports_survive_boot.py sees the bind),
#   agent_stack_webui (the apps.services.ai.open_webui
#   map), agent_stack_webui_oidc_client_id, agent_stack_oidc_issuer,
#   agent_stack_webui_admin_email,
#   agent_stack_agent_user, agent_stack_agent_probe_image,
#   agent_stack_hermes (the apps.services.ai.hermes_kubelab map), and
#   agent_stack_protected_paths (what the agent must fail to read).

# Delivered from prod SOPS by the playbook. Empty means "not configured": the
# role renders nothing that needs it and does not start Open WebUI, because
# without OIDC its first visitor would create the admin account, and the
# tailnet includes the `work@` bridge identities (ADR-041 rule 1).
agent_stack_webui_oidc_client_secret: ""
# The break-glass account's password (ADR-062 D4), from the same prod SOPS. Its
# email comes from the break-glass declaration as `agent_stack_webui_admin_email`.
agent_stack_webui_admin_password: ""
# Both, or Open WebUI is not started. The login form is on, and on an empty
# database the first visitor to sign up becomes admin unless the break-glass
# account was seeded first.
agent_stack_webui_configured: >-
  {{ agent_stack_webui_oidc_client_secret | length > 0
     and agent_stack_webui_admin_password | length > 0 }}
agent_stack_nan_api_key: ""
agent_stack_nan_api_base_url: https://api.nan.builders/v1

# The container's resolvers, the rpi3_services form of `docker_dns_servers`:
# MagicDNS first, so the container resolves ace2's tailnet name and the prod
# Authelia issuer the way the host does, because Docker never passes the host's
# 100.100.100.100 into a container. The public entry is only for a Tailscale
# outage.
agent_stack_docker_dns_servers: ["100.100.100.100", "1.1.1.1"]

# The agent's user (ADR-068 D2). A system user, so useradd allocates it no
# subordinate ids of its own: the role declares them, and asserts at every run
# that no other user's range overlaps. The start sits well above useradd's
# automatic allocations (100000, then one 65536 block per login user).
agent_stack_agent_home: "/var/lib/{{ agent_stack_agent_user }}"
agent_stack_agent_subid_start: 524288
agent_stack_agent_subid_count: 65536

# The daemon the agent drives: the user's own, inside its namespace. Never the
# system socket, which is root on the host. tests/test_agent_user_role.py fails
# if anything in this role can render that one.
agent_stack_agent_docker_host: "unix:///run/user/{{ _agent_stack_agent_uid }}/docker.sock"
agent_stack_agent_daemon_env:
  DOCKER_HOST: "{{ agent_stack_agent_docker_host }}"
  XDG_RUNTIME_DIR: "/run/user/{{ _agent_stack_agent_uid }}"

# Declared rather than left to docker-ce's Recommends: the setup tool ships in
# docker-ce-rootless-extras, newuidmap/newgidmap in uidmap, and the user's
# systemd manager needs a dbus session to take `systemctl --user` calls. acl
# is Ansible's: becoming an unprivileged user without pipelining hands it the
# module files through setfacl.
agent_stack_rootless_packages:
  - acl
  - docker-ce-rootless-extras
  - uidmap
  - dbus-user-session
  - slirp4netns

agent_stack_agent_probe_memory: 64m
agent_stack_agent_probe_cpus: "0.5"

# The agent's user is refused the tailnet on the host (lesson-525), and this
# node's private networks (#2161). The ranges (agent_stack_tailnet_ranges,
# agent_stack_private_ranges), the LAN probe's address and the probe's two addresses
# (agent_stack_egress_probe_refused/_open, one host's tailnet and public
# address) come from the networking SSOT through the playbook.
agent_stack_egress_table: "{{ agent_stack_dir }}/agent-egress.nft"
# MagicDNS (100.100.100.100) sits inside the refused range, so the agent's
# containers resolve through public resolvers only, the headscale role's pair.
# Everything they need (NaN, Slack, GitHub, the prod issuer) is public DNS.
agent_stack_hermes_dns_servers: ["1.1.1.1", "8.8.8.8"]
agent_stack_egress_probe_port: 443

# The hook the agent's vault clone commits through: root's, outside the agent's
# home, whose directory the agent could otherwise rename (spec AC6).
agent_stack_vault_hooks: /usr/local/libexec/agent-stack/vault-hooks

# The vault clone and its sync (ADR-068 D4 as amended 2026-10-08). The clone is
# beside the data directory, not in it, so the gateway's container never sees
# `.git`; the sandbox sees it read-only and the zone writable. The token is
# root's file, handed to the sync unit by systemd (LoadCredential), so no
# process of the agent's user can read it from disk.
agent_stack_vault_token: ""
agent_stack_vault_configured: "{{ agent_stack_vault_token | length > 0 }}"
agent_stack_vault_clone: "{{ agent_stack_agent_home }}/vault"
agent_stack_vault_token_file: "{{ agent_stack_dir }}/vault-token"
agent_stack_vault_libexec: /usr/local/libexec/agent-stack
agent_stack_vault_sync_unit: hermes-kubelab-vault-sync

# The read-only vault the MCP bridge serves Open WebUI (spec AI-009 AC9): root's,
# in the root-only stack directory, refreshed from the remote by its own unit and
# never from the agent's clone. `git` holds the history, `tree` the notes.
agent_stack_vault_mirror: "{{ agent_stack_dir }}/vault-mirror"
agent_stack_vault_mirror_unit: agent-stack-vault-mirror

# The MCP bridge in front of that mirror (spec AI-009 AC9), in Open WebUI's
# Compose project: it runs exactly when both Open WebUI and the vault do. Its
# build context is root's, and the image tag exists only on this node.
agent_stack_mcp_bridge_configured: >-
  {{ agent_stack_webui_configured | bool and agent_stack_vault_configured | bool }}
agent_stack_mcp_bridge_dir: "{{ agent_stack_dir }}/mcp-bridge"
agent_stack_mcp_bridge_image: kubelab/mcp-bridge:local

# hermes-kubelab (ADR-068 D2, spec PR 3). `agent_stack_hermes` is the
# apps.services.ai.hermes_kubelab map, set by the playbook.
agent_stack_hermes_project: agent-stack-hermes
# Mounted at the same path inside the gateway: it computes the host side of
# every sandbox mount from its own view of this directory.
agent_stack_hermes_home: "{{ agent_stack_agent_home }}/data"
# Beside the data directory, not in it: the gateway's container sees only the
# data directory, so neither file is readable from inside it.
agent_stack_hermes_env: "{{ agent_stack_agent_home }}/hermes.env"
agent_stack_hermes_compose: "{{ agent_stack_agent_home }}/compose-hermes.yml"
# Mounted read-only over the data directory's config.yaml. At every start the
# image hands that file to its runtime user and runs a migration that may
# rewrite it (v2026.9.24 stage2-hook.sh), so a file in the data directory would
# be the agent's to edit, approvals included, and would drift from this role.
agent_stack_hermes_config: "{{ agent_stack_agent_home }}/hermes-config.yaml"
# The tailscale sidecar's (spec PR 3b-2). Its state is the node key: beside the
# data directory, so the gateway's container does not see it. The env file
# holds the one-time preauth key until the first registration, then nothing.
agent_stack_hermes_ts_state: "{{ agent_stack_agent_home }}/tailscale"
agent_stack_hermes_ts_env: "{{ agent_stack_agent_home }}/hermes-tailscale.env"
# Inputs set by the playbook: agent_stack_headscale_url, agent_stack_headscale_host
# (the inventory host that runs Headscale) and agent_stack_headscale_agents_user_id.
# The inference key is the only secret Hermes cannot start without. Missing, it
# is not started, and a previous one is taken down.
agent_stack_hermes_configured: "{{ agent_stack_nan_api_key | length > 0 }}"
# Where Hermes publishes its API (spec AI-009 AC4). On the host's address in Open
# WebUI's network when Open WebUI runs, which a ufw rule opens to that network
# alone; on loopback otherwise, where no such address exists to bind.
# agent_stack_webui_bridge (`networking.nodes.ace2.webui_bridge`) is passed in.
_agent_stack_hermes_bind: >-
  {{ agent_stack_webui_bridge.gateway if agent_stack_webui_configured | bool else '127.0.0.1' }}
# The commands Hermes never runs. The file is the list; tests/test_hermes_config.py
# proves each glob blocks what its rule names.
agent_stack_deny_rules: "{{ (lookup('ansible.builtin.file', role_path ~ '/files/guardrails-denylist.yaml') | from_yaml).rules }}"
# `hermes approvals test`: what the gateway would do with a command, without
# running it (exit 3 for a deny, so the tasks read the verdict, not the code).
# The evaluator models a docker sandbox with no host path, which skips every
# guard but the deny list. With the vault mounted the runtime applies them all,
# the path the evaluator takes for `local` (v2026.9.24 `_should_skip_container_guards`).
_agent_stack_hermes_env_type: "{{ 'local' if agent_stack_vault_configured | bool else 'docker' }}"
_agent_stack_hermes_evaluate: [docker, exec, -u, hermes, hermes-kubelab, hermes, approvals, test, --env-type, "{{ _agent_stack_hermes_env_type }}", --json, "--"]
# What each verdict means for a deny rule: refused by it or by Hermes's own
# floor, or let through, possibly to a prompt that a scheduled job then denies.
_agent_stack_hermes_refused_verdicts: [user-deny, hardline-deny]
_agent_stack_hermes_passed_verdicts: [allow, ask-approval]
