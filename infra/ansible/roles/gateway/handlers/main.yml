---
- name: restart nftables
  # Reload, never restart. A restart runs ExecStop, which the kubelab-stop.conf
  # drop-in limits to the edge table, so the uplink has no drops until the start
  # reloads the file. A reload swaps the table in one transaction.
  systemd:
    name: nftables
    state: reloaded

- name: reload systemd
  systemd:
    daemon_reload: true

- name: reload ufw
  command: ufw reload
  changed_when: true

- name: restart dnsmasq
  systemd:
    name: dnsmasq
    state: restarted

- name: restart systemd-sysctl
  systemd:
    name: systemd-sysctl
    state: restarted

- name: apply netplan
  command: netplan apply
  changed_when: true

- name: wait for the session
  wait_for_connection:
    timeout: 120
