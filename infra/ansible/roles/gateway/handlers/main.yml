---
- name: restart nftables
  # Reload, never restart. A restart runs ExecStop, which the kubelab-stop.conf
  # drop-in limits to the edge table, so the uplink has no drops until the start
  # reloads the file. A reload swaps the table in one transaction.
  systemd:
    name: nftables
    state: reloaded

- name: reload systemd
  systemd:
    daemon_reload: true

- name: reload ufw
  command: ufw reload
  changed_when: true

- name: restart dnsmasq
  systemd:
    name: dnsmasq
    state: restarted

- name: restart systemd-sysctl
  systemd:
    name: systemd-sysctl
    state: restarted

- name: apply netplan
  command: netplan apply
  changed_when: true

- name: wait for the session
  wait_for_connection:
    timeout: 120

- name: reload networkd
  command: networkctl reload
  changed_when: true

- name: restart hostapd
  systemd:
    name: hostapd
    state: restarted

# A reload keeps every station associated (ADR-075 D8). After a restart it is skipped:
# the restart already read the file, and the control socket may not be up yet.
- name: reload the lab Wi-Fi PSKs
  command: hostapd_cli -p /run/hostapd -i {{ gateway_ap_interface }} reload_wpa_psk
  changed_when: true
  when: gateway_ap_conf is not changed
