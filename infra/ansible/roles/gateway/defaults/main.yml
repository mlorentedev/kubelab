---
gateway_interface: "eth0"
gateway_lan_cidr: "172.16.1.1/24"
# The playbook passes both from networking.edge (ADR-075 D1).
gateway_uplink_interface: "uplink0"
gateway_ap_interface: "wlan0"
# The site profile, from networking.edge.uplink. The secrets come from prod SOPS and
# stay empty until the operator stores them; the role's check names what is missing.
gateway_uplink_kind: ""
gateway_uplink_regdomain: ""
gateway_uplink_mac: ""
gateway_uplink_ssid: ""
gateway_uplink_psk: ""
# The lab Wi-Fi, from networking.edge.lab_wifi. The SSID and PSKs come from prod SOPS;
# each PSK entry is {keyid, psk}.
gateway_ap_ssid: ""
gateway_ap_psks: []
# No copy of networking.edge.lab_wifi and uplink.channel here: the play passes them,
# and a run without them stops at "Check the lab Wi-Fi addresses" instead of
# rendering a stale subnet.
gateway_ap_channel: ""
gateway_ap_cidr: ""
gateway_ap_address: ""
gateway_ap_dhcp_range_start: ""
gateway_ap_dhcp_range_end: ""
# null, not []: an empty list is a play that reserves no node; null is a play that
# passed nothing, and the check below stops it before rpi3 loses its fixed lease.
gateway_ap_reservations: null
gateway_dhcp_range_start: "172.16.1.50"
gateway_dhcp_range_end: "172.16.1.150"
gateway_dhcp_lease: "12h"
gateway_dns_servers: "8.8.8.8,1.1.1.1"
gateway_dhcp_reservations: []
gateway_tailscale_min_version: "1.96.2"
