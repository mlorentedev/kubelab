---
gateway_interface: "eth0"
gateway_lan_cidr: "172.16.1.1/24"
# The playbook passes both from networking.edge (ADR-075 D1).
gateway_uplink_interface: "uplink0"
gateway_ap_interface: "wlan0"
# The site profile, from networking.edge.uplink. The secrets come from prod SOPS and
# stay empty until the operator stores them; the role's check names what is missing.
gateway_uplink_kind: ""
gateway_uplink_regdomain: ""
gateway_uplink_mac: ""
gateway_uplink_ssid: ""
gateway_uplink_psk: ""
# The lab Wi-Fi, from networking.edge.lab_wifi. The SSID and PSKs come from prod SOPS;
# each PSK entry is {keyid, psk}.
gateway_ap_ssid: ""
gateway_ap_psks: []
gateway_ap_channel: 6
gateway_ap_cidr: "10.0.0.0/24"
gateway_ap_address: "10.0.0.1"
gateway_ap_dhcp_range_start: "10.0.0.50"
gateway_ap_dhcp_range_end: "10.0.0.199"
gateway_ap_reservations: []
gateway_dhcp_range_start: "172.16.1.50"
gateway_dhcp_range_end: "172.16.1.150"
gateway_dhcp_lease: "12h"
gateway_dns_servers: "8.8.8.8,1.1.1.1"
gateway_dhcp_reservations: []
gateway_tailscale_min_version: "1.96.2"
# The uplink lease check (NET-005 AC7). The playbook passes the networks from the SSOT.
gateway_lease_check_path: "/usr/local/sbin/kubelab-edge-lease-check"
gateway_lease_check_networks: {}
# The uplink shaper (NET-005 AC8). The playbook passes the rates from
# networking.edge.uplink.bandwidth; the role refuses zero, which CAKE reads as unlimited.
gateway_uplink_down_kbit: 0
gateway_uplink_up_kbit: 0
gateway_uplink_ifb: "ifb4{{ gateway_uplink_interface }}"
