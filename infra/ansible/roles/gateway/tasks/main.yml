---
# Gateway role: IP forwarding, nftables NAT, dnsmasq DHCP, DNS resilience, and the
# edge's network config: the role owns /etc/netplan (ADR-075 D2).

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-gateway.conf
    reload: true

- name: Disable systemd-resolved
  systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
    masked: true
  failed_when: false

- name: Disable avahi-daemon
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - avahi-daemon.service
    - avahi-daemon.socket
  failed_when: false

# Older runbooks told the operator to `chattr +i` the resolver, and `template`
# writes by rename, which an immutable file refuses.
- name: Read the resolver's attributes
  stat:
    path: /etc/resolv.conf
    follow: false
  register: gateway_resolver

- name: Unlock an immutable resolver
  command: chattr -i /etc/resolv.conf
  when: "'immutable' in (gateway_resolver.stat.attributes | default([]))"
  changed_when: true

# A file, not the resolved stub symlink: the template replaces the link itself.
- name: Deploy the static resolver
  template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    mode: "0644"

- name: Set UFW default forward policy to ACCEPT
  lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
  notify: reload ufw

# Delivered traffic must pass both ufw and inet kubelab, and ufw drops DHCP on
# eth0 by default: that is why the homelab LAN had no DHCP (ADR-075 D3).
- name: Allow DHCP in on the homelab LAN
  community.general.ufw:
    rule: allow
    interface_in: "{{ gateway_interface }}"
    proto: udp
    port: "67"

- name: Install gateway packages
  apt:
    name:
      - nftables
      - dnsmasq
    state: present

# It loads over the LAN session that provisions the edge, so it is checked first.
- name: Deploy the edge ruleset
  template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: nft -c -f %s
  notify: restart nftables

- name: Keep a package restart from flushing the other rule sets
  file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    mode: "0755"

- name: Scope the nftables stop to the edge table
  template:
    src: nftables-stop.conf.j2
    dest: /etc/systemd/system/nftables.service.d/kubelab-stop.conf
    mode: "0644"
  notify: reload systemd

- name: Enable nftables
  systemd:
    name: nftables
    state: started
    enabled: true

# Strict rp_filter under a subnet router needs this floor (tailscale/tailscale#18860).
# The version is dpkg's, not `tailscale version`'s: a binary that fails to run would
# read as absent, and absent is the one case let through.
- name: Read the installed packages
  package_facts:

- name: Assert Tailscale supports strict rp_filter
  assert:
    that: >-
      'tailscale' not in ansible_facts.packages
      or ansible_facts.packages['tailscale'][0].version is version(gateway_tailscale_min_version, '>=')
    fail_msg: >-
      Tailscale {{ ansible_facts.packages.get('tailscale', [{}])[0].version | default('?') }} is older than
      {{ gateway_tailscale_min_version }}. Upgrade it before the strict rp_filter loads.
      An absent package passes: the tailscale role installs a current one later in the play.

- name: Deploy the edge sysctls
  template:
    src: 99-kubelab-edge.conf.j2
    dest: /etc/sysctl.d/99-kubelab-edge.conf
    mode: "0644"
  notify: restart systemd-sysctl

# A changed ruleset only loads when its handler runs, and the uplink must never come
# up without its drops (ADR-075 D7).
- name: Load the edge ruleset and sysctls before the uplink
  meta: flush_handlers

- name: Check the site profile and its secrets
  assert:
    that:
      - gateway_uplink_kind in ['wifi_open', 'wifi_psk', 'ethernet']
      - gateway_uplink_regdomain | length == 2
      - gateway_uplink_mac | length > 0
      - gateway_uplink_kind == 'ethernet' or gateway_uplink_ssid | length > 0
      - gateway_uplink_kind != 'wifi_psk' or gateway_uplink_psk | length > 0
    fail_msg: >-
      The site profile in common.yaml needs networking.edge.uplink.kind (wifi_open, wifi_psk
      or ethernet) and a two-letter regdomain. The {{ gateway_uplink_kind }} uplink needs
      networking.edge.uplink.mac in prod SOPS, plus .ssid for a Wi-Fi kind and .psk for
      wifi_psk. The operator stores them with `toolkit secrets set`; the role never invents them.
    quiet: true

# ADR-075 D7: applying the uplink can cut a session that rides the tailnet it carries.
- name: Check that the run comes over the homelab LAN
  assert:
    that: ansible_host == gateway_lan_cidr | regex_replace('/.*', '')
    fail_msg: >-
      ERROR: this run reaches the edge at {{ ansible_host }}, not at its LAN address.
      WHY: edge changes run over the homelab LAN, because applying the uplink can cut a
      session that rides the tailnet (ADR-075 D7).
      FIX: from the laptop on the switch, run `make provision NODE=rpi4 ENV=prod BOOTSTRAP=1`.
    quiet: true

# It holds every adapter's MAC, the uplink's included (ADR-075 C7).
- name: Read the adapters
  command: ip -br link
  register: gateway_uplink_links
  changed_when: false
  check_mode: false
  no_log: true

# Without the adapter, netplan waits on a device that never appears and fails without a
# cause. On the LAN port, the next boot would rename the recovery path.
- name: Check that the uplink adapter is plugged in
  assert:
    that:
      - (gateway_uplink_mac | lower) in (gateway_uplink_links.stdout | lower)
      - (gateway_uplink_mac | lower) != (ansible_facts[gateway_interface].macaddress | default('') | lower)
    fail_msg: >-
      ERROR: no adapter other than {{ gateway_interface }} has the uplink MAC in prod SOPS.
      WHY: the uplink adapter is unplugged, or networking.edge.uplink.mac names another adapter, or
      something set the adapter's MAC away from its permanent one (`ip link` then shows `permaddr`).
      The .link file matches the permanent MAC and sets none (MACAddressPolicy=none), so nothing in
      this role does that.
      FIX: plug in the uplink adapter, correct the MAC with `toolkit secrets set`, or undo what
      changed the MAC, then re-run.
    quiet: true

- name: Pin and name the uplink adapter
  template:
    src: uplink.link.j2
    dest: /etc/systemd/network/10-kubelab-uplink.link
    mode: "0644"
  no_log: true
  register: gateway_uplink_link

# Tasks, not handlers: a handler fires only when the .link file changes, so a run that
# failed after writing it would never rename the adapter.
- name: Reload the udev rules
  command: udevadm control --reload
  when: gateway_uplink_link is changed or gateway_uplink_interface not in ansible_facts.interfaces
  changed_when: true

- name: Rename the uplink adapter
  command: >-
    udevadm trigger --settle --action=add --subsystem-match=net
    --attr-match=address={{ gateway_uplink_mac | lower }}
  when: gateway_uplink_interface not in ansible_facts.interfaces
  changed_when: true
  no_log: true

- name: Read the uplink adapter's name
  stat:
    path: "/sys/class/net/{{ gateway_uplink_interface }}"
  register: gateway_uplink_sysfs

# udevadm exits 0 when nothing matched, and the kernel refuses to rename an interface
# that is up, so the name itself is checked before netplan depends on it.
- name: Check that the uplink adapter took its name
  assert:
    that: gateway_uplink_sysfs.stat.exists or ansible_check_mode
    fail_msg: >-
      ERROR: the uplink adapter is not named {{ gateway_uplink_interface }}.
      WHY: the kernel refuses to rename an interface that is up, and udevadm reports success either way.
      FIX: unplug the adapter and plug it back in, which brings it back down and named, then re-run.
    quiet: true

# An adapter an earlier profile named keeps the name while it stays plugged in, and
# the rename above is skipped because the name is taken. `ip -o link` shows the
# permanent MAC as `permaddr` when the current one differs.
- name: Read the uplink adapter's MAC
  command: ip -o link show {{ gateway_uplink_interface }}
  register: gateway_uplink_named
  changed_when: false
  check_mode: false
  no_log: true
  when: gateway_uplink_sysfs.stat.exists

- name: Check that the uplink name is on the uplink adapter
  assert:
    that: not gateway_uplink_sysfs.stat.exists or (gateway_uplink_mac | lower) in (gateway_uplink_named.stdout | lower)
    fail_msg: >-
      ERROR: {{ gateway_uplink_interface }} is not the adapter with the uplink MAC in prod SOPS.
      WHY: an adapter that an earlier profile named is still plugged in and keeps the name, so the
      new adapter could not take it.
      FIX: unplug the old adapter, then re-run, which names the new one.
    quiet: true

# AC7, AC8. The check exits 64 on every lease event without a network to check,
# and CAKE reads a zero bandwidth as unlimited.
- name: Check the lease check's networks and the shaping rates
  assert:
    that:
      - gateway_lease_check_networks | length > 0
      - gateway_uplink_down_kbit | int > 0
      - gateway_uplink_up_kbit | int > 0
    fail_msg: >-
      ERROR: the uplink's lease check or shaper has no input.
      WHY: the playbook maps them from networking.lan_cidr, networking.edge.lab_wifi.cidr,
      networking.tailscale_cidr and networking.edge.uplink.bandwidth in common.yaml.
      FIX: set those keys in common.yaml, then re-run.
    quiet: true

# AC7. The watch has to be running before the uplink takes a lease: a path unit
# does not fire for a lease written before it started. The timer re-checks what
# no lease event will.
- name: Install the uplink lease check
  copy:
    src: edge-lease-check.sh
    dest: "{{ gateway_lease_check_path }}"
    mode: "0755"

- name: Deploy the uplink lease check units
  template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - kubelab-edge-lease-check.service
    - kubelab-edge-lease-check.path
    - kubelab-edge-lease-check.timer
  register: gateway_lease_check_units

# `--check` writes no unit, and the systemd module fails on one that is not on disk,
# which would end the preview before the netplan and AP diffs. So in check mode a
# unit is started only once it exists unchanged.
- name: Watch the uplink lease
  systemd:
    name: kubelab-edge-lease-check.path
    enabled: true
    state: "{{ 'restarted' if gateway_lease_check_units is changed else 'started' }}"
    daemon_reload: true
  when: not ansible_check_mode or gateway_lease_check_units is not changed

- name: Re-check the uplink lease on a schedule
  systemd:
    name: kubelab-edge-lease-check.timer
    enabled: true
    state: "{{ 'restarted' if gateway_lease_check_units is changed else 'started' }}"
  when: not ansible_check_mode or gateway_lease_check_units is not changed

- name: Deploy the uplink shaper
  template:
    src: kubelab-edge-shaper.service.j2
    dest: /etc/systemd/system/kubelab-edge-shaper.service
    mode: "0644"
  register: gateway_shaper_unit

# Enabled, it starts whenever the uplink device appears. Skipped in check mode
# until its unit is on disk, as the lease watch is.
- name: Shape the uplink whenever it is plugged in
  systemd:
    name: kubelab-edge-shaper.service
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode or gateway_shaper_unit is not changed

- name: Shape the uplink now
  systemd:
    name: kubelab-edge-shaper.service
    state: "{{ 'restarted' if gateway_shaper_unit is changed else 'started' }}"
    daemon_reload: true
  when:
    - gateway_uplink_sysfs.stat.exists
    - not ansible_check_mode or gateway_shaper_unit is not changed

- name: Keep cloud-init from writing netplan
  copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    content: "network: {config: disabled}\n"
    mode: "0644"

# Checked alone in a scratch root, so a file netplan rejects never replaces a working one.
- name: Deploy the edge netplan
  template:
    src: netplan-edge.yaml.j2
    dest: /etc/netplan/10-kubelab-edge.yaml
    mode: "0600"
    validate: >-
      sh -c 'root=$(mktemp -d) && mkdir -p "$root/etc/netplan" &&
      install -m 0600 "$1" "$root/etc/netplan/10-kubelab-edge.yaml" &&
      netplan generate --root-dir "$root"; status=$?; rm -rf "$root"; exit $status' _ %s
  no_log: true
  notify:
    - apply netplan
    - wait for the session

- name: Create the uplink's networkd drop-in directory
  file:
    path: "/etc/systemd/network/10-netplan-{{ gateway_uplink_interface }}.network.d"
    state: directory
    mode: "0755"

# Named after the .network file netplan generates for the uplink, or it applies to nothing.
- name: Let the uplink lease set the default gateway
  template:
    src: dhcp-gateway.conf.j2
    dest: "/etc/systemd/network/10-netplan-{{ gateway_uplink_interface }}.network.d/kubelab-gateway.conf"
    mode: "0644"
  notify: apply netplan

- name: Find hand-written netplan files
  find:
    paths: /etc/netplan
    patterns: "*.yaml,*.yml"
    excludes: "10-kubelab-edge.yaml"
  register: gateway_netplan_found

- name: Create the netplan backup directory
  file:
    path: /var/backups/kubelab-netplan
    state: directory
    mode: "0700"

# They can hold a Wi-Fi PSK, so the copies stay root-only and out of the log.
- name: Back up hand-written netplan files
  copy:
    src: "{{ item.path }}"
    dest: "/var/backups/kubelab-netplan/{{ item.path | basename }}.{{ ansible_facts.date_time.iso8601_basic_short }}"
    remote_src: true
    mode: "0600"
  loop: "{{ gateway_netplan_found.files }}"
  no_log: true

- name: Remove hand-written netplan files
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ gateway_netplan_found.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify:
    - apply netplan
    - wait for the session

# Apply now, so a profile that cuts the LAN stops the run here and not later.
- name: Apply the uplink before anything depends on it
  meta: flush_handlers

# --- The lab Wi-Fi AP (ADR-075 D2) ---

- name: Check the lab Wi-Fi secrets
  assert:
    that:
      - gateway_ap_ssid is regex('[^\x00-\x1f\x7f]+', match_type='fullmatch')
      - gateway_ap_ssid.encode('utf-8') | length <= 32
      - gateway_ap_psks | length > 0
      - gateway_ap_psks | rejectattr('psk', 'regex', '[!-~][ -~]{6,61}[!-~]', match_type='fullmatch') | list | length == 0
      - gateway_ap_psks | rejectattr('keyid', 'regex', '[A-Za-z0-9_-]{1,31}', match_type='fullmatch') | list | length == 0
    fail_msg: >-
      The lab Wi-Fi needs networking.edge.lab_wifi.ssid and .psk in prod SOPS. The SSID is
      1 to 32 bytes with no control characters. A PSK is 8 to 63 printable ASCII characters
      with no blank at either end: hostapd keeps one as part of the passphrase, where no
      client's password prompt shows it. A keyid is one word of at most 31 characters. The
      operator stores them with `toolkit secrets set`.
    quiet: true

- name: Check the lab Wi-Fi addresses
  assert:
    that:
      - gateway_ap_channel | string | length > 0
      - gateway_ap_cidr | length > 0
      - gateway_ap_address | length > 0
      - gateway_ap_dhcp_range_start | length > 0
      - gateway_ap_dhcp_range_end | length > 0
      - gateway_ap_reservations is not none
    fail_msg: >-
      The lab Wi-Fi needs its channel, addresses and reserved nodes from the play:
      networking.edge.uplink.channel and networking.edge.lab_wifi.{cidr,gateway,dhcp_range,reservations}
      in common.yaml, passed by provision-rpi4.yml. The role keeps no copy of them.
    quiet: true

# The archive answers over the uplink, and at a portal site only after the login: a run
# before it stops here, before anything of the AP is written. Installed packages need no
# archive, so the index is refreshed only when the install fails: a re-run after the
# portal's login expired still converges.
- name: Install the AP's packages
  block:
    - name: Install hostapd and iw
      apt:
        name:
          - hostapd
          - iw
        state: present
  rescue:
    - name: Refresh the package index and retry
      block:
        - name: Install hostapd and iw from a fresh index
          apt:
            name:
              - hostapd
              - iw
            state: present
            update_cache: true
      rescue:
        - name: Say why the AP's packages are missing
          fail:
            msg: >-
              ERROR: hostapd and iw are not installed ({{ ansible_failed_result.msg | default('apt failed') }}).
              WHY: the package archive does not answer over the uplink. At a captive-portal site it
              answers only after the portal login.
              FIX: log in to the portal (bring-up B4), then re-run the provision.

- name: Read the kernel command line
  slurp:
    src: /boot/firmware/cmdline.txt
  register: gateway_cmdline
  failed_when: false

- name: Check that no boot parameter overrides the regulatory domain
  assert:
    that: >-
      (gateway_cmdline.content | default('') | b64decode).split()
      | select('match', 'cfg80211[.]ieee80211_regdom=') | list | length == 0
    fail_msg: >-
      ERROR: /boot/firmware/cmdline.txt sets cfg80211.ieee80211_regdom.
      WHY: kmod appends the kernel command line's module options after /etc/modprobe.d, and
      the kernel keeps the last value, so the site's regulatory domain would never load.
      FIX: remove the parameter through the rpi_boot role (#2668), then re-run.
    quiet: true

# modprobe.d reaches cfg80211 when the module loads, which is at boot: it is in no
# initramfs and is loaded already. `iw reg set` makes the running kernel agree now.
- name: Persist the regulatory domain
  copy:
    dest: /etc/modprobe.d/kubelab-regdom.conf
    content: "options cfg80211 ieee80211_regdom={{ gateway_uplink_regdomain }}\n"
    mode: "0644"

- name: Read the regulatory domain in force
  command: iw reg get
  register: gateway_regdomain
  changed_when: false
  check_mode: false

# By lines, not by a '\n' in the expression: whether Jinja sees one as a newline
# depends on the YAML quoting and the Ansible version (lesson-497).
- name: Set the regulatory domain
  command: iw reg set {{ gateway_uplink_regdomain }}
  changed_when: true
  when: >-
    not (gateway_regdomain.stdout_lines[:2] | join(' ')).startswith('global country ' ~ gateway_uplink_regdomain ~ ':')

- name: Read the services
  service_facts:

# hostapd cannot take an interface a supplicant holds, and removing the home SSID from
# netplan does not stop a running one. Exact names: a glob would match the uplink's too.
- name: Mask the supplicants that would hold the AP interface
  systemd:
    name: "{{ item }}"
    masked: true
  loop:
    - "netplan-wpa-{{ gateway_ap_interface }}.service"
    - wpa_supplicant.service

- name: Stop the supplicants that would hold the AP interface
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - "netplan-wpa-{{ gateway_ap_interface }}.service"
    - wpa_supplicant.service
  when: item in ansible_facts.services

- name: Deploy the lab Wi-Fi PSKs
  template:
    src: hostapd.wpa_psk.j2
    dest: /etc/hostapd/hostapd.wpa_psk
    mode: "0600"
  no_log: true
  notify: reload the lab Wi-Fi PSKs

- name: Deploy the lab Wi-Fi AP
  template:
    src: hostapd.conf.j2
    dest: /etc/hostapd/hostapd.conf
    mode: "0600"
  no_log: true
  register: gateway_ap_conf
  notify: restart hostapd

- name: Give the AP interface the gateway address
  template:
    src: 10-kubelab-ap.network.j2
    dest: /etc/systemd/network/10-kubelab-ap.network
    mode: "0644"
  register: gateway_ap_network

- name: Read the AP interface's addresses
  command: ip -4 -br addr show dev {{ gateway_ap_interface }}
  register: gateway_ap_addresses
  changed_when: false
  failed_when: false
  check_mode: false

# A task and not a handler: a handler deferred to the end of the play is lost when a
# later role fails, and the re-run reports changed=0 with no address on the AP. So it
# runs whenever the address is not in place, whatever the last run did.
- name: Apply the AP interface's address
  command: "{{ item }}"
  loop:
    - networkctl reload
    - networkctl reconfigure {{ gateway_ap_interface }}
  changed_when: true
  when: >-
    gateway_ap_network is changed
    or (' ' ~ gateway_ap_address ~ '/' ~ gateway_ap_cidr.split('/')[1]) not in (' ' ~ gateway_ap_addresses.stdout)

- name: Allow DHCP in on the lab Wi-Fi
  community.general.ufw:
    rule: allow
    interface_in: "{{ gateway_ap_interface }}"
    proto: udp
    port: "67"

# The package masks hostapd when it installs without a config. In check mode the
# package is not installed yet, so there is no unit to start.
- name: Start the lab Wi-Fi AP
  systemd:
    name: hostapd
    masked: false
    enabled: true
    state: started
  when: not ansible_check_mode or 'hostapd.service' in ansible_facts.services

- name: Deploy dnsmasq DHCP config
  template:
    src: kubelab-dhcp.conf.j2
    dest: /etc/dnsmasq.d/kubelab-dhcp.conf
    mode: "0644"
  notify: restart dnsmasq

- name: Enable dnsmasq
  systemd:
    name: dnsmasq
    state: started
    enabled: true

# hostapd's and dnsmasq's handlers run here, inside the role, for the same reason the
# address is a task. A play-level force_handlers would also run the uplink's netplan
# handlers after a failure, which the uplink's ordering rules out.
- name: Apply the AP's changes
  meta: flush_handlers
