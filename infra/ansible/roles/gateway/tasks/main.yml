---
# Gateway role: IP forwarding, nftables NAT, dnsmasq DHCP, DNS resilience, and the
# edge's network config: the role owns /etc/netplan (ADR-075 D2).

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-gateway.conf
    reload: true

- name: Disable systemd-resolved
  systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
    masked: true
  failed_when: false

- name: Disable avahi-daemon
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - avahi-daemon.service
    - avahi-daemon.socket
  failed_when: false

# Older runbooks told the operator to `chattr +i` the resolver, and `template`
# writes by rename, which an immutable file refuses.
- name: Read the resolver's attributes
  stat:
    path: /etc/resolv.conf
    follow: false
  register: gateway_resolver

- name: Unlock an immutable resolver
  command: chattr -i /etc/resolv.conf
  when: "'immutable' in (gateway_resolver.stat.attributes | default([]))"
  changed_when: true

# A file, not the resolved stub symlink: the template replaces the link itself.
- name: Deploy the static resolver
  template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    mode: "0644"

- name: Set UFW default forward policy to ACCEPT
  lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
  notify: reload ufw

# Delivered traffic must pass both ufw and inet kubelab, and ufw drops DHCP on
# eth0 by default: that is why the homelab LAN had no DHCP (ADR-075 D3).
- name: Allow DHCP in on the homelab LAN
  community.general.ufw:
    rule: allow
    interface_in: "{{ gateway_interface }}"
    proto: udp
    port: "67"

- name: Install gateway packages
  apt:
    name:
      - nftables
      - dnsmasq
    state: present

# It loads over the LAN session that provisions the edge, so it is checked first.
- name: Deploy the edge ruleset
  template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: nft -c -f %s
  notify: restart nftables

- name: Keep a package restart from flushing the other rule sets
  file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    mode: "0755"

- name: Scope the nftables stop to the edge table
  template:
    src: nftables-stop.conf.j2
    dest: /etc/systemd/system/nftables.service.d/kubelab-stop.conf
    mode: "0644"
  notify: reload systemd

- name: Enable nftables
  systemd:
    name: nftables
    state: started
    enabled: true

# Strict rp_filter under a subnet router needs this floor (tailscale/tailscale#18860).
# The version is dpkg's, not `tailscale version`'s: a binary that fails to run would
# read as absent, and absent is the one case let through.
- name: Read the installed packages
  package_facts:

- name: Assert Tailscale supports strict rp_filter
  assert:
    that: >-
      'tailscale' not in ansible_facts.packages
      or ansible_facts.packages['tailscale'][0].version is version(gateway_tailscale_min_version, '>=')
    fail_msg: >-
      Tailscale {{ ansible_facts.packages.get('tailscale', [{}])[0].version | default('?') }} is older than
      {{ gateway_tailscale_min_version }}. Upgrade it before the strict rp_filter loads.
      An absent package passes: the tailscale role installs a current one later in the play.

- name: Deploy the edge sysctls
  template:
    src: 99-kubelab-edge.conf.j2
    dest: /etc/sysctl.d/99-kubelab-edge.conf
    mode: "0644"
  notify: restart systemd-sysctl

# A changed ruleset only loads when its handler runs, and the uplink must never come
# up without its drops (ADR-075 D7).
- name: Load the edge ruleset and sysctls before the uplink
  meta: flush_handlers

- name: Check the site profile and its secrets
  assert:
    that:
      - gateway_uplink_kind in ['wifi_open', 'wifi_psk', 'ethernet']
      - gateway_uplink_regdomain | length == 2
      - gateway_uplink_mac | length > 0
      - gateway_uplink_kind == 'ethernet' or gateway_uplink_ssid | length > 0
      - gateway_uplink_kind != 'wifi_psk' or gateway_uplink_psk | length > 0
    fail_msg: >-
      The site profile in common.yaml needs networking.edge.uplink.kind (wifi_open, wifi_psk
      or ethernet) and a two-letter regdomain. The {{ gateway_uplink_kind }} uplink needs
      networking.edge.uplink.mac in prod SOPS, plus .ssid for a Wi-Fi kind and .psk for
      wifi_psk. The operator stores them with `toolkit secrets set`; the role never invents them.
    quiet: true

# ADR-075 D7: applying the uplink can cut a session that rides the tailnet it carries.
- name: Check that the run comes over the homelab LAN
  assert:
    that: ansible_host == gateway_lan_cidr | regex_replace('/.*', '')
    fail_msg: >-
      ERROR: this run reaches the edge at {{ ansible_host }}, not at its LAN address.
      WHY: edge changes run over the homelab LAN, because applying the uplink can cut a
      session that rides the tailnet (ADR-075 D7).
      FIX: from the laptop on the switch, run `make provision NODE=rpi4 ENV=prod BOOTSTRAP=1`.
    quiet: true

# It holds every adapter's MAC, the uplink's included (ADR-075 C7).
- name: Read the adapters
  command: ip -br link
  register: gateway_uplink_links
  changed_when: false
  check_mode: false
  no_log: true

# Without the adapter, netplan waits on a device that never appears and fails without a
# cause. On the LAN port, the next boot would rename the recovery path.
- name: Check that the uplink adapter is plugged in
  assert:
    that:
      - (gateway_uplink_mac | lower) in (gateway_uplink_links.stdout | lower)
      - (gateway_uplink_mac | lower) != (ansible_facts[gateway_interface].macaddress | default('') | lower)
    fail_msg: >-
      ERROR: no adapter other than {{ gateway_interface }} has the uplink MAC in prod SOPS.
      WHY: the uplink adapter is unplugged, or networking.edge.uplink.mac names another adapter, or
      something set the adapter's MAC away from its permanent one (`ip link` then shows `permaddr`).
      The .link file matches the permanent MAC and sets none (MACAddressPolicy=none), so nothing in
      this role does that.
      FIX: plug in the uplink adapter, correct the MAC with `toolkit secrets set`, or undo what
      changed the MAC, then re-run.
    quiet: true

- name: Pin and name the uplink adapter
  template:
    src: uplink.link.j2
    dest: /etc/systemd/network/10-kubelab-uplink.link
    mode: "0644"
  no_log: true
  register: gateway_uplink_link

# Tasks, not handlers: a handler fires only when the .link file changes, so a run that
# failed after writing it would never rename the adapter.
- name: Reload the udev rules
  command: udevadm control --reload
  when: gateway_uplink_link is changed or gateway_uplink_interface not in ansible_facts.interfaces
  changed_when: true

- name: Rename the uplink adapter
  command: >-
    udevadm trigger --settle --action=add --subsystem-match=net
    --attr-match=address={{ gateway_uplink_mac | lower }}
  when: gateway_uplink_interface not in ansible_facts.interfaces
  changed_when: true
  no_log: true

- name: Read the uplink adapter's name
  stat:
    path: "/sys/class/net/{{ gateway_uplink_interface }}"
  register: gateway_uplink_sysfs

# udevadm exits 0 when nothing matched, and the kernel refuses to rename an interface
# that is up, so the name itself is checked before netplan depends on it.
- name: Check that the uplink adapter took its name
  assert:
    that: gateway_uplink_sysfs.stat.exists or ansible_check_mode
    fail_msg: >-
      ERROR: the uplink adapter is not named {{ gateway_uplink_interface }}.
      WHY: the kernel refuses to rename an interface that is up, and udevadm reports success either way.
      FIX: unplug the adapter and plug it back in, which brings it back down and named, then re-run.
    quiet: true

# An adapter an earlier profile named keeps the name while it stays plugged in, and
# the rename above is skipped because the name is taken. `ip -o link` shows the
# permanent MAC as `permaddr` when the current one differs.
- name: Read the uplink adapter's MAC
  command: ip -o link show {{ gateway_uplink_interface }}
  register: gateway_uplink_named
  changed_when: false
  check_mode: false
  no_log: true
  when: gateway_uplink_sysfs.stat.exists

- name: Check that the uplink name is on the uplink adapter
  assert:
    that: not gateway_uplink_sysfs.stat.exists or (gateway_uplink_mac | lower) in (gateway_uplink_named.stdout | lower)
    fail_msg: >-
      ERROR: {{ gateway_uplink_interface }} is not the adapter with the uplink MAC in prod SOPS.
      WHY: an adapter that an earlier profile named is still plugged in and keeps the name, so the
      new adapter could not take it.
      FIX: unplug the old adapter, then re-run, which names the new one.
    quiet: true

- name: Keep cloud-init from writing netplan
  copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    content: "network: {config: disabled}\n"
    mode: "0644"

# Checked alone in a scratch root, so a file netplan rejects never replaces a working one.
- name: Deploy the edge netplan
  template:
    src: netplan-edge.yaml.j2
    dest: /etc/netplan/10-kubelab-edge.yaml
    mode: "0600"
    validate: >-
      sh -c 'root=$(mktemp -d) && mkdir -p "$root/etc/netplan" &&
      install -m 0600 "$1" "$root/etc/netplan/10-kubelab-edge.yaml" &&
      netplan generate --root-dir "$root"; status=$?; rm -rf "$root"; exit $status' _ %s
  no_log: true
  notify:
    - apply netplan
    - wait for the session

- name: Create the uplink's networkd drop-in directory
  file:
    path: "/etc/systemd/network/10-netplan-{{ gateway_uplink_interface }}.network.d"
    state: directory
    mode: "0755"

# Named after the .network file netplan generates for the uplink, or it applies to nothing.
- name: Let the uplink lease set the default gateway
  template:
    src: dhcp-gateway.conf.j2
    dest: "/etc/systemd/network/10-netplan-{{ gateway_uplink_interface }}.network.d/kubelab-gateway.conf"
    mode: "0644"
  notify: apply netplan

- name: Find hand-written netplan files
  find:
    paths: /etc/netplan
    patterns: "*.yaml,*.yml"
    excludes: "10-kubelab-edge.yaml"
  register: gateway_netplan_found

- name: Create the netplan backup directory
  file:
    path: /var/backups/kubelab-netplan
    state: directory
    mode: "0700"

# They can hold a Wi-Fi PSK, so the copies stay root-only and out of the log.
- name: Back up hand-written netplan files
  copy:
    src: "{{ item.path }}"
    dest: "/var/backups/kubelab-netplan/{{ item.path | basename }}.{{ ansible_facts.date_time.iso8601_basic_short }}"
    remote_src: true
    mode: "0600"
  loop: "{{ gateway_netplan_found.files }}"
  no_log: true

- name: Remove hand-written netplan files
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ gateway_netplan_found.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify:
    - apply netplan
    - wait for the session

# Apply now, so a profile that cuts the LAN stops the run here and not later.
- name: Apply the uplink before anything depends on it
  meta: flush_handlers

- name: Deploy dnsmasq DHCP config
  template:
    src: kubelab-dhcp.conf.j2
    dest: /etc/dnsmasq.d/kubelab-dhcp.conf
    mode: "0644"
  notify: restart dnsmasq

- name: Enable dnsmasq
  systemd:
    name: dnsmasq
    state: started
    enabled: true
