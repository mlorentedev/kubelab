---
# Gateway role: IP forwarding, nftables NAT, dnsmasq DHCP, DNS resilience
# Assumes netplan was configured pre-boot (see vault runbook: 40-runbooks/rpi4-bootstrap.md)

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-gateway.conf
    reload: true

- name: Disable systemd-resolved
  systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
    masked: true
  failed_when: false

- name: Disable avahi-daemon
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - avahi-daemon.service
    - avahi-daemon.socket
  failed_when: false

# Older runbooks told the operator to `chattr +i` the resolver, and `template`
# writes by rename, which an immutable file refuses.
- name: Read the resolver's attributes
  stat:
    path: /etc/resolv.conf
    follow: false
  register: gateway_resolver

- name: Unlock an immutable resolver
  command: chattr -i /etc/resolv.conf
  when: "'immutable' in (gateway_resolver.stat.attributes | default([]))"
  changed_when: true

# A file, not the resolved stub symlink: the template replaces the link itself.
- name: Deploy the static resolver
  template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    mode: "0644"

- name: Set UFW default forward policy to ACCEPT
  lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
  notify: reload ufw

# Delivered traffic must pass both ufw and inet kubelab, and ufw drops DHCP on
# eth0 by default: that is why the homelab LAN had no DHCP (ADR-075 D3).
- name: Allow DHCP in on the homelab LAN
  community.general.ufw:
    rule: allow
    interface_in: "{{ gateway_interface }}"
    proto: udp
    port: "67"

- name: Install gateway packages
  apt:
    name:
      - nftables
      - dnsmasq
    state: present

# It loads over the LAN session that provisions the edge, so it is checked first.
- name: Deploy the edge ruleset
  template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: nft -c -f %s
  notify: restart nftables

- name: Keep a package restart from flushing the other rule sets
  file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    mode: "0755"

- name: Scope the nftables stop to the edge table
  template:
    src: nftables-stop.conf.j2
    dest: /etc/systemd/system/nftables.service.d/kubelab-stop.conf
    mode: "0644"
  notify: reload systemd

- name: Enable nftables
  systemd:
    name: nftables
    state: started
    enabled: true

# Strict rp_filter under a subnet router needs this floor (tailscale/tailscale#18860).
- name: Read the installed Tailscale version
  command: tailscale version
  register: gateway_tailscale_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert Tailscale supports strict rp_filter
  assert:
    that: >-
      gateway_tailscale_version.rc != 0 or
      gateway_tailscale_version.stdout_lines[0] is version(gateway_tailscale_min_version, '>=')
    fail_msg: >-
      Tailscale {{ gateway_tailscale_version.stdout_lines[0] | default('?') }} is older than
      {{ gateway_tailscale_min_version }}. Upgrade it before the strict rp_filter loads.
      An absent binary passes: the tailscale role installs a current one later in the play.

- name: Deploy the edge sysctls
  template:
    src: 99-kubelab-edge.conf.j2
    dest: /etc/sysctl.d/99-kubelab-edge.conf
    mode: "0644"
  notify: restart systemd-sysctl

- name: Deploy dnsmasq DHCP config
  template:
    src: kubelab-dhcp.conf.j2
    dest: /etc/dnsmasq.d/kubelab-dhcp.conf
    mode: "0644"
  notify: restart dnsmasq

- name: Enable dnsmasq
  systemd:
    name: dnsmasq
    state: started
    enabled: true
