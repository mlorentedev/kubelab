---
# node_backup — BACKUP-044 Part 3. Captures node-path state (SQLite databases
# and their surrounding directory) and ships it to Cloudflare R2 via restic.
# Sources and R2 config are SSOT in common.yaml (backup.sources, backup.r2.*);
# this role never hardcodes a path, volume name or credential of its own.

# Where the capture step stages a snapshot before restic ships it. Local disk
# only, never the destination — a staging dir is not a backup.
node_backup_staging_dir: /opt/node-backup/staging

# Success sentinel: capture writes this as its LAST action, ship refuses to
# run without it. A non-empty staging dir proves capture STARTED, not that it
# finished — a run that dies halfway through the third of four sources leaves
# a directory that looks perfectly healthy, and shipping it stores a partial
# backup indistinguishable from a whole one.
#
# Deliberately NOT solved with `Requires=` on the ship unit: capture and ship
# are oneshots without RemainAfterExit, so a hard requirement re-runs capture
# on every ship start. That would pre-commit Part 4's trigger topology (one
# timer or two) from here. A sentinel is scheduling-agnostic, and it also
# covers a script invoked by hand, which no unit dependency ever would.
# Settled in Part 4: `Wants=`, not `Requires=` (see node-backup-ship.service.j2) —
# this sentinel is what lets ship run and refuse, instead of never starting.
node_backup_capture_sentinel: "{{ node_backup_staging_dir }}/.capture-complete"

# Per-host source map, passed by the playbook as
# config.backup.sources[inventory_hostname]. Each entry is keyed by service
# name and carries EITHER `path` (a bind mount) OR `volume` (a Docker volume,
# resolved to a host path via `docker volume inspect` at capture time) plus a
# `sqlite` key naming the live database to snapshot with `sqlite3 .backup`
# rather than copied as a plain file.
node_backup_sources: {}

# restic install (BACKUP-044 Part 2 decision): pinned static binary, checksum
# verified against upstream's own SHA256SUMS, arch resolved per node at
# Ansible run time — never hardcoded per node. Version is SSOT in
# common.yaml (backup.r2.restic_version), passed in by the playbook.
node_backup_restic_version: ""
node_backup_restic_install_path: /usr/local/bin/restic

# R2 destination (SSOT in common.yaml backup.r2.*, passed in by the
# playbook). One restic repository per node under the shared bucket prefix,
# so a compromised node cannot rewrite another's history.
node_backup_r2_repo_prefix: ""
node_backup_r2_repository: "{{ node_backup_r2_repo_prefix }}/{{ inventory_hostname }}"

# Credentials, delivered as root-only (0600) files rather than argv or a
# rendered literal — the kubelab-notify.sh precedent (ANSIBLE-038):
# argv is readable via `ps` for the life of the call, a file is not. Content
# comes from SOPS (backup.r2.access_key_id/secret_access_key,
# backup.restic_password) via the playbook's normal decrypt step, never
# written to this role's own files.
node_backup_restic_password_file: /opt/node-backup-restic-password
node_backup_r2_access_key_file: /opt/node-backup-r2-access-key
node_backup_r2_secret_key_file: /opt/node-backup-r2-secret-key

# The decrypted secret VALUES themselves — no default, the playbook must
# supply them from SOPS. Left undefined rather than empty-string so a
# missing wiring fails loudly (StrictUndefined at apply time) instead of
# writing an empty credential file that looks provisioned and is not.

# Installed script and unit paths/names — shared between tasks/main.yml
# (which writes them) and the .service.j2 templates (which reference them),
# so the two can never drift apart silently.
node_backup_capture_script_path: /opt/node-backup-capture.sh
node_backup_ship_script_path: /opt/node-backup-ship.sh
node_backup_capture_service_name: node-backup-capture.service
node_backup_ship_service_name: node-backup-ship.service
node_backup_ship_timer_name: node-backup-ship.timer
node_backup_ship_check_service_name: node-backup-ship-check.service
node_backup_ship_check_timer_name: node-backup-ship-check.timer
node_backup_shutdown_service_name: node-backup-shutdown.service

# --- coverage heartbeat (BACKUP-044 AC9) ----------------------------------
# The ship script posts here as its LAST step, so silence means no backup
# completed. The watcher is Uptime Kuma on the RPi3 -- deliberately outside this
# node's failure domain (ADR-028), because a watcher inside the thing it watches
# goes dark with it.
#
# Domain and token come from the playbook: the domain from
# `apps.services.observability.uptime_kuma.domain` in common.yaml, the token from
# SOPS. Neither is defaulted here -- an empty domain would post to a URL that
# looks valid and reaches nobody, and a defaulted token would address the wrong
# monitor. Left undefined so StrictUndefined fails the apply instead.
node_backup_heartbeat_domain: ""

# Root-only file rather than argv or a rendered literal, the same reasoning as
# the restic credentials above: the push endpoint is unauthenticated and the
# token IS the credential, so `ps` visibility would be a live leak.
node_backup_heartbeat_token_file: /opt/node-backup-heartbeat-token

# Retention approved by the operator 2026-08-16 on measured arithmetic
# (tasks.md "Approved operating parameters") — ~a year of restore points,
# dedup makes the history nearly free. Frozen here rather than re-derived at
# call time, so a script invocation always carries the ratified policy.
node_backup_retention_flags: "--keep-daily 7 --keep-weekly 4 --keep-monthly 6"

# `restic check` runs weekly, not per invocation (16x headroom on repository
# growth, per the same approved-parameters table). The ship script supports
# both modes; this flag picks which one a given rendering of
# node-backup-ship.service.j2 gets — false for the frequent (hourly/4h) unit,
# true for the weekly one (tasks/main.yml overrides it per-render).
node_backup_check: false

# RPi3 memory ceiling (Part 0 / R-B: measured floor 16-24M against restic's
# baseline footprint, before any real repository existed -- read as >5x
# headroom at the time). MemorySwapMax=0 is deliberate, not decoration -- the
# node has ~900MB swap and a restic that swaps thrashes the monitoring of
# record instead of failing cleanly. Enforceable only because ANSIBLE-040
# (#1101) put the memory cgroup controller on the RPi3; nodes that never
# needed the fix simply do not set this default.
#
# Measured against a real (if still small) repository (2026-08-21, first
# deploy): ship peaked at 90M, ~1.4x margin, not >5x. Flagged for the
# operator, not acted on here -- a grown rpi3 repository pushing past this
# cap gets restic OOM-killed on the monitoring-of-record node. See
# verification.md's Part 4 evidence section.
node_backup_memory_max: ""
node_backup_memory_swap_max: "0"

# Trigger model (Part 4). Node class comes from `networking.*.location`
# (ADR-028, #1107) via the playbook -- never redeclared here, so a node
# reclassified in one SSOT cannot silently keep the wrong trigger model.
# This asymmetry (wall-clock vs interval-while-up) is deliberate and must
# not be generalised fleet-wide: an on-demand node given a wall-clock
# schedule would simply never fire, because the homelab runs in 3-4h bursts
# (#1090) -- the next person changing this reads it here first.

# Always-on: every 4h, ratified (tasks.md "Approved operating parameters" --
# #452's Tier 1 RPO < 6h; hourly over-delivered at 119k ops/month to do it).
node_backup_schedule: "*-*-* 0/4:00:00"

# On-demand: hourly while the node is up, ratified in the same table.
node_backup_interval: "1h"

# The remaining two knobs are NOT in the ratified table -- proposed here,
# not decided; flag before treating them as settled.
#
# On-demand first tick after boot: long enough that the boot capture's own
# network/DNS dependencies (Tailscale, DNS resolution to R2) are up before
# ship's first attempt, short enough that a short homelab session still gets
# an offsite copy of its boot capture.
node_backup_boot_ship_delay: "2min"

# Spreads uploads across the (small) always-on fleet so R2 is not hit by
# every node on the same wall-clock second -- the one part of this pipeline
# shared between nodes. Applied uniformly to both trigger shapes since the
# timer template carries one RandomizedDelaySec regardless of branch.
node_backup_randomized_delay: "5min"

# `restic check` weekly, not per-run (Part 3's script already supports the
# --check flag; this is Part 4 wiring it to its own timer). Ratified cadence
# (tasks.md), unratified exact schedule string -- OnCalendar=weekly with
# Persistent=true is uniform across both node classes on purpose: unlike the
# main on-demand timer (whose missed window is already covered by the boot
# capture), a missed weekly check has no boot-time equivalent, so Persistent
# is the only thing that gives an on-demand node roughly-weekly coverage.
