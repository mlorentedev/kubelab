---
# node_backup — BACKUP-044. Installs restic + sqlite3, renders the
# capture/ship scripts from the SSOT, installs their systemd units, and
# enables the timers that drive them (periodic ship, weekly integrity check,
# and — on-demand nodes only — boot-ordered capture and a shutdown
# snapshot). The last block below is this pipeline's go-live: from here on,
# a deploy is not just installing the mechanism, it is scheduling it.

- name: Install sqlite3 (host package, unpinned like every other supporting
    tool in this fleet — only the payload restic gets an explicit version pin).
    It is the role's ONLY apt dependency, deliberately — see the decompress
    step for why bzip2 is not a second one.
  apt:
    name: sqlite3
    state: present
    # Fleet idiom (base_system, dev_node): refresh a genuinely empty list on a
    # first provision, and cost nothing on a same-hour re-run. NOT a fix for
    # the RPi4's apt conflict — that node's cache was already fresh and the
    # conflict survived the refresh.
    update_cache: true
    cache_valid_time: 3600

- name: Install restic at the pinned version (shared with dev_node, BACKUP-071)
  import_tasks: restic.yml

- name: Ensure staging directory exists
  file:
    path: "{{ node_backup_staging_dir }}"
    state: directory
    mode: "0700"

- name: Ensure the repository-id directory exists (BACKUP-058). The directory
    only; the ship script writes the marker inside it, so a role re-run never
    touches which repository this node has shipped to.
  file:
    path: "{{ node_backup_repository_id_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# --- Credentials: root-only files, never a rendered literal in the scripts
# themselves (ANSIBLE-038 pattern). Values arrive already decrypted in
# `config.*` via the playbook's standard SOPS step — this role never reads
# SOPS directly.

- name: Write restic repository password (root-only)
  copy:
    content: "{{ node_backup_restic_password }}"
    dest: "{{ node_backup_restic_password_file }}"
    mode: "0600"
  no_log: true

- name: Write R2 access key (root-only)
  copy:
    content: "{{ node_backup_r2_access_key }}"
    dest: "{{ node_backup_r2_access_key_file }}"
    mode: "0600"
  no_log: true

- name: Write R2 secret key (root-only)
  copy:
    content: "{{ node_backup_r2_secret_key }}"
    dest: "{{ node_backup_r2_secret_key_file }}"
    mode: "0600"
  no_log: true

- name: Render capture script
  template:
    src: node-backup-capture.sh.j2
    dest: "{{ node_backup_capture_script_path }}"
    mode: "0700"

- name: Write the coverage-heartbeat push token
  # 0600 and root-owned, like every other credential this role delivers. The
  # ship script refuses a token that is not [A-Za-z0-9_-], so a corrupted file
  # skips the heartbeat rather than posting to a wrong or malformed URL.
  copy:
    content: "{{ node_backup_heartbeat_token }}"
    dest: "{{ node_backup_heartbeat_token_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render ship script
  template:
    src: node-backup-ship.sh.j2
    dest: "{{ node_backup_ship_script_path }}"
    mode: "0700"

- name: Render prune script (BACKUP-057 Q6)
  template:
    src: node-backup-prune.sh.j2
    dest: "{{ node_backup_prune_script_path }}"
    mode: "0700"

- name: Install capture systemd unit
  template:
    src: node-backup-capture.service.j2
    dest: "/etc/systemd/system/{{ node_backup_capture_service_name }}"
    mode: "0644"
  notify: Reload systemd (node_backup)

- name: Install ship systemd unit
  template:
    src: node-backup-ship.service.j2
    dest: "/etc/systemd/system/{{ node_backup_ship_service_name }}"
    mode: "0644"
  notify: Reload systemd (node_backup)

- name: Install ship-with-check systemd unit (weekly instance, Part 4)
  template:
    src: node-backup-ship.service.j2
    dest: "/etc/systemd/system/{{ node_backup_ship_check_service_name }}"
    mode: "0644"
  vars:
    node_backup_check: true
  notify: Reload systemd (node_backup)

- name: Install ship timer (periodic trigger, Part 4)
  template:
    src: node-backup-ship.timer.j2
    dest: "/etc/systemd/system/{{ node_backup_ship_timer_name }}"
    mode: "0644"
  notify: Reload systemd (node_backup)

- name: Install weekly integrity-check timer (Part 4)
  template:
    src: node-backup-ship-check.timer.j2
    dest: "/etc/systemd/system/{{ node_backup_ship_check_timer_name }}"
    mode: "0644"
  notify: Reload systemd (node_backup)

- name: Install prune systemd unit (BACKUP-057 Q6)
  template:
    src: node-backup-prune.service.j2
    dest: "/etc/systemd/system/{{ node_backup_prune_service_name }}"
    mode: "0644"
  notify: Reload systemd (node_backup)

- name: Install daily prune timer (BACKUP-057 Q6)
  template:
    src: node-backup-prune.timer.j2
    dest: "/etc/systemd/system/{{ node_backup_prune_timer_name }}"
    mode: "0644"
  notify: Reload systemd (node_backup)

- name: Install shutdown-snapshot unit (Part 4, on-demand nodes only — AC5)
  template:
    src: node-backup-shutdown.service.j2
    dest: "/etc/systemd/system/{{ node_backup_shutdown_service_name }}"
    mode: "0644"
  when: node_backup_location == 'on-demand'
  notify: Reload systemd (node_backup)

# Reload now rather than at end-of-play: the enable/start tasks below need
# systemd to have already loaded whatever changed above, in this same run —
# `systemctl start` (unlike `enable`) acts on the daemon's loaded definition,
# not the file on disk.
- meta: flush_handlers

- name: Enable capture at boot, ordered before docker.service (on-demand
    nodes only — R-C; always-on nodes are never routinely power-cycled)
  systemd:
    name: "{{ node_backup_capture_service_name }}"
    enabled: true
  when: node_backup_location == 'on-demand'

- name: Enable and start the periodic ship timer (Part 4 go-live)
  systemd:
    name: "{{ node_backup_ship_timer_name }}"
    enabled: true
    state: started

- name: Enable and start the weekly integrity-check timer (Part 4 go-live)
  systemd:
    name: "{{ node_backup_ship_check_timer_name }}"
    enabled: true
    state: started

- name: Enable and start the daily prune timer (BACKUP-057 Q6)
  systemd:
    name: "{{ node_backup_prune_timer_name }}"
    enabled: true
    state: started

- name: Enable and start the shutdown-snapshot unit (on-demand nodes only —
    RemainAfterExit=yes, must be active now to protect this session's own
    eventual shutdown, not just the next one)
  systemd:
    name: "{{ node_backup_shutdown_service_name }}"
    enabled: true
    state: started
  when: node_backup_location == 'on-demand'
