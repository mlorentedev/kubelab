---
# restic at the pinned version, checksum-verified (BACKUP-044). The one install
# in the repository: node_backup imports it, and dev_node includes it through
# `import_role: tasks_from: restic` so ace2 can run the restore drills with the
# same binary that wrote the repositories (BACKUP-071).
# tests/test_restic_install_shared.py fails if either role grows its own copy.
#
# Inputs: node_backup_restic_version (from backup.r2.restic_version) and
# node_backup_restic_install_path (defaults/main.yml).

- name: Refuse an unset restic version (the default is empty on purpose)
  assert:
    that: node_backup_restic_version | length > 0
    fail_msg: >-
      node_backup_restic_version is empty. Pass backup.r2.restic_version from
      common.yaml; an empty pin would build a download URL for no release.
    quiet: true

- name: Detect system architecture
  set_fact:
    node_backup_arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"

- name: Check installed restic version
  command: "{{ node_backup_restic_install_path }} version"
  register: node_backup_restic_installed
  failed_when: false
  changed_when: false
  # A read: under --check a skipped probe makes the download report `changed`.
  check_mode: false

- name: Resolve the restic release URL prefix (one place, so the asset URL
    and its checksum URL cannot drift onto different releases)
  set_fact:
    node_backup_restic_release: "https://github.com/restic/restic/releases/download/v{{ node_backup_restic_version }}"

- name: Download restic (checksum verified against upstream's own SHA256SUMS —
    never a floating "latest")
  get_url:
    url: "{{ node_backup_restic_release }}/restic_{{ node_backup_restic_version }}_linux_{{ node_backup_arch }}.bz2"
    dest: "/tmp/restic_{{ node_backup_restic_version }}_linux_{{ node_backup_arch }}.bz2"
    checksum: "sha256:{{ node_backup_restic_release }}/SHA256SUMS"
    mode: "0644"
  when: node_backup_restic_version not in node_backup_restic_installed.stdout

- name: Install restic (decompress the pinned release asset into place)
  # Python's stdlib bz2, NOT the bunzip2 binary. This is backup machinery — it
  # has to work on a node that is already degraded, and a broken apt IS a
  # degraded node. Measured on the RPi4, whose apt refuses bzip2 outright
  # (bzip2 1.0.8-5.1 depends on libbz2-1.0 (= 1.0.8-5.1) while
  # 1.0.8-5.1build0.1 is installed), so requiring the CLI would have made this
  # role uninstallable there. python3 is guaranteed wherever Ansible already
  # runs, and libbz2 is present on that node — only the CLI package is not.
  #
  # Via a temp path and a move: a redirect onto the install path is evaluated
  # by the shell BEFORE the command resolves, so a failure leaves a truncated
  # binary where the capture and ship scripts expect a working one. Observed —
  # the earlier bunzip2 form exited 127 having already created a 0-byte
  # /usr/local/bin/restic.
  # `rm -f` first, not after: a decompression that dies part-way leaves a
  # partial .tmp, and the next run must start from nothing rather than write
  # into whatever the last failure left. The `&& mv` already guarantees a
  # partial is never promoted into place.
  shell: >
    rm -f {{ node_backup_restic_install_path }}.tmp
    && python3 -c 'import bz2,shutil,sys; shutil.copyfileobj(bz2.open(sys.argv[1],"rb"), open(sys.argv[2],"wb"))'
    /tmp/restic_{{ node_backup_restic_version }}_linux_{{ node_backup_arch }}.bz2
    {{ node_backup_restic_install_path }}.tmp
    && mv {{ node_backup_restic_install_path }}.tmp {{ node_backup_restic_install_path }}
  when: node_backup_restic_version not in node_backup_restic_installed.stdout
  changed_when: true

- name: Make restic executable
  file:
    path: "{{ node_backup_restic_install_path }}"
    mode: "0755"
