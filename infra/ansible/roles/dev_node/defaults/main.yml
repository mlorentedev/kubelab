---
# =============================================================================
# dev_node role defaults (ANSIBLE-028 / ADR-058 D1)
# Turns a node into a centralized self-hosted CDE. Additive and idempotent.
# PR-1a: tooling + dotfiles + workspace + dev-session + tmux-resurrect.
# D6 housekeeping timers are split to ANSIBLE-030; routing (PR-1b) and secret
# scoping (PR-1c) are out of scope here.
# =============================================================================

# Interactive developer user. SSOT: networking.ssh_users.homelab (== the SSH
# connection user), so the role provisions the same account it logs in as.
dev_node_user: "{{ ansible_user }}"
dev_node_home: "/home/{{ dev_node_user }}"

# --- mise (polyglot runtime manager) --------------------------------------
# The mise binary itself; empty => the installer's latest. The reproducible
# SSOT that matters is the toolchain pins below, materialized in mise config.
dev_node_mise_version: ""
#
# node/go/python pinned in the global mise config (single source of truth).
# EXACT versions, deliberately — `lts`/`latest`/`3.12` are moving aliases that
# resolve differently on every reprovision, which would make ADR-058 D1's
# "reproducible by construction" false: two nodes provisioned a month apart
# would get different toolchains from identical IaC. Bumping is a reviewed
# one-line edit here, which is the point.
#
# These are the versions verified on ace2 (2026-08-07). To bump: change the
# value, reprovision, and update the version claims in the spec's f4 evidence.
dev_node_toolchains:
  node: "24.19.0"
  go: "1.26.5"
  python: "3.12.13"

# --- Agent CLI tooling (global tools for remote CDE execution) -------------
dev_node_global_agent_npm_packages:
  - "@anthropic-ai/claude-code"


# --- tmux-resurrect (vendored git clone: idempotent, offline-tolerant) ----
# Base `tmux` ships via base_system (do NOT re-declare it here).
dev_node_tmux_plugins_dir: "{{ dev_node_home }}/.tmux/plugins"
dev_node_tmux_resurrect_repo: "https://github.com/tmux-plugins/tmux-resurrect.git"
dev_node_tmux_resurrect_version: "v4.0.0"

# --- dotfiles bootstrap ----------------------------------------------------
# A dev-node IS a development machine, so the "never clone on deploy targets"
# rule does not apply (ADR-058 D1). setup-linux.sh must be idempotent + secret-free.
dev_node_dotfiles_repo: "https://github.com/mlorentedev/dotfiles.git"
dev_node_dotfiles_dir: "{{ dev_node_home }}/Projects/Workspace/dotfiles"
# The dotfiles repo's default branch is `main` (kubelab's own `master` convention
# does not apply here) — verified via `git ls-remote --symref … HEAD`.
dev_node_dotfiles_version: "main"
# Run the (long) dotfiles bootstrap. Toggle off to only clone/update the repo.
dev_node_dotfiles_run_setup: true

# --- workspace skeleton ----------------------------------------------------
# Each agent gets its own clone dir for filesystem isolation between concurrent
# agents (ADR-058 D1 / #809). v1 is tmux isolation only — no orchestration.
dev_node_agent_workspaces:
  - claude-agent
  - codex-agent
  - pi-agent
  - orca-agent
dev_node_project_dirs:
  - "{{ dev_node_home }}/Projects"
  - "{{ dev_node_home }}/Projects/Workspace"
  - "{{ dev_node_home }}/workspaces"
  - "{{ dev_node_home }}/bin"

# --- apt tooling -----------------------------------------------------------
# neovim (headless editing). gh CLI adds its own apt repo (below).
dev_node_apt_packages:
  - neovim
  - build-essential

# --- machine identity (ANSIBLE-033 / ADR-058 D1-D3) ------------------------
# Fine-grained GitHub PAT giving this node an identity of its own — it serves
# BOTH `gh` and git-over-HTTPS (via `gh auth setup-git`), so there is one secret
# to rotate and one to revoke, and no SSH private key ships to the node.
#
# SSOT: `apps.services.automation.dev_node.github_token` in **common.enc.yaml**
# (machine identity, not environment config). The CONTROLLER decrypts it and
# passes it in — ace2 holds no age key and cannot decrypt anything. That absence
# is load-bearing: per SEC-SOPS-001 (#889) every SOPS file is encrypted to the
# same recipients, so any age key here would also open prod.
#
# Empty by default ON PURPOSE. A run without the secret must degrade to "not
# configured" and skip the auth tasks, rather than authenticate with an empty
# credential — which `gh` accepts syntactically and which then fails later, far
# from the cause.
dev_node_github_token: ""
