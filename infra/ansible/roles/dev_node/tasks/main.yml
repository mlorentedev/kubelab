---
# =============================================================================
# dev_node — centralized self-hosted CDE (ANSIBLE-028 / ADR-058 D1)
# Additive + idempotent. Since AI-007 this role owns ace2 outright: the
# ace2_services role (Ollama) was deleted, and its teardown lives below.
# =============================================================================

# --- Cleanup legacy Ollama (Docker) ----------------------------------------
# AI-007: Ollama was retired from ace2. Ansible is additive, so deleting the
# ace2_services role does NOT remove what it installed — the teardown has to be
# carried by the role that now owns the node. Same pattern as beelink_services,
# which still strips the bare-metal Ollama it replaced.
#
# Port 11434 is written literally on purpose: AI-007 removes
# apps.services.ai.ollama.* from common.yaml, so a cleanup task that read the
# value from config would break the moment the sweep lands. This is a
# historical fact about what to remove, not live configuration.
- name: Check if the legacy Ollama compose stack exists
  ansible.builtin.stat:
    path: /opt/ollama/compose.yml
  register: _ollama_compose
  tags: [dev_node, cleanup]

- name: Stop the legacy Ollama stack
  ansible.builtin.command: docker compose -f /opt/ollama/compose.yml down --remove-orphans --volumes
  when: _ollama_compose.stat.exists
  register: _ollama_down
  changed_when: "'Stopped' in _ollama_down.stderr or 'Removed' in _ollama_down.stderr"
  tags: [dev_node, cleanup]

- name: Remove the legacy Ollama deployment directory and model data
  ansible.builtin.file:
    path: /opt/ollama
    state: absent
  tags: [dev_node, cleanup]

- name: Remove the legacy Ollama UFW rules
  community.general.ufw:
    rule: allow
    port: "11434"
    proto: tcp
    from_ip: "{{ item }}"
    delete: true
  loop:
    - "{{ config.networking.tailscale_cidr }}"
    - "{{ config.networking.lan_cidr }}"
  tags: [dev_node, cleanup]

- name: Remove the legacy Ollama UFW interface rule
  community.general.ufw:
    rule: allow
    interface_in: tailscale0
    port: "11434"
    proto: tcp
    delete: true
  tags: [dev_node, cleanup]

# --- System tooling (root) -------------------------------------------------
- name: Install dev tooling apt packages (neovim, build-essential)
  ansible.builtin.apt:
    name: "{{ dev_node_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [dev_node, tooling]

# GitHub CLI ships from its own apt repo (modeled on the docker role).
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags: [dev_node, tooling, gh]

- name: Download GitHub CLI GPG key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"
  tags: [dev_node, tooling, gh]

- name: Add GitHub CLI apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
    state: present
    update_cache: true
  tags: [dev_node, tooling, gh]

- name: Install GitHub CLI (gh)
  ansible.builtin.apt:
    name: gh
    state: present
  tags: [dev_node, tooling, gh]

# --- User-level provisioning (runs as the interactive dev user) ------------
- name: Provision the developer user's environment
  become: true
  become_user: "{{ dev_node_user }}"
  block:
    - name: Create workspace skeleton (Projects, workspaces, bin)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ dev_node_project_dirs }}"
      tags: [dev_node, workspace]

    - name: Create per-agent isolated workspace dirs
      ansible.builtin.file:
        path: "{{ dev_node_home }}/workspaces/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ dev_node_agent_workspaces }}"
      tags: [dev_node, workspace]

    # --- mise (polyglot runtime manager) ---
    - name: Install mise (idempotent — skips if the binary already exists)
      ansible.builtin.shell:
        cmd: "curl -fsSL https://mise.run | sh"
        creates: "{{ dev_node_home }}/.local/bin/mise"
      environment:
        MISE_VERSION: "{{ dev_node_mise_version }}"
      tags: [dev_node, mise]

    # `template` does not create the destination's parent dir; on a fresh node
    # ~/.config/mise does not exist yet (mise.run installs only the binary), so
    # the render below would fail on the first run without this.
    - name: Ensure the mise config directory exists
      ansible.builtin.file:
        path: "{{ dev_node_home }}/.config/mise"
        state: directory
        mode: "0755"
      tags: [dev_node, mise]

    - name: Render global mise config (pins node/go/python — reproducible SSOT)
      ansible.builtin.template:
        src: mise-config.toml.j2
        dest: "{{ dev_node_home }}/.config/mise/config.toml"
        mode: "0644"
      tags: [dev_node, mise]

    - name: Install the pinned toolchains (node, go, python)
      ansible.builtin.command:
        cmd: "{{ dev_node_home }}/.local/bin/mise install"
      register: _mise_install
      changed_when: "'installing' in (_mise_install.stderr | lower) or 'installing' in (_mise_install.stdout | lower)"
      tags: [dev_node, mise]

    # --- Agent CLI tooling (Claude Code, etc.) ---
    - name: Install global agent CLI tools via mise node npm
      ansible.builtin.command:
        cmd: "{{ dev_node_home }}/.local/bin/mise exec -- npm install -g {{ item }}"
      environment:
        PATH: "{{ dev_node_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin:{{ ansible_env.PATH | default('') }}"
      loop: "{{ dev_node_global_agent_npm_packages }}"
      register: _npm_global_install
      changed_when: "'added' in _npm_global_install.stdout or 'changed' in _npm_global_install.stdout"
      tags: [dev_node, mise, agents]



    # --- tmux-resurrect (vendored plugin; base tmux comes from base_system) ---
    - name: Vendor tmux-resurrect at a pinned version
      ansible.builtin.git:
        repo: "{{ dev_node_tmux_resurrect_repo }}"
        dest: "{{ dev_node_tmux_plugins_dir }}/tmux-resurrect"
        version: "{{ dev_node_tmux_resurrect_version }}"
        depth: 1
      tags: [dev_node, tmux]

    # Writes ~/.tmux.conf.local, NOT ~/.tmux.conf: the dotfiles bootstrap redeploys
    # ~/.tmux.conf wholesale on every run, so injecting there means re-adding the
    # block on every pass — never idempotent, whatever the task order. The `.local`
    # file is the dotfiles-side seam (mlorentedev/dotfiles#788) and is never
    # overwritten, which is what makes this task converge.
    - name: Wire tmux-resurrect into .tmux.conf.local (load line only; prefs are dotfiles')
      ansible.builtin.blockinfile:
        path: "{{ dev_node_home }}/.tmux.conf.local"
        create: true
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED BLOCK — dev_node tmux-resurrect"
        block: |
          run-shell {{ dev_node_tmux_plugins_dir }}/tmux-resurrect/resurrect.tmux
      tags: [dev_node, tmux]

    # --- dotfiles bootstrap ---
    - name: Clone/update the dotfiles repo
      ansible.builtin.git:
        repo: "{{ dev_node_dotfiles_repo }}"
        dest: "{{ dev_node_dotfiles_dir }}"
        version: "{{ dev_node_dotfiles_version }}"
      register: _dotfiles
      tags: [dev_node, dotfiles]

    - name: Run the dotfiles bootstrap (idempotent, secret-free — see verification.md)
      ansible.builtin.command:
        cmd: "bash {{ dev_node_dotfiles_dir }}/setup-linux.sh"
        # setup-linux.sh sources ./scripts/utils.sh relative to the CWD and
        # documents `Usage: ./setup-linux.sh` — repo root is part of its contract.
        chdir: "{{ dev_node_dotfiles_dir }}"
      when: dev_node_dotfiles_run_setup | bool
      register: _dotfiles_setup
      changed_when: _dotfiles.changed
      tags: [dev_node, dotfiles]

    # --- mise activation (MUST run after the dotfiles bootstrap) ---
    # Ownership rule: Ansible owns /etc and the gitignored *.local override files;
    # the dotfiles bootstrap owns ~/.bashrc, ~/.zshrc and ~/.tmux.conf and redeploys
    # them on EVERY run. Writing to a file with two owners can never converge — the
    # last writer wins and the other re-does its work next pass — so nothing here
    # touches a dotfiles-owned file. Observed on the first real provision of ace2
    # (2026-08-06): the mise block was silently lost, then churned every run.
    - name: Put the mise shims on PATH system-wide (survives the dotfiles deploy)
      ansible.builtin.template:
        src: mise-profile.sh.j2
        dest: /etc/profile.d/mise.sh
        mode: "0644"
        owner: root
        group: root
      # The enclosing block runs as dev_node_user; /etc needs an explicit root
      # override (become: true alone inherits the block's become_user).
      become: true
      become_user: root
      tags: [dev_node, mise]

    # Non-interactive SSH sessions (e.g. Orca ADE remote relay, non-interactive CI
    # runners, remote agent harnesses) bypass /etc/profile.d/ and ~/.bashrc (early
    # return on [ -z "$PS1" ]). Symlinking the pinned mise node/npm/npx binaries
    # to /usr/local/bin exposes them on standard non-interactive $PATH cleanly.
    # A wrapper, not a symlink, and the earlier symlink was measured broken.
    # mise ships `bin/npm` as a bash script that finds npm's JS relative to
    # ITSELF via `dirname "${BASH_SOURCE[0]}"` — and `pwd -P` there normalises
    # the directory without resolving a symlinked file. Reached through
    # /usr/local/bin/npm it computed plugin_dir=/usr/local and looked for
    # /usr/local/lib/node_modules/npm/bin/npm-cli.js. Measured on ace2
    # 2026-08-23, the first time this ran against the node:
    #
    #     $ npm --version
    #     Error: Cannot find module '/usr/local/lib/node_modules/npm/bin/npm-cli.js'
    #
    # `npx` survived only by accident — mise installs THAT one as a symlink to
    # npx-cli.js, so resolution landed on a real JS file. Same task, same loop,
    # opposite outcome, decided by how upstream happened to package each entry.
    #
    # `follow: false` matters: without it the template writes THROUGH the
    # existing symlink and corrupts mise's own bin/npm, which is the file this
    # wrapper needs to keep working.
    - name: Wrap mise node, npm, npx, and claude into /usr/local/bin for non-interactive SSH tools
      ansible.builtin.template:
        src: mise-bin-wrapper.sh.j2
        dest: "/usr/local/bin/{{ item }}"
        mode: "0755"
        follow: false
      vars:
        wrapper_src_dir: "{{ dev_node_home }}/.local/share/mise/installs/node/{{ dev_node_toolchains.node }}/bin"
      loop:
        - node
        - npm
        - npx
        - claude
      become: true
      become_user: root
      tags: [dev_node, mise, orca, agents]

    # The same question as the loop above, for the tools that are NOT part of the
    # node toolchain. A non-interactive SSH session's PATH is /etc/environment
    # verbatim — measured on ace2: pam_env.so is in sshd's stack and the session
    # PATH matches that file character for character. ~/.local/bin is not in it,
    # so `dotf`, `hive` and `hive-vault` were installed and invisible: a remote
    # agent running the project's own doctrine (`dotf pr triage-queue`,
    # `dotf secrets run`) got "command not found", while an interactive login
    # found them and reported everything fine.
    #
    # Not fixed by appending ~/.local/bin to /etc/environment: that puts a
    # user-writable directory on root's PATH. A wrapper per tool states exactly
    # what is exposed, which is also what makes the list reviewable.
    - name: Wrap the dotfiles CLI and hive into /usr/local/bin for non-interactive SSH tools
      ansible.builtin.template:
        src: mise-bin-wrapper.sh.j2
        dest: "/usr/local/bin/{{ item }}"
        mode: "0755"
        follow: false
      vars:
        wrapper_src_dir: "{{ dev_node_home }}/.local/bin"
      loop: "{{ dev_node_local_bin_wrapped }}"
      become: true
      become_user: root
      tags: [dev_node, dotfiles, orca, agents]

    - name: Symlink mise binary into /usr/local/bin
      ansible.builtin.file:
        src: "{{ dev_node_home }}/.local/bin/mise"
        dest: "/usr/local/bin/mise"
        state: link
        force: true
      become: true
      become_user: root
      tags: [dev_node, mise, orca]


    # ~/.bashrc.local and ~/.zshrc.local are the dotfiles-side seam (IDEAS-001):
    # gitignored, sourced LAST by the tracked rc files, and never redeployed by
    # setup-linux.sh — so this block survives a bootstrap and stops churning.
    # Shims (not `mise activate`): shims are real executables, so they also resolve
    # from scripts; activate is an interactive-only eval.
    - name: Activate mise in interactive shells (bash + zsh)
      ansible.builtin.blockinfile:
        path: "{{ dev_node_home }}/{{ item }}"
        create: true
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED BLOCK — dev_node mise"
        block: |
          export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"
      loop:
        - .bashrc.local
        - .zshrc.local
      tags: [dev_node, mise]

    # --- dev-session launcher ---
    - name: Install ~/bin/dev-session.sh (tmux session launcher)
      ansible.builtin.template:
        src: dev-session.sh.j2
        dest: "{{ dev_node_home }}/bin/dev-session.sh"
        mode: "0755"
      tags: [dev_node, dev-session]

    # --- machine identity: one PAT for gh AND git over HTTPS (ANSIBLE-033) ---
    # Every task here is guarded on the token being configured, so a run without
    # the secret leaves a working dev node with no identity rather than half of
    # one. HOME is set explicitly: `become_user` does not reliably export it, and
    # both `gh` (~/.config/gh/hosts.yml) and `git config --global` resolve their
    # target file from HOME — get it wrong and the credential lands in root's
    # home, which is both a leak and an invisible failure.
    - name: Read the token gh currently holds
      ansible.builtin.command:
        cmd: gh auth token
      environment:
        HOME: "{{ dev_node_home }}"
      register: _gh_current_token
      # Exits non-zero when not logged in — that is a state to read, not a failure.
      failed_when: false
      changed_when: false
      no_log: true
      when: dev_node_github_token | length > 0
      tags: [dev_node, gh, identity]

    - name: Authenticate gh with the dev-node token
      ansible.builtin.command:
        cmd: gh auth login --with-token
        # stdin, NEVER argv: a token passed as a command argument is readable by
        # any user via /proc/<pid>/cmdline for the lifetime of the process, and
        # lands in the process accounting log (SEC-SECRETS-001).
        stdin: "{{ dev_node_github_token }}"
      environment:
        HOME: "{{ dev_node_home }}"
      no_log: true
      when:
        - dev_node_github_token | length > 0
        - (_gh_current_token.stdout | default('') | trim) != dev_node_github_token
      # The guard above IS the state check, so reaching this task means the stored
      # credential genuinely differed. Convergence therefore comes from `when`,
      # not from a post-hoc parse of gh's output.
      changed_when: true
      tags: [dev_node, gh, identity]

    # Registering gh as git's credential helper is what makes ONE token serve
    # both tools. That wiring lives in ~/.gitconfig — a file the dotfiles
    # bootstrap (run earlier in THIS role) redeploys wholesale every pass.
    #
    # So this role does NOT run `gh auth setup-git`. Measured on ace2
    # 2026-08-08: the helper was deleted by hand, and the bootstrap had already
    # restored it before the check below ran. Anything written here is erased on
    # the next pass, and a role that keeps rewriting it reports `changed`
    # forever — the "one writer per file" failure ANSIBLE-028 already paid for
    # with ~/.bashrc and ~/.tmux.conf. A guarded write is not a fallback here;
    # in the only case it would ever fire it is a churn generator.
    #
    # Division of labour: the token is this role's, the wiring is dotfiles'
    # (the `[credential "https://github.com"]` block in its .gitconfig). We
    # verify the contract instead of fighting for the file, so a missing helper
    # fails loudly rather than silently costing the "one credential, not two"
    # property. There is no ~/.gitconfig.local seam to write into; creating one
    # is a dotfiles change, not a kubelab one.
    - name: Check whether gh is git's credential helper
      ansible.builtin.command:
        cmd: git config --global --get-regexp '^credential\..*helper$'
      environment:
        HOME: "{{ dev_node_home }}"
      register: _git_credential_helper
      # Exits 1 when no key matches — an unconfigured helper, not an error.
      failed_when: false
      changed_when: false
      when: dev_node_github_token | length > 0
      tags: [dev_node, gh, identity]

    - name: Assert the same token serves git over HTTPS
      ansible.builtin.assert:
        that:
          - "'gh auth git-credential' in (_git_credential_helper.stdout | default(''))"
        fail_msg: >-
          The dev-node token is installed, but git will not use it over HTTPS:
          no `gh auth git-credential` helper is configured. ~/.gitconfig is owned
          by the dotfiles bootstrap, so this role must not write it (one writer
          per file). Restore the [credential "https://github.com"] block in
          mlorentedev/dotfiles .gitconfig, then re-provision.
        success_msg: gh is git's credential helper — one credential serves both.
      when: dev_node_github_token | length > 0
      tags: [dev_node, gh, identity]

# =============================================================================
# Gitea — the private forge (ANSIBLE-037 / #1075)
#
# What the node ends up holding is a keypair it GENERATED ITSELF. The private
# half is created on ace2 and never transits; the controller only ever handles
# the public half and the bot's API token, which stays on the controller. That
# is strictly better than either alternative the GitHub block above weighs:
# nothing is shipped to the node, and the node holds no `write:user` credential.
#
# Identity is the machine account (ADR-062 D1). Blast radius on the node is
# repositories only, and revoking it is deleting one key from one account —
# `DELETE /user/keys/{id}`, measured to fail closed within a second (R3).
#
# Empty token ON PURPOSE, matching the GitHub block: a run without the secret
# degrades to "not configured" and skips registration rather than authenticating
# with an empty credential.
# =============================================================================

- name: Configure git access to the private forge
  when: dev_node_gitea_bot_token | length > 0
  tags: [dev_node, gitea, identity]
  block:
    - name: Ensure the developer user's .ssh directory exists
      ansible.builtin.file:
        path: "{{ dev_node_home }}/.ssh"
        state: directory
        owner: "{{ dev_node_user }}"
        group: "{{ dev_node_user }}"
        mode: "0700"

    # `creates:`-guarded rather than `force: false` on openssh_keypair, because
    # the community collection is not a dependency of this role and adding one
    # for a single call is a heavier change than the call is worth.
    # The comment carries the RESOLVED identity, which is the only place
    # `dev_node_gitea_user` is consumed: Gitea's OpenSSH always authenticates the
    # transport as `git@` and resolves the owning account from the key itself, so
    # the identity can never appear in the SSH user field. Putting it in the
    # comment is what makes `ssh-keygen -lf` on the node and the key's title in
    # the account agree on whose key this is — without it, D1's machine-identity
    # decision would be declared in the spec and invisible on the box.
    - name: Generate this node's own forge keypair (private half never leaves ace2)
      ansible.builtin.command:
        cmd: >-
          ssh-keygen -t ed25519 -N ''
          -C '{{ dev_node_gitea_user }}@{{ inventory_hostname }} (ANSIBLE-037)'
          -f {{ dev_node_gitea_key_path }}
        creates: "{{ dev_node_gitea_key_path }}"
      become: true
      become_user: "{{ dev_node_user }}"

    - name: Fix ownership and mode on the generated keypair
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ dev_node_user }}"
        group: "{{ dev_node_user }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ dev_node_gitea_key_path }}", mode: "0600" }
        - { path: "{{ dev_node_gitea_key_path }}.pub", mode: "0644" }

    # AC3. The host key is DECLARED in common.yaml, not scanned: a scan trusts
    # whatever answers at provision time, which is trust-on-first-use with the
    # prompt suppressed rather than the prompt answered. With the declared value
    # the node refuses a substituted key instead of adopting it.
    - name: Pin the forge's SSH host key (declared, never scanned)
      ansible.builtin.known_hosts:
        path: "{{ dev_node_home }}/.ssh/known_hosts"
        name: "[{{ dev_node_gitea_ssh_host }}]:{{ dev_node_gitea_ssh_port }}"
        key: "[{{ dev_node_gitea_ssh_host }}]:{{ dev_node_gitea_ssh_port }} {{ dev_node_gitea_ssh_host_key }}"
        state: present
      become: true
      become_user: "{{ dev_node_user }}"

    # `/etc/ssh/ssh_config.d/`, not `~/.ssh/config.d/`, and the difference was
    # measured rather than assumed: ace2's `~/.ssh/config` (owned by the
    # dotfiles bootstrap — one writer per file, the rule the GitHub block above
    # states) carries NO `Include` directive, and OpenSSH has no implicit
    # `.d` convention for the user file. A drop-in there would have been read by
    # nothing while every task reported changed/ok — green, and inert.
    # `/etc/ssh/ssh_config` ships `Include /etc/ssh/ssh_config.d/*.conf` on
    # Ubuntu and belongs to no other writer, so a drop-in there is actually read.
    - name: Point git at the forge with this node's key, without touching dotfiles' files
      ansible.builtin.copy:
        dest: /etc/ssh/ssh_config.d/60-kubelab-gitea.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # {{ ansible_managed }}
          # ANSIBLE-037. System-wide because the developer user's own ssh config
          # has a different owner; the IdentityFile below is readable only by
          # that user, so this grants nothing to anyone else on the node.
          Host {{ dev_node_gitea_ssh_host }}
            Port {{ dev_node_gitea_ssh_port }}
            User git
            IdentityFile {{ dev_node_gitea_key_path }}
            IdentitiesOnly yes
            StrictHostKeyChecking yes
      become: true
      register: _gitea_ssh_config

    - name: Read back the public half (never the private one)
      ansible.builtin.slurp:
        src: "{{ dev_node_gitea_key_path }}.pub"
      register: _gitea_pubkey

    # Registration runs on the CONTROLLER: the bot token is the credential that
    # can add a key to the account, and it has no business being on the node.
    - name: List the keys already on the machine account
      ansible.builtin.uri:
        url: "{{ dev_node_gitea_api_url }}/user/keys"
        headers:
          Authorization: "token {{ dev_node_gitea_bot_token }}"
        return_content: true
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true
      register: _gitea_keys

    - name: Register this node's public key on the machine account
      ansible.builtin.uri:
        url: "{{ dev_node_gitea_api_url }}/user/keys"
        method: POST
        headers:
          Authorization: "token {{ dev_node_gitea_bot_token }}"
        body_format: json
        body:
          title: "{{ dev_node_gitea_key_title }}"
          key: "{{ (_gitea_pubkey.content | b64decode) | trim }}"
          read_only: false
        status_code: [201]
      delegate_to: localhost
      become: false
      no_log: true
      # Idempotence is by KEY MATERIAL, not by title. A title match with
      # different material would leave the node holding a key the forge does not
      # know, and the play would still report changed=0 — green, and broken.
      # `trim` before splitting, deliberately: ssh-keygen writes a trailing
      # newline, and a key generated without a comment would put it inside the
      # material field. The comparison would then never match an already-
      # registered key, and every provision would POST a duplicate — the play
      # reporting `changed` forever and the account accumulating one key per run,
      # which is the opposite of what AC1's `changed=0` asserts.
      when: >-
        (((_gitea_pubkey.content | b64decode) | trim).split(' ')[1] | default('', true))
        not in (_gitea_keys.json | default([]) | map(attribute='key')
                | map('regex_replace', '^(\S+)\s+(\S+).*$', '\2') | list)
