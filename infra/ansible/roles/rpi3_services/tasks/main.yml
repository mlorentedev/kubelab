---
# rpi3_services owns Uptime Kuma only since DASH-DT-014b. Glances was
# extracted to the shared `roles/glances/` role (one role for all nodes,
# tailscale_ip bind, more secure than the previous 0.0.0.0 bind here).
# A container named uptime-kuma from outside this stack (the pre-Ansible ad-hoc
# deployment) would hold the name and break `compose up`. Remove only that one:
# removing it unconditionally took the external monitor of prod down on every
# provision and reported nothing (2026-10-02). Same guard as roles/glances.
- name: Detect compose project of any existing 'uptime-kuma' container
  command: docker inspect uptime-kuma --format '{% raw %}{{index .Config.Labels "com.docker.compose.project"}}{% endraw %}'
  register: _kuma_project
  changed_when: false
  check_mode: false
  failed_when: false

- name: Force-remove a legacy Uptime Kuma container (not this stack's)
  command: docker rm -f uptime-kuma
  when:
    - _kuma_project.rc == 0
    - _kuma_project.stdout != (rpi3_deploy_dir | basename)
  changed_when: true

- name: Create deployment directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ rpi3_deploy_dir }}"

- name: Template Docker Compose stack
  template:
    src: compose.yml.j2
    dest: "{{ rpi3_deploy_dir }}/compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart rpi3 services

# --- Boot ordering: bind address must exist before Docker publishes on it ---
# The compose stack binds Uptime Kuma to {{ tailscale_ip }}. At boot Docker
# restores containers independently of tailscaled, and losing that race means
# the container comes up with NO published ports while still reporting
# `running`. Same helper and same unit shape as beelink_services and glances.
- name: Install the Tailscale address wait helper
  copy:
    src: wait-for-tailscale-addr.sh
    dest: "{{ rpi3_deploy_dir }}/wait-for-tailscale-addr.sh"
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [boot]

# Read before the template: under --check the template only predicts the file,
# so whether systemd can see the unit is a question about the disk, not about
# the template's `changed`, which is also true when an existing unit is updated.
- name: Check whether the Compose stack unit is already installed
  stat:
    path: /etc/systemd/system/kubelab-rpi3.service
  register: _rpi3_unit_file
  tags: [boot]

- name: Install the Compose stack systemd unit
  template:
    src: kubelab-rpi3.service.j2
    dest: /etc/systemd/system/kubelab-rpi3.service
    owner: root
    group: root
    mode: "0644"
  become: true
  tags: [boot]

# Under --check a unit not yet on disk is only predicted, so systemd has nothing
# to enable and the dry run fails here (#1983). Skipped only in that case: on a
# real run, and on a dry run where the unit file exists (even if the template
# would update it), the task runs as before and still reports a disabled unit.
- name: Enable the Compose stack unit at boot
  systemd:
    name: kubelab-rpi3.service
    enabled: true
    daemon_reload: true
  become: true
  when: not (ansible_check_mode and not _rpi3_unit_file.stat.exists)
  tags: [boot]

# --- Port allowlist: who may open the published port (#2482) ---
# The bind keeps Kuma off every interface but the tailnet; this keeps it off every
# tailnet machine but the ones that need it. ufw cannot do it (Docker's DNAT runs
# first), so the rules go in DOCKER-USER, re-applied by a unit whenever Docker starts.
- name: Template the Kuma port allowlist rules
  template:
    src: kuma-allowlist.rules.j2
    dest: "{{ rpi3_deploy_dir }}/kuma-allowlist.rules"
    owner: root
    group: root
    mode: "0644"
  become: true
  register: _kuma_allowlist_rules
  tags: [allowlist]

- name: Check whether the Kuma allowlist unit is already installed
  stat:
    path: /etc/systemd/system/kubelab-kuma-allowlist.service
  register: _kuma_allowlist_unit_file
  tags: [allowlist]

- name: Install the Kuma allowlist unit
  template:
    src: kubelab-kuma-allowlist.service.j2
    dest: /etc/systemd/system/kubelab-kuma-allowlist.service
    owner: root
    group: root
    mode: "0644"
  become: true
  register: _kuma_allowlist_unit
  tags: [allowlist]

# Restarted only when a rendered file changed, so a re-run reports changed=0.
# Same --check guard as the stack unit above (#1983).
- name: Apply the Kuma allowlist and enable it with Docker
  systemd:
    name: kubelab-kuma-allowlist.service
    enabled: true
    daemon_reload: true
    state: "{{ 'restarted' if (_kuma_allowlist_rules.changed or _kuma_allowlist_unit.changed) else 'started' }}"
  become: true
  when: not (ansible_check_mode and not _kuma_allowlist_unit_file.stat.exists)
  tags: [allowlist]

- name: Verify the allowlist jump is in DOCKER-USER
  command: >-
    iptables -w -C DOCKER-USER -p tcp -m conntrack --ctorigdst {{ tailscale_ip }}
    --ctorigdstport {{ uptime_kuma_port }} -j KUMA-ALLOW
  become: true
  changed_when: false
  when: not ansible_check_mode
  tags: [allowlist]

# rpi3 is on the lab Wi-Fi, which leaves by the edge's uplink: sized against its
# downlink when the play sets image_pull_down_kbit, bounded and retried (#2742).
- name: Pull the Uptime Kuma image
  ansible.builtin.import_tasks: "{{ playbook_dir }}/_includes/image-pull.yml"
  vars:
    image_pull_name: Uptime Kuma
    image_pull_images: ["{{ uptime_kuma_image }}"]
    image_pull_command: docker compose -f {{ rpi3_deploy_dir }}/compose.yml pull

# Enabling does not start a unit, so a unit that failed at boot stayed failed and
# its stack unbound until the next boot (#2500). Starting a failed unit recreates
# the stack once its address exists; on a healthy node the unit is already active
# and this is a no-op.
- name: Start the Compose stack unit
  systemd:
    name: kubelab-rpi3.service
    state: started
  # Same --check guard as the enable task above (#1983).
  when: not (ansible_check_mode and not _rpi3_unit_file.stat.exists)
  tags: [boot]

# Before the compose run below: it would race the unit's own recreate.
- name: Wait for the Compose stack unit to bring the stack up
  import_tasks: "{{ playbook_dir }}/_includes/stack-unit-settled.yml"
  vars:
    stack_unit_settled_name: kubelab-rpi3.service
  tags: [boot]

- name: Check for a port binding that was never established
  import_tasks: "{{ playbook_dir }}/_includes/compose-port-drift.yml"
  vars:
    compose_port_drift_file: "{{ rpi3_deploy_dir }}/compose.yml"

- name: Start services
  command: >-
    docker compose -f {{ rpi3_deploy_dir }}/compose.yml up -d
    {{ '--force-recreate' if compose_port_drift | bool else '' }}
  register: _compose_up
  # compose v2 writes progress to stderr. `Running` is no change; Started and
  # Created (which Recreated contains) are.
  changed_when: "'Started' in _compose_up.stderr or 'Created' in _compose_up.stderr"

- name: Wait for services to stabilize
  pause:
    seconds: 10

- name: Verify Uptime Kuma health
  uri:
    # The port is published on the tailnet address only (compose.yml.j2), so
    # nothing listens on localhost: ask where it is bound.
    url: "http://{{ tailscale_ip }}:{{ uptime_kuma_port }}"
    method: GET
    status_code: [200, 302]
    timeout: 10
  retries: 5
  delay: 5

- name: Bootstrap Uptime Kuma (setup admin + import monitors from seed)
  command: poetry run toolkit monitoring bootstrap
  args:
    chdir: "{{ playbook_dir }}/../.."
  delegate_to: localhost
  become: false
  register: bootstrap_result
  changed_when: "'Created admin' in bootstrap_result.stdout"
  failed_when: false

- name: Report service status
  debug:
    msg: "Uptime Kuma on port {{ uptime_kuma_port }}"
