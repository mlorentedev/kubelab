---
# --- Install ---
- name: Detect system architecture
  set_fact:
    docker_arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"

- name: Remove old Docker packages
  apt:
    name:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
    state: absent

- name: Remove legacy Docker GPG key (.gpg format)
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/keyrings/docker.gpg
    - /etc/apt/keyrings/docker.gpg~
  register: _legacy_gpg

- name: Remove old Docker repository entries (migration from .gpg to .asc)
  shell: rm -f /etc/apt/sources.list.d/*docker*
  when: _legacy_gpg is changed
  changed_when: true

- name: Ensure apt keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable"
    state: present
    update_cache: true

- name: Install Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

# --- Configure (before starting daemon) ---
- name: Configure Docker daemon
  copy:
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "{{ docker_log_max_size }}",
          "max-file": "{{ docker_log_max_files }}"
        },
        "storage-driver": "overlay2",
        "live-restore": true,
        "userland-proxy": false,
        "experimental": false,
        "ipv6": false,
        "fixed-cidr": "172.17.0.0/16",
        "default-address-pools": [
          {
            "base": "{{ docker_address_pool_base }}",
            "size": {{ docker_address_pool_size }}
          }
        ]
      }
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: restart docker

- name: Configure system limits for containers
  copy:
    content: |
      # Container resource limits
      * soft nofile 65536
      * hard nofile 65536
      * soft nproc 32768
      * hard nproc 32768
      root soft nofile 65536
      root hard nofile 65536
    dest: /etc/security/limits.d/99-container-limits.conf
    mode: '0644'

- name: Configure sysctl for containers
  copy:
    content: |
      # Kernel parameters for containers
      vm.max_map_count=262144
      fs.file-max=2097152
      net.core.somaxconn=1024
      net.ipv4.ip_local_port_range=1024 65535
    dest: /etc/sysctl.d/99-container.conf
    mode: '0644'
  notify: reload sysctl

- name: Add user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes

# --- Start daemon (config already in place) ---
- name: Start and enable Docker
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Flush handlers (ensure Docker restarts if daemon.json changed)
  meta: flush_handlers

- name: Wait for Docker daemon to be ready
  command: docker info
  register: _docker_ready
  retries: 5
  delay: 3
  until: (_docker_ready.rc == 0) or ansible_check_mode
  changed_when: false
  check_mode: false
  ignore_errors: "{{ ansible_check_mode }}"

# --- Post-start (daemon is running) ---
- name: Reset SSH connection for group changes
  meta: reset_connection

- name: Create Docker networks
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
    driver: bridge
  loop: "{{ [docker_network] + docker_additional_networks }}"

# --- Verification ---
- name: Verify Docker installation
  command: docker --version
  register: docker_version
  changed_when: false
  check_mode: false
  ignore_errors: "{{ ansible_check_mode }}"

- name: Verify Docker Compose installation
  command: docker compose version
  register: docker_compose_version
  changed_when: false
  check_mode: false
  ignore_errors: "{{ ansible_check_mode }}"

- name: Display Docker versions
  debug:
    msg:
      - "Docker version: {{ docker_version.stdout | default('not installed yet') }}"
      - "Docker Compose version: {{ docker_compose_version.stdout | default('not installed yet') }}"

- name: Test Docker functionality
  command: docker run --rm hello-world
  register: docker_test
  changed_when: false
  ignore_errors: true

- name: Verify Docker is working
  assert:
    that:
      - docker_test.rc == 0
    fail_msg: "Docker installation test failed"
    success_msg: "Docker installation verified successfully"

# A play turns this on for the run that upgrades its engine (#2722). On
# 2026-10-27 the BuildKit session failed 5 s into a build and fatally 5 s later,
# and the build then waited for it, with no error, until the runner's 3 h job
# timeout. The build sleeps past that window, and `timeout` turns a hang into a
# failed play: 124 on its TERM, or 137 on the KILL that follows when a client
# blocked on the dead session ignores the TERM. `cacheonly` keeps no image behind.
- name: Smoke-build an image on this engine
  shell: |
    set -o pipefail
    printf 'FROM %s\nRUN sleep 20\n' '{{ docker_smoke_build_image }}' \
      | timeout --kill-after=30 {{ docker_smoke_build_timeout_seconds }} \
        docker buildx build --no-cache --progress=plain --output type=cacheonly -
  args:
    executable: /bin/bash
  register: _docker_smoke_build
  changed_when: false
  failed_when: false
  when:
    - docker_smoke_build | bool
    - not ansible_check_mode

- name: Verify the smoke build finished
  assert:
    that: _docker_smoke_build.rc == 0
    fail_msg: >-
      {{ ('The smoke build made no progress in ' ~ docker_smoke_build_timeout_seconds
          ~ ' s: a dropped BuildKit session (#2722). Read journalctl -u docker.')
         if _docker_smoke_build.rc == 124 else
         ('The smoke build was killed after ' ~ (_docker_smoke_build.delta | default('?'))
          ~ '. Past the ' ~ docker_smoke_build_timeout_seconds ~ ' s timeout, its client ignored the'
          ~ ' TERM on a dropped BuildKit session (#2722); sooner, something else killed it, most'
          ~ ' often the OOM killer (journalctl -k).')
         if _docker_smoke_build.rc == 137 else
         ('The smoke build failed with rc ' ~ _docker_smoke_build.rc ~ ': '
          ~ (_docker_smoke_build.stderr_lines | default([]))[-5:] | join(' | ')) }}
  when:
    - docker_smoke_build | bool
    - not ansible_check_mode
