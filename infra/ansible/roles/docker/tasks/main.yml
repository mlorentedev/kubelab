---
# --- Install ---
- name: Detect system architecture
  set_fact:
    docker_arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"

- name: Remove old Docker packages
  apt:
    name:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
    state: absent

- name: Remove legacy Docker GPG key (.gpg format)
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/keyrings/docker.gpg
    - /etc/apt/keyrings/docker.gpg~
  register: _legacy_gpg

# The glob also matches today's docker.sources. That is harmless: it runs before
# the source is written, and only on a node that still had the .gpg key.
- name: Remove old Docker repository entries (migration from .gpg to .asc)
  shell: rm -f /etc/apt/sources.list.d/*docker*
  when: _legacy_gpg is changed
  changed_when: true

- name: Ensure apt keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Install the library deb822_repository needs
  apt:
    name: python3-debian
    state: present
    # The first apt step a tagged run reaches: it refreshes an index never fetched
    # or over an hour old, as the role's other installs do.
    update_cache: true
    cache_valid_time: 3600

# deb822, as Docker's install page writes it (docker.sources), because
# apt_repository goes away in ansible-core 2.25 (#2737).
- name: Add Docker repository
  deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [stable]
    architectures: ["{{ docker_arch }}"]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

# The one-line source apt_repository derived from the URL (lesson-037; measured
# on bee, ace1, ace2 and rpi4 on 2026-10-28). Removed only now that
# docker.sources is in place, so the node is never without the repository; left
# beside it, apt warns the target is configured twice. The install below
# refreshes the index.
- name: Remove the Docker source the old task wrote
  file:
    path: /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
    state: absent

- name: Install Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

# --- Configure (before starting daemon) ---
# max-download-attempts: dockerd resumes a layer from its partial file on each of
# its own attempts, but after the last one it fails the pull and drops every layer
# the pull registered, so a retry of the whole pull starts from nothing. Behind the
# edge a layer's connection ends in `unexpected EOF` every 7 to 8 minutes, and
# Docker's default of 5 lost a 1.6 GB pull three times running (ace2, 2026-10-30).
# The pause after attempt k is 5k seconds, uncapped: 40 attempts sleep at most
# 65 minutes in all, which is also how long a blob that never downloads takes to
# fail. tests/test_image_pull_budget.py holds it between those two bounds.
- name: Configure Docker daemon
  copy:
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "{{ docker_log_max_size }}",
          "max-file": "{{ docker_log_max_files }}"
        },
        "storage-driver": "overlay2",
        "max-download-attempts": 40,
        "live-restore": true,
        "userland-proxy": false,
        "experimental": false,
        "ipv6": false,
        "fixed-cidr": "172.17.0.0/16",
        "default-address-pools": [
          {
            "base": "{{ docker_address_pool_base }}",
            "size": {{ docker_address_pool_size }}
          }
        ]
      }
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: restart docker

- name: Configure system limits for containers
  copy:
    content: |
      # Container resource limits
      * soft nofile 65536
      * hard nofile 65536
      * soft nproc 32768
      * hard nproc 32768
      root soft nofile 65536
      root hard nofile 65536
    dest: /etc/security/limits.d/99-container-limits.conf
    mode: '0644'

- name: Configure sysctl for containers
  copy:
    content: |
      # Kernel parameters for containers
      vm.max_map_count=262144
      fs.file-max=2097152
      net.core.somaxconn=1024
      net.ipv4.ip_local_port_range=1024 65535
    dest: /etc/sysctl.d/99-container.conf
    mode: '0644'
  notify: reload sysctl

- name: Add user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes

# --- Start daemon (config already in place) ---
- name: Start and enable Docker
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Flush handlers (ensure Docker restarts if daemon.json changed)
  meta: flush_handlers

- name: Wait for Docker daemon to be ready
  command: docker info
  register: _docker_ready
  retries: 5
  delay: 3
  until: (_docker_ready.rc == 0) or ansible_check_mode
  changed_when: false
  check_mode: false
  ignore_errors: "{{ ansible_check_mode }}"

# --- Post-start (daemon is running) ---
- name: Reset SSH connection for group changes
  meta: reset_connection

- name: Create Docker networks
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
    driver: bridge
  loop: "{{ [docker_network] + docker_additional_networks }}"

# --- Verification ---
- name: Verify Docker installation
  command: docker --version
  register: docker_version
  changed_when: false
  check_mode: false
  ignore_errors: "{{ ansible_check_mode }}"

- name: Verify Docker Compose installation
  command: docker compose version
  register: docker_compose_version
  changed_when: false
  check_mode: false
  ignore_errors: "{{ ansible_check_mode }}"

- name: Display Docker versions
  debug:
    msg:
      - "Docker version: {{ docker_version.stdout | default('not installed yet') }}"
      - "Docker Compose version: {{ docker_compose_version.stdout | default('not installed yet') }}"

- name: Test Docker functionality
  command: docker run --rm hello-world
  register: docker_test
  changed_when: false
  ignore_errors: true

- name: Verify Docker is working
  assert:
    that:
      - docker_test.rc == 0
    fail_msg: "Docker installation test failed"
    success_msg: "Docker installation verified successfully"

# A play turns this on for the run that upgrades its engine (#2722), so a build
# that makes no progress fails the play rather than holding the runner until its
# 3 h job timeout. The hang on record was a 2.31 GB base layer pulling at about
# 80 KB/s, so the base image is pulled first under its own timeout: the uplink
# fails as a pull and the build's timeout measures the engine alone. The pinned
# image stays in the store; `cacheonly` keeps no build result behind.
- name: Pull the smoke build's base image
  command: timeout --kill-after=30 {{ docker_smoke_build_timeout_seconds }} docker pull {{ docker_smoke_build_image }}
  register: _docker_smoke_pull
  changed_when: false
  failed_when: false
  when:
    - docker_smoke_build | bool
    - not ansible_check_mode

- name: Verify the smoke build's base image pulled
  assert:
    that: _docker_smoke_pull.rc == 0
    fail_msg: >-
      {{ ('Pulling ' ~ docker_smoke_build_image ~ ' did not finish in ' ~ docker_smoke_build_timeout_seconds
          ~ ' s: the registry or the uplink, not the engine. The build did not run.')
         if _docker_smoke_pull.rc in [124, 137] else
         ('Pulling ' ~ docker_smoke_build_image ~ ' failed with rc ' ~ _docker_smoke_pull.rc ~ ': '
          ~ (_docker_smoke_pull.stderr_lines | default([]))[-5:] | join(' | ')
          ~ '. The build did not run.') }}
  when:
    - docker_smoke_build | bool
    - not ansible_check_mode

# `default` is the engine's own BuildKit, the one the Gitea jobs build on.
# Without it the build runs on whichever builder root last selected, and on the
# Beelink that is `multiarch`, a docker-container builder that pulls its own image
# first. The build sleeps past the 10 s in which dockerd logs its session
# healthcheck lines, which also appear on builds that pass, and `timeout` turns a
# hang into a failed play: 124 on its TERM, or 137 on the KILL that follows when a
# client blocked on its build ignores the TERM.
- name: Smoke-build an image on this engine
  shell: |
    set -o pipefail
    printf 'FROM %s\nRUN sleep 20\n' '{{ docker_smoke_build_image }}' \
      | timeout --kill-after=30 {{ docker_smoke_build_timeout_seconds }} \
        docker buildx build --builder default --no-cache --progress=plain --output type=cacheonly -
  args:
    executable: /bin/bash
  register: _docker_smoke_build
  changed_when: false
  failed_when: false
  when:
    - docker_smoke_build | bool
    - not ansible_check_mode

- name: Verify the smoke build finished
  assert:
    that: _docker_smoke_build.rc == 0
    fail_msg: >-
      {{ ('The smoke build made no progress in ' ~ docker_smoke_build_timeout_seconds
          ~ ' s. Read the step it stopped in with docker buildx history logs on this node,'
          ~ ' and record it on #2722. Last output: '
          ~ (_docker_smoke_build.stderr_lines | default([]))[-5:] | join(' | '))
         if _docker_smoke_build.rc == 124 else
         ('The smoke build was killed after ' ~ (_docker_smoke_build.delta | default('?'))
          ~ '. Past the ' ~ docker_smoke_build_timeout_seconds ~ ' s timeout, it made no progress and'
          ~ ' its client ignored the TERM: record it on #2722. Sooner, something else killed it,'
          ~ ' most often the OOM killer (journalctl -k).')
         if _docker_smoke_build.rc == 137 else
         ('The smoke build failed with rc ' ~ _docker_smoke_build.rc ~ ': '
          ~ (_docker_smoke_build.stderr_lines | default([]))[-5:] | join(' | ')) }}
  when:
    - docker_smoke_build | bool
    - not ansible_check_mode
