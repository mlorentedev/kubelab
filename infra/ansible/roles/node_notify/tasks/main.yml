---
# node_notify — installs the fleet's one failure-notification path and retires
# the single-purpose one it replaces.

# The keys become `case` patterns in the script, inside single quotes, and the
# values the envelope's severity. The character set is what keeps the quotes
# closed, and a name without its suffix would never match what `%n` passes.
- name: Check the per-unit severities
  assert:
    that:
      - node_notify_unit_severity is mapping
      - node_notify_unit_severity.values() | reject('in', ['log', 'page']) | list | length == 0
      - node_notify_unit_severity.keys() | reject('match', '^[A-Za-z0-9@:_.-]+[.][a-z]+$') | list | length == 0
    fail_msg: >-
      ERROR: node_notify_unit_severity is {{ node_notify_unit_severity }}.
      WHY: it maps full unit names, suffix included, to log or page; a key outside
      letters, digits and @:_.- or without its suffix never matches, and a level the
      fleet's router does not tell apart pages or stays silent by accident.
      FIX: correct the play that declares it.
    quiet: true

- name: Write fleet notify secret
  copy:
    content: "{{ secrets.apps.services.automation.notify.fleet_webhook_secret }}"
    dest: "{{ node_notify_secret_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install fleet notify script
  template:
    src: kubelab-notify.sh.j2
    dest: "{{ node_notify_script_path }}"
    owner: root
    group: root
    mode: "0700"

- name: Install fleet notify template unit
  template:
    src: kubelab-notify@.service.j2
    dest: "/etc/systemd/system/{{ node_notify_unit_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install fleet recovery template unit
  template:
    src: kubelab-notify-recovered@.service.j2
    dest: "/etc/systemd/system/{{ node_notify_recovered_unit_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# NOTE: the single-purpose notifier this replaces is removed by
# `node_maintenance`, not here, and the reason is ordering rather than
# ownership. Removing it from this role would delete the unit file while
# systemd still has the OLD `kubelab-maintenance.service` loaded and pointing
# at it -- the consumer is re-templated by a role that runs AFTER this one, and
# a handler-driven `daemon-reload` would not fire until the end of the play
# either way. A maintenance failure in that window would invoke a target whose
# file is already gone. So the teardown lives immediately after the reload that
# makes the old unit unreferenced. Raised by review on #1212.
