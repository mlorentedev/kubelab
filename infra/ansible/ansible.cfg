# Read by every Ansible command started from this directory: the toolkit runner
# (`toolkit infra ansible run`, cwd=infra/ansible) and a raw `ansible-playbook`
# run by hand from here. Ansible reads ONE config file, the first it finds, so
# keep this file to settings the repo needs and nothing a user might set at home.

[inventory]
# A play whose pattern matches no host is a WARNING and exit 0 by default, so a
# run against the wrong or a stale inventory reports success having touched
# nothing (lesson-356, #1228). Make it a failure.
host_pattern_mismatch = error
