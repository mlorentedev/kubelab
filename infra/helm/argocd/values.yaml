# Argo CD — non-HA, tuned for t4g.small (2 vCPU, 2GB RAM)
# Ref: ADR-023 Phase 3, upgraded from t4g.micro (2026-03-28)

global:
  domain: argo.kubelab.live

server:
  replicas: 1
  # RELIAB-009 §9.2 — keep two-step rollback; collapse ReplicaSet graveyard.
  revisionHistoryLimit: 3
  service:
    type: NodePort
    nodePortHttp: 30080
    nodePortHttps: 30443
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  extraArgs:
    - --insecure  # TLS terminated by prod Traefik, not Argo CD server

controller:
  replicas: 1
  revisionHistoryLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

repoServer:
  replicas: 1
  revisionHistoryLimit: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

redis:
  revisionHistoryLimit: 3
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

dex:
  enabled: false  # Native OIDC via Authelia — dex not needed

notifications:
  enabled: true
  revisionHistoryLimit: 3
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  notifiers:
    service.webhook.slack: |
      url: $slack-webhook-url
      headers:
        - name: Content-Type
          value: application/json
  # Two properties every trigger here needs, both learned the hard way and both
  # taken from upstream's own catalog (argoproj/argo-cd
  # notifications_catalog/triggers/*.yaml) rather than reinvented:
  #
  # 1. `operationState != nil` BEFORE any field of it. expr-lang RAISES on a nil
  #    dereference, and a raised expression is a SKIPPED trigger — not a false
  #    one. `operationState` is nil at the instant a sync starts, so an unguarded
  #    `on-sync-failed` is blind during exactly the window a sync fails in.
  #    Measured on the live hub 2026-08-22: ten `cannot fetch phase from <nil>`
  #    errors, at the two timestamps syncs began, while `on-sync-failed` and
  #    `on-health-degraded` each fired ZERO times in 24h. The alarm worked
  #    whenever nothing was happening.
  #
  # 2. `oncePer` keyed on the REVISION. Without it Argo CD dedupes on the
  #    condition hash, which does not change between deploys: both applications
  #    logged the same key across every revision, so the notification for the
  #    next deploy is suppressed as "already sent". `?.` is optional chaining and
  #    is nil-safe by construction, which is why it needs no guard of its own.
  #
  # Guarded by tests/test_argocd_notification_triggers.py, structurally — the
  # assertion holds for any trigger added later, not just these three.
  triggers:
    trigger.on-sync-failed: |
      # Folded (`>-`) purely to stay inside yamllint's 130-column limit; it
      # joins to the single line Argo CD evaluates. Continuation lines must keep
      # the SAME indent — a deeper one is literal, not folded, and would put a
      # newline inside the expression.
      - when: >-
          app.status.sync.status == 'Unknown' ||
          (app.status.operationState != nil and
          app.status.operationState.phase in ['Error', 'Failed'])
        send: [app-sync-failed]
        oncePer: app.status.operationState?.syncResult?.revision
    trigger.on-health-degraded: |
      - when: app.status.health.status == 'Degraded'
        send: [app-health-degraded]
        oncePer: app.status.operationState?.syncResult?.revision
    trigger.on-sync-succeeded: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded']
        send: [app-sync-succeeded]
        oncePer: app.status.operationState?.syncResult?.revision
  templates:
    template.app-sync-failed: |
      webhook:
        slack:
          method: POST
          body: |
            {"attachments": [{"color": "#E96D76", "blocks": [
              {"type": "header", "text": {"type": "plain_text", "text": "Sync Failed"}},
              {"type": "section", "fields": [
                {"type": "mrkdwn", "text": "*App:*\n{{.app.metadata.name}}"},
                {"type": "mrkdwn", "text": "*Revision:*\n{{.app.status.sync.revision | trunc 7}}"}
              ]},
              {"type": "context", "elements": [
                {"type": "mrkdwn", "text": "<https://argo.kubelab.live/applications/argocd/{{.app.metadata.name}}|Open>"}
              ]}
            ]}]}
    template.app-health-degraded: |
      webhook:
        slack:
          method: POST
          body: |
            {"attachments": [{"color": "#F4C030", "blocks": [
              {"type": "header", "text": {"type": "plain_text", "text": "Health Degraded"}},
              {"type": "section", "fields": [
                {"type": "mrkdwn", "text": "*App:*\n{{.app.metadata.name}}"},
                {"type": "mrkdwn", "text": "*Health:*\n{{.app.status.health.status}}"}
              ]},
              {"type": "context", "elements": [
                {"type": "mrkdwn", "text": "<https://argo.kubelab.live/applications/argocd/{{.app.metadata.name}}|Open>"}
              ]}
            ]}]}
    template.app-sync-succeeded: |
      webhook:
        slack:
          method: POST
          body: |
            {"attachments": [{"color": "#18BE52", "blocks": [
              {"type": "header", "text": {"type": "plain_text", "text": "Sync Succeeded"}},
              {"type": "section", "fields": [
                {"type": "mrkdwn", "text": "*App:*\n{{.app.metadata.name}}"},
                {"type": "mrkdwn", "text": "*Revision:*\n{{.app.status.sync.revision | trunc 7}}"}
              ]},
              {"type": "context", "elements": [
                {"type": "mrkdwn", "text": "<https://argo.kubelab.live/applications/argocd/{{.app.metadata.name}}|Open>"}
              ]}
            ]}]}
  subscriptions:
    - recipients:
        - slack
      triggers:
        - on-sync-failed
        - on-health-degraded
        - on-sync-succeeded

applicationSet:
  replicas: 1
  revisionHistoryLimit: 3
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

configs:
  params:
    server.insecure: true  # TLS at Traefik level, not Argo
  cm:
    # Remove default EndpointSlice exclusion — kubelab uses manual EndpointSlices
    # for external services (uptime-kuma, headscale, argocd).
    # Auto-managed EndpointSlices aren't in Git, so prune won't touch them
    # (Argo CD only prunes resources with its tracking label).
    resource.exclusions: ""
    # CronJob completed pods are Healthy, not Degraded (pvc-backup CronJobs)
    resource.customizations.health.batch_CronJob: |
      hs = {}
      hs.status = "Healthy"
      return hs
    resource.customizations.health.batch_Job: |
      hs = {}
      if obj.status.succeeded == 1 then
        hs.status = "Healthy"
      elseif obj.status.failed ~= nil and obj.status.failed > 0 then
        hs.status = "Degraded"
      else
        hs.status = "Progressing"
      end
      return hs
    # Admin local account: API key only (CLI fallback), no web login
    accounts.admin: apiKey
    # Custom branding CSS (ADR-032)
    ui.cssurl: "https://assets.kubelab.live/brand/brand.css"
    # OIDC via Authelia (ARGO-010) — native OIDC, no dex
    url: https://argo.kubelab.live
    oidc.config: |
      name: KubeLab IDP
      issuer: https://auth.kubelab.live
      clientID: argocd
      clientSecret: $oidc.authelia.clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
  rbac:
    policy.csv: |
      g, admins, role:admin
    policy.default: role:readonly
    scopes: '[groups]'
  secret:
    # GitHub webhook secret — triggers instant sync on push (no 3min polling delay)
    # Configure webhook in GitHub repo → Settings → Webhooks:
    #   URL: https://argo.kubelab.live/api/webhook
    #   Content-type: application/json
    #   Secret: (same value as webhook.github.secret below)
    #   Events: Just the push event
    githubSecret: ""  # Injected at deploy time via --set
    extra:
      oidc.authelia.clientSecret: ""  # Injected at deploy time via --set
