# ==========================================================================
# PROD SETTINGS
# ==========================================================================
environment: prod
global:
  base_domain: kubelab.live
  restart_policy: unless-stopped

# ==========================================================================
# RUNTIME
# ==========================================================================
log_level: INFO
debug_mode: false

# ==========================================================================
# K3S — Production ports (cutover from Pattern C, ADR-015)
# ==========================================================================
k3s:
  traefik:
    http_port: 80
    https_port: 443

# ==========================================================================
# NETWORKING — prod topology overrides
# ==========================================================================
networking:
  vps:
    ansible_groups: ["vps", "docker_hosts", "k3s_servers"]  # VPS runs K3s in prod only
  nodes:
    ace1:
      ansible_groups: ["docker_hosts", "minipc"]  # Not a K3s server in prod

# ==========================================================================
# PROTOCOLS & NETWORKING
# ==========================================================================
protocol: https

# ==========================================================================
# SERVICE DISCOVERY (Internal endpoints)
# ==========================================================================
endpoints:
  api: http://api:8080

# ==========================================================================
# EDGE SETTINGS
# ==========================================================================
edge:
  traefik:
    domain: traefik.kubelab.live
    disable_https: false
    acme_server: https://acme-v02.api.letsencrypt.org/directory

  nginx:
    domain: errors.kubelab.live

  cloudflared:
    enabled: true

# ==========================================================================
# APPS SETTINGS
# ==========================================================================
apps:
  # Platform applications (custom-built)
  platform:
    api:
      domain: api.kubelab.live
      site_domain: kubelab.live
      site_url: https://kubelab.live

      version: 1.1.0
    # blog: removed here too, 2026-09-01. `common.yaml` has recorded it as
    # killed since 2026-03-15 ("blog: removed — killed"), but this prod-only
    # override outlived the deletion and kept `services health` probing a
    # `blog.kubelab.live` that nothing has served for nearly six months.
    # Found by tests/test_declared_domains_are_served.py on its first run.

    web:
      backend_url: "https://api.kubelab.live"
      allowed_hosts: "localhost,web,127.0.0.1,.kubelab.live,.mlorente.dev"
      domain: mlorente.dev
      site_domain: mlorente.dev
      site_url: https://mlorente.dev
      default_port: 8080
      enable_blog: false
      enable_homelabs: false
      enable_contact: false

  # Third-party services
      version: 1.12.0
  services:
    core:
      gitea:
        domain: gitea.kubelab.live
      vikunja:
        domain: tasks.kubelab.live

    automation:
      n8n:
        domain: n8n.kubelab.live

    observability:
      # loki has NO `domain` in prod, deliberately. `domain` declares the public
      # name a service answers on, and prod's Loki has none: the overlay patches
      # its route to `Host(loki.internal.kubelab.local)` — a non-public TLD,
      # because ACME cannot issue for one. The name it does answer on lives in
      # the IngressRoute, which is where routing belongs.
      #
      # It declared `loki.kubelab.live` until 2026-09-01. Nothing served that
      # name, so `toolkit services health --env prod` reported a FAIL forever,
      # and #1406 (OBS-023) was filed reading the symptom as a missing DNS
      # record — the fix there is this deletion, not a new Cloudflare entry.
      # Guarded by tests/test_declared_domains_are_served.py.

      uptime_kuma:
        domain: status.kubelab.live

      grafana:
        domain: grafana.kubelab.live

    security:
      authelia:
        domain: auth.kubelab.live
        issuer_domain: kubelab.live
        default_domain_root: kubelab.live
        disable_require_tls: false

      # crowdsec has NO `domain` in prod, deliberately. It has no IngressRoute
      # in any overlay — it is reached only in-cluster, at
      # `crowdsec.kubelab.svc.cluster.local:8080`, by the Traefik bouncer
      # plugin. Declaring a public name for an admin/security surface that is
      # not served is worse than useless: it made `services health` report a
      # FAIL forever, and it invites someone to "fix" that by publishing the
      # very surface #1389 and #675 argue should stay unexposed.
      # Guarded by tests/test_declared_domains_are_served.py.

    data:
      minio:
        domain: minio.kubelab.live
        console_domain: console.minio.kubelab.live
