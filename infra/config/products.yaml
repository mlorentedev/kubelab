# Product registry (ADR-067 D2, IDP-042). The products kubelab admits, in the
# order the generators emit them; read by toolkit/features/product_registry.py.
#
# A product absent from this file is refused: `toolkit deployment promote`
# names this file, and a dispatch event type nobody claims maps to no app.
# The registry is the trust anchor for a product's contract (`kubelab.yaml`),
# so nothing here is ever taken from the contract.
#
# Fields:
#   forge       github | gitea | in-tree. in-tree (api, ADR-048) has no remote
#               repository and receives no dispatch; its values stay hand-authored.
#   repository  owner/name on the forge; where the contract is fetched from.
#   receiver    legacy (its own receiver workflow) | generic (product-image-receiver).
#   events      repository_dispatch event types per lane. Never renamed: GitHub
#               accepts a dispatch nobody listens for with a 204 and drops it.
#   image_name  only where the derived image (<registry>/<app>) is wrong.
#   image_registry  where CI pushed the image: a host and its owner path, no scheme
#               (gitea.kubelab.live/personal). Absent, the platform registry in
#               common.yaml applies. The host lives only here (IDP-053 D4); the
#               prune janitor skips a product whose registry is not the platform's.
#   private     true when the image needs a login to pull (default false). Needs
#               image_registry and pull_credential; Docker Hub private is not supported.
#   pull_credential  {username: <registry login>, secret: <catalog key of the token>}.
#               The token stays in SOPS; the pull Secret is rendered at apply time.
#               Two private entries on one registry host name one credential (D6).
products:
  api:
    forge: in-tree
  web:
    repository: mlorentedev/web
    forge: github
    receiver: generic
    image_name: kubelab-web
    events:
      staging: web-image-published
      prod: web-release-published
  console:
    forge: in-tree
  imagesensortool:
    repository: personal/imagesensortool
    forge: gitea
    receiver: generic
    image_registry: gitea.kubelab.live/personal
    private: true
    pull_credential:
      username: mentor
      secret: apps.services.core.gitea.registry_pull_token
    events:
      staging: imagesensortool-image-published
