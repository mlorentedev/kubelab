# Orphaned secrets: keys that exist in a SOPS vault and that no SECRET_CATALOG
# entry owns.
#
# WHY THIS FILE EXISTS. `orphan_key_paths` has detected these for a while and
# `toolkit secrets audit` printed them as a warning and exited 0. Seventeen
# standing warnings is not a signal, it is background noise -- so when an
# eighteenth appeared on 2026-09-01 (a real, freshly written Authelia hash that
# nobody had registered) nothing distinguished it from the pile. A check nobody
# can act on is not a check.
#
# HOW IT BINDS. The audit now fails on any orphan NOT listed here. Listing one is
# a deliberate, reviewable edit, and `tests/test_orphan_secrets_ratchet.py`
# enforces that the list may only SHRINK: adding an entry requires raising an
# explicit constant, which a reviewer sees. Existing debt is frozen, new debt is
# refused.
#
# WHERE IT BINDS. Reading this requires decrypting the vault, so it can only run
# where the age key is -- a workstation, not a CI runner (the same constraint that
# produced `sops_can_decrypt()` in tests/conftest.py). It is wired into
# `toolkit secrets audit`, which is what `make secrets-audit` runs.
#
# EVERY LINE IS A DELETION WAITING TO HAPPEN. The reason is not decoration: it
# says what has to be true before the key can go. Removing a key from the vault,
# or registering it in SECRET_CATALOG, both mean deleting its line here.

orphans:

  # --- Usernames, which per SSOT-014 / AUTH-004 should not be secrets at all ---
  apps.services.data.minio.root_user: >-
    A username, not a secret. AUTH-004 resolves service identities from
    `apps.auth.identities` in plaintext common.yaml; a copy in SOPS is a second
    source of truth for a value that is not confidential. Delete once the
    consumer reads the map (this is the same class #1013 tracks).
  apps.services.observability.uptime_kuma.admin_user: >-
    Same class as minio.root_user: a username in the secret vault.
  apps.services.core.gitea.admin_user: >-
    Same class again, dev only. Gitea's admin username already resolves from
    `apps.auth.identities.superadmin` on the Ansible path.

  # --- Real credentials that simply were never registered ---------------------
  apps.platform.api.beehiiv.api_key: >-
    Real third-party credential with no SecretSpec. Register it (kind EXTERNAL)
    or delete it if the Beehiiv integration is gone.
  apps.platform.api.zoho.client.id: >-
    Zoho OAuth client id. Register alongside its secret, or remove both.
  apps.platform.api.zoho.client.secret: >-
    Zoho OAuth client secret. Pairs with zoho.client.id.
  apps.services.dashboard.homepage.cloudflare_token: >-
    Homepage widget token. The three homepage.* keys are one registration job.
  apps.services.dashboard.homepage.github_token: >-
    Homepage widget token, unregistered. Resolve with the other two homepage.*
    keys in one pass -- they share a consumer and a disposition.
  apps.services.dashboard.homepage.uptimekuma_key: >-
    Homepage widget token, unregistered. Resolve with the other two homepage.*
    keys in one pass -- they share a consumer and a disposition.
  apps.services.network.pihole.admin_password: >-
    Staging only. CLAUDE.md documents this key as the Pi-hole admin password, so
    it has a consumer and a home -- it just has no SecretSpec.
  aws.access_key_id: >-
    AWS credential pair for the hub. Register both, or confirm they were
    superseded by the instance role and delete.
  aws.secret_access_key: >-
    Pairs with aws.access_key_id and shares its disposition: register both as
    one EXTERNAL pair, or confirm the hub moved to an instance role and delete
    both together. Never resolve only one half of a credential pair.
  cloudflare.api_email: >-
    Not confidential on its own (it is an account email) but it lives in the
    vault; decide between registering and moving it to common.yaml.
  cloudflare.tunnel_token: >-
    Real credential with no SecretSpec. Establish whether any tunnel still runs
    (ADR-049 D3 moved edge storage to R2 and retired B2; the tunnel may have
    gone the same way), then register it as EXTERNAL or delete it.
  infra.smtp.user: >-
    ADR-036 puts shared infra values at `infra.<service>.<attr>`, and the SMTP
    *password* is registered while the user is not. Deliberate asymmetry or
    oversight -- settle which, then register or move to common.yaml.
  webhooks.slack: >-
    Slack webhook URL, which is itself the credential. Unregistered.
